<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>parametric lab v1 (frozen) — listen faceplates</title>
<!-- ⛔ FROZEN 2026-08-14. This is version 1, kept so v2 can be compared
     against it. Do not edit — work happens in parametric-lab.html.
     It keeps the ORIGINAL localStorage keys (wt-parametric-lab-v3 /
     -locks-v2 / -gens-v1) so the ratings already collected stay attached
     to the gene set they were collected against; v2 bumps its keys. -->
<style>
  /* ── Lab chrome wears the simple theme's own tokens ────────────── */
  :root {
    --ink-rgb: 150, 150, 150;      /* simple's chrome cap */
    --ink-hi-rgb: 215, 215, 215;   /* legibility tier */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: rgba(var(--ink-rgb), 0.9);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    padding: 16px 20px 60px;
  }
  h1 {
    font-size: 11px; font-weight: 500; letter-spacing: 1.5px;
    text-transform: uppercase; color: rgba(var(--ink-rgb), 0.5);
    margin-bottom: 14px;
  }
  h1 b { color: rgba(var(--ink-hi-rgb), 0.95); font-weight: 500; }

  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-bottom: 8px; font-size: 11px;
  }
  .bar button, .bar select, .bar label.chk {
    background: rgba(var(--ink-rgb), 0.10);
    border: none; border-radius: 4px;
    color: rgba(var(--ink-hi-rgb), 0.9);
    font-size: 10px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 6px 12px; cursor: pointer;
  }
  .bar button:hover { background: rgba(var(--ink-rgb), 0.18); }
  .bar button.primary { background: rgba(var(--ink-rgb), 0.22); }
  .bar label.chk { display: inline-flex; align-items: center; gap: 6px; user-select: none; }
  .bar .stat { font-size: 10px; letter-spacing: 0.5px; color: rgba(var(--ink-rgb), 0.45); font-variant-numeric: tabular-nums; }
  .bar .gennav { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; }
  .bar .gennav button { padding: 6px 9px; }
  .bar .gennav button:disabled { opacity: 0.3; cursor: default; }
  .bar .gennav .stat { min-width: 96px; text-align: center; }
  .hint { font-size: 10px; color: rgba(var(--ink-rgb), 0.35); letter-spacing: 0.3px; margin-bottom: 16px; line-height: 1.7; }

  /* manifest editor */
  #manifestEditor {
    display: none; margin: 4px 0 14px; padding: 10px 12px;
    background: rgba(var(--ink-rgb), 0.05); border-radius: 6px;
    font-size: 10px; letter-spacing: 0.4px;
  }
  #manifestEditor.open { display: block; }
  #manifestEditor .fam { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 6px; }
  #manifestEditor .famname {
    width: 58px; text-align: right; text-transform: uppercase;
    color: rgba(var(--ink-rgb), 0.35); font-weight: 500;
  }
  #manifestEditor label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: rgba(var(--ink-rgb), 0.75); }
  #manifestEditor input[type="number"] { width: 40px; background: rgba(var(--ink-rgb),0.1); border: none; border-radius: 3px; color: rgba(var(--ink-hi-rgb),0.9); padding: 2px 4px; }
  #manifestEditor .pairnote { margin-top: 8px; color: rgba(var(--ink-rgb), 0.3); }

  /* card grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .card {
    position: relative; border-radius: 8px; overflow: hidden;
    background: #000; outline: 1px solid rgba(var(--ink-rgb), 0.10);
    cursor: pointer; transition: outline-color 0.15s;
  }
  .card:hover { outline-color: rgba(var(--ink-rgb), 0.30); }
  .card.liked   { outline: 1px solid rgba(120, 220, 150, 0.55); }
  .card.disliked{ outline: 1px solid rgba(230, 100, 90, 0.4); opacity: 0.45; }
  .card.focus { outline: 2px solid rgba(var(--ink-hi-rgb), 0.8); }
  .card svg { display: block; width: 100%; height: auto; }
  .card .meta {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px 7px; font-size: 9px; letter-spacing: 0.5px;
    color: rgba(var(--ink-rgb), 0.4); font-variant-numeric: tabular-nums;
  }
  .card .meta .votes { display: flex; gap: 4px; }
  .card .meta button {
    background: rgba(var(--ink-rgb), 0.10); border: none; border-radius: 3px;
    color: rgba(var(--ink-hi-rgb), 0.85); font-size: 10px; width: 26px; height: 20px; cursor: pointer;
  }
  .card .meta button:hover { background: rgba(var(--ink-rgb), 0.22); }
  .card .meta button.wide { width: auto; padding: 0 8px; letter-spacing: 0.5px; text-transform: uppercase; font-size: 9px; }
  .card .meta button.on { background: rgba(230, 160, 90, 0.25); color: rgba(245, 205, 155, 0.95); }
  .card.excluded { outline: 1px solid rgba(230, 160, 90, 0.35); opacity: 0.34; }
  .card.excluded:hover { opacity: 0.7; }
  .card .score { color: rgba(var(--ink-rgb), 0.55); }
  .card .sweepval b { color: rgba(var(--ink-hi-rgb), 0.95); font-weight: 500; }
  .card.locked { outline: 1px solid rgba(120, 220, 150, 0.65); }

  /* locks panel */
  #locks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; font-size: 10px; }
  #locks .lk {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(120, 220, 150, 0.12); border-radius: 4px; padding: 4px 8px;
    color: rgba(var(--ink-hi-rgb), 0.85); letter-spacing: 0.4px; font-variant-numeric: tabular-nums;
  }
  #locks .ex {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(230, 160, 90, 0.12); border-radius: 4px; padding: 4px 8px;
    color: rgba(240, 200, 155, 0.9); letter-spacing: 0.4px; font-variant-numeric: tabular-nums;
  }
  #locks .lk button, #locks .ex button { background: none; border: none; color: rgba(var(--ink-rgb), 0.6); cursor: pointer; font-size: 11px; padding: 0; }
  #locks .none b { color: rgba(var(--ink-hi-rgb), 0.8); font-weight: 500; }
  #locks .none { color: rgba(var(--ink-rgb), 0.3); letter-spacing: 0.4px; }

  /* swept-gene description */
  #geneDesc { max-width: 780px; margin: 2px 0 14px; font-size: 11px; line-height: 1.65; }
  #geneDesc .dsc { color: rgba(var(--ink-rgb), 0.62); letter-spacing: 0.2px; }
  #geneDesc .dsc b { color: rgba(var(--ink-hi-rgb), 0.95); font-weight: 500; letter-spacing: 0.5px; }
  #geneDesc .warn {
    display: block; margin-top: 5px; padding: 5px 9px; border-radius: 4px;
    background: rgba(230, 160, 90, 0.10); color: rgba(235, 185, 130, 0.92);
    font-size: 10px; letter-spacing: 0.3px;
  }

  /* zoom modal */
  #modal {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,0.88); align-items: center; justify-content: center; gap: 28px;
  }
  #modal.open { display: flex; }
  #modal .plate { background: #000; outline: 1px solid rgba(var(--ink-rgb), 0.15); border-radius: 12px; overflow: hidden; }
  #modal .plate svg { display: block; width: 500px; height: auto; }
  #modal .genes {
    max-width: 260px; font-size: 10px; letter-spacing: 0.4px; line-height: 1.9;
    color: rgba(var(--ink-rgb), 0.6); font-variant-numeric: tabular-nums;
  }
  #modal .genes b { color: rgba(var(--ink-hi-rgb), 0.9); font-weight: 500; }

  /* model weight panel */
  #weights { margin-top: 26px; max-width: 560px; }
  #weights h2 { font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: rgba(var(--ink-rgb), 0.4); margin-bottom: 8px; }
  .wrow { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.4px; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .wrow .wname { width: 190px; color: rgba(var(--ink-rgb), 0.7); text-align: right; }
  .wrow .wbar { height: 4px; border-radius: 2px; }
  .wrow .wpos { background: rgba(120, 220, 150, 0.7); }
  .wrow .wneg { background: rgba(230, 100, 90, 0.6); }
</style>
</head>
<body>

<h1><b>parametric lab v1 · frozen</b> — listen pane region (393×292) · simple theme · braun ⇄ bauhaus</h1>

<div class="bar">
  <select id="songSel"></select>
  <button id="editManifest">edit manifest</button>
  <button id="modeBatch" class="primary">batch</button>
  <button id="modeSweep">sweep</button>
  <span class="stat" id="stats"></span>
</div>

<div class="bar" id="batchBar">
  <button id="newBatch" class="primary">new batch</button>
  <button id="evolve">evolve from likes</button>
  <span class="gennav">
    <button id="genBack" title="previous generation">◀</button>
    <span class="stat" id="genLabel">gen —</span>
    <button id="genFwd" title="next generation">▶</button>
  </span>

<div class="bar" id="sweepBar" style="display:none">
  <select id="geneSel"></select>
  <select id="baseSel">
    <option value="neutral">neutral base</option>
    <option value="random">random base</option>
  </select>
  <button id="reroll">reroll base</button>
  <button id="exportBtn2">export json</button>
  <span class="stat">every card shares one seed — only this gene moves</span>
</div>
<div id="geneDesc"></div>

<div class="hint" id="hint"></div>

<div id="locks"></div>
<div id="manifestEditor"></div>
<div id="grid"></div>

<div id="weights"></div>

<div id="modal"><div class="plate" id="modalPlate"></div><div class="genes" id="modalGenes"></div></div>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   0 · THEME TOKENS — lifted from src/theme/palette.js + App.css simple
   ════════════════════════════════════════════════════════════════════ */
const CLASSIC_PALETTE = [
  '#ff4136', '#2ecc40', '#0074d9', '#ffdc00', '#bb8fce',
  '#85c1e9', '#82e0aa', '#f8b500', '#e74c3c', '#1abc9c',
  '#ff7eb6', '#a78bfa',
];
function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const ch = (s) => { const c = (n >> s) & 0xff; return Math.round(c + (255 - c) * amt).toString(16).padStart(2, '0'); };
  return `#${ch(16)}${ch(8)}${ch(0)}`;
}
const SIMPLE_PALETTE = CLASSIC_PALETTE.map(c => lighten(c, 0.18));
const INK = (a) => `rgba(150,150,150,${a})`;   // simple's chrome cap
const HI  = (a) => `rgba(215,215,215,${a})`;   // legibility tier
const TRACK = 'rgba(255,255,255,0.10)';        // arc/fader track level
function dim(color, pct) {                     // PanPot's dim idiom: mix over black
  return pct >= 100 ? color : `color-mix(in srgb, ${color} ${pct}%, black)`;
}
function voiceColor(i) { return SIMPLE_PALETTE[i % SIMPLE_PALETTE.length]; }

/* ════════════════════════════════════════════════════════════════════
   0b · iPHONE 17 LISTEN-PAGE GEOMETRY (pt) — from ListenView.swift
   field (square, elided to a sliver) → spectrum bar (56) →
   pane region (~292, ⛔ fixed height) → ListenRail (52)
   ════════════════════════════════════════════════════════════════════ */
const PHONE_W  = 393;
const FIELD_H  = 84;
const SPECT_H  = 56;
const REGION_H = 292;
const RAIL_H   = 52;
const TOTAL_H  = FIELD_H + SPECT_H + REGION_H + RAIL_H;
/* Fixed rails flanking the pane, each a hairline away from it.
   LEFT  — play/pause + volume (+ auto, under `autoPlace: column`)
   RIGHT — snapshot · prev/next song · shuffle. ⛔ PARKED: the buttons
           are built (`chromeRightColumn`) but the rail is switched off
           until the UX for them is settled, and the pane takes back the
           width. Rating designs against a reserved-but-empty strip
           would be composing for a layout that does not exist — so the
           space is either used or given back, never held.
           Flip RIGHT_RAIL to restore it. */
const RIGHT_RAIL = false;
const LCOL_W   = 46;
const RCOL_W   = RIGHT_RAIL ? 46 : 0;
/* How far through the current auto-cycle the mock-ups are drawn. A
   static number on purpose — these are faceplates, not a running app —
   but it must be the SAME everywhere so the ring and the bar agree. */
const CYCLE_PROGRESS = 0.42;

/* Which control render() last promoted to hero. Set inside render and
   read by the card meta immediately after, so it is always the hero of
   the plate directly above it. A return value would be cleaner, but
   render() is called from inside template literals in three places. */
let LAST_HERO = null;

/* ════════════════════════════════════════════════════════════════════
   1 · PARAM CATALOG — the control VOCABULARY.
   Every song control is one id from here. `family` drives grouping,
   `kind` drives which primitive renders it, `def` is the shown value.
   Adding a new control to the app = one row here, nothing else.
   ════════════════════════════════════════════════════════════════════ */
const FAMILY_ORDER = ['voices', 'motion', 'tone', 'filter', 'space', 'tuning', 'arp', 'action', 'view'];

const PARAMS = {
  // ── motion: how the patch moves on its own ──────────────────────
  drift:      { label: 'drift',  family: 'motion', kind: 'knob',   def: 0.35, fmt: v => `${Math.round(v * 100)}` },
  slide:      { label: 'slide',  family: 'motion', kind: 'knob',   def: 0.45, fmt: v => `${(v * 4).toFixed(1)}s` },
  autoCycle:  { label: 'cycle',  family: 'motion', kind: 'knob',   def: 0.40, fmt: v => `${Math.round(15 + v * 105)}s` },

  // ── tone: the timbre knobs ──────────────────────────────────────
  noise:      { label: 'noise',  family: 'tone',   kind: 'knob',   def: 0.20, fmt: v => `${Math.round(v * 100)}` },
  saturation: { label: 'drive',  family: 'tone',   kind: 'knob',   def: 0.35, fmt: v => `${Math.round(v * 100)}` },
  satButton:  { label: 'sat',    family: 'tone',   kind: 'segment', opts: ['soft', 'warm', 'hot'], def: 1 },
  width:      { label: 'width',  family: 'tone',   kind: 'knob',   def: 0.50, fmt: v => `${Math.round(v * 100)}%` },

  // ── filter: cutoff + its peak, twice over ───────────────────────
  lpf:        { label: 'lpf',    family: 'filter', kind: 'knob',   def: 0.62, fmt: v => `${Math.round(120 * Math.pow(2, v * 7))}` },
  lpfPeak:    { label: 'peak',   family: 'filter', kind: 'knob',   def: 0.22, fmt: v => `${(v * 20).toFixed(1)}` },
  hpf:        { label: 'hpf',    family: 'filter', kind: 'knob',   def: 0.18, fmt: v => `${Math.round(30 * Math.pow(2, v * 7))}` },
  hpfPeak:    { label: 'peak',   family: 'filter', kind: 'knob',   def: 0.25, fmt: v => `${(v * 20).toFixed(1)}` },
  filter:     { label: 'filter', family: 'filter', kind: 'knob',   def: 0.55, fmt: v => `${Math.round(120 * Math.pow(2, v * 7))}` },
  resonance:  { label: 'res',    family: 'filter', kind: 'knob',   def: 0.30, fmt: v => `${(v * 20).toFixed(1)}` },

  // ── space ───────────────────────────────────────────────────────
  reverb:     { label: 'reverb', family: 'space',  kind: 'knob',   def: 0.40, fmt: v => `${Math.round(v * 100)}` },
  room:       { label: 'room',   family: 'space',  kind: 'knob',   def: 0.55, fmt: v => `${Math.round(v * 100)}` },

  // ── tuning ──────────────────────────────────────────────────────
  detune:     { label: 'detune', family: 'tuning', kind: 'knob',   def: 0.25, fmt: v => `${(v * 10).toFixed(1)}¢` },
  detuneBtn:  { label: 'detune', family: 'tuning', kind: 'button', glyph: 'spread' },
  fineTune:   { label: 'fine',   family: 'tuning', kind: 'voiceBipolar' },
  levels:     { label: 'level',  family: 'voices', kind: 'voiceFaders' },
  pans:       { label: 'pan',    family: 'voices', kind: 'voicePans' },
  orbs:       { label: '',       family: 'voices', kind: 'orbs' },

  // ── arp ─────────────────────────────────────────────────────────
  arpOn:      { label: 'arp',    family: 'arp',    kind: 'toggle', def: true },
  arpBpm:     { label: 'tempo',  family: 'arp',    kind: 'slider', def: 0.45, fmt: v => `${Math.round(50 + v * 130)}` },
  arpOct:     { label: 'octaves',family: 'arp',    kind: 'steps',  def: 4 },
  arpDir:     { label: 'dir',    family: 'arp',    kind: 'segment', opts: ['up', 'down', 'updn', 'rand'], def: 0 },
  arpRatio:   { label: 'ratio',  family: 'arp',    kind: 'segment', opts: ['1:1', '1:2', '2:3', '1:4'], def: 1 },

  // ── actions: momentary, they DO something ───────────────────────
  remix:      { label: 'remix',  family: 'action', kind: 'button', glyph: 'dice' },
  tune:       { label: 'tune',   family: 'action', kind: 'button', glyph: 'align' },
  /* Auto-advance on/off. The only control that can live EITHER in the
     fixed left column (under play, where it reads as transport) or in
     the pane next to remix (where it reads as "keep re-rolling") —
     see the `autoPlace` gene. It is genuinely both, which is why the
     position is worth testing rather than deciding. */
  auto:       { label: 'auto',   family: 'action', kind: 'button', glyph: 'auto', on: true },

  // ── view: not instrument controls — quiet tier, pinned last ─────
  satViz:     { label: 'sat viz', family: 'view',  kind: 'toggle', def: true },
};

/* ── COUPLINGS ──────────────────────────────────────────────────────
   The layout ATOM is the pair, not the control. A pair only fires when
   BOTH members are in the song; otherwise each renders alone.
     concentric — cutoff outer ring, peak inner ring, one body
     timerRing  — the action button wearing its timer as a progress ring
     adjacent   — two controls that must touch, drawn side by side
   ──────────────────────────────────────────────────────────────── */
const PAIRS = [
  // a voice's level and its pan belong to each other before they belong
  // to the row — so they render as ONE cluster block, which is what lets
  // the pair travel together when the layout scatters (`mixerScatter`)
  { a: 'levels', b: 'pans',      style: 'cluster',    label: 'mix' },
  { a: 'lpf',    b: 'lpfPeak',   style: 'concentric', label: 'lpf' },
  { a: 'hpf',    b: 'hpfPeak',   style: 'concentric', label: 'hpf' },
  { a: 'filter', b: 'resonance', style: 'concentric', label: 'filter' },
  { a: 'remix',  b: 'autoCycle', style: 'timerRing',  label: 'remix' },
  { a: 'tune',   b: 'detune',    style: 'adjacent',   label: '' },
  { a: 'tune',   b: 'detuneBtn', style: 'adjacent',   label: '' },
];

/* ════════════════════════════════════════════════════════════════════
   2 · SONGS — Dan's four, verbatim. The manifest is authored per song
   and is INPUT, never a gene: the song decides WHAT, the genome HOW.
   ════════════════════════════════════════════════════════════════════ */
const SONGS = {
  'square waves immediate slide': {
    voices: 4,
    controls: ['remix', 'auto', 'tune', 'drift', 'slide', 'reverb', 'autoCycle', 'lpf', 'lpfPeak'],
  },
  /* Same patch with the arp bolted on — 12 controls, deliberately over
     the 6–9 budget so the two can be compared side by side. The arp is
     its own family, so it packs as one unit rather than scattering. */
  'square waves immediate slide + arp': {
    voices: 4,
    controls: ['remix', 'auto', 'tune', 'drift', 'slide', 'reverb', 'autoCycle', 'lpf', 'lpfPeak',
               'arpOn', 'arpBpm', 'arpOct', 'arpDir', 'arpRatio'],
  },
  'cello drone': {
    voices: 3,
    controls: ['remix', 'detune', 'tune', 'reverb', 'filter', 'resonance', 'noise'],
  },
  'square wave exploration': {
    voices: 4,
    controls: ['width', 'reverb', 'lpf', 'lpfPeak', 'hpf', 'hpfPeak',
               'remix', 'detune'],
  },
  /* ── the hello-world trio ──────────────────────────────────────────
     All three hand FREQUENCY to the spectrum bar's orb handles, so none
     of them carries a fine-tune: the pane is free for everything else.
     1 and 2 differ in CONTENT (2 gains the mixer); 2 and 3 differ only
     in CHARACTER, which is what `pins` is for. */
  'hello world 1 · no mixer': {
    voices: 4,
    controls: ['noise', 'saturation', 'filter', 'tune', 'remix', 'detune'],
  },
  'hello world 2 · mixer, ordered': {
    voices: 4,
    controls: ['levels', 'pans', 'noise', 'saturation', 'filter', 'tune', 'remix', 'detune'],
    pins: { mixerScatter: 0, align: 'center', jitter: 0, school: 0.1 },
  },
  'hello world 3 · mixer, abstract': {
    voices: 4,
    controls: ['levels', 'pans', 'noise', 'saturation', 'filter', 'tune', 'remix', 'detune'],
    pins: { mixerScatter: 0.92, school: 0.8, hero: 'on' },
  },
  /* The two halves on their own. Neither fires the `cluster` pair — it
     needs both members — so pan-only renders a plain arc row and
     mixer-only a plain fader row, and `mixerScatter` has nothing to
     compose in either. That is the honest answer: scatter is a property
     of the PAIRING, not of faders or pans by themselves. */
  'hello world 4 · pan only': {
    voices: 4,
    controls: ['pans', 'noise', 'saturation', 'filter', 'tune', 'remix', 'detune'],
  },
  'hello world 5 · mixer only': {
    voices: 4,
    controls: ['levels', 'noise', 'saturation', 'filter', 'tune', 'remix', 'detune'],
  },
  /* a fifth slot for the example that didn't come through — kept as the
     denser stress case so the generator keeps getting tested against a
     song that does NOT fit comfortably. */
  'full console (stress)': {
    voices: 4,
    controls: ['levels', 'orbs', 'arpBpm', 'arpOct', 'arpDir', 'noise', 'saturation',
               'width', 'lpf', 'lpfPeak', 'hpf', 'hpfPeak', 'reverb', 'room',
               'remix', 'tune', 'detune', 'fineTune', 'satViz'],
  },
};
/* ?song=<substring> deep-links a manifest — handy for screenshots and for
   sending someone a specific song's batch. */
const SONG_KEYS = Object.keys(SONGS);
const songParam = new URLSearchParams(location.search).get('song');
let currentSongKey = (songParam
  && SONG_KEYS.find(k => k.toLowerCase().includes(songParam.toLowerCase())))
  || 'square waves immediate slide';
let manifest = JSON.parse(JSON.stringify(SONGS[currentSongKey]));

/* ════════════════════════════════════════════════════════════════════
   3 · GENOME — pure style + layout. school 0 = braun, 1 = bauhaus.
   ════════════════════════════════════════════════════════════════════ */
/* Does this song contain anything the gene can act on? A sweep of a gene
   with nothing to bite renders 8 identical cards, which reads as "the
   gene is broken" rather than "this song has no faders". */
