  const meters = [{ dx: -(vw + vgap) / 2, lv: 0.52 }, { dx: (vw + vgap) / 2, lv: 0.6 }];
  for (const mtr of meters) {
    const mx = cx + mtr.dx - vw / 2;
    out += `<rect x="${mx}" y="${vTop}" width="${vw}" height="${vh}" rx="${vw / 2}" fill="${TRACK}"/>`;
    out += levelFill(mx, vTop + vh * (1 - mtr.lv), vw, vh * mtr.lv, INK(0.5), 'top');
  }
  const crossY = vTop + vh * (1 - fill);
  out += `<line x1="${cx - 11}" y1="${crossY}" x2="${cx + 11}" y2="${crossY}"
    stroke="${INK(0.9)}" stroke-width="3" stroke-linecap="round"/>`;
  if (labelOn) {
    const fs = trial ? 8 * (fitScale || 1) : 8;
    out += `<text x="${cx}" y="${vBot + 12}" text-anchor="middle" font-size="${fs.toFixed(2)}" font-weight="500" letter-spacing="0.5" fill="${INK(0.3)}">VOL</text>`;
  }
  return out;
}

/* ════════════════════════════════════════════════════════════════════
   5b · THE WAVE TRACE — the witness's actual signal
   ────────────────────────────────────────────────────────────────────
   ⛔ NOT a decorative squiggle. The one thing the screen is being judged
   on is "does this READ at 40pt tall", and a fake trace makes exactly
   that unjudgeable. So the maths is ported from the app:

     · `sampleShapeIdeal` — src/audio/visualShape.js, the idealised
       (non-band-limited) morph the app's own line modes draw, because
       it matches the user's mental model of "square".
     · duty warp, fold, dry/wet mix, peak-normalise — the order
       `WaveShapePreviewView` (SoundDesignViews.swift:33) runs.
     · ⚠️ saturation is the one stage the iOS component does NOT have.
       Dan's note puts the screen on saturation too, so the trace runs a
       soft-clip after the fold — which means adding that stage to the
       shipping view as well, not just here.
   ════════════════════════════════════════════════════════════════════ */
const TWO_PI = Math.PI * 2;
function sampleShapeIdeal(norm, p) {
  const sine = Math.sin(TWO_PI * norm);
  const triangle = norm < 0.25 ? 4 * norm : norm < 0.75 ? 2 - 4 * norm : 4 * norm - 4;
  const square = norm < 0.5 ? 1 : -1;
  const saw = norm < 0.5 ? 2 * norm : 2 * norm - 2;
  const anchors = [sine, triangle, square, saw];
  const c = Math.max(0, Math.min(3, p));
  const seg = Math.min(2, Math.floor(c)), f = c - seg;
  return anchors[seg] * (1 - f) + anchors[seg + 1] * f;
}
/* Duty warp: the first half-cycle is squeezed into `w` of the period,
   which on a square IS pulse-width. Symmetric at 0.5. */
function dutyWarp(n, w) {
  const d = Math.max(0.06, Math.min(0.94, w));
  return n < d ? 0.5 * n / d : 0.5 + 0.5 * (n - d) / (1 - d);
}
/* Sine wavefold: drive the signal up into a sine's turnover so the peaks
   come back down, then cross-fade with the dry — the shape of `Fold`'s
   sine table without building the table. */
const foldSine = (x, amt) => Math.sin(x * (1 + amt * 3.2) * Math.PI / 2);
const softClip = (x, amt) => {
  const k = 1 + amt * 7;
  return Math.tanh(x * k) / Math.tanh(k);
};
/* vals ∈ [-1,1], peak-normalised, one period per `cycles`. */
function waveTrace(vals, n, cycles) {
  const { shape = 0, width = 0.5, fold = 0, sat = 0 } = vals;
  const out = new Array(n);
  let peak = 0;
  for (let i = 0; i < n; i++) {
    const norm = ((i / (n - 1)) * cycles) % 1;
    const dry = sampleShapeIdeal(dutyWarp(norm, width), shape * 3);
    let v = dry * (1 - fold) + foldSine(dry, fold) * fold;
    if (sat > 0) v = softClip(v, sat);
    out[i] = v;
    peak = Math.max(peak, Math.abs(v));
  }
  if (peak > 0) for (let i = 0; i < n; i++) out[i] /= peak;
  return out;
}

/* ════════════════════════════════════════════════════════════════════
   6 · RENDERER — (manifest, genome, seed) → the whole listen page
   ════════════════════════════════════════════════════════════════════ */
function render(manifest, g, seed, opts = {}) {
  /* `opts.transportTrial` — the app-sim's 08-16 transport mock (r2):
     play/pause → rail center, the left column reduced to a full-height
     main mixer, the cycle bar off — retune stays on the plate, doubles
     as NEXT, and its countdown ring is forced on. ⛔ Every other call
     site (grid, fixtures, champions, modal) passes no opts, so parity
     goldens never see this branch.
     `opts.playFace` — the sim's iOS-play mirror: program-size palette
     orbs on the spectrum bar (the caller also wraps this render in
     `withTheme(PAPER_THEME)` for the glass-over-paper split). */
  const trial = !!opts.transportTrial;
  const playFace = !!opts.playFace;
  LAST_CLUSTER = null;
  const rng = mulberry32(seed ^ 0x9e3779b9);
  const stableBase = mulberry32(seed ^ 0x51ed270b);
  const stableVals = Array.from({ length: 64 }, () => stableBase());
  const rs = (i) => stableVals[i % 64];

  const t = g.school;
  const patch = manifest.patch;
  const regionY = FIELD_H + SPECT_H;
  const margin = g.margin;
  /* The walk-progress capsule (ListenView's `walkProgressBar`): a thin
     line across the top of the pane filling over the current cycle. It
     takes a strip off the top of the zone, so the content below never
     has to know about it.

     ⭐ Driven by `patch.cycle`, NOT by a control being present. The dwell
     knob went to the back face because turning it changes nothing now —
     but the countdown it drives is a READOUT, and a readout needs no
     control on the plate to have something to say. */
  const cycleBarOn = !trial && patch.cycle
    && (g.cycleReadout === 'bar' || g.cycleReadout === 'both');
  const cycleBarH = cycleBarOn ? 12 : 0;
  const zone = {
    x: LCOL_W + 12, y: regionY + margin + cycleBarH,
    w: PHONE_W - LCOL_W - 24, h: REGION_H - margin * 2 - cycleBarH,
  };
  /* Declared HERE, not down at the block stage: several builders need to
     know what else is on the plate before they can size themselves. */
  const present = new Set(manifest.controls);
  const accentFor = (i) =>
    g.accent === 'none' ? INK(0.85)
    : g.accent === 'voice0' ? voiceColor(0)
    : voiceColor(i);          // voiceColor already wraps the index

  /* ── the one source of per-voice colour ───────────────────────────
     Faders, pans, fine-tune lanes and pane orbs ALL come through here,
     so a voice can never be one colour in the mixer and another in the
     pan row.

     `voiceLit` and `accent` are separate genes and used to be able to
     contradict each other — `accent: voice0` painted every knob one
     voice's colour while the pans stayed a full rainbow, which reads as
     a bug rather than a choice. So:

       voiceLit: gray      → follow the plate's accent, whatever it is
       accent:   voice0    → ONE accent means one colour, voices included
       otherwise           → the spectrum (the `simple` theme's own rule:
                             full-spectrum voices over gray chrome)  */
  const voiceInk = (i) => {
    if (g.voiceLit !== 'lit') return accentFor(0);
    if (g.accent === 'voice0') return voiceColor(0);
    return voiceColor(i);
  };

  /* ── primitives ─────────────────────────────────────────────────── */
  const label = (x, y, text, w) => (g.labels === 'hidden' || !text) ? '' :
    `<text x="${x + w / 2}" y="${y}" text-anchor="middle" font-size="8" font-weight="500"
      letter-spacing="0.5" fill="${INK(0.3)}">${String(text).toUpperCase()}</text>`;
  const readout = (x, y, text, w) => (g.readouts !== 'on' || text == null) ? '' :
    `<text x="${x + w / 2}" y="${y}" text-anchor="middle" font-size="9" fill="${HI(0.7)}"
      style="font-variant-numeric:tabular-nums">${text}</text>`;

  const polar = (cx, cy, deg, rad) => {
    const rd = (deg - 90) * Math.PI / 180;
    return [cx + rad * Math.cos(rd), cy + rad * Math.sin(rd)];
  };
  const arcPath = (cx, cy, from, to, rad) => {
    const [x1, y1] = polar(cx, cy, from, rad), [x2, y2] = polar(cx, cy, to, rad);
    return `M ${x1} ${y1} A ${rad} ${rad} 0 ${Math.abs(to - from) > 180 ? 1 : 0} 1 ${x2} ${y2}`;
  };

  /* ── the knob vocabulary ──────────────────────────────────────────
     All eight run the same 270° travel (−135°…135°) at radius `r`, so
     they are swappable anywhere a knob is drawn and a sweep of
     `knobStyle` is a straight comparison.

       ring       track arc + radial tick — the PanPot grammar
       ringValue  …plus a filled arc showing the value
       cap        the knob BODY: circle outline + pointer centre→rim
       scale      Braun dial — discrete marks round the arc, live one lit
       wedge      a solid annulus sector; the boldest of the set
       segments   the arc split into 9 cells, lit up to the value
       needle     a meter pointer crossing the whole face

     `plain` forces the quiet form. The inner ring of a concentric pair
     always takes it: the pair needs a hierarchy, so the primary control
     wears the expressive style and the secondary stays out of its way. */
  function ring(cx, cy, r, value, color, sw, plain, bipolar) {
    const a0 = -135, a1 = 135, av = a0 + value * (a1 - a0);
    const style = plain ? 'ring' : g.knobStyle;
    /* Where a filled style STARTS. Normally the beginning of travel; on
       a bipolar control with `panFill: noon` it is the middle, so the
       fill grows out of centre in whichever direction the value went.
       Drawn low→high so a leftward fill sweeps back out of the middle
       rather than the long way round. */
    const from = (bipolar && g.panFill === 'noon') ? 0 : a0;
    const fillArc = (rad, width) => {
      const lo = Math.min(from, av), hi = Math.max(from, av);
      if (hi - lo < 1.5) return '';
      return `<path d="${arcPath(cx, cy, lo, hi, rad)}" fill="none"
        stroke="${dim(color, style === 'band' ? 60 : 78)}" stroke-width="${width}" stroke-linecap="round"/>`;
    };
    const track = (rad, w) =>
      `<path d="${arcPath(cx, cy, a0, a1, rad)}" fill="none" stroke="${TRACK}" stroke-width="${w}" stroke-linecap="round"/>`;
    const tick = (from, to, col, w) => {
      const [ix, iy] = polar(cx, cy, av, from), [ox, oy] = polar(cx, cy, av, to);
      return `<line x1="${ix}" y1="${iy}" x2="${ox}" y2="${oy}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
    };
    let out = '';
    /* ⭐ ring/ringValue strokes scale with the dial (Dan, 2026-08-16) —
       the same rule `band` already runs (stroke ∝ diameter, floored):
       a 2px arc that reads right at knobSize 1 goes wiry at 2.3, and a
       floored/hero knob kept hairline tracks. Only these two styles:
       cap/dot bodies stay 1px outlines by design, and the caller's `sw`
       stays the floor so pan marks and concentric inners never thin. */
    const rsw = Math.max(sw, r * 0.16);
    switch (style) {
      case 'ringValue':
        out += track(r, rsw);
        out += fillArc(r, rsw);
        out += tick(r * 0.75, r * 1.25, color, rsw);
        break;

      case 'cap':
        out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${INK(0.22)}" stroke-width="1"/>`;
        out += tick(r * 0.12, r * 0.84, color, sw);
        break;

      case 'dot': {
        // the classic Braun cap: a body with a single dot marker rather
        // than a line. ⚠️ deliberately breaks the theme's no-dots rule —
        // it is here to be judged, not because it already fits
        out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${INK(0.22)}" stroke-width="1"/>`;
        const [dx, dy] = polar(cx, cy, av, r * 0.6);
        out += `<circle cx="${dx}" cy="${dy}" r="${sw * 1.05}" fill="${color}"/>`;
        break;
      }

      case 'band': {
        /* The iOS bottom knob band's dial, ported straight from
           `SourceDial.swift`:
             · an OPAQUE black disc under the ring — the band's knobs sit
               over live faces, and an unfilled circle let the visuals
               read through the numeral
             · a 270° track at ink-soft 0.10, stroke = 10% of the
               DIAMETER, floored at 3 — it grows with the circle (the
               2026-08-10 PanPot-parity pass) rather than sitting at a
               fixed hairline
             · the value arc in the voice colour at 0.6
             · ⭐ a value TICK crossing the arc (Dan, 2026-08-16) — the
               level lines' crossbar grammar carried onto the program
               mode's knobs: a tick crossing a line is the handle. This
               reverses the 08-13 "no tick" for the band; the cap DOT
               stays banned. Same proportions as the fader bar (length
               1.9× the stroke it crosses, 2px wide), and the arc meets
               it square — a round cap curving away under the tick is
               the same two-lines misread the web fixed on the faders.
           The numeral itself is drawn by knobBlock, since it sits inside
           the circle rather than under it. */
        const bw = Math.max(3, r * 0.2);
        out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${GROUND}"/>`;
        out += `<path d="${arcPath(cx, cy, a0, a1, r)}" fill="none" stroke="${TRACK}" stroke-width="${bw}" stroke-linecap="round"/>`;
        out += fillArc(r, bw).replace('stroke-linecap="round"', 'stroke-linecap="butt"');
        out += tick(r - bw * 0.95, r + bw * 0.95, color, 2);
        break;
      }

      case 'scale': {
        const N = 11, active = Math.round(value * (N - 1));
        for (let i = 0; i < N; i++) {
          const a = a0 + (i / (N - 1)) * 270, on = i === active;
          const [x1, y1] = polar(cx, cy, a, r);
          const [x2, y2] = polar(cx, cy, a, r + (on ? 5 : 2.5));
          out += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
            stroke="${on ? color : INK(0.22)}" stroke-width="${on ? sw : 1}" stroke-linecap="round"/>`;
        }
        out += tick(0, r * 0.62, color, sw);
        break;
      }

      case 'wedge':
        out += track(r, 1);
        out += fillArc(r * 0.72, r * 0.55).replace('stroke-linecap="round"', '');
        break;

      case 'segments': {
        const N = 9, pad = 2.5;
        const lo = Math.min(from, av), hi = Math.max(from, av);
        for (let i = 0; i < N; i++) {
          const s0 = a0 + (i / N) * 270 + pad, s1 = a0 + ((i + 1) / N) * 270 - pad;
          const mid = a0 + ((i + 0.5) / N) * 270;
          const lit = mid >= lo && mid <= hi;
          out += `<path d="${arcPath(cx, cy, s0, s1, r)}" fill="none"
            stroke="${lit ? dim(color, 88) : TRACK}" stroke-width="${sw}" stroke-linecap="butt"/>`;
        }
        break;
      }

      case 'needle':
        out += track(r, 1);
        out += tick(-r * 0.34, r * 1.04, color, sw);
        break;

      default:   // 'ring'
        out += track(r, rsw);
        out += tick(r * 0.75, r * 1.25, color, rsw);
    }
    return out;
  }

  /* ── block builders (each returns {w, h, draw(x,y,scale)}) ──────── */
  const KNOB = Math.max(44 * g.knobSize, MIN_KNOB);
  const labelH = g.labels === 'hidden' ? 4 : 12;
  const readH  = g.readouts === 'on' ? 11 : 0;

  /* `band` moves the value numeral INSIDE the circle, so its block is a
     row shorter than the others — the readout below would be the same
     number twice. */
  const bandStyle = g.knobStyle === 'band';
  function centreNumeral(cx, cy, s, text) {
    if (!text || g.readouts !== 'on') return '';
    // SourceDial's readoutFont: semibold, compressed, monospaced digits,
    // scaled off the dial and floored so it never goes wiry.
    const fs = Math.max(9, Math.min(13, s * 0.26));
    return `<text x="${cx}" y="${cy + fs * 0.35}" text-anchor="middle" font-size="${fs}"
      font-weight="600" letter-spacing="-0.3" fill="${HI(0.9)}"
      style="font-variant-numeric:tabular-nums">${text}</text>`;
  }

  /* ⭐ THE CULL METRIC fields (round three, Dan 08-16): each block that
     draws a LABELED control declares `ctl` = its drawn size pre-fit
     (`ctlScales` = takes the placement scale, the way the draw does;
     `ctlFloored` = the draw floors it at MIN_KNOB). Fader/slider tracks
     and the scope are exempt (deliberately thin lines / a witness). The
     layout's min over these, × fit, is what the knob cull judges —
     the knob-only formula let pans and the retune button slip under. */
  function knobBlock(pid, colorIdx) {
    const p = PARAMS[pid], size = KNOB;
    const h = size + labelH + (bandStyle ? 0 : readH);
    return {
      kind: 'knob', pid, w: size, h, family: p.family,
      ctl: size, ctlScales: true,
      draw: (x, y, sc = 1) => {
        const s = size * sc, cx = x + s / 2, cy = y + s / 2, r = s * 0.38;
        const color = accentFor(colorIdx);
        let out = ring(cx, cy, r, p.def, color, sc > 1.3 ? 3 : 2);
        if (bandStyle) out += centreNumeral(cx, cy, s, p.fmt ? p.fmt(p.def) : null);
        out += label(x, y + s + (labelH ? 8 : 0), p.label, s);
        if (!bandStyle) {
          out += readout(x, y + s + (labelH ? 8 : 0) + (labelH ? 11 : 9), p.fmt ? p.fmt(p.def) : null, s);
        }
        return out;
      },
    };
  }

  /* concentric pair: cutoff outer, peak inner — one body, two rings */
  function concentricBlock(aid, bid, name, colorIdx) {
    const A = PARAMS[aid], B = PARAMS[bid], size = KNOB * 1.18;
    const h = size + labelH + readH;
    return {
      kind: 'pair', pid: aid, w: size, h, family: A.family,
      ctl: size, ctlScales: true,
      draw: (x, y, sc = 1) => {
        const s = size * sc, cx = x + s / 2, cy = y + s / 2;
        const color = accentFor(colorIdx);
        let out = ring(cx, cy, s * 0.40, A.def, color, sc > 1.3 ? 3 : 2);
        // `plain` — the peak stays a quiet track+tick whatever style the
        // cutoff wears, so the pair reads as primary + secondary rather
        // than two controls competing at different radii.
        out += ring(cx, cy, s * 0.20, B.def, dim(color, 62), 2, true);
        out += label(x, y + s + (labelH ? 8 : 0), name, s);
        out += readout(x, y + s + (labelH ? 8 : 0) + (labelH ? 11 : 9),
          A.fmt ? `${A.fmt(A.def)}·${B.fmt(B.def)}` : null, s);
        return out;
      },
    };
  }

  /* ── the remix mark ───────────────────────────────────────────────
     What "give me another one" looks like. Four readings of the same
     action, behind the `remixGlyph` gene:

       dots     two pips — abstract, quiet, says nothing specific
       dice     a real die face: rounded square + three pips. Names the
                mechanism (this app already calls it rolling dice)
       shuffle  the media-player shuffle: two paths swapping places.
                Says re-ARRANGE rather than re-ROLL — closer to what a
                remix does to a chord you already have
       cycle    a circular arrow — "again", the weakest claim of the four

     All drawn in the theme's own grammar: round-capped lines, no fills
     except the die pips, which are the one place a dot is the subject
     rather than an indicator. */
  function remixMark(cx, cy, r, color) {
    const sw = 1.8;
    const line = (x1, y1, x2, y2) =>
      `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
    switch (g.remixGlyph) {
      case 'dice': {
        /* A real face, not an abstract pair of pips — and the face is
           drawn from the seed, so the die on screen has actually been
           rolled. 1 and 4 are left out: 1 reads as a bullet and 4 as a
           square of dots, neither of which says "die" at 18pt. */
        const FACES = {
          2: [[-1, -1], [1, 1]],
          3: [[-1, -1], [0, 0], [1, 1]],
          5: [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]],
          6: [[-1, -1], [-1, 0], [-1, 1], [1, -1], [1, 0], [1, 1]],
        };
        const counts = [2, 3, 5, 6];
        const n = counts[Math.floor(rs(41) * counts.length) % counts.length];
        // ⛔ No die outline (Dan): the pips alone carry it. The button's
        // own wash is already a container, so a box inside a circle was
        // two enclosures doing one job.
        const p = r * 0.38, pr = n === 6 ? 1.35 : 1.65;
        let out = '';
        for (const [px, py] of FACES[n]) {
          out += `<circle cx="${cx + px * p}" cy="${cy + py * p}" r="${pr}" fill="${color}"/>`;
        }
        return out;
      }
      case 'shuffle': {
        /* The media-player shuffle: two lanes that cross and swap. Both
           arrowheads sit on the RIGHT so the glyph has a direction —
           symmetric heads at both ends read as "swap", which is a
           different verb. Heads are chevrons on the path's own
           tangent (horizontal at the tip), never a filled triangle:
           the theme has no filled marks on controls. */
        const w = r * 0.74, h = r * 0.36;
        const k = r * 0.26, kx = k * 0.86, ky = k * 0.52;
        let out = '';
        for (const dir of [1, -1]) {
          const ty = cy + h * dir, tx = cx + w;
          out += `<path d="M ${cx - w} ${cy - h * dir} L ${cx - w * 0.42} ${cy - h * dir}
            L ${cx + w * 0.30} ${ty} L ${tx - kx * 0.55} ${ty}"
            fill="none" stroke="${color}" stroke-width="${sw}"
            stroke-linecap="round" stroke-linejoin="round"/>`;
          out += line(tx - kx, ty - ky, tx, ty) + line(tx - kx, ty + ky, tx, ty);
        }
        return out;
      }
      case 'cycle': {
        // the head sits ON the arc's end angle, chevroned across the
        // tangent — an arrowhead pointing anywhere else reads as a nick
        const rr = r * 0.62, end = 380;
        const [tx, ty] = polar(cx, cy, end, rr);
        const [b1x, b1y] = polar(cx, cy, end - 16, rr + 3.4);
        const [b2x, b2y] = polar(cx, cy, end - 16, rr - 3.4);
        return `<path d="${arcPath(cx, cy, 60, end, rr)}" fill="none" stroke="${color}"
            stroke-width="${sw}" stroke-linecap="round"/>` +
          line(b1x, b1y, tx, ty) + line(b2x, b2y, tx, ty);
      }
      default:   // 'dots'
        return `<circle cx="${cx - r * 0.3}" cy="${cy - r * 0.3}" r="1.9" fill="${color}"/>
                <circle cx="${cx + r * 0.3}" cy="${cy + r * 0.3}" r="1.9" fill="${color}"/>`;
    }
  }

  /* action button; `timer` draws the auto-cycle ring around it */
  /* `timer` is now a BOOLEAN off `patch.cycle`, not a param id: the
     dwell knob went to the back face (turning it changes nothing now)
     but its COUNTDOWN stayed, because a readout is not a control. The
     ring is still drawn on the thing it re-clicks, which was the whole
     point of v1's timerRing pair. */
  function buttonBlock(pid, timer, colorIdx) {
    const p = PARAMS[pid], T = timer ? PARAMS.autoCycle : null;
    /* The CELL is a knob's cell; the BUTTON inside it stays smaller.
       Sizing the block to the glyph made remix and tune sit on a
       tighter grid than the knobs beside them, so a row of controls
       had two different rhythms and their labels never lined up. This
       is padding only — the drawn button is the size it was. */
    const cell = KNOB;
    const size = KNOB * (T ? 1.05 : 0.86);
    const h = cell + labelH + (bandStyle && !T ? 0 : readH);
    return {
      kind: 'button', pid, w: cell, h, family: p.family,
      ctl: size, ctlScales: true, ctlFloored: true,
      draw: (x, y, sc = 1) => {
        /* MIN_KNOB floors the DRAWN button too (Dan, 2026-08-16): the
           cell is KNOB (already floored), but the 0.86 inner shrink ×
           retune/tune's sizeMul 0.85 (arriving through `sc`) put the
           button itself at ~0.73× the floor knobs stop at. View-only,
           like the knob floor — the glyph circle is 0.68·s, so it still
           sits inside the 0.85-scaled cell at any floor value. */
        const c = cell * sc, s = Math.max(size * sc, MIN_KNOB);
        const cx = x + c / 2, cy = y + c / 2, r = s * 0.34;
        const color = accentFor(colorIdx);
        let out = '';
        if (g.chipStyle === 'wash') out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${INK(0.12)}"/>`;
        // the timer IS the ring: how far to the next auto-remix. Skipped
        // when `cycleReadout: bar` moves that job to the capsule up top.
        // Trial (Dan 08-16 r2): retune DOUBLES AS NEXT and the capsule
        // is off, so the ring is forced on whatever the gene says.
        if (T && (trial || g.cycleReadout !== 'bar')) {
          out += `<path d="${arcPath(cx, cy, -135, 135, r + 5)}" fill="none" stroke="${TRACK}" stroke-width="2" stroke-linecap="round"/>`;
          out += `<path d="${arcPath(cx, cy, -135, -135 + CYCLE_PROGRESS * 270, r + 5)}" fill="none" stroke="${dim(color, 70)}" stroke-width="2" stroke-linecap="round"/>`;
        }
        // glyph: dice = the `remixGlyph` gene, align = 3 converging
        // lines, spread = 3 diverging
        if (p.glyph === 'dice') {
          out += remixMark(cx, cy, r, color);
        } else if (p.glyph === 'align') {
          // Three VERTICAL lines, equal height and evenly spaced (Dan).
          // Vertical is the right axis for this button: the spectrum bar
          // above draws each voice as a vertical stem, so "tune" shows
          // those stems standing level — horizontal lines read as a list.
          // Equal heights ARE the message: aligned.
          const hh = r * 0.52;
          for (const dx of [-0.42, 0, 0.42]) {
            out += `<line x1="${cx + r * dx}" y1="${cy - hh}" x2="${cx + r * dx}" y2="${cy + hh}"
              stroke="${color}" stroke-width="2" stroke-linecap="round"/>`;
          }
        } else {   // spread
          out += `<line x1="${cx - r * 0.55}" y1="${cy - r * 0.45}" x2="${cx + r * 0.55}" y2="${cy - r * 0.45}" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
                  <line x1="${cx - r * 0.3}" y1="${cy + r * 0.1}" x2="${cx + r * 0.3}" y2="${cy + r * 0.1}" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
                  <line x1="${cx - r * 0.7}" y1="${cy + r * 0.55}" x2="${cx + r * 0.7}" y2="${cy + r * 0.55}" stroke="${color}" stroke-width="2" stroke-linecap="round"/>`;
        }
        // label + readout hang off the CELL, so they sit on the same
        // baseline as a knob's in the same row
        out += label(x, y + c + (labelH ? 8 : 0), p.label, c);
        out += readout(x, y + c + (labelH ? 8 : 0) + (labelH ? 11 : 9), T ? T.fmt(T.def) : null, c);
        return out;
      },
    };
  }

  /* ⛔ v1's `autoBlock` (auto drawn IN the pane) and `stackBlock` (which
     existed to stack it under remix) are both cut: auto is not
     immediate, so it cannot be a pane control. It stays in the rail. */

  function segmentBlock(pid) {
    const p = PARAMS[pid], cw = 32, ch = 18;
    const w = p.opts.length * (cw + 3), h = ch + labelH;
    return {
      kind: 'segment', pid, w, h, family: p.family,
      draw: (x, y) => {
        let out = '';
        p.opts.forEach((o, i) => {
          const cx = x + i * (cw + 3);
          if (i === p.def && g.chipStyle === 'wash') out += `<rect x="${cx}" y="${y}" width="${cw}" height="${ch}" rx="4" fill="${INK(0.18)}"/>`;
          out += `<text x="${cx + cw / 2}" y="${y + ch / 2 + 3}" text-anchor="middle" font-size="8" font-weight="500"
            letter-spacing="0.5" fill="${i === p.def ? HI(0.9) : INK(0.35)}">${o.toUpperCase()}</text>`;
        });
        out += label(x, y + ch + 10, p.label, w);
        return out;
      },
    };
  }

  /* A toggle: a line + a travelling cap. It lights in the accent when
     on, because everything left on the plate IS an instrument control —
     ⛔ v1's quiet `view` tier went out with the view family, which had
     exactly one member (a visualiser toggle) and no business competing
     with a control that changes the sound. */
  function toggleBlock(pid, colorIdx) {
    const p = PARAMS[pid], w = 52, h = 14 + labelH;
    const quiet = false;
    return {
      kind: 'toggle', pid, w, h, family: p.family,
      draw: (x, y) => {
        const tw = 26, cy = y + 7;
        const lit = quiet ? INK(0.7) : accentFor(colorIdx ?? 0);
        let out = `<line x1="${x + w / 2 - tw / 2}" y1="${cy}" x2="${x + w / 2 + tw / 2}" y2="${cy}"
          stroke="${TRACK}" stroke-width="3" stroke-linecap="round"/>`;
        const kx = x + w / 2 + (p.def ? tw / 2 - 4 : -tw / 2 + 4);
        out += `<line x1="${kx - 3}" y1="${cy}" x2="${kx + 3}" y2="${cy}" stroke="${p.def ? lit : INK(0.3)}" stroke-width="3" stroke-linecap="round"/>`;
        out += label(x, y + 14 + 8, p.label, w);
        return out;
      },
    };
  }

  /* A single horizontal slider — the VerticalFader's grammar laid flat:
     capsule track, capsule fill, and the fill's own rounded end IS the
     handle. No ball, per the theme. */
  function sliderBlock(pid, colorIdx) {
    const p = PARAMS[pid], w = 66, sw = 4;
    const h = sw + 10 + labelH + readH;
    return {
      kind: 'slider', pid, w, h, family: p.family,
      draw: (x, y) => {
        const cy = y + sw, color = accentFor(colorIdx);
        let out = `<line x1="${x}" y1="${cy}" x2="${x + w}" y2="${cy}"
          stroke="${TRACK}" stroke-width="${sw}" stroke-linecap="round"/>`;
        out += `<line x1="${x}" y1="${cy}" x2="${x + Math.max(sw, w * p.def)}" y2="${cy}"
          stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
        out += label(x, cy + (labelH ? 14 : 8), p.label, w);
        out += readout(x, cy + (labelH ? 25 : 15), p.fmt ? p.fmt(p.def) : null, w);
        return out;
      },
    };
  }

  function stepsBlock(pid) {
    const p = PARAMS[pid], w = 50, h = 40 + labelH;
    return {
      kind: 'steps', pid, w, h, family: p.family,
      draw: (x, y) => {
        let out = '';
        const bw = 3, gap = (w - 14) / (p.def - 1);
        for (let i = 0; i < p.def; i++) {
          const bh = 7 + i * 5.5;
          out += `<rect x="${x + 7 + i * gap - bw / 2}" y="${y + 34 - bh}" width="${bw}" height="${bh}" rx="1.5"
            fill="${i < 2 ? INK(0.8) : TRACK}"/>`;
        }
        out += label(x, y + 34 + 10, p.label, w);
        return out;
      },
    };
  }

  /* ── the per-voice SET: one geometry for pans and mutes ──────────
     Three readings of a per-voice set — square · horizontal line ·
     vertical line — and ⭐ ONE geometry behind both, so two sets on the
     same plate line up cell for cell: same cell pitch, same mark size,
     same label baseline, identical footprint for a given voice count.
     Before this the mutes sat on a 19pt pitch and the pans on 22, which
     meant a matched pair still failed to align.

     ⚠️ `square` degenerates honestly at low counts: 2 voices is a pair
     either way, and 3 is an L rather than a square. Forcing a 2×2 with a
     hole would be a grid lying about how many voices there are. */
  /* ⚠️ Scaled by `knobSize` like everything else. These were fixed at
     20/15 while `KNOB` grew, so at the top of the range the knobs
     ballooned and the pan and mute sets sat there unchanged — the plate
     stopped reading as one instrument and started reading as two. The
     gene is called knobSize but it is really the plate's control scale,
     and a per-voice mark is a control. */
  /* ⚠️ The shared cell is sized off the LARGEST mark, not the base one.
     The pan mark runs 1.2× (prominence, below), and in a 20pt cell that
     left 2pt between pan bodies — arcs visually touching. 24 restores
     the mute's 0.75 mark:cell ratio for the pan too, and because the
     pitch is still ONE number the pan and mute sets keep lining up cell
     for cell — the padding grows, the grid holds. */
  /* ⭐ The knob floor applies to the per-voice marks too ("including pan
     knobs and mute buttons" — Dan): the SCALE is floored, not one mark,
     so the cell grows with its mark and the 0.75 mark:cell ratio — and
     with it the pan/mute/fader alignment — holds. */
  const vScale = Math.max(g.knobSize, MIN_KNOB / 15);
  const VCELL = 24 * vScale;       // the per-voice cell, shared
  const VMARK = 15 * vScale;       // the mark drawn inside it
  /* ⭐ v3: the pan is the prominent one of the two per-voice marks —
     "make the pans more prominent" (Dan). One-fifth up on the shared
     mark, still inside the shared cell so a matched pan/mute pair keeps
     lining up cell for cell. */
  const PANMARK = VMARK * 1.2;

  function voiceGrid(layout, n) {
    const cols = layout === 'row' ? n : layout === 'column' ? 1 : Math.ceil(Math.sqrt(n));
    return { cols, rows: Math.ceil(n / cols) };
  }

  /* ⚠️ The block declares the width it REALLY occupies, caption included.
     A `column` is one cell wide — about 20pt — while its caption is
     nearer 24, so two of them placed a `blockGap` apart had captions
     almost touching while the marks looked far apart: the packer was
     spacing the grids, not the blocks. Measuring the caption fixes the
     padding and the centring at once, because the grid is then centred
     inside the true width rather than flush against its left edge. */
  const captionW = (text) => (g.labels === 'hidden' || !text) ? 0 : String(text).length * 5.9 + 2;

  function voiceSetBlock(pid, voices, layout, kind, mark) {
    const p = PARAMS[pid];
    const { cols, rows } = voiceGrid(layout, voices);
    const gridW = cols * VCELL;
    /* ⚠️ A small inset so the grid never sits flush against the block's
       edge. Two per-voice sets side by side were separated only by the
       generic `blockGap`, which reads as tight when both sides of it are
       a dense field of marks rather than a lone knob on a big cell. It
       scales with the cell, so the breathing room holds at every
       `knobSize`. */
    const inset = VCELL * 0.18;
    const w = Math.max(gridW + inset * 2, captionW(p.label));
    const h = rows * VCELL + labelH;
    const pad = (w - gridW) / 2;          // ⭐ the grid centred in the block
    return {
      kind, pid, w, h, family: p.family,
      // per-voice marks draw at a fixed size (no placement scale)
      ctl: kind === 'voicePans' ? PANMARK : VMARK,
      draw: (x, y) => {
        let out = '';
        for (let i = 0; i < voices; i++) {
          const cx = x + pad + (i % cols) * VCELL + VCELL / 2;
          const cy = y + Math.floor(i / cols) * VCELL + VCELL / 2;
          out += mark(cx, cy, i);
        }
        out += label(x, y + rows * VCELL + 8, p.label, w);
        return out;
      },
    };
  }

  /* The switch itself is a filled cell when live and an outline when
     muted, because "muted" is the state that should look like an
     absence. No cross, no slash: the theme has no filled marks, and an
     empty cell already says nothing-coming-through. */
  function muteCell(cx, cy, size, on, color) {
    const x = cx - size / 2, y = cy - size / 2;
    return on
      ? `<rect x="${x}" y="${y}" width="${size}" height="${size}" rx="3" fill="${color}" opacity="0.85"/>`
      : `<rect x="${x + 0.5}" y="${y + 0.5}" width="${size - 1}" height="${size - 1}" rx="3"
           fill="none" stroke="${INK(0.28)}" stroke-width="1"/>`;
  }
  const muteOn = (i) => rs(i * 19 + 7) > 0.28;

  /* ⭐ ONE place decides both per-voice shapes, so pan and mute can never
     disagree by accident — the same discipline as `voiceInk` being the
     single source of per-voice colour. Under `shapeLink: matched` (the
     norm) the pan simply takes the mute's shape, direction included. */
  const muteShape = g.mutePlace === 'cluster' ? 'square' : g.mutePlace;
  const panShape = (g.shapeLink !== 'free' && present.has('mutes')) ? muteShape : g.panPlace;

  const voiceMutesBlock = (pid, voices) =>
    voiceSetBlock(pid, voices, muteShape, 'voiceMutes',
      (cx, cy, i) => muteCell(cx, cy, VMARK, muteOn(i), voiceInk(i)));

  /* ── THE WAVE SCREEN (the witness) ────────────────────────────────
     One period (or two) of the real morphed, folded, saturated waveform
     — the same picture the shape/fold menu shows, at faceplate size.

     It is not a control and never appears in a manifest: it is drawn
     because the plate carries the controls that move it. Its VALUES come
     from those controls, so a plate with no fold knob shows an unfolded
     wave — the screen can never claim more than the plate can do. */
  function scopeBlock(present, strength, sizeMul) {
    /* ⚠️ No shape KNOB does not mean no shape. A square-only patch has
       nothing to morph, which is precisely why it has no shape control —
       and drawing a sine there would be the screen lying about the
       synth. So the resting shape comes from the PATCH, and the knob
       only overrides it when the plate actually carries one. */
    const anchor = { sine: 0, triangle: 1 / 3, square: 2 / 3, saw: 1 };
    const restShape = patch.waves.length === 1 ? (anchor[patch.waves[0]] ?? 0) : PARAMS.shape.def;
    const vals = {
      shape: present.has('shape') ? PARAMS.shape.def : restShape,
      width: present.has('width') ? PARAMS.width.def : 0.5,
      fold:  present.has('fold')  ? PARAMS.fold.def  : 0,
      sat:   present.has('saturation') ? PARAMS.saturation.def : 0,
    };
    const cycles = g.scopeCycles === 'two' ? 2 : 1;
    /* ⭐ The size INVERSION: the weak witness (saturation alone) is drawn
       BIGGER. A subtle change needs more pixels to be legible, while a
       silhouette-transforming one survives at any size. */
    const bigger = strength === 'weak' ? 1.25 : 1;
    /* `banner` and `hero` claim a SHARE OF THE ZONE, not a multiple of
       the inline size — "spanning the plate's width" has to mean the
       plate, or the gene is just three sizes of the same small box. */
    const w = sizeMul > 1
      ? Math.round(zone.w * (sizeMul >= 2.5 ? 0.94 : 0.78))
      : Math.round(76 * bigger);
    const h = Math.round((sizeMul > 1 ? w * (sizeMul >= 2.5 ? 0.42 : 0.30) : 38 * bigger));
    const N = 150;
    return {
      kind: 'scope', pid: 'scope', w, h: h + labelH, family: 'tone', witness: true,
      draw: (x, y, sc = 1) => {
        const ww = w * sc, hh = h * sc;
        let out = '';
        if (g.scopeFrame === 'fill') {
          out += `<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="4" fill="${INK(0.05)}"/>`;
        } else if (g.scopeFrame === 'hairline') {
          out += `<rect x="${x + 0.5}" y="${y + 0.5}" width="${ww - 1}" height="${hh - 1}" rx="4"
            fill="none" stroke="${INK(0.10)}" stroke-width="1"/>`;
        }
        const mid = y + hh / 2, half = (hh - 6) / 2;
        out += `<line x1="${x + 3}" y1="${mid}" x2="${x + ww - 3}" y2="${mid}" stroke="${INK(0.10)}" stroke-width="1"/>`;
        const pts = waveTrace(vals, N, cycles);
        let d = '';
        for (let i = 0; i < N; i++) {
          const px = x + 3 + (i / (N - 1)) * (ww - 6);
          const py = mid - pts[i] * half;
          d += `${i ? ' L' : 'M'} ${px.toFixed(1)} ${py.toFixed(1)}`;
        }
        // the app's own trace weight: ink 0.75, round caps, 1.5 at 1×
        out += `<path d="${d}" fill="none" stroke="${INK(0.75)}" stroke-width="${(1.5 * sc).toFixed(2)}"
          stroke-linecap="round" stroke-linejoin="round"/>`;
        out += label(x, y + hh + 9, 'wave', ww);
        return out;
      },
    };
  }

  /* ── the pan mark ─────────────────────────────────────────────────
     A pan is a knob, so it wears whatever `knobStyle` the knobs wear —
     it just runs bipolar. Delegating to `ring()` is the whole
     implementation: the pan's −1…1 maps onto the same 270° travel, and
     `panFill: noon` makes the filled styles grow out of the middle
     instead of out of the start.

     ⛔ No centre pip (Dan): the fill starting at the middle IS the
     centre marker, and on the unfilled styles the plate is already a
     grid of knobs — a lone dot floating over one of them was a second
     vocabulary for no gain. */
  function panMark(cx, cy, pr, pan, color) {
    return ring(cx, cy, pr, (pan + 1) / 2, color, 2, false, true);
  }

  /* ── the mixer CLUSTER ────────────────────────────────────────────
     level + pan for every voice, positioned by `mixerScatter`:

       0   a strict console — even columns, equal fader heights, each
           pan squarely beneath its own fader
       1   a composition — the faders take the spectrum bar's own stem
           spacing (so a voice sits where its pitch sits), their heights
           vary, and each pan swings out to a seeded angle and distance
           around its fader's foot instead of always hanging below it

     The pan never leaves its fader's neighbourhood at any scatter: it
     orbits the foot rather than being thrown somewhere else, so which
     pan belongs to which voice survives the scattering. That is the
     whole difference between a composition and a mess.

     ⭐ v2: under `mutePlace: cluster` the voice's MUTE joins it, sitting
     at the head of its own fader — so a voice's whole strip (level, pan,
     mute) is one thing that travels together. That is the coherence half
     of Dan's open question; `square` and `row` are the other half. */
  /* ⭐ The per-voice strip, in its two kinds (Dan, 2026-08-15):
       'mixer'  fader track · pan at the foot
       'mute'   mute cap    · pan below it
     One object with the head swapped, not two objects — a voice reads
     the same way in both, so a plate carrying one and a plate carrying
     the other are recognisably the same instrument.
     ⛔ Never both: `mutes` and `levels` are xor'd in the catalog, which
     is what makes this a pair and never a triple. */
  /* ⭐ THE FADER FLOOR (Dan, 2026-08-16): a voice level line may never
     RENDER thinner than the main mixer's MASTER_VW lines beside it —
     the body group is scaled by `fit`, so a faderW-4 plate at fit 0.6
     drew ~2.4px faders against fixed 5px chrome. Divide the floor by
     `fit` at DRAW time (draws run after the fit const is assigned;
     builders only close over it) so the on-screen width comes out
     ≥ MASTER_VW. ⛔ Draw-time only, MIN_KNOB's precedent: boxes still
     pack on `g.faderW` — the ink refuses to go hairline, the layout
     does not move. The levelBar crossbar rides the floored width. */
  const fadW = () => Math.max(g.faderW, MASTER_VW / fit);

  function clusterBlock(voices, kind) {
    const mixer = kind !== 'mute';
    LAST_CLUSTER = mixer ? 'mixer' : 'mute';
    const s = g.mixerScatter;
    const W = Math.max(voices * 26, zone.w * (0.55 + 0.45 * s));
    /* ⭐ One mark size everywhere: the strip's mute cap and its pan
       take the SAME `VMARK` as a standalone set, so a voice reads as
       head-square · track · foot-circle at one scale, and a cluster on
       one plate matches a loose set on another. */
    const baseH = 60, panR = PANMARK / 2, panGap = 15;
    const mS = VMARK;                         // the in-strip mute cap
    /* ⚠️ The mute strip has no track, so `fh` is 0 and the pan orbits
       the CAP instead of a fader foot. Everything below is written off
       `fh`, which keeps one geometry for both kinds — the scatter gene
       goes on meaning the same thing rather than needing a second
       calibration for a strip half the height. */
    const headR = mixer ? 0 : mS / 2;

    const stems = stemXs(voices, W);
    const units = [];
    for (let i = 0; i < voices; i++) {
      const even = W * (i + 0.5) / voices;
      const fx = Math.max(panR + 2, Math.min(W - panR - 2,
        even + (stems[i] - even) * s + (rs(i * 31 + 4) - 0.5) * s * 26));
      const fh = mixer ? baseH * (1 - s * 0.35 + rs(i * 13 + 6) * s * 0.7) : 0;
      const fy = (rs(i * 7 + 11) - 0.5) * s * 34;          // vertical drift
      // the pan orbits the fader's foot: straight below at s=0, out to a
      // seeded bearing as s→1
      const bearing = 90 + (rs(i * 23 + 9) * 360 - 90) * s;
      const dist = (panGap + headR) * (1 + (rs(i * 29 + 3) * 1.5 - 0.35) * s);
      const rad = bearing * Math.PI / 180;
      units.push({
        i, fx, fy, fh,
        px: fx + Math.cos(rad) * dist * 0.95,
        py: fy + fh + Math.sin(rad) * dist,
        pan: (rs(i * 17 + 1) - 0.5) * 2,
        val: 0.25 + rs(i * 5) * 0.65,
      });
    }
    // normalise to the real bounding box so the layout packs it honestly
    const fw = g.faderW;
    const headW = mixer ? fw : mS;
    const minX = Math.min(...units.map(u => Math.min(u.fx - headW / 2, u.px - panR - 1)));
    const maxX = Math.max(...units.map(u => Math.max(u.fx + headW / 2, u.px + panR + 1)));
    const minY = Math.min(...units.map(u => Math.min(u.fy - headR, u.py - panR - 1)));
    const maxY = Math.max(...units.map(u => Math.max(u.fy + u.fh + headR, u.py + panR + 1)));
    const w = maxX - minX, h = (maxY - minY) + labelH;

    return {
      kind: 'cluster', pid: mixer ? 'levels' : 'mutes', w, h, family: 'voices',
      members: mixer ? ['levels', 'pans'] : ['mutes', 'pans'],
      // smallest drawn mark: the mute strip's cap or the mixer's pan
      ctl: mixer ? PANMARK : VMARK,
      draw: (x, y) => {
        let out = '';
        const fwd = fadW();      // floored at draw; the bbox packed on fw
        for (const u of units) {
          const color = voiceInk(u.i);
          const cx = x + u.fx - minX, ty = y + u.fy - minY;
          if (mixer) {
            out += `<rect x="${cx - fwd / 2}" y="${ty}" width="${fwd}" height="${u.fh}" rx="${fwd / 2}" fill="${TRACK}"/>`;
            const filled = Math.max(fwd, u.fh * u.val);
            out += levelFill(cx - fwd / 2, ty + u.fh - filled, fwd, filled, color, 'top');
            out += levelBar(cx, ty + u.fh - filled, fwd, color, true);
          } else {
            out += muteCell(cx, ty, mS, muteOn(u.i), color);
          }
          out += panMark(x + u.px - minX, y + u.py - minY, panR, u.pan, dim(color, 100));
        }
        out += label(x, y + (maxY - minY) + 9, mixer ? 'mix' : 'mute', w);
        return out;
      },
    };
  }

  /* pans on their own — a plain row of PanPot arcs */
  /* Pans standing alone (no mixer to join) take the SAME three layouts
     as the mutes, off the same geometry — `panPlace`, or the mute's own
     shape under `shapeLink: matched`. Inside the cluster this is inert:
     there the pan belongs to its fader's foot, which is the whole point
     of the cluster. */
  const voicePansBlock = (pid, voices) =>
    voiceSetBlock(pid, voices, panShape, 'voicePans',
      (cx, cy, i) => panMark(cx, cy, PANMARK / 2, (rs(i * 17 + 1) - 0.5) * 2, voiceInk(i)));

  function voiceFadersBlock(pid, voices) {
    const p = PARAMS[pid], trackH = 74;
    /* ⭐ ONE pitch for EVERY per-voice mark (Dan, 2026-08-15: "align
       level and pan along the columns / items below"). The faders sat
       on their own private lane — first 13pt, then 20, then 24, never
       scaled by knobSize — so a fader console stacked over a pan row
       could not line up voice for voice. Now a lane IS a voice cell:
       `VCELL` pitch, the sets' own 0.18 inset, caption-aware width, and
       the grid centred in the block — exactly voiceSetBlock's geometry.
       Two same-count per-voice blocks centred on one axis (which the
       loose grid's centre-snap guarantees) therefore align lane to
       cell: voice i's fader stands over voice i's pan. */
    const inset = VCELL * 0.18;
    const lenOf = (i) => g.faderLen === 'varied' ? 0.6 + rs(i * 11 + 2) * 0.45 : 1;
    const maxLen = Math.max(...Array.from({ length: voices }, (_, i) => lenOf(i)));
    const val = (i) => 0.25 + rs(i * 5) * 0.65;

    if (g.faderOrient === 'horizontal') {
      /* ⭐ The track spans the voice GRID's width (min 84 so two voices
         don't leave a stub) — at 4+ voices the bar ends land flush with
         a pan row's edges below, which is the alignment being asked for. */
      const rowH = VCELL;
      const trackW = Math.max(voices * VCELL, 84);
      const w = Math.max(trackW + inset * 2, captionW(p.label));
      const pad = (w - trackW) / 2;
      const h = rowH * voices + labelH;
      return {
        kind: 'voiceFaders', pid, w, h, family: p.family,
        draw: (x, y) => {
          let out = '';
          const x0 = x + pad;
          for (let i = 0; i < voices; i++) {
            const cy = y + rowH * (i + 0.5), fw = fadW(), len = trackW * lenOf(i) / maxLen;
            out += `<line x1="${x0}" y1="${cy}" x2="${x0 + len}" y2="${cy}" stroke="${TRACK}" stroke-width="${fw}" stroke-linecap="round"/>`;
            /* The fill was a round-capped line; as a rect its foot keeps
               the cap's reach (x0 − fw/2) and its value end squares off
               AT the value, where the crossbar now stands. */
            const fx1 = x0 + Math.max(fw, len * val(i));
            out += levelFill(x0 - fw / 2, cy - fw / 2, fx1 - x0 + fw / 2, fw, voiceInk(i), 'right');
            out += levelBar(fx1, cy, fw, voiceInk(i), false);
          }
          out += label(x, y + rowH * voices + 9, p.label, w);
          return out;
        },
      };
    }

    const laneW = VCELL, gridW = laneW * voices;
    const w = Math.max(gridW + inset * 2, captionW(p.label));
    const pad = (w - gridW) / 2;
    /* ⭐ Caption padding matched to the other per-voice blocks (Dan,
       2026-08-16). A voice grid's marks stop (VCELL−VMARK)/2 short of
       the cell edge, so its caption sits 8 + that inset below the ink —
       while these tracks run to the block's own edge, leaving the same
       caption visually tighter. The fader caption takes the identical
       gap, mark-bottom to baseline. */
    const capGap = (VCELL - VMARK) / 2;
    const h = trackH + capGap + labelH + 2;
    return {
      kind: 'voiceFaders', pid, w, h, family: p.family,
      draw: (x, y) => {
        let out = '';
        for (let i = 0; i < voices; i++) {
          const cx = x + pad + laneW * (i + 0.5), fw = fadW();
          const color = voiceInk(i);
          const len = trackH * lenOf(i) / maxLen, top = y + (trackH - len), v = val(i);
          out += `<rect x="${cx - fw / 2}" y="${top}" width="${fw}" height="${len}" rx="${fw / 2}" fill="${TRACK}"/>`;
          out += levelFill(cx - fw / 2, top + len * (1 - v), fw, len * v, color, 'top');
          out += levelBar(cx, top + len * (1 - v), fw, color, true);
        }
        out += label(x, y + trackH + capGap + 8, p.label, w);
        return out;
      },
    };
  }

  /* ── manifest → blocks, honouring the declared pairs ─────────────── */
  const consumed = new Set();
  const blocks = [];
  let colorIdx = 0;

  /* ⭐ v3: ⛔ no cluster at 5+ voices — "for 5 it might not look
     appealing in a cluster" (Dan). The pair flattens to separate blocks
     (see the PAIRS loop), so a six-voice plate reads as rows and grids
     rather than one dense knot. The threshold is a constant, not a
     gene: it is a legibility floor, not a taste to explore.
     ⚠️ `pairStyle: flatten` stops every cluster from forming, which is
     why nothing may DEPEND on one existing — both members are ordinary
     blocks whenever the pair does not fire. */
  const clusterAllowed = manifest.voices < 5;

  if (g.pairStyle === 'declared') {
    for (const pr of PAIRS) {
      if (!present.has(pr.a) || !present.has(pr.b)) continue;
      if (consumed.has(pr.a) || consumed.has(pr.b)) continue;
      if (pr.style === 'cluster' && !clusterAllowed) continue;   // 5+ voices: no knot
      /* ⛔ v3.1: the mute+pan strip is opt-in per genome. `mutePlace`
         still owns where mutes go, so the other three placements keep
         mutes and pans as separate blocks — otherwise adding the pair
         would have quietly deleted three quarters of that gene. */
      if (pr.a === 'mutes' && g.mutePlace !== 'cluster') continue;
      consumed.add(pr.a); consumed.add(pr.b);
      if (pr.style === 'cluster') {
        blocks.push(clusterBlock(manifest.voices, pr.a === 'mutes' ? 'mute' : 'mixer'));
      } else if (pr.style === 'concentric') {
        blocks.push(concentricBlock(pr.a, pr.b, pr.label, colorIdx++));
      } else {   // adjacent — two blocks, marked so layout keeps them together
        const mk = (id) => PARAMS[id].kind === 'button'
          ? buttonBlock(id, null, colorIdx) : knobBlock(id, colorIdx);
        const g1 = mk(pr.a), g2 = mk(pr.b);
        g1.glue = g2.glue = `glue${colorIdx++}`;
        blocks.push(g1, g2);
      }
    }
  }
  for (const pid of manifest.controls) {
    if (consumed.has(pid)) continue;
    const p = PARAMS[pid];
    if (!p) continue;
    switch (p.kind) {
      case 'knob':         blocks.push(knobBlock(pid, colorIdx++)); break;
      case 'slider':       blocks.push(sliderBlock(pid, colorIdx++)); break;
      /* ⭐ remix wears the cycle ring whenever the SONG cycles — the
         readout survived the dwell knob's exile to the back face. */
      case 'button':       blocks.push(buttonBlock(pid, pid === 'remix' && patch.cycle, colorIdx++)); break;
      case 'segment':      blocks.push(segmentBlock(pid)); break;
      case 'toggle':       blocks.push(toggleBlock(pid, colorIdx++)); break;
      case 'steps':        blocks.push(stepsBlock(pid)); break;
      case 'voiceFaders':  blocks.push(voiceFadersBlock(pid, manifest.voices)); break;
      case 'voicePans':    blocks.push(voicePansBlock(pid, manifest.voices)); break;
      case 'voiceMutes':   blocks.push(voiceMutesBlock(pid, manifest.voices)); break;
    }
  }

  /* ── the witness (PLAN §9) ───────────────────────────────────────
     Derived, never authored. `banner` and `hero` are pulled out of the
     flow entirely and drawn as their own row; `inline` lets the screen
     pack as an ordinary tone block, bound to the controls that move it.

     ⛔ ONE picture per plate. The pane already sits under a field sliver
     and a spectrum bar; a third is how a faceplate becomes a dashboard.
     That is enforced by there being exactly one witness, not by a rule
     the layout has to remember. */
  const scopeStrength = manifest.scope;
  let bannerScope = null;
  if (scopeStrength) {
    const heroScope = g.scopePlace === 'hero';
    const sizeMul = g.scopePlace === 'banner' ? 1.9 : heroScope ? 2.6 : 1;   // >1 = zone-relative
    const sb = scopeBlock(present, scopeStrength, sizeMul);
    if (g.scopePlace === 'inline') blocks.push(sb);
    else bannerScope = sb;
  }

  /* ── group into family sections ─────────────────────────────────── */
  const byFamily = new Map();
  for (const b of blocks) {
    if (!byFamily.has(b.family)) byFamily.set(b.family, []);
    byFamily.get(b.family).push(b);
  }
  let sections = FAMILY_ORDER.filter(f => byFamily.has(f)).map(f => ({ key: f, blocks: byFamily.get(f) }));

  const orderRng = mulberry32(Math.floor(g.orderSeed * 0xffffffff) ^ seed);
  for (let i = sections.length - 1; i > 0; i--) {
    const j = Math.floor(orderRng() * (i + 1));
    [sections[i], sections[j]] = [sections[j], sections[i]];
  }
  if (t < 0.45) {   // braun: the voice block leads if there is one
    const vi = sections.findIndex(s => s.key === 'voices');
    if (vi > 0) { const [v] = sections.splice(vi, 1); sections.unshift(v); }
  }

  /* ── TIERS have to mean something visually (PLAN §8) ─────────────
     Or they are just draw weights. Three light rules, leaving the
     composition itself to the genome:
       always (**)   a size FLOOR, and the only tier eligible for hero
       mostly (*)    normal
       situational   may render at 0.85×, and is the only tier the
                     packer may strand in a last row
     ⛔ Deliberately NOT a position rule: pinning the ** tier to the top
     would be the genome's job taken away, and the whole point is that
     the arrangement stays explorable. */
  /* ⭐ v3: a tier is the RECIPE's weight, not the catalog's — the same
     number the grid's slider shows, so a control you set to 100% earns
     the size floor on this recipe even if the catalog thinks little of
     it. The catalog stays the fallback for authored plates. */
  const tierOf = (b) => {
    const w = manifest.weights ? manifest.weights[b.pid] : PARAMS[b.pid]?.w;
    if (b.witness || w == null) return 'mostly';
    return w >= 1 ? 'always' : w >= 0.5 ? 'mostly' : 'situational';
  };
  /* ⛔ The situational 0.85 shrink is RETIRED (Dan, 2026-08-15). It kept
     injecting size differences the catalog never asked for: pans a tier
     apart from levels broke the voice-set pitch ("align level and pan
     along the columns" — first patched as an exemption), then DRIVE and
     DRIFT drew as two almost-equal knobs ("make the drive and drift the
     same size"), which reads as sloppy, not as hierarchy. Size now has
     exactly two authors: the catalog's `sizeMul` (remix/tune 0.85, lpf
     1.25 — Dan's stated hierarchy) and the hero. Tiers still order the
     plate; they no longer size it. */
  const tierScale = () => 1;

  /* hero: one control drawn oversize (bauhaus half of the axis).
     WHICH one is `heroPick` — before that gene it took the first
     eligible block in reading order, making the identity a side-effect
     of `orderSeed`, a gene documented as "not a quality axis". So the
     model could never learn that promoting the FILTER reads differently
     from promoting REMIX.

     ⛔ Under `scopePlace: hero` there is no control hero at all: the
     screen is already the dominant element, and two dominants is none. */
  let heroBlock = null;
  const scopeIsHero = !!bannerScope && g.scopePlace === 'hero';
  if (g.hero === 'on' && t > 0.35 && !scopeIsHero) {
    const eligible = (b) => !b.glue && tierOf(b) !== 'situational' &&
      (b.kind === 'knob' || b.kind === 'pair' ||
       (b.kind === 'button' && g.heroPick === 'action'));
    const all = sections.flatMap(sec => sec.blocks).filter(eligible);
    heroBlock = (g.heroPick !== 'first' && all.find(b => b.family === g.heroPick))
      || all[0] || null;
  }
  LAST_HERO = scopeIsHero ? 'scope' : heroBlock ? heroBlock.pid : null;
  const heroScale = 1.3 + t * 0.5;
  /* ⭐ v3 `sizeMul` — the catalog's fixed per-control size class (lpf
     1.25×, remix/tune 0.85×), multiplied on top of tier and hero. The
     size hierarchy Dan described lives in the catalog, not the genome:
     it holds on every plate, and the genome still owns everything else. */
  const scaleOf = (b) => (b === heroBlock ? heroScale : tierScale(b)) * (PARAMS[b.pid]?.sizeMul || 1);

  /* ── layout ──────────────────────────────────────────────────────── */
  const rowGap = 12 * g.gapScale, sectionGap = 15 * g.gapScale, blockGap = 11 * g.gapScale;
  const glueGap = 5;
  const placed = [], marks = [], SNAP_LOG = [];

  /* ── the loose grid's matcher, shared by both flows ────────────────
     Order-preserving MAX-GAIN assignment where items may go unmatched:
     gainOf(i, j) > 0 pairs item i with target j. Returns chosen[i] =
     target index or -1. Both grid passes feed it centres — the rows
     pass in x, the columns pass (transposed) in y. */
  const assignLoose = (n, m, gainOf) => {
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    const mv = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(1)); // 1 skip item · 2 skip target · 3 match
    for (let j = 1; j <= m; j++) mv[0][j] = 2;
    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        let best = dp[i - 1][j], move = 1;
        if (dp[i][j - 1] > best) { best = dp[i][j - 1]; move = 2; }
        const g2 = gainOf(i - 1, j - 1);
        if (g2 > 0 && dp[i - 1][j - 1] + g2 > best) { best = dp[i - 1][j - 1] + g2; move = 3; }
        dp[i][j] = best; mv[i][j] = move;
      }
    }
    const chosen = new Array(n).fill(-1);
    let bi = n, bj = m;
    while (bi > 0 || bj > 0) {
      const move = mv[bi][bj];
      if (move === 3) { chosen[bi - 1] = bj - 1; bi--; bj--; }
      else if (move === 2) bj--;
      else bi--;
    }
    return chosen;
  };
  const VOICEK = /^voice(Faders|Pans|Mutes)$|^cluster$/;
  let contentW = 0, contentH = 0;

  /* ── LAYOUT CAPS (SPEC-parametric-faceplates §5/§13, Dan 2026-08-15) ─
     Not genes — packer CONSTANTS that travel with the pane geometry
     (393×292 ⇒ 3 rows / 4 columns). The evening's ratings replay is
     unambiguous: rows-flow like-rate falls 68% → 38% → 10% → 0% at
     2/3/4/5+ rows, and columns 72–80% → 64% → 55% → 16% at 2–3/4/5/6.
     Past the cap the plate is not a variant, it is a failure.

     ⛔ Deterministic per seed: an over-cap plate is RE-LAID, never
     re-rolled — the same seeds must always give the same plate.
     ⛔ Never violated in the output, so the check is a post-pack
     invariant, not a hint: rows falls back to the columns flow (a
     rows-flow plate that wide is 0–10% liked anyway, and columns
     absorbs the same content by merging), columns keeps merging past
     the "must buy fit" refusal until it is inside the cap.

     ⚠️ The iPad pass (§13.5) re-reads these two numbers off a larger
     pane; nothing else about the packer is allowed to know the size. */
  const ROW_CAP = 3, COL_CAP = 4;
  let capNote = null;              // what the cap did, for __WT_DEBUG + goldens
  let flow = g.flow;               // the EFFECTIVE flow — g.flow stays the gene
  let rowPlan = null;

  if (flow === 'rows') {
    /* ── 1. sections → UNITS ─────────────────────────────────────────
       A unit is a run of blocks that must stay adjacent. Normally that
       is a whole section; a section too wide for the zone splits into
       several units so it wraps rather than overflowing. Pairs keep
       their tight `glueGap` inside a unit. */
    const units = [];
    for (const sec of sections) {
      let items = [], w = 0;
      for (const b of sec.blocks) {
        const scale = scaleOf(b);
        const bw = b.w * scale;
        const gap = items.length
          ? (b.glue && items[items.length - 1].b.glue === b.glue ? glueGap : blockGap) : 0;
        if (items.length && w + gap + bw > zone.w) {
          units.push({ key: sec.key, items, w }); items = []; w = 0;
        }
        const gg = items.length
          ? (b.glue && items[items.length - 1].b.glue === b.glue ? glueGap : blockGap) : 0;
        items.push({ b, scale, bw, gap: gg });
        w += gg + bw;
      }
      if (items.length) units.push({ key: sec.key, items, w });
    }

    /* ── 2. pack units into rows, BALANCED ───────────────────────────
       One section per row wasted this zone: 7 controls in 4 families
       laid out 2-1-1-1 and filled a third of the width. So units share
       rows, separated by the wider `sectionGap` (blocks inside a unit
       keep `blockGap`) — the gap itself says where one group ends.

       Greedy wrap finds the minimum row count R, then a second pass
       re-packs into exactly R rows aiming at an equal width each, so
       the last row isn't left holding one lonely knob. */
    const packRows = () => {
      let n = 0, w = 0, rowsMin = 1;
      for (const u of units) {
        const gap = n ? sectionGap : 0;
        if (n && w + gap + u.w > zone.w) { rowsMin++; n = 0; w = 0; }
        w += (n ? sectionGap : 0) + u.w; n++;
      }
      const R = rowsMin;
      const total = units.reduce((a, u) => a + u.w, 0) + sectionGap * (units.length - 1);
      const target = total / R;
      const rows = [];
      let i = 0;
      for (let r = 0; r < R; r++) {
        const row = [];
        let rw = 0;
        const rowsAfter = R - r - 1;
        while (i < units.length) {
          // never take a unit a later row still needs
          if (row.length && (units.length - i) <= rowsAfter) break;
          const gap = row.length ? sectionGap : 0;
          if (row.length && rw + gap + units[i].w > zone.w) break;
          if (row.length && rw >= target) break;   // this row has its share
          rw += gap + units[i].w;
          row.push(units[i]); i++;
        }
        if (row.length) rows.push(row);
      }
      while (i < units.length) rows[rows.length - 1].push(units[i++]);  // safety
      return rows;
    };

    /* ── 2b. the ROW CAP ─────────────────────────────────────────────
       Taken here, before a single rng() is drawn: unit building and
       packRows are pure functions of (blocks, zone, genome), so the
       fallback costs the seed nothing — the columns branch then draws
       its own jitter from the same untouched stream. */
    rowPlan = packRows();
    if (rowPlan.length > ROW_CAP) {
      capNote = { cap: 'rows', rows: rowPlan.length, to: 'columns' };
      flow = 'columns'; rowPlan = null;
    }
  }

  if (flow === 'rows') {
    /* ── 3. place ───────────────────────────────────────────────────── */
    let cursorY = 0;
    const rows = rowPlan;
    const rowEntries = [];
    rows.forEach((row, ri) => {
      const totalW = row.reduce((a, u) => a + u.w, 0) + sectionGap * (row.length - 1);
      let x = g.align === 'center' ? (zone.w - totalW) / 2 : 0;
      /* jitter is DRAWN here (rng order unchanged) but APPLIED after the
         grid pass below — `jitter` is wander off the grid, and there is
         no grid to wander off if the wander goes in first */
      const jx = (rng() - 0.5) * 2 * t * g.jitter * Math.max(0, (zone.w - totalW) * 0.45);
      const rowH = Math.max(...row.flatMap(u => u.items.map(e => e.b.h * e.scale)));
      const entries = [];
      row.forEach((u, ui) => {
        if (ui) x += sectionGap;
        for (const e of u.items) {
          x += e.gap;
          /* blocks share the row's CENTRE line, not its top edge — a
             short pan set beside a tall mute grid reads as one shelf */
          const p = { block: e.b, x, y: cursorY + (rowH - e.b.h * e.scale) / 2,
                      scale: e.scale, ri, jy: (rng() - 0.5) * 2 * t * g.jitter * 5 };
          placed.push(p); entries.push(p);
          x += e.bw;
        }
      });
      rowEntries.push({ entries, jx });
      contentW = Math.max(contentW, totalW);
      cursorY += rowH;
      if (ri < rows.length - 1) {
        // the hairline now separates ROWS (shelves), not sections —
        // sections share rows, so a rule between them would cut a row
        // in half rather than group anything.
        cursorY += rowGap / 2;
        marks.push({ kind: 'h', at: cursorY });
        cursorY += rowGap / 2;
      }
    });
    contentH = cursorY;

    /* ── 3b. the loose grid ──────────────────────────────────────────
       Rows pack independently, so nothing in one row lines up with
       anything above it — REMIX and TUNE end up wherever packing left
       them rather than under the mute and pan grids. Snap each row's
       blocks onto the COLUMNS the row above established: centre to
       centre, order preserved, glued runs travelling as one, with the
       assignment minimising total shift so each block takes the axis
       nearest it instead of all crowding one column. A row DENSER than
       the one above keeps its own packing — it has no columns to
       inherit. Overlap is resolved left-to-right at blockGap, so the
       grid is loose: alignment where it fits, packing where it can't. */
    for (let ri = 1; ri < rowEntries.length; ri++) {
      const prev = rowEntries[ri - 1].entries, cur = rowEntries[ri].entries;
      if (!prev.length || !cur.length) continue;
      const runs = [];
      for (const p of cur) {
        const last = runs[runs.length - 1];
        if (last && p.block.glue && last.glue === p.block.glue) {
          last.items.push(p); last.x1 = p.x + p.block.w * p.scale;
        } else {
          runs.push({ items: [p], glue: p.block.glue, x0: p.x, x1: p.x + p.block.w * p.scale });
        }
      }
      const targets = prev.map(p => ({ c: p.x + p.block.w * p.scale / 2, k: p.block.kind }));
      const n = runs.length, m = targets.length;
      SNAP_LOG.push({ ri, n, m });
      /* ⚠️ a NaN anywhere (a block with no declared w, say) would poison
         the gains and quietly mis-assign — refuse the whole row */
      if (!targets.every(t2 => Number.isFinite(t2.c)) ||
          !runs.every(r => Number.isFinite(r.x0) && Number.isFinite(r.x1))) continue;
      /* Order-preserving MAX-GAIN alignment, runs allowed to go
         UNMATCHED — the all-or-nothing version skipped any row denser
         than the one above, which is exactly where a pan row sharing
         its shelf with remix and saturation lost its column. A pair's
         gain is bonus − distance: 60 for ordinary blocks (align when
         nearby, stay packed when far), effectively unbounded for a
         per-voice block under another per-voice block — voice sets
         MARRY (Dan, 2026-08-15: "align level and pan along the columns
         / items below"), whatever the distance. Unmatched runs keep
         their packing, nudged right only as neighbours claim room. */
      const chosen = assignLoose(n, m, (i, j) => {
        const run = runs[i], t2 = targets[j];
        const voiceRun = run.items.some(p => VOICEK.test(p.block.kind));
        const rk = run.items.length === 1 ? run.items[0].block.kind : '';
        const dist = Math.abs(t2.c - (run.x0 + run.x1) / 2);
        /* affinity tiers: voice sets marry · like seeks like (a knob
           takes the knob's column over a nearer button's — DRIVE and
           DRIFT pair up past a closer REMIX) · anything else aligns
           only when already nearby */
        return (voiceRun && VOICEK.test(t2.k) ? 1e6
          : rk === 'knob' && t2.k === 'knob' ? 500   // knobs find knobs anywhere on the plate
          : rk && rk === t2.k ? 150 : 60) - dist;
      });
      if (chosen.every(c2 => c2 < 0)) continue;   // nothing aligned — leave the row be
      /* matched runs are ANCHORS: they take their targets first (L→R,
         order kept), and only then do the unmatched fill the gaps — at
         their own packing when it fits, pushed just enough when not.
         Placing everything in one L→R sweep let an unmatched neighbour
         shove the matched run off the very column it married. */
      const wOf = (r2) => r2.x1 - r2.x0;
      /* an anchor may only sit as far right as leaves room for every run
         after it — anchoring past that point just overflowed the zone
         and the row-level clamp then yanked the whole row (anchor
         included) back off its column */
      const sufNeed = new Array(n + 1).fill(0);
      for (let k = n - 1; k >= 0; k--) sufNeed[k] = sufNeed[k + 1] + wOf(runs[k]) + blockGap;
      /* …and from the LEFT by a running bound that reserves EVERY
         earlier run's room, matched or not — bounding only against
         earlier anchors let an anchor land inside the space its
         unmatched neighbours still needed (the remix/tune and
         arpBpm/arpOct pile-up bugs) */
      const pos = new Array(n);
      let lo = 0;
      for (let k = 0; k < n; k++) {
        if (chosen[k] >= 0) {
          const hi = zone.w - wOf(runs[k]) - sufNeed[k + 1];
          pos[k] = Math.max(lo, Math.min(hi, targets[chosen[k]].c - wOf(runs[k]) / 2));
          lo = pos[k] + wOf(runs[k]) + blockGap;
        } else {
          lo += wOf(runs[k]) + blockGap;   // room reserved; placed in the fill pass
        }
      }
      let prevEnd = 0, k2 = 0;
      while (k2 < n) {
        if (chosen[k2] >= 0) { prevEnd = pos[k2] + wOf(runs[k2]) + blockGap; k2++; continue; }
        let j2 = k2;
        while (j2 < n && chosen[j2] < 0) j2++;
        const na = j2 < n ? pos[j2] : zone.w + blockGap;   // next anchor's left edge
        let need = 0;
        for (let q = k2; q < j2; q++) need += wOf(runs[q]) + blockGap;
        let c2 = Math.max(prevEnd, Math.min(runs[k2].x0, na - need));
        for (let q = k2; q < j2; q++) { pos[q] = c2; c2 += wOf(runs[q]) + blockGap; }
        prevEnd = c2; k2 = j2;
      }
      runs.forEach((run, k) => {
        const d = pos[k] - run.x0;
        for (const p of run.items) p.x += d;
      });
      rowEntries[ri].follow = true;   // this row now sits on the grid above
    }

    /* jitter goes on top of the grid — the row as one piece in x (same
       clamp as before, so it never leaves the zone), each block its own
       small y. ⚠️ A row that SNAPPED inherits the dx of the row it
       snapped to: two independently-jittered rows would shear the very
       columns the snap pass just built. */
    let prevDx = 0;
    for (const re of rowEntries) {
      if (!re.entries.length) { prevDx = 0; continue; }
      const x0 = Math.min(...re.entries.map(p => p.x));
      const x1 = Math.max(...re.entries.map(p => p.x + p.block.w * p.scale));
      const dx = Math.max(-x0, Math.min(zone.w - x1, re.follow ? prevDx : re.jx));
      for (const p of re.entries) { p.x += dx; p.y += p.jy; }
      prevDx = dx;
    }
  } else {
    /* ⭐ Columns FILL the pane: the leftover width is dealt evenly to
       every column's cell, blocks centred in the widened cell. Before
       this the columns packed at their declared widths and the whole
       remainder sat past the last one — a drift knob whose column ended
       mid-pane read as shoved left of the space it plainly owned (Dan:
       "make the drift centered in these scenarios"). Dividers move with
       the cells, so each column centres between its own boundaries. */
    /* ⭐ FEWER COLUMNS FIRST (Dan, 2026-08-15: "bias towards having less
       columns especially on iphone since screen real-estate is
       important … reverb could be combined with the filter column").
       Sections start as one column each, then ADJACENT columns merge
       greedily whenever the merge makes the plate render LARGER — the
       fit scale is min(zone.w/W, zone.h/H, 1), and a lone reverb knob
       holding a whole column costs every other column width that the
       shrink-to-fit then takes out of the entire plate. A merge that
       buys nothing (the plate already fits at 1, or it is height-bound)
       is refused, so sparse plates keep their composition and this
       never collapses to a single stack for free. Order is preserved;
       a merged column simply stacks its right neighbour below it. */
    let groups = sections.map(sec => sec.blocks.slice());
    const gW = (bs) => Math.max(...bs.map(b => b.w * scaleOf(b)));
    const gH = (bs) => bs.reduce((a, b) => a + b.h * scaleOf(b), 0) + rowGap * (bs.length - 1);
    const fitOf = (gs) => {
      const W = gs.reduce((a, c) => a + gW(c), 0) + sectionGap * (gs.length - 1);
      const H = Math.max(...gs.map(gH));
      return Math.min(1, zone.w / W, zone.h / H);
    };
    const mergeAt = (gs, i) => gs.slice(0, i)
      .concat([gs[i].concat(gs[i + 1])], gs.slice(i + 2));
    /* the best merge available, or -1 when none beats `floor` */
    const bestMerge = (gs, floor) => {
      let bestF = floor, bestI = -1;
      for (let i = 0; i + 1 < gs.length; i++) {
        const f = fitOf(mergeAt(gs, i));
        if (f > bestF) { bestF = f; bestI = i; }
      }
      return bestI;
    };
    for (let guard = 0; groups.length > 1 && guard < 16; guard++) {
      const bestI = bestMerge(groups, fitOf(groups) + 1e-3);
      if (bestI < 0) break;
      groups = mergeAt(groups, bestI);
    }
    /* ── the COLUMN CAP ────────────────────────────────────────────
       Past 4 columns the merge above stops asking whether the merge
       buys fit and starts asking which merge costs least: it takes
       the highest-fit adjacent pair (ties left-most, so it stays
       deterministic) until the plate is inside the cap. Refusing here
       the way the fit-driven pass refuses would leave the invariant
       unenforced on exactly the plates that need it — a 6-column
       plate is 16% liked, and "it already fits" is not a defence. */
    const precapCols = groups.length;
    while (groups.length > COL_CAP) {
      const i = bestMerge(groups, -Infinity);
      groups = mergeAt(groups, i < 0 ? 0 : i);
    }
    if (groups.length < precapCols && precapCols > COL_CAP) {
      capNote = { ...(capNote || {}), cap: capNote ? 'rows+cols' : 'cols',
                  cols: precapCols, to: `${groups.length}cols` };
    }

    const colWs = groups.map(gW);
    const total = colWs.reduce((a, b) => a + b, 0) + sectionGap * (groups.length - 1);
    const extra = Math.max(0, zone.w - total) / groups.length;
    let cursorX = 0;
    const cols = [];
    groups.forEach((blocks2, si) => {
      const cellW = colWs[si] + extra;
      let y = Math.max(0, (rng() - 0.5) * 2 * t * g.jitter * 12);
      const entries = [];
      for (const b of blocks2) {
        const scale = scaleOf(b);
        const p = { block: b, x: cursorX + (cellW - b.w * scale) / 2, y, scale, ri: si };
        placed.push(p); entries.push(p);
        y += b.h * scale + rowGap;
      }
      cols.push({ entries, h: y - rowGap });
      contentH = Math.max(contentH, y - rowGap);
      cursorX += cellW;
      if (si < groups.length - 1) {
        cursorX += sectionGap / 2;
        marks.push({ kind: 'v', at: cursorX });
        cursorX += sectionGap / 2;
      }
    });
    contentW = cursorX;
    /* the loose grid, columns edition: every column shares the pane's
       centre line, so a short mute column sits LEVEL with the tall ones
       instead of hanging off the top edge */
    for (const c of cols) {
      const d = (contentH - c.h) / 2;
      for (const p of c.entries) p.y += d;
    }
    /* …and then the SNAP, transposed: a column's blocks take the ROWS
       the previous column established, centre to centre in y — DRIVE
       in one column and DRIFT in the next sit on one line instead of
       each floating wherever its own stack put it (Dan, 2026-08-15:
       "the drive and drift the same size and aligned vertically").
       Same matcher as the rows pass, voice marriage included; anchors
       are bounded so the rest of the stack still fits the pane. */
    for (let ci = 1; ci < cols.length; ci++) {
      const prev = cols[ci - 1].entries, cur = cols[ci].entries;
      if (!prev.length || !cur.length) continue;
      const hOf = (p) => p.block.h * p.scale;
      const targets = prev.map(p => ({ c: p.y + hOf(p) / 2, k: p.block.kind }));
      if (!targets.every(t2 => Number.isFinite(t2.c)) ||
          !cur.every(p => Number.isFinite(p.y) && Number.isFinite(hOf(p)))) continue;
      const n = cur.length, m = targets.length;
      const chosen = assignLoose(n, m, (i, j) => {
        const ck = cur[i].block.kind;
        const dist = Math.abs(targets[j].c - (cur[i].y + hOf(cur[i]) / 2));
        // same affinity tiers as the rows pass: marry · like seeks like · nearby
        return (VOICEK.test(ck) && VOICEK.test(targets[j].k) ? 1e6
          : ck === 'knob' && targets[j].k === 'knob' ? 500   // knobs find knobs anywhere on the plate
          : ck === targets[j].k ? 150 : 60) - dist;
      });
      if (chosen.every(c2 => c2 < 0)) continue;
      const span = Math.max(contentH, cols[ci].h);
      const sufNeed = new Array(n + 1).fill(0);
      for (let k = n - 1; k >= 0; k--) sufNeed[k] = sufNeed[k + 1] + hOf(cur[k]) + rowGap;
      // and from ABOVE by a running bound that reserves EVERY earlier
      // block's room, matched or not — same pile-up hole as the rows
      // pass (remix/tune, arpBpm/arpOct)
      const pos = new Array(n);
      let lo = 0;
      for (let k = 0; k < n; k++) {
        if (chosen[k] >= 0) {
          const hi = span - hOf(cur[k]) - sufNeed[k + 1];
          pos[k] = Math.max(lo, Math.min(hi, targets[chosen[k]].c - hOf(cur[k]) / 2));
          lo = pos[k] + hOf(cur[k]) + rowGap;
        } else {
          lo += hOf(cur[k]) + rowGap;   // room reserved; placed in the fill pass
        }
      }
      let prevEnd = 0, k2 = 0;
      while (k2 < n) {
        if (chosen[k2] >= 0) { prevEnd = pos[k2] + hOf(cur[k2]) + rowGap; k2++; continue; }
        let j2 = k2;
        while (j2 < n && chosen[j2] < 0) j2++;
        const na = j2 < n ? pos[j2] : span + rowGap;
        let need = 0;
        for (let q = k2; q < j2; q++) need += hOf(cur[q]) + rowGap;
        let c2 = Math.max(prevEnd, Math.min(cur[k2].y, na - need));
        for (let q = k2; q < j2; q++) { pos[q] = c2; c2 += hOf(cur[q]) + rowGap; }
        prevEnd = c2; k2 = j2;
      }
      cur.forEach((p, k) => { p.y = pos[k]; });
    }
  }

  /* ── the screen as its own row (`banner` / `hero`) ────────────────
     Pulled out of the flow rather than packed: a banner that had to
     share a row with knobs would be a wide block competing for width,
