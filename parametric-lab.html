     which is the opposite of what "spanning the plate" means.

     It leads, so the plate reads display-over-controls the way an
     instrument does. ⚠️ That does put it directly under the spectrum
     bar — two pictures adjacent, which is exactly what `scopeFrame`
     is for: the frameless reading keeps the boundary quiet. */
  if (bannerScope) {
    const sc = 1;
    const sh = bannerScope.h * sc + rowGap;
    const sw2 = bannerScope.w * sc;
    const sx = g.align === 'left' ? 0 : Math.max(0, (Math.max(contentW, sw2) - sw2) / 2);
    /* ⭐ v3 `scopeSlot` — "the waveshape viewer banner can also be in
       other places (not just the top)" (Dan). lead keeps v2's reading
       (display over controls, like an instrument); mid slips it between
       the two shelves nearest the middle; end sets it under everything.
       ⚠️ mid needs a row boundary to slip into — a single-row plate
       falls back to end rather than inventing one. */
    const hMarks = marks.filter(m => m.kind === 'h').map(m => m.at);
    let slot = g.scopeSlot || 'lead';
    if (slot === 'mid' && !hMarks.length) slot = 'end';
    if (slot === 'lead') {
      for (const p2 of placed) p2.y += sh;
      for (const m of marks) if (m.kind === 'h') m.at += sh;
      placed.unshift({ block: bannerScope, x: sx, y: 0, scale: sc });
    } else if (slot === 'end') {
      placed.push({ block: bannerScope, x: sx, y: contentH + rowGap, scale: sc });
    } else {
      const at = hMarks.reduce((a, b) =>
        Math.abs(b - contentH / 2) < Math.abs(a - contentH / 2) ? b : a);
      for (const p2 of placed) if (p2.y > at) p2.y += sh;
      for (const m of marks) if (m.kind === 'h' && m.at > at) m.at += sh;
      placed.push({ block: bannerScope, x: sx, y: at + rowGap / 2, scale: sc });
    }
    contentW = Math.max(contentW, sw2);
    contentH += sh;
  }

  const fit = Math.min(1, zone.w / Math.max(1, contentW), zone.h / Math.max(1, contentH));
  const ox = zone.x + (zone.w - contentW * fit) / 2;
  const oy = zone.y + (zone.h - contentH * fit) / 2;

  /* ── the ERGO pass (Dan, 2026-08-16): the DRIFT knob may not sit on
     the pane's right edge or in a bottom corner. It is the plate's
     smallest dragged control (0.85, and a knob — tune/remix beside it
     are TAPS, which an edge doesn't hurt), so at the glass edge there
     is no room for the finger and left/right travel runs off screen.
     ⛔ Deterministic and purely positional — the plate is FIXED UP,
     never re-rolled (the ROW_CAP discipline): first choice is swapping
     centres with a same-size-class block whose slot clears the margins
     (the glue partner ranks first — the swap is then lossless and the
     pair stays adjacent), else drift slides inward as far as its row
     neighbours allow.
     ⛔ NO hero exemption (Dan, second round: a hero drift still landed
     in the corner — "sometimes the drift is not in place". Size never
     made the corner reachable, it only made the first rule miss).
     ⚠️ Margins are SCREEN px (the complaint is about fingers, not
     content coords), so the check runs through fit/ox/oy. */
  let ergoNote = null;
  {
    const det = placed.find(p2 => p2.block.pid === 'detune');
    if (det) {
      const box = (x, y, b, sc) => ({
        l: ox + x * fit, r: ox + (x + b.w * sc) * fit,
        t: oy + y * fit, b: oy + (y + b.h * sc) * fit,
      });
      const zr = zone.x + zone.w, zb = zone.y + zone.h;
      /* Widened after Dan's screenshot: a dial 36px off the edge still
         read as "at the edge" — the margin has to fit the finger PLUS
         the drag travel, not just the artwork. */
      const EDGE = 44, CORN_W = 80, CORN_H = 56;
      const bad = (bb) => bb.r > zr - EDGE ||
        (bb.b > zb - CORN_H && (bb.l < zone.x + CORN_W || bb.r > zr - CORN_W));
      const dw = det.block.w * det.scale, dh = det.block.h * det.scale;
      if (bad(box(det.x, det.y, det.block, det.scale))) {
        const cx0 = det.x + dw / 2, cy0 = det.y + dh / 2;
        const cands = placed
          .filter(p2 => p2 !== det && !p2.block.witness &&
            ['knob', 'pair', 'button'].includes(p2.block.kind) &&
            Math.abs(p2.block.w * p2.scale - dw) <= 12 &&
            Math.abs(p2.block.h * p2.scale - dh) <= 12)
          .map(p2 => {
            const ccx = p2.x + p2.block.w * p2.scale / 2;
            const ccy = p2.y + p2.block.h * p2.scale / 2;
            const partner = p2.block.glue && p2.block.glue === det.block.glue;
            return { p2, ccx, ccy,
              d: (partner ? 0 : 1e6) + (ccx - cx0) ** 2 + (ccy - cy0) ** 2 };
          })
          .filter(c => !bad(box(c.ccx - dw / 2, c.ccy - dh / 2, det.block, det.scale)))
          .sort((a, b2) => a.d - b2.d);
        if (cands.length) {
          const { p2, ccx, ccy } = cands[0];
          p2.x = cx0 - p2.block.w * p2.scale / 2;
          p2.y = cy0 - p2.block.h * p2.scale / 2;
          det.x = ccx - dw / 2; det.y = ccy - dh / 2;
          ergoNote = { fix: 'swap', with: p2.block.pid };
        } else {
          /* No safe twin — slide inward (toward the zone's centre) up
             to the nearest same-shelf neighbour, 4px kept clear.
             Partial relief still beats a dial pinned to the glass. */
          const bb = box(det.x, det.y, det.block, det.scale);
          const leftward = bb.r > zr - EDGE || bb.r > zr - CORN_W;
          const overlapsY = (p2) => p2.y < det.y + dh && p2.y + p2.block.h * p2.scale > det.y;
          if (leftward) {
            const wall = Math.max(0,
              ...placed.filter(p2 => p2 !== det && overlapsY(p2) && p2.x + p2.block.w * p2.scale <= det.x)
                .map(p2 => p2.x + p2.block.w * p2.scale + 4));
            const need = (bb.r - (zr - EDGE)) / fit;
            det.x -= Math.min(need, det.x - wall);
          } else {
            const wall = Math.min(contentW,
              ...placed.filter(p2 => p2 !== det && overlapsY(p2) && p2.x >= det.x + dw)
                .map(p2 => p2.x - 4));
            const need = ((zone.x + CORN_W) - bb.l) / fit;
            det.x += Math.min(need, wall - (det.x + dw));
          }
          ergoNote = { fix: 'nudge' };
        }
      }
    }
  }

  /* layout inspection hook — inert unless a console session sets
     `window.__WT_DEBUG = []` before a render */
  /* ⭐ the cull metric: smallest drawn labeled control, pre-fit (the
     `ctl` fields on the block builders); null = nothing to judge */
  const ctls = placed.map(p => {
    const b = p.block;
    if (b.ctl == null) return null;
    const v = b.ctlScales ? b.ctl * p.scale : b.ctl;
    return b.ctlFloored ? Math.max(v, MIN_KNOB) : v;
  }).filter(v => v != null);
  const minCtl = ctls.length ? Math.min(...ctls) : null;
  if (Array.isArray(window.__WT_DEBUG)) window.__WT_DEBUG.push({
    /* `flow` is what the plate DID; `flowGene` is what was drawn. They
       differ exactly when the row cap fired — see `cap`. */
    flow, flowGene: g.flow, cap: capNote, ergo: ergoNote, minCtl,
    fitBox: { fit, ox, oy, zone },
    lanes: new Set(placed.map(p => p.ri).filter(r => r != null)).size,
    snapLog: typeof SNAP_LOG === 'undefined' ? null : SNAP_LOG,
    placed: placed.map(p => ({ pid: p.block.pid, kind: p.block.kind, ri: p.ri,
      x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10,
      w: Math.round(p.block.w * p.scale * 10) / 10, h: Math.round(p.block.h * p.scale * 10) / 10 })),
  });

  let markSvg = '';
  if (g.dividers === 'hairline') {
    for (const m of marks) {
      markSvg += m.kind === 'h'
        ? `<line x1="0" y1="${m.at}" x2="${contentW}" y2="${m.at}" stroke="${INK(0.08)}" stroke-width="1"/>`
        : `<line x1="${m.at}" y1="0" x2="${m.at}" y2="${contentH}" stroke="${INK(0.08)}" stroke-width="1"/>`;
    }
  }

  /* ⛔ v1's `backdrop` gene (a faint circle/quarter/bar wash behind the
     controls) is CUT. Its own description said "currently decoration —
     it groups nothing", which is a gene admitting it has no job. */

  const regionTop = FIELD_H + SPECT_H;
  const body = placed.map(p => p.block.draw(p.x, p.y, p.scale)).join('');
  /* One hairline between the rail and the pane — the rail is read as a
     rail by the line, not by any background of its own. */
  const colDivider = `<line x1="${LCOL_W + 6}" y1="${regionTop + 14}" x2="${LCOL_W + 6}"
    y2="${regionTop + REGION_H - 14}" stroke="${INK(0.16)}" stroke-width="1"/>`;

  let cycleBar = '';
  if (cycleBarOn) {
    const by = regionY + margin + 4, bh = 3;
    cycleBar = `<rect x="${zone.x}" y="${by}" width="${zone.w}" height="${bh}" rx="${bh / 2}" fill="${INK(0.12)}"/>
      <rect x="${zone.x}" y="${by}" width="${zone.w * CYCLE_PROGRESS}" height="${bh}" rx="${bh / 2}" fill="${INK(0.55)}"/>`;
  }

  /* ⛔ The `⋯` back-face mark is CUT (Dan, 2026-08-16) — it sat in the
     pane's bottom-right corner. The back face itself survives (the zoom
     modal still shows it via renderBack()); only the on-plate entry
     point is gone. */

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PHONE_W} ${TOTAL_H}" width="${PHONE_W}" height="${TOTAL_H}">
    <rect width="${PHONE_W}" height="${TOTAL_H}" fill="${GROUND}"/>
    ${chromeFieldSliver()}
    ${chromeSpectrumBar(FIELD_H, manifest.voices, g, playFace)}
    ${chromeLeftColumn(regionTop, g, accentFor(0), patch.cycle, trial, fit)}
    ${colDivider}
    ${cycleBar}
    <g transform="translate(${ox} ${oy}) scale(${fit})">${body}${markSvg}</g>
    ${chromeRail(regionTop + REGION_H, trial)}
  </svg>`;
}

/* ════════════════════════════════════════════════════════════════════
   6b · THE BACK FACE — everything that does not move the sound now
   ────────────────────────────────────────────────────────────────────
   The other half of v2's admission rule. Dwell, slide and drift live
   here so the plate can promise that every control ON it responds the
   instant you touch it.

   ⛔ The genome does not style this face. It is chrome: one plain list,
   identical on every song. Styling both faces would double the search
   space for the surface nobody is looking at — and the entire reason
   these controls are here is that they do not deserve the attention.
   ════════════════════════════════════════════════════════════════════ */
function renderBack(manifest) {
  const regionTop = FIELD_H + SPECT_H;
  const rows = MENU_IDS.map(id => PARAMS[id]);
  const x0 = 26, w = PHONE_W - 52, rowH = 40;
  let out = '';
  rows.forEach((p, i) => {
    const y = regionTop + 34 + i * rowH;
    out += `<text x="${x0}" y="${y}" font-size="10" font-weight="500" letter-spacing="1"
      fill="${INK(0.75)}">${p.label.toUpperCase()}</text>`;
    out += `<text x="${x0 + w}" y="${y}" text-anchor="end" font-size="10" fill="${HI(0.8)}"
      style="font-variant-numeric:tabular-nums">${p.fmt ? p.fmt(p.def) : ''}</text>`;
    // a plain track + fill: no knob vocabulary, nothing to compare
    out += `<line x1="${x0}" y1="${y + 11}" x2="${x0 + w}" y2="${y + 11}"
      stroke="${TRACK}" stroke-width="3" stroke-linecap="round"/>`;
    out += `<line x1="${x0}" y1="${y + 11}" x2="${x0 + w * p.def}" y2="${y + 11}"
      stroke="${INK(0.6)}" stroke-width="3" stroke-linecap="round"/>`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PHONE_W} ${TOTAL_H}" width="${PHONE_W}" height="${TOTAL_H}">
    <rect width="${PHONE_W}" height="${TOTAL_H}" fill="${GROUND}"/>
    ${chromeFieldSliver()}
    <text x="26" y="${regionTop + 12}" font-size="8" letter-spacing="1.4" fill="${INK(0.35)}">NOT IMMEDIATE</text>
    <line x1="26" y1="${regionTop + 20}" x2="${PHONE_W - 26}" y2="${regionTop + 20}" stroke="${INK(0.10)}" stroke-width="1"/>
    ${out}
    ${chromeRail(regionTop + REGION_H)}
  </svg>`;
}

/* ════════════════════════════════════════════════════════════════════
   7 · TASTE MODEL — logistic regression over gene features
   ════════════════════════════════════════════════════════════════════ */
/* ⚠️ every key bumps at every version. The model's weights are keyed to
   GENE NAMES (v3 adds `scopeSlot` and rebases the manifest on recipe
   weights) — feeding v2's ratings to it would silently mix two
   vocabularies. v2 keeps its own keys so its ratings stay attached to
   the genes they were collected against. */
/* v6 (W1) is a DISTRIBUTION boundary, not a vocabulary one: the rating
   modes now draw manifests through VOICE_BIAS. `featurize` is untouched,
   so v5 records stay valid training data and migrate VERBATIM — the
   bump marks which manifest distribution a record was collected under.
   Records cast since the bump carry `vb: 1`. */
const STORE_KEY = 'wt-parametric-lab-v6';
const LEGACY_STORE_KEY = 'wt-parametric-lab-v5';
let ratings = [];
try {
  ratings = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  if (!Array.isArray(ratings)) ratings = [];
  if (!ratings.length) {
    const v5 = JSON.parse(localStorage.getItem(LEGACY_STORE_KEY) || '[]');
    if (Array.isArray(v5) && v5.length) {
      ratings = v5;                        // verbatim — see the note above
      localStorage.setItem(STORE_KEY, JSON.stringify(ratings));  // one-time; v5 stays
    }
  }
} catch { ratings = []; }
function saveRatings() { localStorage.setItem(STORE_KEY, JSON.stringify(ratings)); }

let model = null;
/* ⭐ W2: champions are training data (Dan 08-15: "it should learn from
   these"). They never ship (iOS spec §9.13), so the ONLY way a champion
   reaches the app is through what it teaches the model — and the bred
   ones never entered `ratings` at all (breeding bypasses the vote
   path). Each counts as CHAMP_W likes via a per-sample multiplier in
   the SGD update; no dedupe against ratings — a champion that was ALSO
   liked earns the extra weight honestly. The taste EXPORT format is
   unchanged (weights block only), so the sync + Swift side need
   nothing: Dan re-exports taste and P8 starts pulling draws toward
   champion territory. */
const CHAMP_W = 3;   // one champion ≈ three likes
function trainModel() {
  if (ratings.length < 8) { model = null; return; }
  const X = ratings.map(r => featurize(r.genome));
  const Y = ratings.map(r => (r.vote > 0 ? 1 : 0));
  const S = ratings.map(() => 1);
  for (const c of champions) { X.push(featurize(c.genome)); Y.push(1); S.push(CHAMP_W); }
  const d = X[0].length, w = new Array(d).fill(0);
  let b = 0;
  const lr = 0.15, l2 = 0.01, epochs = 300;
  for (let ep = 0; ep < epochs; ep++) {
    for (let i = 0; i < X.length; i++) {
      let z = b;
      for (let j = 0; j < d; j++) z += w[j] * X[i][j];
      const p = 1 / (1 + Math.exp(-z)), err = S[i] * (p - Y[i]);
      for (let j = 0; j < d; j++) w[j] -= lr * (err * X[i][j] + l2 * w[j]);
      b -= lr * err;
    }
  }
  model = { w, b };
}
function score(genome) {
  if (!model) return null;
  const x = featurize(genome);
  let z = model.b;
  for (let j = 0; j < x.length; j++) z += model.w[j] * x[j];
  return 1 / (1 + Math.exp(-z));
}

/* ════════════════════════════════════════════════════════════════════
   8 · BATCHES, GRID, INTERACTION
   ════════════════════════════════════════════════════════════════════ */
const BATCH = 12;
let batch = [], focusIdx = -1;
let mode = 'batch';                 // 'batch' | 'sweep' | 'app'
/* ⭐ DRAW-PER-CARD — the payoff of splitting the two seeds (§4).
     off  one manifest, twelve arrangements — style mode, the right way
          to judge a LAYOUT.
     on   twelve cards each drawing their own manifest AND genome. This
          is how you rate the RECIPE: if one draw in twelve comes out
          incoherent that is a WEIGHTS problem, and it is invisible in
          the other mode because the controls never change.
   ⭐ v3 defaults it ON: a recipe is a distribution, and "generate the
   batches" means sampling it — exactly what the app will do each time
   a song is entered (regenerate, show the seed, let you save it). */
let songMode = true;
/* A card renders its own manifest if it drew one, else the live one.
   ⚠️ W1: `vb` is the item's draw provenance. Items drawn since the v6
   bump carry vb:1 and re-derive under the bias; an item restored from a
   pre-bias generation has no tag and re-derives UNIFORM — either path
   costs the same one rng() call, so the manifest the card was rated
   under comes back exactly (the same mseed draws a DIFFERENT manifest
   under the bias, which is why the tag exists). */
const manifestFor = (item) =>
  item.mseed != null
    ? buildManifest(currentRecipeKey, item.mseed, item.vb ? VOICE_BIAS : null)
    : manifest;
/* ?gene=<name> opens a specific sweep — deep-links a single decision. */
const geneParam = new URLSearchParams(location.search).get('gene');
let sweepGene = (geneParam && GENES.some(g => g.k === geneParam)) ? geneParam : 'knobSize';
let sweepSeed = newSeed();

/* ── LOCKS and EXCLUSIONS ────────────────────────────────────────────
   A sweep's output is a DECISION, not a rating, and it comes in two
   strengths:

     LOCK       pin the gene to exactly this value. Total commitment.
     EXCLUDE    rule this value OUT and keep sampling the rest.

   The second is usually the honest one. On an 8-option gene you rarely
   think "it must be `cap`" — you think "not tickOnly, not wedge, the
   other six are all fine". Excluding narrows the space without
   pretending to a decision you have not made, and several exclusions
   compose where a lock cannot.

   For a FLOAT gene, excluding a swept step narrows the RANGE from
   whichever end the step sits nearer — an interior hole in a continuous
   parameter is not a thing you can sample around meaningfully, but "the
   bottom third is too small" is exactly what a float sweep tells you.

   Everything downstream honours both: random batches, evolve children,
   and the base genome of every later sweep.
   ─────────────────────────────────────────────────────────────────── */
const LOCK_KEY = 'wt-parametric-lab-locks-v6';
const V5_LOCK_KEY = 'wt-parametric-lab-locks-v5';
const LEGACY_LOCK_KEY = 'wt-parametric-lab-locks-v4';
/* ── the 08-15 champion consensus, shipped as the lab's OPENING position
   (SPEC-parametric-faceplates §12/§13.2) ───────────────────────────────
   These are not new opinions — they are what 146 champions and ~1,600
   ratings already say, promoted from "what Dan keeps choosing" to "what
   the lab draws". `shapeLink = matched` (85% of champions) and
   `dividers = hairline` (79%) are locks; `knobSize` is BOUNDED to the
   band champions actually live in (1.52–2.28), because the top of the
   old range forces the zone's shrink-to-fit and reads as a dislike.
   ⚠️ Defaults, never a cage: every one of them unlocks in the chips
   above the grid, and a sweep ignores locks by construction.
   ⚠️ They travel as DATA — the fixtures and recipes exports both carry
   `locks/excludes/bounds`, so the Swift sampler draws under the same
   conditions the fixtures were generated under. */
const DEFAULT_LOCKS  = { shapeLink: 'matched', dividers: 'hairline' };
/* v6 (2026-08-16, round two): "we can scrap the rows" — Dan, after the
   211-champion audit left 6 effective rows layouts out of 211. The
   columns flow IS the language now; rows is banned from the draw the
   same way the six knob styles were. ⚠️ Re-export recipes + FIXTURES
   after this lands in a profile — excludes are draw conditions. */
const DEFAULT_EXCLUDES = { flow: ['rows'] };
const DEFAULT_BOUNDS = { knobSize: [1.5, 2.3] };
let LOCKS = {};      // gene → pinned value
let EXCLUDES = {};   // enum gene → [banned options]
let BOUNDS = {};     // float gene → [min, max]
try {
  /* Key-bump rule (the v5 precedent): on the way UP the new key's
     defaults WIN — they are the decision the bump exists to carry —
     and from then on the stored copy wins, so unlocking one sticks.
     v5 → v6 carries ONLY the flow exclude (v5 state travels intact,
     union-merged so an existing flow ban is kept); v4/fresh → v6 gets
     every bump's defaults. */
  const fresh = localStorage.getItem(LOCK_KEY) == null;
  const v5raw = localStorage.getItem(V5_LOCK_KEY);
  const raw = JSON.parse(
    (fresh ? (v5raw ?? localStorage.getItem(LEGACY_LOCK_KEY))
           : localStorage.getItem(LOCK_KEY)) || '{}');
  const fromV5 = fresh && v5raw != null;
  LOCKS = (fresh && !fromV5) ? { ...(raw.locks || {}), ...DEFAULT_LOCKS } : (raw.locks || {});
  EXCLUDES = raw.excludes || {};
  if (fresh) {
    EXCLUDES = { ...EXCLUDES,
      flow: [...new Set([...(EXCLUDES.flow || []), ...DEFAULT_EXCLUDES.flow])] };
  }
  BOUNDS = (fresh && !fromV5) ? { ...(raw.bounds || {}), ...DEFAULT_BOUNDS } : (raw.bounds || {});
  if (fresh) localStorage.setItem(LOCK_KEY,
    JSON.stringify({ locks: LOCKS, excludes: EXCLUDES, bounds: BOUNDS }));
} catch {
  LOCKS = { ...DEFAULT_LOCKS };
  EXCLUDES = { ...DEFAULT_EXCLUDES };
  BOUNDS = { ...DEFAULT_BOUNDS };
}
const saveLocks = () => localStorage.setItem(LOCK_KEY,
  JSON.stringify({ locks: LOCKS, excludes: EXCLUDES, bounds: BOUNDS }));

/* The options / range a gene may still be drawn from. */
function allowedOptions(gene) {
  const ex = EXCLUDES[gene.k] || [];
  const keep = gene.o.filter(o => !ex.includes(o));
  return keep.length ? keep : gene.o;      // never strand a gene with nothing
}
function floatBounds(gene) {
  const b = BOUNDS[gene.k];
  return b ? [Math.max(gene.min, b[0]), Math.min(gene.max, b[1])] : [gene.min, gene.max];
}
function isNarrowed(gene) {
  if (gene.t === 'e') return (EXCLUDES[gene.k] || []).length > 0;
  const [lo, hi] = floatBounds(gene);
  return lo > gene.min || hi < gene.max;
}

/* ── song PINS ───────────────────────────────────────────────────────
   A deliberate hole in the manifest/genome split: a song may pin named
   genes to give itself a CHARACTER. It is what separates "hello world 2"
   from "hello world 3" — identical control lists, different composure —
   and there is no honest way to express that as content.

   Pins beat the random draw and the user's locks, because they define
   which variant you are looking at. The one thing that beats a pin is
   the SWEEP: sweeping a pinned gene must still show its whole range, or
   you could never see what the pin chose from.
   ─────────────────────────────────────────────────────────────────── */
function applyPins(gm, exceptGene, key = currentRecipeKey) {
  const pins = RECIPES[key].pins;
  if (!pins) return gm;
  const out = { ...gm };
  for (const k of Object.keys(pins)) {
    if (k !== exceptGene) out[k] = pins[k];
  }
  return out;
}

/* Pin the locks, then drag anything out of bounds back inside — a
   crossover child can inherit a value that has since been excluded. */
function applyLocks(gm) {
  const out = { ...gm, ...LOCKS };
  for (const gene of GENES) {
    if (LOCKS[gene.k] !== undefined) continue;
    if (gene.t === 'e') {
      const keep = allowedOptions(gene);
      if (!keep.includes(out[gene.k])) out[gene.k] = keep[0];
    } else {
      const [lo, hi] = floatBounds(gene);
      out[gene.k] = Math.max(lo, Math.min(hi, out[gene.k]));
    }
  }
  return out;
}

const drawGenome = (seed, key) => applyPins(applyLocks(randomGenome(mulberry32(seed))), null, key);

/* ── GENERATIONS ─────────────────────────────────────────────────────
   Every batch is kept, so evolve is undoable. Without this a bad
   evolve destroys your position: the previous generation is replaced,
   and only the cards you happened to RATE survive (in `ratings`, which
   stores whole genomes). Interactive evolution needs "that generation
   was better, go back and breed from there" — otherwise you can only
   ever move forward and hope.

   Stepping back and then evolving BRANCHES: the forward history is
   dropped, exactly like editing in the middle of an undo stack. So the
   history is a single line you can rewind and diverge from, not a
   tree — a tree would need naming and pruning UI to be usable, and the
   move you actually want is "rewind and try again".

   Generations hold the batch objects BY REFERENCE, so a vote cast on a
   restored card lands in the history too.
   ─────────────────────────────────────────────────────────────────── */
const GEN_KEY = 'wt-parametric-lab-gens-v3';
const GEN_CAP = 40;
let generations = [], genIdx = -1;
try {
  const raw = JSON.parse(localStorage.getItem(GEN_KEY) || '{}');
  generations = raw.gens || []; genIdx = raw.idx ?? generations.length - 1;
} catch { generations = []; genIdx = -1; }
const saveGens = () => {
  try { localStorage.setItem(GEN_KEY, JSON.stringify({ gens: generations, idx: genIdx })); }
  catch { /* quota — history is a convenience, never block on it */ }
};

function recordGeneration(label) {
  if (genIdx < generations.length - 1) generations = generations.slice(0, genIdx + 1);
  generations.push({ label, recipeKey: currentRecipeKey, items: batch });
  if (generations.length > GEN_CAP) generations.shift();
  genIdx = generations.length - 1;
  saveGens(); renderGenNav();
}

function gotoGeneration(i) {
  if (i < 0 || i >= generations.length) return;
  genIdx = i;
  const gen = generations[i];
  // a generation belongs to the recipe it was bred under — restoring one
  // from another recipe has to bring the manifest with it, or the cards
  // re-render with the wrong controls
  if (gen.recipeKey !== currentRecipeKey && RECIPES[gen.recipeKey]) {
    currentRecipeKey = gen.recipeKey;
    manifest = buildManifest();
    document.getElementById('songSel').value = currentRecipeKey;
    buildManifestEditor();
  }
  batch = gen.items;
  focusIdx = -1;
  saveGens(); renderGrid(); renderGenNav();
}

function renderGenNav() {
  const back = document.getElementById('genBack');
  const fwd = document.getElementById('genFwd');
  const lab = document.getElementById('genLabel');
  if (!back) return;
  const live = mode === 'batch' && generations.length > 0;
  back.disabled = !live || genIdx <= 0;
  fwd.disabled = !live || genIdx >= generations.length - 1;
  lab.textContent = live
    ? `${generations[genIdx]?.label || 'gen'} · ${genIdx + 1}/${generations.length}`
    : 'gen —';
}

/* ── CHAMPIONS — the durable output of a wave ─────────────────────────
   A wave of breeding converges on one plate you want to keep, and
   nothing else in the lab can hold it:

     the SEED can't          — a bred genome's `seed` is a fresh
                               `newSeed()`, so `drawGenome(seed)` gives a
                               DIFFERENT plate. For anything with
                               `bred: true` the seed is a label, not a
                               recipe. The gene object is the only truth.
     `ratings` can't         — a flat pool with no notion of "I chose
                               this one", and evolve only ever reads the
                               last 24 of it.
     `generations` can't     — GEN_CAP 40, oldest-first `shift()`, so
                               around wave eight your early waves fall
                               off the front.

   So a champion stores the whole thing RESOLVED, never by reference:
   genome, manifest (controls + voices, already drawn), the recipe as it
   stood when you rated it, the locks in force, and the rendered SVG.

   ⭐ The SVG is the point, not a nicety. genome+manifest+recipe are the
   INPUT to the tier-3 packer; the SVG is its EXPECTED OUTPUT. A folder
   of these is a golden-file suite you can port Swift against — without
   it a champion is a spec with no acceptance test.

   ⚠️ Records are resolved rather than seed-referenced on purpose: seeds
   only reproduce a plate while the sampler's draw order never changes,
   and it will change (v3 already added a gene, which is why every
   storage key bumped). A resolved record survives that; a seed doesn't. */
const CHAMP_KEY = 'wt-parametric-lab-champions-v1';
let champions = [];
try { champions = JSON.parse(localStorage.getItem(CHAMP_KEY) || '[]'); } catch { champions = []; }

/* ⚠️ SVGs are a few KB each, so a long champion list can hit the 5 MB
   localStorage ceiling. On quota we persist WITHOUT the pictures rather
   than losing the record — the genes are irreplaceable, the picture is
   regenerable (`svgFor`). The in-memory copy keeps its SVG either way,
   so an export made in the same session is still golden. */
function saveChampions() {
  try {
    localStorage.setItem(CHAMP_KEY, JSON.stringify(champions));
  } catch {
    try {
      localStorage.setItem(CHAMP_KEY, JSON.stringify(champions.map(c => ({ ...c, svg: null }))));
      console.warn('champions: storage full — pictures dropped from localStorage, export to keep them');
    } catch { /* nothing more to do; the in-memory list still exports */ }
  }
}

/* Stored picture first, ALWAYS. Re-rendering uses today's renderer, so a
   regenerated SVG cannot witness what the plate looked like when it was
   chosen — which is the one job the stored one has. */
const svgFor = (c) => c.svg || render(c.manifest, c.genome, c.seeds.genomeSeed);

const isChamp = (item) => champions.some(c => c.seeds.genomeSeed === item.seed);

function saveChampion(idx) {
  const item = batch[idx];
  if (!item || mode !== 'batch') return;
  const existing = champions.findIndex(c => c.seeds.genomeSeed === item.seed);
  if (existing >= 0) {                      // pressing ★ again un-saves
    champions.splice(existing, 1);
    saveChampions(); renderChampions(); updateCard(idx);
    trainModel(); renderStats(); renderWeights();   // W2: champions are training data
    return;
  }
  const m = manifestFor(item);
  const gen = generations[genIdx];
  champions.push({
    id: newSeed(),
    name: `${currentRecipeKey} · ${gen ? gen.label : 'batch'} ${genIdx + 1}`,
    notes: '',
    ts: Date.now(),
    recipeKey: currentRecipeKey,
    /* the recipe AS RATED — a weight slider moved afterwards must not
       rewrite the conditions this plate was chosen under */
    recipe: structuredClone(RECIPES[currentRecipeKey]),
    manifest: structuredClone(m),
    genome: { ...item.genome },
    locks: { ...LOCKS },
    seeds: {
      genomeSeed: item.seed,
      manifestSeed: item.mseed ?? manifestSeed,
      /* ⛔ bred ⇒ genomeSeed does NOT reproduce `genome`. Read the object. */
      bred: !!item.bred,
      parents: item.parents || null,
    },
    svg: render(m, item.genome, item.seed),
  });
  saveChampions(); renderChampions(); updateCard(idx);
  trainModel(); renderStats(); renderWeights();     // W2: champions are training data
  document.getElementById('champs').classList.add('open');
}

/* ── W4: champion → pins distillation ────────────────────────────────
   Bred designs Dan loves have no reproducing seed (§0 of the champions
   block) and champions never ship (iOS spec §9.13) — the way one
   re-enters the app is by distilling its CHARACTER into recipe `pins`,
   so the app draws fresh plates that orbit the design: same identity,
   generative variation. The app already honors recipe pins end-to-end
   (draw, render, P8 scoring) — this is data authoring, zero Swift work.
   Principle: pin STYLE, leave ARRANGEMENT free — pinning the noise
   genes freezes the layout, killing the variation that makes
   distillation worth having. ⚠️ Pins beat locks/bounds in both samplers
   (applyPins runs after applyLocks — that's the contract), so a float
   outside the current bounds keeps the champion's value VERBATIM. */
const PIN_CORE = ['flow', 'knobStyle', 'accent', 'school', 'hero', 'heroPick',
  'scopePlace', 'chipStyle', 'orbInk', 'knobSize'];
const PIN_NOISE = ['jitter', 'orderSeed', 'mixerScatter', 'margin', 'gapScale', 'faderW'];
let pinsOpenFor = -1;      // champion index with the checklist open
let pinsChecked = null;    // Set of gene keys while open
/* The checked map, in GENES order, values exactly as the genome stores
   them — the recipes-export `pins` shape (flat gene → value). */
function pinsMapFor(c) {
  const map = {};
  for (const g of GENES) if (pinsChecked?.has(g.k) && c.genome[g.k] !== undefined) map[g.k] = c.genome[g.k];
  return map;
}
function pinsPanelHTML(c, i) {
  if (pinsOpenFor !== i) return '';
  const rows = GENES.map(g => {
    const v = c.genome[g.k];
    if (v === undefined) return '';
    const noise = PIN_NOISE.includes(g.k);
    const vs = typeof v === 'number' ? +v.toFixed(3) : v;
    return `<label class="pgene ${noise ? 'noise' : ''}" title="${noise
      ? 'layout noise — pinning it freezes the arrangement; leave free for variation'
      : 'pin this gene to the champion’s value'}">
      <input type="checkbox" data-pingene="${g.k}" ${pinsChecked.has(g.k) ? 'checked' : ''}>
      <span>${g.k} <b>${vs}</b></span></label>`;
  }).join('');
  const recipeSel = Object.keys(RECIPES).map(k =>
    `<option value="${escAttr(k)}" ${k === (RECIPES[c.recipeKey] ? c.recipeKey : currentRecipeKey) ? 'selected' : ''}>${k}</option>`).join('');
  return `<div class="cpinspanel">
    <div class="pghead">pin STYLE, leave ARRANGEMENT free — checked genes become the recipe's <b>pins</b>, carrying this champion's values verbatim (pins beat locks and bounds in both runtimes)</div>
    <div class="pgrid">${rows}</div>
    <div class="pgfoot">
      <select data-pinrecipe="${i}">${recipeSel}</select>
      <button data-pinapply="${i}" title="write the checked map into the chosen recipe's pins (replacing any it had) — it rides the next recipes export into the app">apply to recipe</button>
      <button data-pincopy="${i}" title="the same map on the clipboard, for hand-authoring">copy json</button>
    </div>
  </div>`;
}

function renderChampions() {
  const el = document.getElementById('champs');
  const n = document.getElementById('champN');
  if (n) n.textContent = champions.length;
  if (!el) return;
  const head = `<div class="chead">
    <b style="color:rgba(var(--ink-hi-rgb),0.8);font-weight:500">${champions.length} champion${champions.length === 1 ? '' : 's'}</b>
    <button data-champexport="1">export champions</button>
    <button data-champimport="1">import</button>
    <input type="file" accept=".json,application/json" data-champfile style="display:none">
    <span>· genome + manifest + recipe + picture, all resolved · <b>S</b> saves the focused card</span>
  </div>`;
  if (!champions.length) {
    el.innerHTML = head + `<div class="cnone">none yet — focus a card and press <b>S</b>, or use the ★ on the card.</div>`;
  } else {
    el.innerHTML = head + champions.map((c, i) => `
      <div class="crow">
        <div class="thumb">${svgFor(c)}</div>
        <div class="cbody">
          <input data-champname="${i}" value="${escAttr(c.name)}" placeholder="name">
          <div class="cmeta">
            <b>${c.manifest.voices}v</b> · ${c.manifest.controls.length} controls ·
            g${c.seeds.genomeSeed.toString(16).slice(0, 6)}
            ${c.seeds.bred ? `<span class="bred">·bred (seed will not reproduce it)</span>` : ''}
            · ${new Date(c.ts).toISOString().slice(0, 10)}
          </div>
          <div class="cmeta">${c.manifest.controls.join(' · ')}</div>
          <input class="notes" data-champnote="${i}" value="${escAttr(c.notes || '')}" placeholder="why this one — the thing a genome dump can't say">
          ${pinsPanelHTML(c, i)}
        </div>
        <button class="cpins ${pinsOpenFor === i ? 'on' : ''}" data-champpins="${i}" title="distill this champion's character into recipe pins — the app then draws fresh plates that orbit the design">pins</button>
        <button class="cdel" data-champdel="${i}" title="remove">✕</button>
      </div>`).join('');
  }
  el.querySelector('button[data-champexport]').addEventListener('click', exportChampions);
  const cf = el.querySelector('input[data-champfile]');
  el.querySelector('button[data-champimport]').addEventListener('click', () => cf.click());
  cf.addEventListener('change', () => importChampions(cf));
  el.querySelectorAll('input[data-champname]').forEach(inp =>
    inp.addEventListener('change', () => {
      champions[+inp.dataset.champname].name = inp.value; saveChampions();
    }));
  el.querySelectorAll('input[data-champnote]').forEach(inp =>
    inp.addEventListener('change', () => {
      champions[+inp.dataset.champnote].notes = inp.value; saveChampions();
    }));
  el.querySelectorAll('button[data-champdel]').forEach(b =>
    b.addEventListener('click', () => {
      const i = +b.dataset.champdel;
      const seed = champions[i].seeds.genomeSeed;
      champions.splice(i, 1);
      pinsOpenFor = -1;                               // indices shifted — close any open checklist
      saveChampions(); renderChampions();
      trainModel(); renderStats(); renderWeights();   // W2: champions are training data
      const k = batch.findIndex(it => it.seed === seed);
      if (k >= 0) updateCard(k);
    }));
  /* W4 — the pins checklist */
  el.querySelectorAll('button[data-champpins]').forEach(b =>
    b.addEventListener('click', () => {
      const i = +b.dataset.champpins;
      if (pinsOpenFor === i) { pinsOpenFor = -1; pinsChecked = null; }
      else { pinsOpenFor = i; pinsChecked = new Set(PIN_CORE); }   // the CHARACTER CORE, pre-checked
      renderChampions();
    }));
  el.querySelectorAll('input[data-pingene]').forEach(cb =>
    cb.addEventListener('change', () => {
      cb.checked ? pinsChecked.add(cb.dataset.pingene) : pinsChecked.delete(cb.dataset.pingene);
    }));
  el.querySelectorAll('button[data-pinapply]').forEach(b =>
    b.addEventListener('click', () => {
      const i = +b.dataset.pinapply;
      const key = el.querySelector(`select[data-pinrecipe="${i}"]`)?.value;
      if (!RECIPES[key]) return;
      /* REPLACE the recipe's pins whole, never merge: pins from two
         champions layered together describe a hybrid neither champion
         is. ⚠️ This changes the recipe's future draws in BOTH runtimes
         (by design, once exported); fixtures embed their own recipes
         and champions store resolved objects, so neither is invalidated. */
      RECIPES[key].pins = pinsMapFor(champions[i]);
      saveRecipes();
      b.textContent = 'applied ✓';
      setTimeout(() => { b.textContent = 'apply to recipe'; }, 900);
    }));
  el.querySelectorAll('button[data-pincopy]').forEach(b =>
    b.addEventListener('click', () => {
      navigator.clipboard?.writeText(JSON.stringify(pinsMapFor(champions[+b.dataset.pincopy]), null, 1));
      b.textContent = 'copied ✓';
      setTimeout(() => { b.textContent = 'copy json'; }, 900);
    }));
}
const escAttr = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

/* ── DOWNLOAD NAMING ─────────────────────────────────────────────────
   Every export lands in one Downloads folder next to the last twenty,
   and `parametric-taste.json` / `parametric-taste (3).json` are
   indistinguishable an hour later — you cannot tell which recipe a dump
   came from, how much taste was in it, or which of two was later. So a
   name carries WHAT · WHICH · HOW MUCH · WHEN:

     parametric-taste_hello-world-sine-waves_38rated_2026-08-15-1432.json

   ⚠️ LOCAL time, not ISO/UTC: these sort against your own session, and a
   file stamped 2132 for work you did at 14:32 reads as someone else's.
   ⚠️ The stamp is minute-resolution, so two exports inside one minute
   still collide into "(1)" — that is the browser's job, not ours, and a
   seconds field buys noise on every other name to fix it.
   ─────────────────────────────────────────────────────────────────── */
function stampNow() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
/* Recipe keys carry spaces and `·` ("hello world · sine waves"), which
   survive a download but not a shell loop or a Finder search. */
const fileSlug = (s) => String(s).toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32).replace(/-+$/, '');
/* One place that serialises, names, clicks and REVOKES — the three
   exports each rolled their own and each leaked its object URL. */
function downloadJSON(kind, tags, data) {
  const name = [`parametric-${kind}`, ...tags.filter(Boolean), stampNow()].join('_') + '.json';
  const url = URL.createObjectURL(
    new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return name;
}

/* Render and keep the layout the packer just built — the same hook the
   ratings replay uses, borrowed for one call so an export never
   disturbs a console session that owns `__WT_DEBUG`. */
function renderWithLayout(manifest, genome, seed) {
  const prev = window.__WT_DEBUG;
  window.__WT_DEBUG = [];
  let svg = '', dbg = null;
  try {
    svg = render(manifest, genome, seed);
    dbg = window.__WT_DEBUG[window.__WT_DEBUG.length - 1] || null;
  } finally { window.__WT_DEBUG = prev; }
  return { svg, dbg };
}

/* Two pictures of the same plate can differ for a reason that is not
   the packer: the THEME. Every colour in the SVG comes out of `THEME`,
   so a champion starred in light and re-rendered in dark differs in
   several hundred characters while every box sits exactly where it did.
   Normalising the colours away leaves the SHAPE — structure and
   geometry — which is the only thing a golden test is entitled to
   assert. ⚠️ rgba() first: `color-mix(…)` can contain one. */
const svgShape = (s) => String(s)
  .replace(/rgba?\([^)]*\)/g, 'C')
  .replace(/color-mix\([^)]*\)/g, 'C')
  .replace(/#[0-9a-fA-F]{3,8}\b/g, 'C');

/* The handoff file. `kind` + `version` so the Swift side can refuse a
   v2 dump outright rather than half-reading it.

   ⭐ v4 (§13.3): every champion also carries `current` — its geometry
   under TODAY's packer. The star-time `svg` is a historical witness and
   must never be regenerated (it is the only record of what was actually
   chosen), but a witness starred before a packer change is a picture of
   a packer the lab no longer has — 28 of the 146 predate the 18:02
   column-merge pass, which is where §12's "5–6 column champions" come
   from and why they cannot be reproduced today. A golden test pointed
   at those would be asserting the Swift port reproduces the OLD lab.
   So: `current` is the assertion, `svg` is the provenance, and
   `staleWitness: true` marks the plates where the two disagree in shape
   (`current.svg` is filled in only there — everywhere else the two
   pictures are the same file twice). */
function exportChampions() {
  /* Champions span recipes, so the recipe tag is only honest when every
     banked plate came from ONE — a mixed file says how many instead. */
  const keys = [...new Set(champions.map(c => c.recipeKey).filter(Boolean))];
  const out = champions.map(c => {
    const { svg, dbg } = renderWithLayout(c.manifest, c.genome, c.seeds.genomeSeed);
    const stale = !!c.svg && svgShape(c.svg) !== svgShape(svg);
    return {
      ...c,
      svg: svgFor(c),                       // ⛔ star-time witness, untouched
      staleWitness: stale,
      current: {
        renderer: 'caps-v1',                // bump when the packer moves again
        flow: dbg?.flow ?? null, flowGene: dbg?.flowGene ?? null,
        lanes: dbg?.lanes ?? null, cap: dbg?.cap ?? null,
        elements: dbg?.placed ?? [],
        svg: stale ? svg : null,            // only where the picture moved
      },
    };
  });
  downloadJSON('champions', [
    keys.length === 1 ? fileSlug(keys[0]) : `${keys.length}recipes`,
    `${champions.length}plates`,
  ], {
    kind: 'parametric-champions', version: 4, exported: Date.now(),
    caps: { rows: 3, columns: 4 },
    /* MIN_KNOB is a PACK input (KNOB and the per-voice scale floor on
       it), so `current` geometry is only replayable knowing it — the
       Swift goldens read this field (WT_PLATE_MINKNOB covers files from
       before it existed). */
    minKnob: MIN_KNOB,
    staleWitnessCount: out.filter(c => c.staleWitness).length,
    cappedCount: out.filter(c => c.current.cap).length,
    note: 'genome+manifest+recipe are the packer INPUT. `current` is the expected OUTPUT under '
        + "today's packer (element boxes; compare CENTRES, not pixels) — assert against THAT. "
        + '`svg` is the star-time witness: staleWitness:true means it predates a packer change '
        + '(compared shape-only, colours normalised, so a theme flip is not a difference) and '
        + 'current.svg is the re-render for those. '
        + 'seeds.bred=true means genomeSeed does NOT reproduce genome — read the object.',
    champions: out,
  });
}

/* Merge by id, so re-importing your own file is idempotent and two
   machines' files can be combined without clobbering either. */
function importChampions(input) {
  const f = input.files?.[0];
  if (!f) return;
  f.text().then(txt => {
    try {
      const data = JSON.parse(txt);
      const list = Array.isArray(data) ? data : data.champions;
      if (!Array.isArray(list)) throw new Error('shape');
      let added = 0;
      for (const c of list) {
        if (!c || !c.genome || !c.manifest || !c.seeds) continue;
        const at = champions.findIndex(x => x.id === c.id);
        if (at >= 0) champions[at] = c; else { champions.push(c); added++; }
      }
      saveChampions(); renderChampions();
      trainModel(); renderStats(); renderWeights();   // W2: champions are training data
      if (!added) alert('nothing new — every champion in that file was already here');
    } catch { alert('not a champions json'); }
    input.value = '';
  });
}

/* The NEUTRAL base: braun-plain, labels on, no jitter, no hero. A sweep
   is only readable against a quiet control — a random base throws four
   other loud genes into the comparison and you end up rating the base,
   not the axis. Reroll gives random bases for a sanity check that the
   choice survives a different context. */
const NEUTRAL = {
  school: 0.15, flow: 'rows', accent: 'none', voiceLit: 'lit',
  knobStyle: 'ring', remixGlyph: 'dice',
  scopePlace: 'inline', scopeFrame: 'hairline', scopeCycles: 'one', scopeSlot: 'lead',
  mixerScatter: 0.15, panFill: 'noon', mutePlace: 'square', panPlace: 'row',
  shapeLink: 'matched',
  faderOrient: 'vertical', faderLen: 'even',
  orbInk: 'mono', autoShape: 'circle', cycleReadout: 'ring',
  heroPick: 'first',
  pairStyle: 'declared', playStyle: 'washCircle',
  align: 'center', labels: 'below', readouts: 'on', dividers: 'none',
  hero: 'off', jitter: 0, chipStyle: 'wash',
  knobSize: 1.1, margin: 14, gapScale: 1.1, orderSeed: 0.5, faderW: 5,
};
let sweepBase = 'neutral';          // 'neutral' | 'random'

function sweepValues(key) {
  const gene = GENES.find(g => g.k === key);
  if (gene.t === 'e') return gene.o.slice();
  const N = 8;
  return Array.from({ length: N }, (_, i) => gene.min + (gene.max - gene.min) * i / (N - 1));
}

/* Every card in a sweep renders with the SAME seed, so the jitter draw,
   the backdrop placement and the per-voice stable values are identical
   and the swept gene is the only thing that moved. */
function buildSweep() {
  // `sweepGene` is exempt from the song's pins — otherwise sweeping a
  // pinned gene would render eight identical cards.
  const base = applyPins(applyLocks(sweepBase === 'neutral'
    ? { ...NEUTRAL } : randomGenome(mulberry32(sweepSeed))), sweepGene);
  batch = sweepValues(sweepGene).map(v => ({
    seed: sweepSeed, genome: { ...base, [sweepGene]: v }, vote: 0, sweepVal: v,
  }));
  focusIdx = -1;
  renderGrid();
  renderGeneDesc();
}

/* What the swept gene does, plus the two ways a sweep can be silently
   inert: the song contains nothing the gene acts on, or `school` is
   sitting below the gene's gate and multiplying it to zero. Both look
   identical on screen (8 identical cards) and both read as a bug. */
function renderGeneDesc() {
  const el = document.getElementById('geneDesc');
  if (mode !== 'sweep') { el.innerHTML = ''; return; }
  const gene = GENES.find(g => g.k === sweepGene);
  const warns = [];
  if (gene.needs && !gene.needs(manifest)) {
    warns.push(`“${currentRecipeKey}” has no ${gene.needsLabel}, so every card will be identical — switch recipe, or raise its weight in <b>edit recipe</b>.`);
  }
  const school = LOCKS.school ?? (sweepBase === 'neutral' ? NEUTRAL.school : null);
  if (school != null && gene.gate != null && school <= gene.gate) {
    warns.push(`<b>school</b> is ${school.toFixed(2)} and this gene only switches on above ${gene.gate} — the sweep is inert. Lock <b>school</b> higher first.`);
  }
  if (school != null && gene.scaledBySchool && school < 0.5) {
    warns.push(`<b>school</b> multiplies this gene, and it is at ${school.toFixed(2)} — you are seeing ${Math.round(school * 100)}% of the effect. Lock <b>school</b> nearer 1 to judge it.`);
  }
  el.innerHTML = `<span class="dsc"><b>${gene.k}</b> — ${gene.d}</span>` +
    warns.map(w => `<span class="warn">⚠ ${w}</span>`).join('');
}

function lockAt(idx) {
  const item = batch[idx];
  if (!item) return;
  if (LOCKS[sweepGene] === item.sweepVal) delete LOCKS[sweepGene];
  else LOCKS[sweepGene] = item.sweepVal;
  saveLocks(); renderLocks(); renderGrid(); renderGeneDesc();
}

/* Is this swept value currently ruled out? */
function isExcludedVal(gene, v) {
  if (gene.t === 'e') return (EXCLUDES[gene.k] || []).includes(v);
  const [lo, hi] = floatBounds(gene);
  return v < lo - 1e-9 || v > hi + 1e-9;
}

function excludeAt(idx) {
  const item = batch[idx];
  if (!item) return;
  const gene = GENES.find(g => g.k === sweepGene);
  const v = item.sweepVal;

  if (gene.t === 'e') {
    const ex = EXCLUDES[sweepGene] || [];
    const next = ex.includes(v) ? ex.filter(o => o !== v) : [...ex, v];
    // never exclude the last survivor — that would strand the gene
    if (next.length >= gene.o.length) return;
    if (next.length) EXCLUDES[sweepGene] = next; else delete EXCLUDES[sweepGene];
  } else {
    const [lo, hi] = floatBounds(gene);
    const step = (gene.max - gene.min) / 7;          // the sweep's own step
    if (isExcludedVal(gene, v)) {                    // click again to restore
      BOUNDS[sweepGene] = [Math.min(lo, v), Math.max(hi, v)];
    } else if (v <= (lo + hi) / 2) {
      BOUNDS[sweepGene] = [Math.min(v + step * 0.5, hi), hi];   // trim the bottom
    } else {
      BOUNDS[sweepGene] = [lo, Math.max(v - step * 0.5, lo)];   // trim the top
    }
    const b = BOUNDS[sweepGene];
    if (b[0] <= gene.min && b[1] >= gene.max) delete BOUNDS[sweepGene];
  }
  // a lock inside the newly-excluded region no longer means anything
  if (LOCKS[sweepGene] !== undefined && isExcludedVal(gene, LOCKS[sweepGene])) {
    delete LOCKS[sweepGene];
  }
  saveLocks(); renderLocks(); renderGrid(); renderGeneDesc();
}

function renderLocks() {
  buildGeneSel();                 // keep the picker's markers in step
  syncKnobCtl();                  // …and the bar's knob-width range slider
  const el = document.getElementById('locks');
  const locked = Object.keys(LOCKS);
  const narrowed = GENES.filter(g => LOCKS[g.k] === undefined && isNarrowed(g));
  if (!locked.length && !narrowed.length) {
    el.innerHTML = `<span class="none">nothing decided yet — <b>lock</b> pins a value, <b>✕</b> rules one out and keeps the rest</span>`;
    return;
  }
  const lockChips = locked.map(k => {
    const v = LOCKS[k];
    return `<span class="lk">${k} = ${typeof v === 'number' ? v.toFixed(2) : v}
      <button data-unlock="${k}" title="unlock">✕</button></span>`;
  }).join('');
  const exChips = narrowed.map(g => {
    const txt = g.t === 'e'
      ? `${g.k} ✕ ${(EXCLUDES[g.k] || []).join(' ✕ ')}`
      : `${g.k} ${floatBounds(g)[0].toFixed(2)}–${floatBounds(g)[1].toFixed(2)}`;
    return `<span class="ex">${txt}<button data-clear="${g.k}" title="clear">✕</button></span>`;
  }).join('');
  el.innerHTML = `<span class="none">${locked.length} locked · ${narrowed.length} narrowed
    · ${GENES.length - locked.length - narrowed.length} open —</span>` + lockChips + exChips;
}
document.getElementById('locks').addEventListener('click', (e) => {
  const un = e.target.closest('button[data-unlock]');
  const cl = e.target.closest('button[data-clear]');
  if (un) delete LOCKS[un.dataset.unlock];
  else if (cl) { delete EXCLUDES[cl.dataset.clear]; delete BOUNDS[cl.dataset.clear]; }
  else return;
  saveLocks(); renderLocks();
  mode === 'sweep' ? buildSweep() : renderGrid();
});

/* ── the bar's knob controls (Dan, 2026-08-16) ───────────────────────
   `min knob` is the pack floor (MIN_KNOB — not a gene; it rides the
   recipes/champions exports since round two, see the KNOB FLOOR note).
   `knob width` is a direct handle on BOUNDS.knobSize, the same
   store a knobSize sweep's ✕ narrows — so the chips, the exports and
   the Swift sampler all see it, and clearing the chip resets the
   slider (renderLocks re-syncs both controls). */
const knobGene = GENES.find(g2 => g2.k === 'knobSize');
const minKnobEl = document.getElementById('minKnob');
const knobLoEl = document.getElementById('knobLo');
const knobHiEl = document.getElementById('knobHi');
for (const el of [knobLoEl, knobHiEl]) {
  el.min = knobGene.min; el.max = knobGene.max; el.step = 0.05;
}
function syncKnobCtl() {
  minKnobEl.value = MIN_KNOB;
  document.getElementById('minKnobVal').textContent = MIN_KNOB ? `${MIN_KNOB}px` : 'off';
  const [lo, hi] = floatBounds(knobGene);
  knobLoEl.value = lo; knobHiEl.value = hi;
  document.getElementById('knobRangeVal').textContent = `${lo.toFixed(2)}–${hi.toFixed(2)}`;
  const span = knobGene.max - knobGene.min;
  const fill = document.getElementById('knobFill');
  fill.style.left = `${((lo - knobGene.min) / span) * 100}%`;
  fill.style.width = `${((hi - lo) / span) * 100}%`;
}
minKnobEl.addEventListener('input', () => {
  MIN_KNOB = +minKnobEl.value;
  try { localStorage.setItem(MINK_KEY, String(MIN_KNOB)); } catch { /* private mode */ }
  syncKnobCtl();
  repaintPlates();
});
function setKnobBounds(lo, hi) {
  if (lo <= knobGene.min + 1e-9 && hi >= knobGene.max - 1e-9) delete BOUNDS.knobSize;
  else BOUNDS.knobSize = [lo, hi];
  // a lock outside the new range no longer means anything (excludeAt's rule)
  if (LOCKS.knobSize !== undefined && (LOCKS.knobSize < lo || LOCKS.knobSize > hi)) {
    delete LOCKS.knobSize;
  }
  saveLocks(); renderLocks();
  mode === 'sweep' ? buildSweep() : renderGrid();
}
knobLoEl.addEventListener('input', () => {
  const lo = +knobLoEl.value;
  setKnobBounds(lo, Math.max(lo, +knobHiEl.value));
});
knobHiEl.addEventListener('input', () => {
  const hi = +knobHiEl.value;
  setKnobBounds(Math.min(hi, +knobLoEl.value), hi);
});

/* ════════════════════════════════════════════════════════════════════
   APP SIM — the iOS runtime, simulated (SPEC-parametric-faceplates §10)
   ────────────────────────────────────────────────────────────────────
   The app's loop, run against the SAME sampler and renderer the rating
   modes use: enter a song → resolve its stored seeds or draw fresh AND
   PERSIST (stable-until-shuffle) → render the plate in a phone frame →
   shuffle re-rolls and re-persists. The store is the localStorage
   stand-in for `song.ui`; the fixtures export is the file the Swift
   parity tests replay.

   ⭐ Voice bias is ON here, as it always was — and since W1's v6
   key-bump the rating modes draw through it too, so every mode shows
   the shipping distribution. ⚠️ Nothing in here may touch `batch` or
   `generations` — peeking at the sim must not cost a rating session
   anything. `ratings` is the ONE deliberate exception, and only through
   simVote: a like cast under the phone is a real rating (src:'app'),
   never a side effect of looking. ⚠️ Its rows carry the BIASED draw's
   controls, so they widen the "across N manifests" spread on purpose —
   they are judgements of what the app will actually show.
   ════════════════════════════════════════════════════════════════════ */
const SIM_KEY = 'wt-parametric-appsim-songui-v1';
let simStore = {};
try { simStore = JSON.parse(localStorage.getItem(SIM_KEY) || '{}'); } catch { simStore = {}; }
const saveSim = () => localStorage.setItem(SIM_KEY, JSON.stringify(simStore));
let simSong = null;          // recipeKey of the entered song
let simView = 'play';        // 'play' | 'listen' | 'program' — the hamburger's three
let simMenuOpen = false;

/* ── W3: the P8 taste filter, lab twin ────────────────────────────────
   Since P8 the app's every fresh genome seed is best-of-K under the
   taste model (Swift `PlateTaste.rollGenomeSeed`; ROLL_CANDIDATES
   mirrors its `rollCandidates`). The sim must roll the same way or Dan
   judges a stream users no longer see. Scoring happens on
   drawGenome(seed, key) — locks + the song's own pins applied — because
   the scored genome must BE the rendered one; the winning SEED is what
   persists, so stored plates stay reproducible from seeds alone,
   exactly the app's design. ⚠️ Scores with the lab's LIVE in-browser
   model, which may be fresher than the app's last synced weights — that
   is the point (this is judging tomorrow's sync), not a bug. No model,
   or the `taste` chip off → the first roll, bit-identical to the old
   single newSeed(). (The batch grid's `biasChk` top-12-of-96 is a
   different, coarser mechanism — deliberately untouched.) */
const ROLL_CANDIDATES = 8;   // = Swift PlateTaste.rollCandidates
let simTaste = true;         // the app has no off switch; the chip is for A/B only

/* ── the 08-16 transport trial (Dan) — SIM-ONLY chrome mock ───────────
   Trying the iOS play-bar proposal on the phone before touching Swift:
   play/pause = the bottom-center rail button · above the volume meter
   the column reads NEXT (cycle countdown as its ring) then AUTO as a
   word-toggle · retune leaves the plate for the settings menu (TBD).
   ⚠️ VIEW-ONLY and vote-neutral: simVote stores the TRUE manifest
   (retune included) — the trial changes what is drawn, never what a
   rating means. Persisted so Dan's A/B choice survives reload;
   defaults ON because the trial is the thing being looked at. */
const SIMTR_KEY = 'wt-parametric-appsim-transport-trial';
let simTransportTrial = true;
try { simTransportTrial = (localStorage.getItem(SIMTR_KEY) ?? '1') === '1'; } catch { /* private mode */ }
/* ── THE KNOB CULL (Dan, 2026-08-16, round two) ─────────────────────
   "when the knobs are very small because one of the designs pushes
   them to be that way, that is an extremely easy way to weed out any
   designs that made it past this process when being generated."
   The pack floor guards PACKED size; a busy layout still drags the
   plate down through shrink-to-fit — so the tell is the EFFECTIVE
   on-screen size, fit × the smallest drawn labeled control (round
   three widened this from fit × KNOB — see below). A candidate under MIN_KNOB is
   disqualified before taste scores it; an all-fail pool falls back to
   the least-shrunk candidate (something must draw). Threshold IS
   MIN_KNOB (0 = off) — no second dial. ⚠️ A HARD rule, not taste: it
   applies with the taste chip off too, exactly as the Swift twin
   (PlateTaste.KnobCull) ships it. ⛔ The batch grid stays uncensored —
   the rule must stay visible/judgeable there. */
/* …and the ROWS HEURISTIC (Dan, same day: "can we just make a heuristic
   to rule out rows?"): a candidate whose EFFECTIVE layout flow is rows
   is culled outright — judged on the layout, never the gene, so a rows
   genome the cap converts to columns still passes (15 liked champions
   do exactly that). Active regardless of MIN_KNOB; the v6 data exclude
   remains as the second layer once a reloaded profile exports it. */
/* → ROUND THREE (Dan, 08-16: "pan faders or the random button rendered
   smaller than the orbs … cull any design with a label smaller than
   50pt on screen, before we hit the button"): the metric is now
   `fit × minCtl` — the smallest drawn LABELED control (knob/pair disc,
   the button's floored inner disc, pan/mute marks; see the `ctl`
   fields on the block builders) — instead of the knob-only formula,
   which let pans (floored at exactly MIN_KNOB pre-fit) and the retune
   button (0.86 shrink × 0.85 sizeMul) slip under whenever fit < 1.
   And "until we find one that fits": an all-fail batch re-rolls, up to
   CULL_RETRY_BATCHES, before settling for the least-shrunk candidate
   (a manifest can be genuinely unfittable — something must draw). */
const CULL_RETRY_BATCHES = 4;   // = Swift PlateTaste.cullRetryBatches
function simCullVerdict(key, mseed, g, gseed) {
  const r = RECIPES[key];
  const m = drawManifest(recipePatch(key), mseed, r.controls, r.weights, VOICE_BIAS);
  const { dbg } = renderWithLayout(m, g, gseed);
  return { eff: dbg?.minCtl == null ? Infinity
                : (dbg?.fitBox?.fit ?? 1) * dbg.minCtl,
           rows: (dbg?.flow ?? g.flow) === 'rows' };
}
function simRollGseed(key, mseed) {
  let bestFail = null, bestFailScore = -Infinity;
  for (let batch = 0; batch < CULL_RETRY_BATCHES; batch++) {
    let best = null, bestScore = -Infinity;
    for (let i = 0; i < ROLL_CANDIDATES; i++) {
      const s = newSeed();
      const g = drawGenome(s, key);
      const v = simCullVerdict(key, mseed, g, s);
      if (v.rows || (MIN_KNOB > 0 && v.eff < MIN_KNOB)) {
        // all-fail fallback: any non-rows beats any rows; then
        // least-shrunk (Infinity capped so a control-less rows plate
        // can never out-rank a finite non-rows one)
        const fb = Math.min(v.eff, 1e5) - (v.rows ? 1e6 : 0);
        if (fb > bestFailScore) { bestFailScore = fb; bestFail = s; }
        continue;
      }
      if (!simTaste || !model) return s;   // first passing, no model
      const sc = score(g);
      if (best == null || sc > bestScore) { bestScore = sc; best = s; }
    }
    if (best != null) return best;         // best passing of this batch
  }
  return bestFail ?? newSeed();
}
/* → the MANIFEST leg (= Swift PlateTaste.rollPlateSeeds): genome
   re-rolls can't rescue a manifest that packs too much — 6 voices +
   8 controls at floor 50 can never reach fit 1 — so a full roll
   (first visit / full shuffle, NEVER shuffle-look) replaces a draw no
   genome fits, up to MANIFEST_RETRY tries, then settles for the
   least-shrunk pair (something must draw). */
const MANIFEST_RETRY = 8;   // = Swift PlateTaste.manifestRetryRolls
function simRollSeeds(key) {
  let bestFail = null, bestFailScore = -Infinity;
  for (let t = 0; t < MANIFEST_RETRY; t++) {
    const ms = newSeed();
    const gs = simRollGseed(key, ms);
    const v = simCullVerdict(key, ms, drawGenome(gs, key), gs);
    if (!v.rows && (MIN_KNOB <= 0 || v.eff >= MIN_KNOB)) {
      return { mseed: ms, gseed: gs };
    }
    const fb = Math.min(v.eff, 1e5) - (v.rows ? 1e6 : 0);
    if (fb > bestFailScore) { bestFailScore = fb; bestFail = { mseed: ms, gseed: gs }; }
  }
  return bestFail ?? { mseed: newSeed(), gseed: newSeed() };
}
function simEnter(key) {
  /* Re-entering the current song restores + advances in the app (§7.4)
     but never redraws — here that means: same stored seeds, same plate. */
  simSong = key;
  simView = 'play'; simMenuOpen = false;
  if (!simStore[key]) {
    // manifest first — the cull judges against it; round three pairs the
    // roll so an unfittable manifest is replaced, not shrunk
    const seeds = simRollSeeds(key);
    simStore[key] = { recipeKey: key, mseed: seeds.mseed, gseed: seeds.gseed };
    saveSim();
  }
  renderAppSim();
}
function simShuffleSeeds(lookOnly) {
  if (!simSong || !simStore[simSong]) return;
  const ui = simStore[simSong];
  // full shuffle rolls the manifest FIRST (was after): the knob cull
  // must judge candidates against the controls the plate will carry —
  // and (round three) retries the manifest itself when nothing fits
  if (!lookOnly) {
    const seeds = simRollSeeds(simSong);
    ui.mseed = seeds.mseed; ui.gseed = seeds.gseed;
  } else {
    ui.gseed = simRollGseed(simSong, ui.mseed);
  }
  saveSim(); renderAppSim();
}
function simForget() {
  if (!simSong) return;
  delete simStore[simSong]; saveSim();
  simEnter(simSong);        // a first visit, immediately
}
/* ── the phone's visual field ─────────────────────────────────────────
   The rated cards keep their 84px field SLIVER (compact is the point of
   a grid); the phone shows the field at the size the app does. The
   lissajous is SIMULATED — a fixed 3:2 (a fifth), not the song's actual
   frequencies — because the sim has no audio and pretending otherwise
   would read as a claim. ⛔ The screen is a rounded black rect in BOTH
   themes: an oscilloscope face is black glass, daylight or not. */
const SIM_FIELD_H = 336;
function simLissajous() {
  const W = PHONE_W, H = SIM_FIELD_H, pad = 16;
  const sx = pad, sy = pad, sw = W - pad * 2, sh = H - pad * 2;
  const cx = sx + sw / 2, cy = sy + sh / 2;
  const ax = sw / 2 - 34, ay = sh / 2 - 26;
  const pts = [];
  for (let i = 0; i <= 720; i++) {
    const t = i / 720;
    pts.push(`${(cx + ax * Math.sin(2 * Math.PI * 3 * t + Math.PI / 2)).toFixed(1)},${(cy + ay * Math.sin(2 * Math.PI * 2 * t)).toFixed(1)}`);
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="18" fill="#000" stroke="${INK(0.22)}" stroke-width="1"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="rgba(235,235,235,0.55)" stroke-width="1.4"
      stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

/* One draw, exactly as the app will run it: biased count, the song's own
   pins, the lab's locks standing in for shipped constants. */
function simPlate(key, ui) {
  const r = RECIPES[key];
  const m = drawManifest(recipePatch(key), ui.mseed, r.controls, r.weights, VOICE_BIAS);
  return { m, g: drawGenome(ui.gseed, key) };
}
const simUiJson = (ui) => JSON.stringify(
  { recipeKey: ui.recipeKey, manifestSeed: ui.mseed, genomeSeed: ui.gseed }, null, 1);

/* ── voting on the plate the app would show ───────────────────────────
   Same row shape and same replace-by-seed contract as vote(): every
   shuffle rolls a fresh gseed, so one visible plate is one row, and
   clicking the vote you already cast clears it. The rating survives the
   shuffle that replaces the plate — that is the point: the plate is
   gone, the taste it taught stays. */
function simVote(v) {
  const ui = simSong && simStore[simSong];
  if (!ui || simView !== 'play') return;
  const { m, g } = simPlate(simSong, ui);
  const repeat = (ratings.find(r => r.seed === ui.gseed)?.vote || 0) === v;
  ratings = ratings.filter(r => r.seed !== ui.gseed);
  if (!repeat) {
    ratings.push({
      seed: ui.gseed, genome: g, recipeKey: simSong, vote: v, ts: Date.now(),
      mseed: ui.mseed, voices: m.voices, controls: m.controls.join(' '), src: 'app',
      vb: 1,   // the sim has always drawn through VOICE_BIAS (⚠️ no vr — ?voices never reaches the sim)
    });
  }
  saveRatings(); trainModel(); renderStats(); renderWeights(); renderAppSim();
}

function renderAppSim() {
  const el = document.getElementById('appSim');
  if (!simSong || !RECIPES[simSong]) simSong = Object.keys(RECIPES)[0];
  const ui = simStore[simSong];
  const chips = Object.keys(RECIPES).map(k => {
    const s = simStore[k];
    return `<button class="songchip ${k === simSong ? 'on' : ''}" data-song="${k}">${k}
      <span class="seedtag ${s ? '' : 'fresh'}">${s
        ? `m${s.mseed.toString(16).slice(0, 5)} g${s.gseed.toString(16).slice(0, 6)}`
        : 'no plate yet — first entry draws one'}</span></button>`;
  }).join('');

  let screen, meta = '';
  if (simView === 'play' && ui) {
    const { m, g } = simPlate(simSong, ui);
    /* Field on top, then the plate with its sliver CLIPPED off (margin
       trick, so render() itself — shared with the rating grid — never
       learns about the phone). Round 2 of the trial UNDID round 1's
       retune filter: retune stays on the plate and doubles as NEXT
       (ring = the cycle countdown), so the manifest renders whole.
       ⭐ The plate renders as the PLAY FACE (Dan, 08-16): forced paper
       theme under the black glass field — the iOS split — plus
       program-size palette orbs; the rated grid keeps the lab theme. */
    const plate = withTheme(PAPER_THEME, () =>
      render(m, g, ui.gseed, { transportTrial: simTransportTrial, playFace: true }));
    screen = `<div class="glass">${simLissajous()}</div>`
      + `<div class="plateclip">${plate}</div>`;
    meta = `<div class="simmeta">
      <b>${simSong}</b> · ${m.voices}v · ${m.controls.length} controls${LAST_CLUSTER ? ' · ' + LAST_CLUSTER : ''}${LAST_HERO ? ' · hero:' + LAST_HERO : ''}<br>
      ${m.controls.join(' · ')}<br>
      ⚗ <b>play face</b> — black glass over paper (the iOS split) ·
      program-size palette orbs<br>
      ${simTransportTrial ? `⚗ <b>transport trial r2</b> — play/pause = bottom-center rail ·
        retune doubles as NEXT (its ring = the cycle countdown) ·
        full-height main mixer, plate-size VOL · auto retired (home TBD)<br>` : ''}<br>
      the plate is drawn fresh from these two integers on every visit —
      that they land on the SAME plate is the thing being simulated.
      <span class="uij" id="simUiJson" title="click to copy — the object a saved song stores">${simUiJson(ui)}</span>
    </div>`;
  } else {
    screen = `<div class="placeholder">${simView === 'listen'
      ? 'listen —<br>the current listen page ships here'
      : 'program —<br>the current instrument page ships here<br>(all settings available)'}</div>`;
  }
  const menu = simMenuOpen ? `<div class="statemenu">${['play', 'listen', 'program'].map(v =>
    `<button class="${v === simView ? 'on' : ''}" data-view="${v}">${v}</button>`).join('')}</div>` : '';
  /* The row reads the vote back OUT of ratings rather than keeping its
     own flag — the rating is the state, and a re-render after shuffle
     (fresh gseed, no row) correctly comes up blank. */
  const cur = ui ? (ratings.find(r => r.seed === ui.gseed)?.vote || 0) : 0;
  const votes = (simView === 'play' && ui) ? `<div class="simvotes">
      <button class="like ${cur > 0 ? 'on' : ''}" data-simvote="1"
        title="record ▲ for this plate — it joins the same taste pool as batch ratings (L)">▲ like</button>
      <button class="dislike ${cur < 0 ? 'on' : ''}" data-simvote="-1"
        title="record ▼ for this plate (X)">▼ dislike</button>
    </div>` : '';

  el.innerHTML = `
    <div class="songstrip"><h2>songs</h2>${chips}</div>
    <div class="phonecol">
      <div class="phone">
        <button class="burger" title="the three app states — this menu replaces the corner mode icon">☰</button>
        ${menu}${screen}
      </div>
      ${votes}
    </div>
    ${meta}`;
  const stat = document.getElementById('simStat');
  if (stat) stat.textContent = ui
    ? `${simSong} · stable until shuffle · ${Object.keys(simStore).length} song${Object.keys(simStore).length === 1 ? '' : 's'} stored`
    : '';
}
document.getElementById('appSim').addEventListener('click', (e) => {
  const sv = e.target.closest('button[data-simvote]');
  if (sv) { simVote(+sv.dataset.simvote); return; }
  const chip = e.target.closest('.songchip');
  if (chip) { simEnter(chip.dataset.song); return; }
  if (e.target.closest('.burger')) { simMenuOpen = !simMenuOpen; renderAppSim(); return; }
  const v = e.target.closest('.statemenu button');
  if (v) { simView = v.dataset.view; simMenuOpen = false; renderAppSim(); return; }
  const uij = e.target.closest('#simUiJson');
  if (uij) {
    navigator.clipboard?.writeText(uij.textContent);
    uij.style.outline = '1px solid rgba(120,220,150,0.7)';
    setTimeout(() => { uij.style.outline = ''; }, 350);
  }
});
document.getElementById('simShuffle').addEventListener('click', () => simShuffleSeeds(false));
document.getElementById('simShuffleLook').addEventListener('click', () => simShuffleSeeds(true));
document.getElementById('simForget').addEventListener('click', simForget);
document.getElementById('simTasteChk').addEventListener('change', (e) => { simTaste = e.target.checked; });
const simTransChk = document.getElementById('simTransChk');
simTransChk.checked = simTransportTrial;
simTransChk.addEventListener('change', (e) => {
  simTransportTrial = e.target.checked;
  try { localStorage.setItem(SIMTR_KEY, simTransportTrial ? '1' : '0'); } catch { /* private mode */ }
  renderAppSim();
});

/* ── fixtures: the Swift parity suite's input ─────────────────────────
   Deterministic case seeds (a fixed base, never newSeed) so two exports
   of an unchanged lab produce identical files — a diffable contract.
   Stored songs lead so the exact plates Dan has been looking at are in
   the suite. Locks + recipes + bias travel WITH the cases: a fixture
   without its draw conditions can only be replayed by luck. */
document.getElementById('simFixtures').addEventListener('click', () => {
  const PER_RECIPE = 40;
  const cases = [];
  for (const [i, key] of Object.keys(RECIPES).entries()) {
    const seen = [];
    const stored = simStore[key];
    if (stored) seen.push({ mseed: stored.mseed, gseed: stored.gseed, stored: true });
    const fr = mulberry32(0xf1c70000 + i * 0x9e37);
    while (seen.length < PER_RECIPE) {
      seen.push({ mseed: Math.floor(fr() * 0xffffffff), gseed: Math.floor(fr() * 0xffffffff) });
    }
    for (const c of seen) {
      const { m, g } = simPlate(key, { mseed: c.mseed, gseed: c.gseed });
      cases.push({
        recipeKey: key, mseed: c.mseed, gseed: c.gseed, stored: !!c.stored,
        manifest: { voices: m.voices, controls: m.controls, scope: m.scope },
        genome: g,
      });
    }
  }
  downloadJSON('fixtures', [`${cases.length}cases`], {
    kind: 'parametric-fixtures', version: 1, exported: Date.now(),
    note: 'Replay: manifest = drawManifest(recipe.patch, mseed, recipe.controls, recipe.weights, voiceBias); genome = pins(locks(randomGenome(mulberry32(gseed)))). A Swift sampler must reproduce every case bit-for-bit.',
    voiceBias: VOICE_BIAS, locks: LOCKS, excludes: EXCLUDES, bounds: BOUNDS,
    recipes: RECIPES, cases,
  });
});

/* ════════════════════════════════════════════════════════════════════
   PICK — pairwise preference, the Midjourney gesture (?mode=pick)
   ════════════════════════════════════════════════════════════════════
   Two draws from the current recipe, side by side; click the one you
   prefer. A pick writes TWO ordinary rating rows — winner ▲, loser ▼,
   src:'pick', each carrying the other's seed in `vs` — so the taste
   model, evolve and the export all see them without learning anything
   new. Forced choice is the point: a grid invites "meh" on everything,
   a pair extracts a preference even between two plates you would have
   left unrated. `skip` is the honest out (nothing is recorded), exactly
   like clearing a vote.
   ⚠️ The pair draws exactly as a song-mode batch card does (own genome
   seed, own manifest seed under draw-per-card) and NEVER biases by the
   model — a model steering what you compare would train on itself. */
let pickPair = null, pickFlash = -1;
function drawPickItem() {
  const seed = newSeed();
  return { seed, mseed: songMode ? newSeed() : null, genome: drawGenome(seed), vb: 1 };
}
function newPickPair() {
  pickPair = [drawPickItem(), drawPickItem()];
  pickFlash = -1;
  renderPick();
}
function pickChoose(i) {
  if (mode !== 'pick' || !pickPair || pickFlash >= 0) return;   // flash = pair already decided
  for (const [item, other, v] of [[pickPair[i], pickPair[1 - i], 1], [pickPair[1 - i], pickPair[i], -1]]) {
    ratings = ratings.filter(r => r.seed !== item.seed);
    const m = manifestFor(item);
    ratings.push({
      seed: item.seed, genome: item.genome, recipeKey: currentRecipeKey, vote: v, ts: Date.now(),
      mseed: item.mseed ?? manifestSeed, voices: m.voices, controls: m.controls.join(' '),
      src: 'pick', vs: other.seed, vb: 1,
      ...(VOICES_OVERRIDE ? { vr: [...VOICES_OVERRIDE] } : {}),
    });
  }
  saveRatings(); trainModel(); renderStats(); renderWeights();
  /* A beat of feedback before the next pair — instant replacement reads
     as "did that register?". */
  pickFlash = i; renderPick();
  setTimeout(() => { if (mode === 'pick') newPickPair(); }, 260);
}
function renderPick() {
  const el = document.getElementById('pick');
  if (!pickPair) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="pickq">which plate do you prefer?</div>
    <div class="pickrow">${pickPair.map((item, i) => {
      const m = manifestFor(item);
      return `<div class="pickcard ${pickFlash === i ? 'won' : pickFlash >= 0 ? 'lost' : ''}" data-pick="${i}">
        <div class="simclip">${renderRated(m, item.genome, item.seed)}</div>
        <div class="meta">
          <span>g${item.seed.toString(16).slice(0, 6)}${item.mseed != null ? ' m' + item.mseed.toString(16).slice(0, 5) : ''} · ${m.voices}v</span>
          <span>${i === 0 ? '←' : '→'}</span>
        </div>
      </div>`;
    }).join('')}</div>`;
  const won = ratings.filter(r => r.src === 'pick' && r.vote > 0).length;
  document.getElementById('pickStat').textContent =
    `${won} pair${won === 1 ? '' : 's'} picked · every pick records ▲ and ▼ into the same taste pool`;
}
document.getElementById('pick').addEventListener('click', (e) => {
  const card = e.target.closest('.pickcard');
  if (card) pickChoose(+card.dataset.pick);
});
document.getElementById('pickSkip').addEventListener('click', newPickPair);

function setMode(m) {
  /* ⛔ A mode button is not an action. Clicking `batch` while already
     in batch mode used to fall through to newBatch(), silently
     replacing the grid and burning a generation — two buttons doing
     the same job, one of them by accident. (`batch.length` is the
     boot guard: empty means nothing has been drawn yet.) */
  if (mode === m && (m === 'app' || m === 'pick' || batch.length)) return;
  mode = m;
  document.getElementById('modeBatch').classList.toggle('primary', m === 'batch');
  document.getElementById('modeSweep').classList.toggle('primary', m === 'sweep');
  document.getElementById('modePick').classList.toggle('primary', m === 'pick');
  document.getElementById('modeApp').classList.toggle('primary', m === 'app');
  document.getElementById('batchBar').style.display = m === 'batch' ? '' : 'none';
  document.getElementById('sweepBar').style.display = m === 'sweep' ? '' : 'none';
  document.getElementById('pickBar').style.display = m === 'pick' ? '' : 'none';
  document.getElementById('appBar').style.display = m === 'app' ? '' : 'none';
  document.getElementById('appSim').style.display = m === 'app' ? '' : 'none';
  document.getElementById('pick').style.display = m === 'pick' ? '' : 'none';
  document.getElementById('grid').style.display = (m === 'app' || m === 'pick') ? 'none' : '';
  if (m === 'pick') {
    document.getElementById('hint').innerHTML =
      `two draws from the recipe, side by side — click the one you PREFER. the winner records ▲ and the loser ▼,
       into the same taste pool as batch votes (they train the model and feed <b>evolve</b>); a forced choice
       extracts a preference where a grid would get two shrugs.<br>
       <b>←</b> pick left · <b>→</b> pick right · <b>space</b> / <b>N</b> skip the pair (nothing recorded)`;
    /* Coming back RESTORES the pair you were looking at — entering pick
       mode must not burn an undecided comparison. */
    if (!pickPair) newPickPair(); else renderPick();
    renderGeneDesc(); renderGenNav();
    return;
  }
  if (m === 'app') {
    document.getElementById('hint').innerHTML =
      `the iOS runtime, simulated: tap a song to enter it — the FIRST entry draws a plate and stores its seeds
       (localStorage, standing in for <b>song.ui</b>); every later entry lands on the SAME plate, across reloads,
       until <b>shuffle</b> re-rolls. voice bias is ON here (4 &gt; 2 &gt; 3 &gt; 6 &gt; 5) and off in the rating modes.
       ☰ is the app's corner menu: <b>play · listen · program</b>.<br>
