<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>parametric lab — listen faceplates</title>
<style>
  /* ── Lab chrome wears the simple theme's own tokens ────────────── */
  :root {
    --ink-rgb: 150, 150, 150;      /* simple's chrome cap */
    --ink-hi-rgb: 215, 215, 215;   /* legibility tier */
    --bg: #000;                    /* the page */
    --card-bg: #000;               /* a plate's own ground */
    --scrim: rgba(0, 0, 0, 0.88);  /* behind the zoom modal */
  }
  /* Daylight. Same token names, base values flipped so every alpha step
     keeps its contrast — see the THEMES table in the script for why this
     is not an inversion. The page sits a shade darker than the plates so
     a card still reads as a card without needing a heavier outline. */
  body.light {
    --ink-rgb: 86, 86, 86;
    --ink-hi-rgb: 20, 20, 20;
    --bg: #e6e6e4;
    --card-bg: #f4f4f3;
    --scrim: rgba(232, 232, 230, 0.92);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: rgba(var(--ink-rgb), 0.9);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    padding: 16px 20px 60px;
  }
  h1 {
    font-size: 11px; font-weight: 500; letter-spacing: 1.5px;
    text-transform: uppercase; color: rgba(var(--ink-rgb), 0.5);
    margin-bottom: 14px;
  }
  h1 b { color: rgba(var(--ink-hi-rgb), 0.95); font-weight: 500; }

  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-bottom: 8px; font-size: 11px;
  }
  .bar button, .bar select, .bar label.chk {
    background: rgba(var(--ink-rgb), 0.10);
    border: none; border-radius: 4px;
    color: rgba(var(--ink-hi-rgb), 0.9);
    font-size: 10px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 6px 12px; cursor: pointer;
  }
  .bar button:hover { background: rgba(var(--ink-rgb), 0.18); }
  .bar button.primary { background: rgba(var(--ink-rgb), 0.22); }
  .bar label.chk { display: inline-flex; align-items: center; gap: 6px; user-select: none; }
  .bar .stat { font-size: 10px; letter-spacing: 0.5px; color: rgba(var(--ink-rgb), 0.45); font-variant-numeric: tabular-nums; }
  .bar .gennav { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; }
  .bar .gennav button { padding: 6px 9px; }
  .bar .gennav button:disabled { opacity: 0.3; cursor: default; }
  .bar .gennav .stat { min-width: 96px; text-align: center; }
  .hint { font-size: 10px; color: rgba(var(--ink-rgb), 0.35); letter-spacing: 0.3px; margin-bottom: 16px; line-height: 1.7; }

  /* manifest editor */
  #manifestEditor {
    display: none; margin: 4px 0 14px; padding: 10px 12px;
    background: rgba(var(--ink-rgb), 0.05); border-radius: 6px;
    font-size: 10px; letter-spacing: 0.4px;
  }
  #manifestEditor.open { display: block; }
  #manifestEditor .fam { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 6px; }
  #manifestEditor .famname {
    width: 58px; text-align: right; text-transform: uppercase;
    color: rgba(var(--ink-rgb), 0.35); font-weight: 500;
  }
  #manifestEditor label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: rgba(var(--ink-rgb), 0.75); }
  #manifestEditor input[type="number"] { width: 40px; background: rgba(var(--ink-rgb),0.1); border: none; border-radius: 3px; color: rgba(var(--ink-hi-rgb),0.9); padding: 2px 4px; }
  #manifestEditor .pairnote { margin-top: 8px; color: rgba(var(--ink-rgb), 0.3); }
  #manifestEditor .pairnote b { color: rgba(var(--ink-hi-rgb), 0.85); font-weight: 500; }
  #manifestEditor .pairnote button {
    margin-left: 10px; background: rgba(var(--ink-rgb), 0.12); border: none; border-radius: 3px;
    color: rgba(var(--ink-hi-rgb), 0.85); font-size: 9px; letter-spacing: 0.5px;
    text-transform: uppercase; padding: 3px 8px; cursor: pointer;
  }
  /* an id the PATCH rules out — greyed with the reason on hover, never
     hidden: a control that silently vanishes reads as a missing feature */
  #manifestEditor label.illegal { opacity: 0.3; cursor: default; text-decoration: line-through; }
  #manifestEditor select {
    background: rgba(var(--ink-rgb),0.1); border: none; border-radius: 3px;
    color: rgba(var(--ink-hi-rgb),0.9); padding: 2px 4px; font-size: 10px;
  }

  /* card grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .card {
    position: relative; border-radius: 8px; overflow: hidden;
    background: var(--card-bg); outline: 1px solid rgba(var(--ink-rgb), 0.10);
    cursor: pointer; transition: outline-color 0.15s;
  }
  .card:hover { outline-color: rgba(var(--ink-rgb), 0.30); }
  .card.liked   { outline: 1px solid rgba(120, 220, 150, 0.55); }
  .card.disliked{ outline: 1px solid rgba(230, 100, 90, 0.4); opacity: 0.45; }
  .card.focus { outline: 2px solid rgba(var(--ink-hi-rgb), 0.8); }
  .card svg { display: block; width: 100%; height: auto; }
  .card .meta {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px 7px; font-size: 9px; letter-spacing: 0.5px;
    color: rgba(var(--ink-rgb), 0.4); font-variant-numeric: tabular-nums;
  }
  .card .meta .votes { display: flex; gap: 4px; }
  .card .meta button {
    background: rgba(var(--ink-rgb), 0.10); border: none; border-radius: 3px;
    color: rgba(var(--ink-hi-rgb), 0.85); font-size: 10px; width: 26px; height: 20px; cursor: pointer;
  }
  .card .meta button:hover { background: rgba(var(--ink-rgb), 0.22); }
  .card .meta button.wide { width: auto; padding: 0 8px; letter-spacing: 0.5px; text-transform: uppercase; font-size: 9px; }
  .card .meta button.on { background: rgba(230, 160, 90, 0.25); color: rgba(245, 205, 155, 0.95); }
  .card.excluded { outline: 1px solid rgba(230, 160, 90, 0.35); opacity: 0.34; }
  .card.excluded:hover { opacity: 0.7; }
  .card .score { color: rgba(var(--ink-rgb), 0.55); }
  .card .sweepval b { color: rgba(var(--ink-hi-rgb), 0.95); font-weight: 500; }
  .card.locked { outline: 1px solid rgba(120, 220, 150, 0.65); }

  /* locks panel */
  #locks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; font-size: 10px; }
  #locks .lk {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(120, 220, 150, 0.12); border-radius: 4px; padding: 4px 8px;
    color: rgba(var(--ink-hi-rgb), 0.85); letter-spacing: 0.4px; font-variant-numeric: tabular-nums;
  }
  #locks .ex {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(230, 160, 90, 0.12); border-radius: 4px; padding: 4px 8px;
    color: rgba(240, 200, 155, 0.9); letter-spacing: 0.4px; font-variant-numeric: tabular-nums;
  }
  #locks .lk button, #locks .ex button { background: none; border: none; color: rgba(var(--ink-rgb), 0.6); cursor: pointer; font-size: 11px; padding: 0; }
  #locks .none b { color: rgba(var(--ink-hi-rgb), 0.8); font-weight: 500; }
  #locks .none { color: rgba(var(--ink-rgb), 0.3); letter-spacing: 0.4px; }

  /* swept-gene description */
  #geneDesc { max-width: 780px; margin: 2px 0 14px; font-size: 11px; line-height: 1.65; }
  #geneDesc .dsc { color: rgba(var(--ink-rgb), 0.62); letter-spacing: 0.2px; }
  #geneDesc .dsc b { color: rgba(var(--ink-hi-rgb), 0.95); font-weight: 500; letter-spacing: 0.5px; }
  #geneDesc .warn {
    display: block; margin-top: 5px; padding: 5px 9px; border-radius: 4px;
    background: rgba(230, 160, 90, 0.10); color: rgba(235, 185, 130, 0.92);
    font-size: 10px; letter-spacing: 0.3px;
  }

  /* zoom modal */
  #modal {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: var(--scrim); align-items: center; justify-content: center; gap: 28px;
  }
  #modal.open { display: flex; }
  #modal .plate { background: var(--card-bg); outline: 1px solid rgba(var(--ink-rgb), 0.15); border-radius: 12px; overflow: hidden; }
  #modal .plate svg { display: block; width: 420px; height: auto; }
  #modal .plate.back { opacity: 0.85; }
  #modal .plate.back svg { width: 250px; }
  #modal .genes {
    max-width: 260px; font-size: 10px; letter-spacing: 0.4px; line-height: 1.9;
    color: rgba(var(--ink-rgb), 0.6); font-variant-numeric: tabular-nums;
  }
  #modal .genes b { color: rgba(var(--ink-hi-rgb), 0.9); font-weight: 500; }
  #modal .genes .mf {
    display: block; margin: 6px 0; padding: 5px 8px; border-radius: 4px;
    background: rgba(var(--ink-rgb), 0.08); line-height: 1.5;
    color: rgba(var(--ink-hi-rgb), 0.75);
  }

  /* model weight panel */
  #weights { margin-top: 26px; max-width: 560px; }
  #weights h2 { font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: rgba(var(--ink-rgb), 0.4); margin-bottom: 8px; }
  .wrow { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.4px; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .wrow .wname { width: 190px; color: rgba(var(--ink-rgb), 0.7); text-align: right; }
  .wrow .wbar { height: 4px; border-radius: 2px; }
  .wrow .wpos { background: rgba(120, 220, 150, 0.7); }
  .wrow .wneg { background: rgba(230, 100, 90, 0.6); }
</style>
</head>
<body>

<h1><b>parametric lab v2</b> — patch → manifest → genome · 393×292 · every control on the plate moves the sound NOW</h1>

<div class="bar">
  <select id="songSel"></select>
  <button id="editManifest">edit manifest</button>
  <button id="modeBatch" class="primary">batch</button>
  <button id="modeSweep">sweep</button>
  <button id="themeBtn" title="invert the plates for daylight (D)">daylight</button>
  <span class="stat" id="stats"></span>
</div>

<div class="bar" id="batchBar">
  <button id="newBatch" class="primary">new batch</button>
  <button id="evolve">evolve from likes</button>
  <span class="gennav">
    <button id="genBack" title="previous generation">◀</button>
    <span class="stat" id="genLabel">gen —</span>
    <button id="genFwd" title="next generation">▶</button>
  </span>
  <label class="chk"><input type="checkbox" id="biasChk"> bias by model</label>
  <label class="chk" title="each card draws its OWN controls from the patch — rate the system, not one plate"><input type="checkbox" id="songChk"> song mode</label>
  <button id="exportBtn">export json</button>
  <button id="resetBtn">reset ratings</button>
</div>

<div class="bar" id="sweepBar" style="display:none">
  <select id="geneSel"></select>
  <select id="baseSel">
    <option value="neutral">neutral base</option>
    <option value="random">random base</option>
  </select>
  <button id="reroll">reroll base</button>
  <button id="exportBtn2">export json</button>
  <span class="stat">every card shares one seed — only this gene moves</span>
</div>
<div id="geneDesc"></div>

<div class="hint" id="hint"></div>

<div id="locks"></div>
<div id="manifestEditor"></div>
<div id="grid"></div>

<div id="weights"></div>

<div id="modal">
  <div class="plate" id="modalPlate"></div>
  <div class="plate back" id="modalBack"></div>
  <div class="genes" id="modalGenes"></div>
</div>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   0 · THEME TOKENS — lifted from src/theme/palette.js + App.css simple
   ════════════════════════════════════════════════════════════════════ */
const CLASSIC_PALETTE = [
  '#ff4136', '#2ecc40', '#0074d9', '#ffdc00', '#bb8fce',
  '#85c1e9', '#82e0aa', '#f8b500', '#e74c3c', '#1abc9c',
  '#ff7eb6', '#a78bfa',
];
function shift(hex, amt, toward) {              // toward 255 = lighten, 0 = darken
  const n = parseInt(hex.slice(1), 16);
  const ch = (s) => { const c = (n >> s) & 0xff; return Math.round(c + (toward - c) * amt).toString(16).padStart(2, '0'); };
  return `#${ch(16)}${ch(8)}${ch(0)}`;
}

/* ── DAYLIGHT MODE ───────────────────────────────────────────────────
   A viewing aid first (these plates are hard to read on a bright
   screen), and a look worth judging second — if the app ever gets a
   light theme, an inverted faceplate is exactly the thing to look at.

   ⛔ NOT an inversion of the drawing. Every ink here is alpha over the
   ground, so swapping #000 for #fff would leave a 0.3-alpha gray-150
   label almost invisible on paper. What flips is the ink's BASE VALUE,
   chosen so each alpha step lands at the same CONTRAST against its
   ground as it does on black:

     INK(0.30)  dark  gray-150 over #000 → Δ45    light  gray-86 over paper → Δ47
     HI(0.90)   dark  gray-215 over #000 → Δ194   light  gray-20 over paper → Δ202
     TRACK      white 0.10 over #000     → Δ26    black 0.10 over paper     → Δ24

   ⚠️ The voice palette flips direction too. `SIMPLE_PALETTE` is the
   classic hues lightened 18% *to carry on black*; on paper those wash
   out (yellow worst), so daylight darkens by 22% instead. Same hues,
   opposite correction.

   ⛔ `dim()` must mix toward the GROUND, not toward black — on paper,
   mixing a voice colour with black makes it louder, which is the exact
   opposite of what every caller wants.
   ─────────────────────────────────────────────────────────────────── */
const DARK_PALETTE  = CLASSIC_PALETTE.map(c => shift(c, 0.18, 255));
const LIGHT_PALETTE = CLASSIC_PALETTE.map(c => shift(c, 0.22, 0));
const THEMES = {
  dark:  { ink: '150,150,150', hi: '215,215,215', track: 'rgba(255,255,255,0.10)',
           ground: '#000000', mix: 'black',  palette: DARK_PALETTE },
  light: { ink: '86,86,86',    hi: '20,20,20',    track: 'rgba(0,0,0,0.11)',
           ground: '#f4f4f3', mix: 'white',  palette: LIGHT_PALETTE },
};
const THEME_KEY = 'wt-parametric-lab-theme';
let THEME = THEMES.dark;
const INK = (a) => `rgba(${THEME.ink},${a})`;   // simple's chrome cap
const HI  = (a) => `rgba(${THEME.hi},${a})`;    // legibility tier
let TRACK = THEME.track;                        // arc/fader track level
let GROUND = THEME.ground;                      // the plate's own paper
function dim(color, pct) {                      // PanPot's dim idiom
  return pct >= 100 ? color : `color-mix(in srgb, ${color} ${pct}%, ${THEME.mix})`;
}
function voiceColor(i) { return THEME.palette[i % THEME.palette.length]; }
function setTheme(light) {
  THEME = light ? THEMES.light : THEMES.dark;
  TRACK = THEME.track; GROUND = THEME.ground;
  document.body.classList.toggle('light', light);
  try { localStorage.setItem(THEME_KEY, light ? 'light' : 'dark'); } catch { /* private mode */ }
}

/* ════════════════════════════════════════════════════════════════════
   0b · iPHONE 17 LISTEN-PAGE GEOMETRY (pt) — from ListenView.swift
   field (square, elided to a sliver) → spectrum bar (56) →
   pane region (~292, ⛔ fixed height) → ListenRail (52)
   ════════════════════════════════════════════════════════════════════ */
const PHONE_W  = 393;
const FIELD_H  = 84;
const SPECT_H  = 56;
const REGION_H = 292;
const RAIL_H   = 52;
const TOTAL_H  = FIELD_H + SPECT_H + REGION_H + RAIL_H;
/* ONE fixed rail, a hairline away from the pane: play/pause · volume ·
   auto. ⛔ v1's right rail (snapshot · prev/next song · shuffle) was
   built, parked at `RIGHT_RAIL = false`, and is DELETED in v2 — dead
   chrome in a file being rewritten. `SPEC-song-ui-manifest-v1.md` §1
   keeps the reasoning if those actions come back. */
const LCOL_W   = 46;
/* How far through the current auto-cycle the mock-ups are drawn. A
   static number on purpose — these are faceplates, not a running app —
   but it must be the SAME everywhere so the ring and the bar agree. */
const CYCLE_PROGRESS = 0.42;

/* Which control render() last promoted to hero. Set inside render and
   read by the card meta immediately after, so it is always the hero of
   the plate directly above it. A return value would be cleaner, but
   render() is called from inside template literals in three places. */
let LAST_HERO = null;

/* ════════════════════════════════════════════════════════════════════
   1 · THE PATCH — v2's new layer, and the one that decides what is LEGAL
   ────────────────────────────────────────────────────────────────────
   Each song is authored as a patch first (by hand now, parametrically
   later). The faceplate reads it as GATES: a control whose `requires`
   the patch fails can never be drawn, whatever the weights say.

   Two constraints fall out of this with no special case at all:

     · "not on cello grains" — one `engine: 'granular'` retires shape,
       fold and wave level together.
     · "width only on a square-only synth, and only when there's no
       shape knob" — a square-only patch has nothing to morph, so
       `shape` fails its own gate and `width` takes the slot. The PATCH
       enforces it, not the layout engine.

   ⚠️ A granular patch therefore has NOTHING in the tone family. It ships
   as filter + reverb until grains get their own family (size · density ·
   position · spray) — see PLAN §1.
   ════════════════════════════════════════════════════════════════════ */
const DEFAULT_PATCH = {
  engine: 'classic',        // 'classic' (sine/tri/square/saw) | 'granular'
  waves: ['sine', 'triangle', 'square', 'saw'],
  /* ⭐ 2, 3 or 4 ACTIVE VOICES, and it trickles all the way down: the
     spectrum bar's stems and orb handles, the mute grid, the pan grid,
     the fader row and the mixer cluster all size themselves off this one
     number. ⛔ It is a patch field, not a gene — how many voices a song
     has is the song, not a way of drawing it. Two loads of one song must
     never disagree about how many voices exist.
     ⚠️ Clamped to 2–4: one voice is not a chord, and past four the
     per-voice blocks stop fitting the 292pt pane. */
  voices: 4,
  noise: true,
  arp: false,
  /* ⭐ Does this synth SHAPE its waveform at all? `false` is a synth
     whose oscillator is what it is — no morph, no fold, no PWM. It gates
     the three waveshaping controls AND the wave screen together, because
     they are one idea: with nothing able to redraw the silhouette there
     is nothing for a screen to witness, and a picture of a wave that
     never changes is decoration. ⛔ Two consequences, one field — not
     two special cases, and it is the answer to "where do I turn the
     viewer off": you say the synth does not shape its wave. */
  shaping: true,
  cycle: true,              // is auto-cycling part of this song at all?
};
const squareOnly = (p) => p.waves.length === 1 && p.waves[0] === 'square';

/* ════════════════════════════════════════════════════════════════════
   2 · PARAM CATALOG — the control VOCABULARY
   ────────────────────────────────────────────────────────────────────
   ⭐ v2's admission rule: `imm` — does moving this change the sound NOW?
   The faceplate is the IMMEDIATE surface. Everything else lives on the
   back face (§9), so the plate can promise that every control on it
   responds the instant you touch it.

   `w`    sampling weight — Dan's visibility tiers as numbers:
          1.0 = ** always · 0.6 = * mostly · below = situational.
          `tune` is 0.5 because it was specified as half of remix.
          ⚠️ On a `ridesWith` row it is CONDITIONAL on the host, not the
          rate you will observe.
   `cost` what it claims of the plate. A knob is 1, a per-voice array 2,
          the mixer cluster 3. The BUDGET is in these units, not in a
          control count: a per-voice array and a knob are one entry
          each and nothing like the same claim on the plate (PLAN §3).
   `requires`  patch gate. Absent = legal on every patch.
   `xor`  at most one row per group: `filter+res` is the generic single
          filter, `lpf`/`hpf` the split pair. Drawing both would be two
          answers to one question.
          ⚠️ An xor'd row's OBSERVED rate is therefore below its `w` —
          whichever member is offered first claims the group, so `filter`
          lands ~0.30 against a nominal 0.50 while `lpf` (0.60) takes
          most of them. That is the exclusion working, not the weight
          being wrong; read the group's total, not the member's.
   ════════════════════════════════════════════════════════════════════ */
const FAMILY_ORDER = ['voices', 'tone', 'filter', 'space', 'tuning', 'arp', 'action'];
const BUDGET = 11;          // cost units — see PLAN §3

const PARAMS = {
  /* ── voices ───────────────────────────────────────────────────────
     ⛔ There is NO pitch control here, and that is the point. Frequency
     lives in the spectrum bar's orb handles, which are fixed chrome on
     every song — so it is always reachable without any song spending
     pane space on it (Dan, 2026-08-14, settling the one collision v2
     opened: a pitch ARRAY and the orbs cannot both be the reason the
     other is unnecessary, and the orbs were there first).

     ⚠️ Consequence worth knowing: the ** tier is now `remix` ALONE, and
     the 2 cost units the array used to take are simply given back — the
     mean plate went 9.7 → 8.1 units (square waves) and 8.7 → 6.8
     (cello). Plates got LIGHTER, not denser: the sampler offers each
     candidate once, so freeing space does not invite more controls, it
     only stops the budget from rejecting the ones already offered.
     The visible effect is that the low-weight tiers now land nearer
     their nominal rates (waveLevel 0.37 → 0.40, detune 0.25 → 0.28). */
  /* ⭐ The mixer is the RARE half of this family (Dan, 2026-08-14):
     panning is only sometimes there, and volume rarer still. Both were
     a tier too high — pan sat with the `*` group at 0.6 and measured
     0.61, which made a mixer feel like standard equipment. Mutes stay
     `*`: a mute is a performance control, a fader is a setup one. */
  /* ⚠️ `ridesWith` — volume is offered only on a plate that already has
     PANS, at this conditional rate. Independent draws put pan at 35% and
     volume at 18% exactly as asked, but then both landed together on
     only 6% of plates, and BOTH is what fires the mixer cluster — so
     `mixerScatter` and `mutePlace: cluster`, two of the more interesting
     genes, became things you would see once in seventeen cards.
     Riding pan keeps volume's OBSERVED rate where it was asked for (18%)
     and lifts the cluster from 6% to the same 18%. It also says
     something true: four volume faders with no pans is a stranger object
     than a mixer.
     ⚠️ 0.7, not 0.5: the nominal 0.35 × w overstates it, because the
     rider is judged last and a 2-cost block is the one most often
     refused by what is left of the budget. Calibrated against the
     measurement, not the arithmetic. */
  levels:     { label: 'level',  family: 'voices', kind: 'voiceFaders', imm: true, w: 0.7, cost: 2,
                ridesWith: 'pans' },
  pans:       { label: 'pan',    family: 'voices', kind: 'voicePans',   imm: true, w: 0.35, cost: 2 },
  mutes:      { label: 'mute',   family: 'voices', kind: 'voiceMutes',  imm: true, w: 0.6,  cost: 1 },

  /* ── tone ─────────────────────────────────────────────────────────
     The three that transform the waveform's SILHOUETTE — and so the
     three that earn the wave screen (§9). */
  shape:      { label: 'shape',  family: 'tone', kind: 'knob', imm: true, w: 0.6, cost: 1, def: 0.42,

  noise:      { label: 'noise',  family: 'tone', kind: 'knob', imm: true, w: 0.4, cost: 1, def: 0.20,

  lpf:        { label: 'lpf',    family: 'filter', kind: 'knob', imm: true, w: 0.6, cost: 1, def: 0.62,

  reverb:     { label: 'reverb', family: 'space', kind: 'knob', imm: true, w: 0.6, cost: 1, def: 0.40,
                fmt: v => `${Math.round(v * 100)}` },

  /* ── tuning ───────────────────────────────────────────────────────
     ⭐ The detune SPLIT (PLAN §2). Dan's note listed detune under both
     "immediate" and "not immediate"; read physically they are two

     instant you turn it — immediate, stays here. How far the next remix
     WANDERS changes nothing until the next remix — that is `drift`,
     and it is on the back face. Same gesture, before and after the

     Both are "tied to remix + tune": `needsAction` keeps them off a
     plate that has neither. */
  detune:     { label: 'detune', family: 'tuning', kind: 'knob',   imm: true, w: 0.3, cost: 1, def: 0.25,
                needsAction: true, fmt: v => `${(v * 10).toFixed(1)}¢` },
  detuneBtn:  { label: 'spread', family: 'tuning', kind: 'button', imm: true, w: 0.2, cost: 1,
                needsAction: true, glyph: 'spread' },

  // ── arp — only exists if the patch has one ───────────────────────
  /* ⚠️ No built-in song carries `arp: true` any more (the arp song came
     out 2026-08-14), so the arp family is reachable only by ticking
     `arp` in the patch editor — or on `full console (stress)`, whose
     control list is authored. Flip it on any song to explore the arp. */
  arpOn:      { label: 'arp',    family: 'arp', kind: 'toggle',  imm: true, w: 0.9, cost: 1, def: true,
                requires: p => p.arp },
  arpBpm:     { label: 'tempo',  family: 'arp', kind: 'slider',  imm: true, w: 0.7, cost: 1, def: 0.45,
                requires: p => p.arp, fmt: v => `${Math.round(50 + v * 130)}` },
  arpOct:     { label: 'octaves',family: 'arp', kind: 'steps',   imm: true, w: 0.5, cost: 1, def: 4,
                requires: p => p.arp },
  arpDir:     { label: 'dir',    family: 'arp', kind: 'segment', imm: true, w: 0.5, cost: 1, def: 0,
                opts: ['up', 'down', 'updn', 'rand'], requires: p => p.arp },

  // ── actions: momentary, they DO something — instantly ────────────
  remix:      { label: 'remix',  family: 'action', kind: 'button', imm: true, w: 1.0, cost: 1, glyph: 'dice' },
  tune:       { label: 'tune',   family: 'action', kind: 'button', imm: true, w: 0.5, cost: 1, glyph: 'align' },

  /* ── ⛔ THE BACK FACE — nothing here moves the sound now ───────────
     `autoCycle` is the dwell timer, `slide` the glide time, `drift` the
     wander amount. Turning any of them changes what happens NEXT.

     ⭐ Note what survives the exile: the cycle READOUT stays on the
     plate (the ring around remix, `cycleReadout`). The countdown is a
     display, not a control — it was only the knob that failed the test,
     so v1's best idea, the timer drawn on the thing it re-clicks, is
     kept while the dwell knob goes to the menu.

     `auto` likewise stays reachable as RAIL chrome (it is transport,
     and the rail is not the plate) — so v1's `autoPlace` gene, and the
     machinery that glued auto onto the remix block, are both gone. */
  autoCycle:  { label: 'dwell',  family: 'motion', kind: 'knob', imm: false, def: 0.40,
                fmt: v => `${Math.round(15 + v * 105)}s` },

                fmt: v => `${(v * 4).toFixed(1)}s` },
  drift:      { label: 'drift',  family: 'motion', kind: 'knob', imm: false, def: 0.35,

/* Every id that can reach the plate, in catalog order. */
const PLATE_IDS = Object.keys(PARAMS).filter(id => PARAMS[id].imm);
const MENU_IDS  = Object.keys(PARAMS).filter(id => !PARAMS[id].imm);
/* Legal on this patch? A partner rides in on its principal, never alone. */
function legalOn(patch, id) {
  const p = PARAMS[id];
  if (!p || !p.imm) return false;
  return !p.requires || p.requires(patch);
}

/* ── COUPLINGS ──────────────────────────────────────────────────────
   The layout ATOM is the pair, not the control. A pair only fires when
   BOTH members are in the song; otherwise each renders alone.
     cluster    — the mixer: every voice's fader, pan (and mute) as one
     concentric — cutoff outer ring, peak inner ring, one body
     adjacent   — two controls that must touch, drawn side by side
   ⛔ v1's `timerRing` pair is GONE with the dwell knob — the ring is now
   drawn from `patch.cycle`, because a readout needs no control present.
   ──────────────────────────────────────────────────────────────── */
const PAIRS = [
  { a: 'levels', b: 'pans',      style: 'cluster',    label: 'mix' },
  { a: 'lpf',    b: 'lpfPeak',   style: 'concentric', label: 'lpf' },
  { a: 'hpf',    b: 'hpfPeak',   style: 'concentric', label: 'hpf' },
  { a: 'filter', b: 'resonance', style: 'concentric', label: 'filter' },
  // the two SOURCE volumes read as one blend, so they are glued
  { a: 'noise',  b: 'waveLevel', style: 'adjacent',   label: '' },
  { a: 'tune',   b: 'detune',    style: 'adjacent',   label: '' },
  { a: 'tune',   b: 'detuneBtn', style: 'adjacent',   label: '' },
];

/* ════════════════════════════════════════════════════════════════════
   2b · THE WITNESS — the wave screen (PLAN §9)
   ────────────────────────────────────────────────────────────────────
   Neither a control nor chrome: a third class. It never appears in a
   manifest — it is a CONSEQUENCE of what the plate carries.

   It does not break the immediacy rule; it is that rule made visible.
   The plate claims every knob moves the sound now, and the screen is
   the plate proving it.

   ⭐ The weight tracks how much the control moves the TRACE, which is
   the honest reading of "less often for saturation": shape, fold and
   width transform the silhouette; saturation only rounds the peaks off.
   And it inverts on size — when the screen appears for saturation ALONE
   it is drawn BIGGER, because a subtle change needs more pixels to be
   legible while a dramatic one survives at any size.
   ════════════════════════════════════════════════════════════════════ */
const WITNESS = {
  id: 'scope',
  strong: ['shape', 'fold', 'width'],   // w 0.7 — they redraw the silhouette
  weak: ['saturation'],                 // w 0.3 — and only on a sparse plate
};

/* ════════════════════════════════════════════════════════════════════
   3 · SONGS — a PATCH plus, optionally, a hand-authored control list
   ────────────────────────────────────────────────────────────────────
   v1 hand-wrote every song's controls. v2 draws them from the patch and
   the weights (§4), so a song only needs a patch. A song may still pin
   `controls` to override the draw — the way you lock a plate you have
   already art-directed — and `pins` still fixes named genes.
   ════════════════════════════════════════════════════════════════════ */
const SONGS = {
  'square waves · immediate slide': {
    patch: { waves: ['square'], voices: 4, cycle: true },
  },
  'cello grains': {
    // ⚠️ granular: shape, fold, wave level and width are all illegal
    patch: { engine: 'granular', waves: [], voices: 2, noise: false, cycle: false },
  },
  /* The simplest song there is: sine, and nothing that bends it. ⛔ No
     shape knob and no wave screen — both fall out of `shaping: false`
     rather than being struck off by hand. */
  'hello world · sine waves': {
    patch: { waves: ['sine'], voices: 4, shaping: false },
  },
  /* Square-only, so `shape` is illegal and `width` becomes legal — the
     one patch where PWM is a meaningful control, and where the wave
     screen has a pulse to draw rather than a fixed square. */
  'two squares': {
    patch: { waves: ['square'], voices: 2 },
  },
  /* The one configuration `shapeLink` is actually about: both per-voice
     sets standing alone, side by side, with nothing else competing.
     Without this there was no way to look at it — in every other song
     the pans get absorbed into the mixer cluster. */
  'authored · pan + mute': {
    patch: { voices: 4, shaping: false },
    controls: ['pans', 'mutes', 'reverb', 'remix'],
  },
  /* ── AUTHORED: the two holdouts whose `controls` are written out
     rather than drawn, kept so a sampled plate can be read against one
     somebody composed on purpose. Identical control lists; they differ
     only in composure, which is what `pins` is for. */
  'authored · mixer, ordered': {
    patch: { voices: 3 },
    controls: ['levels', 'pans', 'noise', 'waveLevel', 'saturation', 'filter', 'resonance', 'tune', 'remix'],
    pins: { mixerScatter: 0, align: 'center', jitter: 0, school: 0.1 },
  },
  'authored · mixer, abstract': {
    patch: { voices: 4 },
    controls: ['levels', 'pans', 'noise', 'waveLevel', 'saturation', 'filter', 'resonance', 'tune', 'remix'],
    pins: { mixerScatter: 0.92, school: 0.8, hero: 'on' },
  },
  /* Kept deliberately as the failure case: everything legal at once,
     ~3× the budget, so the generator keeps being tested against a plate
     that does NOT fit. */
  'full console (stress)': {
    patch: { voices: 4, arp: true },
    controls: ['levels', 'pans', 'mutes', 'shape', 'fold', 'saturation', 'noise',
               'waveLevel', 'lpf', 'lpfPeak', 'hpf', 'hpfPeak', 'reverb', 'detune',
               'arpOn', 'arpBpm', 'arpOct', 'arpDir', 'remix', 'tune'],
  },
};
const songPatch = (key) => ({ ...DEFAULT_PATCH, ...(SONGS[key].patch || {}) });

/* ?song=<substring> deep-links a song — handy for screenshots. */
const SONG_KEYS = Object.keys(SONGS);
const songParam = new URLSearchParams(location.search).get('song');
let currentSongKey = (songParam
  && SONG_KEYS.find(k => k.toLowerCase().includes(songParam.toLowerCase())))
  || 'square waves · immediate slide';

/* ════════════════════════════════════════════════════════════════════
   4 · THE MANIFEST SAMPLER — patch + weights + seed → which controls
   ────────────────────────────────────────────────────────────────────
   v1's manifest was hand-authored per song. Dan's v2 note gave
   FREQUENCIES rather than lists ("** always", "* mostly", "tune half as
   often as remix"), which is a sampler spec — so the manifest is now
   drawn, under a `manifestSeed` kept SEPARATE from the genome seed.

   Two seeds is the mechanic that makes song mode possible: hold the
   manifest and vary the genome (v1's whole workflow), or vary both and
   rate the SYSTEM rather than one plate.

   ⛔ The manifest is still not a gene. It is a deterministic function of
   (patch, manifestSeed): the same song always draws the same plate.
   ════════════════════════════════════════════════════════════════════ */
function drawManifest(patch, mseed, forced) {
  const rng = mulberry32(mseed ^ 0x2f6a88c1);
  const chosen = [], claimedXor = new Set();
  let cost = 0;

  if (forced) {
    // a hand-authored song: honour it verbatim, minus anything its own
    // patch makes illegal (so editing the patch can't produce a lie)
    for (const id of forced) if (legalOn(patch, id) || PARAMS[id]?.partnerOf) chosen.push(id);
    return finish(chosen, patch);
  }

  const take = (id) => {
    const p = PARAMS[id];
    if (p.xor) {
      const [group] = p.xor.split(':');
      if ([...claimedXor].some(x => x.startsWith(group + ':') && x !== p.xor)) return false;
      claimedXor.add(p.xor);
    }
    chosen.push(id);
    cost += p.cost;
    return true;
  };

  const pool = PLATE_IDS.filter(id => legalOn(patch, id) && !PARAMS[id].partnerOf);
  // 1 · the ** tier is not sampled. It is always there — that is what
  //     "always visible" means.
  for (const id of pool.filter(id => PARAMS[id].w >= 1)) take(id);
  // 2 · everything else by weight, in a shuffled order so no control
  //     wins its slot merely by sitting higher in the catalog.
  const rest = pool.filter(id => PARAMS[id].w < 1);
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  const hasAction = () => chosen.includes('remix') || chosen.includes('tune');
  /* Riders are held back to a second pass, because the first pass is
     SHUFFLED — a rider drawn before its host would be judged against a
     plate that does not have the host yet, and its rate would depend on
     where the shuffle happened to put it. */
  const riders = rest.filter(id => PARAMS[id].ridesWith);
  for (const id of rest) {
    const p = PARAMS[id];
    if (p.ridesWith) continue;
    if (cost + p.cost > BUDGET) continue;
    if (p.needsAction && !hasAction()) continue;      // detune is tied to remix/tune
    if (rng() < p.w) take(id);
  }
  for (const id of riders) {
    const p = PARAMS[id];
    if (!chosen.includes(p.ridesWith)) continue;
    if (cost + p.cost > BUDGET) continue;
    if (rng() < p.w) take(id);                        // w is CONDITIONAL here
  }
  return finish(chosen, patch);
}

/* Pull in partners (a peak rides in on its cutoff), order by family, and
   attach the derived witness. */
function finish(chosen, patch) {
  const out = [];
  for (const id of chosen) {
    out.push(id);
    for (const pid of Object.keys(PARAMS)) {
      if (PARAMS[pid].partnerOf === id && !chosen.includes(pid)) out.push(pid);
    }
  }
  const controls = FAMILY_ORDER.flatMap(f => out.filter(id => PARAMS[id].family === f));
  return { patch, voices: patch.voices, controls, scope: scopeFor(controls, patch) };
}

/* The witness decision (§2b), returned as null | 'strong' | 'weak'. */
function scopeFor(controls, patch) {
  const cost = controls.reduce((a, id) => a + (PARAMS[id]?.cost || 0), 0);
  /* ⛔ A granular patch has no single-cycle waveform, so there is nothing
     honest for the screen to draw — the same rule that makes a
     square-only patch show a SQUARE rather than a sine (`restShape`).
     Before this gate, dropping the pitch array freed the two cost units
     that the weak witness needs spare, and 55% of cello plates started
     showing a saturated sine for a grain cloud. ⚠️ Grains want their own
     witness (a cloud, not a wave); until then they get none.
     The same gate covers `shaping: false` — a synth whose oscillator
     never changes shape has nothing for a screen to show, and saturation
     alone rounding the peaks is not a picture worth the space. */
  if (patch.engine !== 'classic' || !patch.shaping) return null;
  if (WITNESS.strong.some(id => controls.includes(id))) return 'strong';
  // ⭐ saturation earns a screen less often AND only on a sparse plate:
  // both readings of Dan's "(and less other things)", composed.
  if (WITNESS.weak.some(id => controls.includes(id)) && cost <= BUDGET - 2) return 'weak';
  return null;
}

/* ── the live manifest ───────────────────────────────────────────────
   `manifestSeed` is deliberately NOT the genome seed. Holding it still
   while the genome varies is v1's workflow (one plate, twelve styles);
   letting each card draw its own is song mode (twelve plates), which is
   how you rate the SYSTEM instead of one arrangement.

   `manifestEdits` holds hand-toggles from the editor, so ticking a box
   survives a re-draw of everything else. */
let manifestSeed = 0x5eed;
let manifestEdits = null;         // null = whatever the sampler drew
function buildManifest(key = currentSongKey, mseed = manifestSeed) {
  const song = SONGS[key];
  const patch = songPatch(key);
  return drawManifest(patch, mseed, manifestEdits || song.controls);
}
let manifest = buildManifest();

/* ════════════════════════════════════════════════════════════════════

const hasPair = (m) => PAIRS.some(p => m.controls.includes(p.a) && m.controls.includes(p.b));

/* Both samplers draw only from what exclusions/bounds have left alive,
   so a ruled-out value never reappears in a batch or a bred child.
   (allowedOptions/floatBounds are declared further down with the lock

/* Pick an enum value. Most genes are a fair draw across their options —
   but a few are a NORM with an exception rather than a menu of equals,
   and `bias` says so. ⚠️ The bias is renormalised over whatever the
   exclusions have left alive, so ruling a value out never silently
   redistributes weight to something you also ruled out.
   ⛔ A sweep ignores this entirely: seeing the whole range is the point
   of a sweep, and a rare value you can't see is one you can't judge. */

  const keep = allowedOptions(gene);
  if (!gene.bias) return keep[Math.floor(rng() * keep.length)];
  const w = keep.map(o => gene.bias[gene.o.indexOf(o)] ?? 0);
  const total = w.reduce((a, b) => a + b, 0);
  if (total <= 0) return keep[Math.floor(rng() * keep.length)];
  let r = rng() * total;
  for (let i = 0; i < keep.length; i++) { r -= w[i]; if (r <= 0) return keep[i]; }

      out[gene.k] = Math.max(lo, Math.min(hi,
        out[gene.k] + (rng() - 0.5) * (gene.max - gene.min) * 0.4));

/* ════════════════════════════════════════════════════════════════════
   5b · THE WAVE TRACE — the witness's actual signal
   ────────────────────────────────────────────────────────────────────
   ⛔ NOT a decorative squiggle. The one thing the screen is being judged
   on is "does this READ at 40pt tall", and a fake trace makes exactly
   that unjudgeable. So the maths is ported from the app:

     · `sampleShapeIdeal` — src/audio/visualShape.js, the idealised
       (non-band-limited) morph the app's own line modes draw, because
       it matches the user's mental model of "square".
     · duty warp, fold, dry/wet mix, peak-normalise — the order
       `WaveShapePreviewView` (SoundDesignViews.swift:33) runs.
     · ⚠️ saturation is the one stage the iOS component does NOT have.
       Dan's note puts the screen on saturation too, so the trace runs a
       soft-clip after the fold — which means adding that stage to the
       shipping view as well, not just here.

const TWO_PI = Math.PI * 2;
function sampleShapeIdeal(norm, p) {
  const sine = Math.sin(TWO_PI * norm);
  const triangle = norm < 0.25 ? 4 * norm : norm < 0.75 ? 2 - 4 * norm : 4 * norm - 4;
  const square = norm < 0.5 ? 1 : -1;
  const saw = norm < 0.5 ? 2 * norm : 2 * norm - 2;
  const anchors = [sine, triangle, square, saw];
  const c = Math.max(0, Math.min(3, p));
  const seg = Math.min(2, Math.floor(c)), f = c - seg;
  return anchors[seg] * (1 - f) + anchors[seg + 1] * f;

  return n < d ? 0.5 * n / d : 0.5 + 0.5 * (n - d) / (1 - d);

  const out = new Array(n);

    let v = dry * (1 - fold) + foldSine(dry, fold) * fold;
    if (sat > 0) v = softClip(v, sat);
    out[i] = v;
    peak = Math.max(peak, Math.abs(v));
  }
  if (peak > 0) for (let i = 0; i < n; i++) out[i] /= peak;

    g.accent === 'none' ? INK(0.85)
    : g.accent === 'voice0' ? voiceColor(0)
    : voiceColor(i);          // voiceColor already wraps the index

  /* ── the one source of per-voice colour ───────────────────────────
     Faders, pans, fine-tune lanes and pane orbs ALL come through here,
     so a voice can never be one colour in the mixer and another in the
     pan row.

     `voiceLit` and `accent` are separate genes and used to be able to
     contradict each other — `accent: voice0` painted every knob one
     voice's colour while the pans stayed a full rainbow, which reads as
     a bug rather than a choice. So:

       voiceLit: gray      → follow the plate's accent, whatever it is
       accent:   voice0    → ONE accent means one colour, voices included
       otherwise           → the spectrum (the `simple` theme's own rule:
                             full-spectrum voices over gray chrome)  */
  const voiceInk = (i) => {
    if (g.voiceLit !== 'lit') return accentFor(0);
    if (g.accent === 'voice0') return voiceColor(0);
    return voiceColor(i);
  };

  /* ── primitives ─────────────────────────────────────────────────── */
  const label = (x, y, text, w) => (g.labels === 'hidden' || !text) ? '' :
    `<text x="${x + w / 2}" y="${y}" text-anchor="middle" font-size="8" font-weight="500"
      letter-spacing="0.5" fill="${INK(0.3)}">${String(text).toUpperCase()}</text>`;
  const readout = (x, y, text, w) => (g.readouts !== 'on' || text == null) ? '' :
    `<text x="${x + w / 2}" y="${y}" text-anchor="middle" font-size="9" fill="${HI(0.7)}"
      style="font-variant-numeric:tabular-nums">${text}</text>`;

  const polar = (cx, cy, deg, rad) => {
    const rd = (deg - 90) * Math.PI / 180;
    return [cx + rad * Math.cos(rd), cy + rad * Math.sin(rd)];
  };
  const arcPath = (cx, cy, from, to, rad) => {
    const [x1, y1] = polar(cx, cy, from, rad), [x2, y2] = polar(cx, cy, to, rad);
    return `M ${x1} ${y1} A ${rad} ${rad} 0 ${Math.abs(to - from) > 180 ? 1 : 0} 1 ${x2} ${y2}`;
  };

  /* ── the knob vocabulary ──────────────────────────────────────────
     All eight run the same 270° travel (−135°…135°) at radius `r`, so
     they are swappable anywhere a knob is drawn and a sweep of
     `knobStyle` is a straight comparison.

       ring       track arc + radial tick — the PanPot grammar
       ringValue  …plus a filled arc showing the value
       cap        the knob BODY: circle outline + pointer centre→rim
       scale      Braun dial — discrete marks round the arc, live one lit
       wedge      a solid annulus sector; the boldest of the set
       segments   the arc split into 9 cells, lit up to the value
       needle     a meter pointer crossing the whole face

     `plain` forces the quiet form. The inner ring of a concentric pair
     always takes it: the pair needs a hierarchy, so the primary control
     wears the expressive style and the secondary stays out of its way. */
  function ring(cx, cy, r, value, color, sw, plain, bipolar) {
    const a0 = -135, a1 = 135, av = a0 + value * (a1 - a0);
    const style = plain ? 'ring' : g.knobStyle;
    /* Where a filled style STARTS. Normally the beginning of travel; on
       a bipolar control with `panFill: noon` it is the middle, so the
       fill grows out of centre in whichever direction the value went.
       Drawn low→high so a leftward fill sweeps back out of the middle
       rather than the long way round. */
    const from = (bipolar && g.panFill === 'noon') ? 0 : a0;
    const fillArc = (rad, width) => {
      const lo = Math.min(from, av), hi = Math.max(from, av);
      if (hi - lo < 1.5) return '';
      return `<path d="${arcPath(cx, cy, lo, hi, rad)}" fill="none"
        stroke="${dim(color, style === 'band' ? 60 : 78)}" stroke-width="${width}" stroke-linecap="round"/>`;
    };
    const track = (rad, w) =>
      `<path d="${arcPath(cx, cy, a0, a1, rad)}" fill="none" stroke="${TRACK}" stroke-width="${w}" stroke-linecap="round"/>`;
    const tick = (from, to, col, w) => {
      const [ix, iy] = polar(cx, cy, av, from), [ox, oy] = polar(cx, cy, av, to);
      return `<line x1="${ix}" y1="${iy}" x2="${ox}" y2="${oy}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
    };
    let out = '';
    switch (style) {
      case 'ringValue':
        out += track(r, sw);
        out += fillArc(r, sw);
        out += tick(r * 0.75, r * 1.25, color, sw);
        break;

      case 'cap':
        out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${INK(0.22)}" stroke-width="1"/>`;
        out += tick(r * 0.12, r * 0.84, color, sw);
        break;

      case 'dot': {
        // the classic Braun cap: a body with a single dot marker rather
        // than a line. ⚠️ deliberately breaks the theme's no-dots rule —
        // it is here to be judged, not because it already fits
        out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${INK(0.22)}" stroke-width="1"/>`;
        const [dx, dy] = polar(cx, cy, av, r * 0.6);
        out += `<circle cx="${dx}" cy="${dy}" r="${sw * 1.05}" fill="${color}"/>`;
        break;
      }

      case 'band': {
        /* The iOS bottom knob band's dial, ported straight from
           `SourceDial.swift`:
             · an OPAQUE black disc under the ring — the band's knobs sit
               over live faces, and an unfilled circle let the visuals
               read through the numeral
             · a 270° track at ink-soft 0.10, stroke = 10% of the
               DIAMETER, floored at 3 — it grows with the circle (the
               2026-08-10 PanPot-parity pass) rather than sitting at a
               fixed hairline
             · the value arc in the voice colour at 0.6
             · ⛔ NO tick and NO cap dot. The cap orb retired 2026-08-13
               with the fader ball and the pan orb: the arc's own length
               plus the centre numeral say the value between them.
           The numeral itself is drawn by knobBlock, since it sits inside
           the circle rather than under it. */
        const bw = Math.max(3, r * 0.2);
        out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${GROUND}"/>`;
        out += `<path d="${arcPath(cx, cy, a0, a1, r)}" fill="none" stroke="${TRACK}" stroke-width="${bw}" stroke-linecap="round"/>`;
        out += fillArc(r, bw);
        break;
      }

      case 'scale': {
        const N = 11, active = Math.round(value * (N - 1));
        for (let i = 0; i < N; i++) {
          const a = a0 + (i / (N - 1)) * 270, on = i === active;
          const [x1, y1] = polar(cx, cy, a, r);
          const [x2, y2] = polar(cx, cy, a, r + (on ? 5 : 2.5));
          out += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
            stroke="${on ? color : INK(0.22)}" stroke-width="${on ? sw : 1}" stroke-linecap="round"/>`;
        }
        out += tick(0, r * 0.62, color, sw);
        break;
      }

      case 'wedge':
        out += track(r, 1);
        out += fillArc(r * 0.72, r * 0.55).replace('stroke-linecap="round"', '');
        break;

      case 'segments': {
        const N = 9, pad = 2.5;
        const lo = Math.min(from, av), hi = Math.max(from, av);
        for (let i = 0; i < N; i++) {
          const s0 = a0 + (i / N) * 270 + pad, s1 = a0 + ((i + 1) / N) * 270 - pad;
          const mid = a0 + ((i + 0.5) / N) * 270;
          const lit = mid >= lo && mid <= hi;
          out += `<path d="${arcPath(cx, cy, s0, s1, r)}" fill="none"
            stroke="${lit ? dim(color, 88) : TRACK}" stroke-width="${sw}" stroke-linecap="butt"/>`;
        }
        break;
      }

      case 'needle':
        out += track(r, 1);
        out += tick(-r * 0.34, r * 1.04, color, sw);
        break;

      default:   // 'ring'
        out += track(r, sw);
        out += tick(r * 0.75, r * 1.25, color, sw);
    }
    return out;
  }

  /* ── block builders (each returns {w, h, draw(x,y,scale)}) ──────── */
  const KNOB = 44 * g.knobSize;
  const labelH = g.labels === 'hidden' ? 4 : 12;
  const readH  = g.readouts === 'on' ? 11 : 0;

  /* `band` moves the value numeral INSIDE the circle, so its block is a
     row shorter than the others — the readout below would be the same
     number twice. */
  const bandStyle = g.knobStyle === 'band';
  function centreNumeral(cx, cy, s, text) {
    if (!text || g.readouts !== 'on') return '';
    // SourceDial's readoutFont: semibold, compressed, monospaced digits,
    // scaled off the dial and floored so it never goes wiry.
    const fs = Math.max(9, Math.min(13, s * 0.26));
    return `<text x="${cx}" y="${cy + fs * 0.35}" text-anchor="middle" font-size="${fs}"
      font-weight="600" letter-spacing="-0.3" fill="${HI(0.9)}"
      style="font-variant-numeric:tabular-nums">${text}</text>`;
  }

  function knobBlock(pid, colorIdx) {
    const p = PARAMS[pid], size = KNOB;
    const h = size + labelH + (bandStyle ? 0 : readH);
    return {
      kind: 'knob', pid, w: size, h, family: p.family,
      draw: (x, y, sc = 1) => {
        const s = size * sc, cx = x + s / 2, cy = y + s / 2, r = s * 0.38;
        const color = accentFor(colorIdx);
        let out = ring(cx, cy, r, p.def, color, sc > 1.3 ? 3 : 2);
        if (bandStyle) out += centreNumeral(cx, cy, s, p.fmt ? p.fmt(p.def) : null);
        out += label(x, y + s + (labelH ? 8 : 0), p.label, s);
        if (!bandStyle) {
          out += readout(x, y + s + (labelH ? 8 : 0) + (labelH ? 11 : 9), p.fmt ? p.fmt(p.def) : null, s);
        }
        return out;
      },
    };
  }

  /* concentric pair: cutoff outer, peak inner — one body, two rings */
  function concentricBlock(aid, bid, name, colorIdx) {
    const A = PARAMS[aid], B = PARAMS[bid], size = KNOB * 1.18;
    const h = size + labelH + readH;
    return {
      kind: 'pair', pid: aid, w: size, h, family: A.family,
      draw: (x, y, sc = 1) => {
        const s = size * sc, cx = x + s / 2, cy = y + s / 2;
        const color = accentFor(colorIdx);
        let out = ring(cx, cy, s * 0.40, A.def, color, sc > 1.3 ? 3 : 2);
        // `plain` — the peak stays a quiet track+tick whatever style the
        // cutoff wears, so the pair reads as primary + secondary rather
        // than two controls competing at different radii.
        out += ring(cx, cy, s * 0.20, B.def, dim(color, 62), 2, true);
        out += label(x, y + s + (labelH ? 8 : 0), name, s);
        out += readout(x, y + s + (labelH ? 8 : 0) + (labelH ? 11 : 9),
          A.fmt ? `${A.fmt(A.def)}·${B.fmt(B.def)}` : null, s);
        return out;
      },
    };
  }

  /* ── the remix mark ───────────────────────────────────────────────
     What "give me another one" looks like. Four readings of the same
     action, behind the `remixGlyph` gene:

       dots     two pips — abstract, quiet, says nothing specific
       dice     a real die face: rounded square + three pips. Names the
                mechanism (this app already calls it rolling dice)
       shuffle  the media-player shuffle: two paths swapping places.
                Says re-ARRANGE rather than re-ROLL — closer to what a
                remix does to a chord you already have
       cycle    a circular arrow — "again", the weakest claim of the four

     All drawn in the theme's own grammar: round-capped lines, no fills
     except the die pips, which are the one place a dot is the subject
     rather than an indicator. */
  function remixMark(cx, cy, r, color) {
    const sw = 1.8;
    const line = (x1, y1, x2, y2) =>
      `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
    switch (g.remixGlyph) {
      case 'dice': {
        /* A real face, not an abstract pair of pips — and the face is
           drawn from the seed, so the die on screen has actually been
           rolled. 1 and 4 are left out: 1 reads as a bullet and 4 as a
           square of dots, neither of which says "die" at 18pt. */
        const FACES = {
          2: [[-1, -1], [1, 1]],
          3: [[-1, -1], [0, 0], [1, 1]],
          5: [[-1, -1], [1, -1], [0, 0], [-1, 1], [1, 1]],
          6: [[-1, -1], [-1, 0], [-1, 1], [1, -1], [1, 0], [1, 1]],
        };
        const counts = [2, 3, 5, 6];
        const n = counts[Math.floor(rs(41) * counts.length) % counts.length];
        // ⛔ No die outline (Dan): the pips alone carry it. The button's
        // own wash is already a container, so a box inside a circle was
        // two enclosures doing one job.
        const p = r * 0.38, pr = n === 6 ? 1.35 : 1.65;
        let out = '';
        for (const [px, py] of FACES[n]) {
          out += `<circle cx="${cx + px * p}" cy="${cy + py * p}" r="${pr}" fill="${color}"/>`;
        }
        return out;
      }
      case 'shuffle': {
        /* The media-player shuffle: two lanes that cross and swap. Both
           arrowheads sit on the RIGHT so the glyph has a direction —
           symmetric heads at both ends read as "swap", which is a
           different verb. Heads are chevrons on the path's own
           tangent (horizontal at the tip), never a filled triangle:
           the theme has no filled marks on controls. */
        const w = r * 0.74, h = r * 0.36;
        const k = r * 0.26, kx = k * 0.86, ky = k * 0.52;
        let out = '';
        for (const dir of [1, -1]) {
          const ty = cy + h * dir, tx = cx + w;
          out += `<path d="M ${cx - w} ${cy - h * dir} L ${cx - w * 0.42} ${cy - h * dir}
            L ${cx + w * 0.30} ${ty} L ${tx - kx * 0.55} ${ty}"
            fill="none" stroke="${color}" stroke-width="${sw}"
            stroke-linecap="round" stroke-linejoin="round"/>`;
          out += line(tx - kx, ty - ky, tx, ty) + line(tx - kx, ty + ky, tx, ty);
        }
        return out;
      }
      case 'cycle': {
        // the head sits ON the arc's end angle, chevroned across the
        // tangent — an arrowhead pointing anywhere else reads as a nick
        const rr = r * 0.62, end = 380;
        const [tx, ty] = polar(cx, cy, end, rr);
        const [b1x, b1y] = polar(cx, cy, end - 16, rr + 3.4);
        const [b2x, b2y] = polar(cx, cy, end - 16, rr - 3.4);
        return `<path d="${arcPath(cx, cy, 60, end, rr)}" fill="none" stroke="${color}"
            stroke-width="${sw}" stroke-linecap="round"/>` +
          line(b1x, b1y, tx, ty) + line(b2x, b2y, tx, ty);
      }
      default:   // 'dots'
        return `<circle cx="${cx - r * 0.3}" cy="${cy - r * 0.3}" r="1.9" fill="${color}"/>
                <circle cx="${cx + r * 0.3}" cy="${cy + r * 0.3}" r="1.9" fill="${color}"/>`;
    }
  }

  /* action button; `timer` draws the auto-cycle ring around it */
  /* `timer` is now a BOOLEAN off `patch.cycle`, not a param id: the
     dwell knob went to the back face (turning it changes nothing now)
     but its COUNTDOWN stayed, because a readout is not a control. The
     ring is still drawn on the thing it re-clicks, which was the whole
     point of v1's timerRing pair. */
  function buttonBlock(pid, timer, colorIdx) {
    const p = PARAMS[pid], T = timer ? PARAMS.autoCycle : null;
    /* The CELL is a knob's cell; the BUTTON inside it stays smaller.
       Sizing the block to the glyph made remix and tune sit on a
       tighter grid than the knobs beside them, so a row of controls
       had two different rhythms and their labels never lined up. This
       is padding only — the drawn button is the size it was. */
    const cell = KNOB;
    const size = KNOB * (T ? 1.05 : 0.86);
    const h = cell + labelH + (bandStyle && !T ? 0 : readH);
    return {
      kind: 'button', pid, w: cell, h, family: p.family,
      draw: (x, y, sc = 1) => {
        const c = cell * sc, s = size * sc;
        const cx = x + c / 2, cy = y + c / 2, r = s * 0.34;
        const color = accentFor(colorIdx);
        let out = '';
        if (g.chipStyle === 'wash') out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${INK(0.12)}"/>`;
        // the timer IS the ring: how far to the next auto-remix. Skipped
        // when `cycleReadout: bar` moves that job to the capsule up top.
        if (T && g.cycleReadout !== 'bar') {
          out += `<path d="${arcPath(cx, cy, -135, 135, r + 5)}" fill="none" stroke="${TRACK}" stroke-width="2" stroke-linecap="round"/>`;
          out += `<path d="${arcPath(cx, cy, -135, -135 + CYCLE_PROGRESS * 270, r + 5)}" fill="none" stroke="${dim(color, 70)}" stroke-width="2" stroke-linecap="round"/>`;
        }
        // glyph: dice = the `remixGlyph` gene, align = 3 converging
        // lines, spread = 3 diverging
        if (p.glyph === 'dice') {
          out += remixMark(cx, cy, r, color);
        } else if (p.glyph === 'align') {
          // Three VERTICAL lines, equal height and evenly spaced (Dan).
          // Vertical is the right axis for this button: the spectrum bar
          // above draws each voice as a vertical stem, so "tune" shows
          // those stems standing level — horizontal lines read as a list.
          // Equal heights ARE the message: aligned.
          const hh = r * 0.52;
          for (const dx of [-0.42, 0, 0.42]) {
            out += `<line x1="${cx + r * dx}" y1="${cy - hh}" x2="${cx + r * dx}" y2="${cy + hh}"
              stroke="${color}" stroke-width="2" stroke-linecap="round"/>`;
          }
        } else {   // spread
          out += `<line x1="${cx - r * 0.55}" y1="${cy - r * 0.45}" x2="${cx + r * 0.55}" y2="${cy - r * 0.45}" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
                  <line x1="${cx - r * 0.3}" y1="${cy + r * 0.1}" x2="${cx + r * 0.3}" y2="${cy + r * 0.1}" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
                  <line x1="${cx - r * 0.7}" y1="${cy + r * 0.55}" x2="${cx + r * 0.7}" y2="${cy + r * 0.55}" stroke="${color}" stroke-width="2" stroke-linecap="round"/>`;
        }
        // label + readout hang off the CELL, so they sit on the same
        // baseline as a knob's in the same row
        out += label(x, y + c + (labelH ? 8 : 0), p.label, c);
        out += readout(x, y + c + (labelH ? 8 : 0) + (labelH ? 11 : 9), T ? T.fmt(T.def) : null, c);
        return out;
      },
    };
  }

  /* ⛔ v1's `autoBlock` (auto drawn IN the pane) and `stackBlock` (which
     existed to stack it under remix) are both cut: auto is not
     immediate, so it cannot be a pane control. It stays in the rail. */

  function segmentBlock(pid) {
    const p = PARAMS[pid], cw = 32, ch = 18;
    const w = p.opts.length * (cw + 3), h = ch + labelH;
    return {
      kind: 'segment', pid, w, h, family: p.family,
      draw: (x, y) => {
        let out = '';
        p.opts.forEach((o, i) => {
          const cx = x + i * (cw + 3);
          if (i === p.def && g.chipStyle === 'wash') out += `<rect x="${cx}" y="${y}" width="${cw}" height="${ch}" rx="4" fill="${INK(0.18)}"/>`;
          out += `<text x="${cx + cw / 2}" y="${y + ch / 2 + 3}" text-anchor="middle" font-size="8" font-weight="500"
            letter-spacing="0.5" fill="${i === p.def ? HI(0.9) : INK(0.35)}">${o.toUpperCase()}</text>`;
        });
        out += label(x, y + ch + 10, p.label, w);
        return out;
      },
    };
  }

  /* A toggle: a line + a travelling cap. It lights in the accent when
     on, because everything left on the plate IS an instrument control —
     ⛔ v1's quiet `view` tier went out with the view family, which had
     exactly one member (a visualiser toggle) and no business competing
     with a control that changes the sound. */
  function toggleBlock(pid, colorIdx) {
    const p = PARAMS[pid], w = 52, h = 14 + labelH;
    const quiet = false;
    return {
      kind: 'toggle', pid, w, h, family: p.family,
      draw: (x, y) => {
        const tw = 26, cy = y + 7;
        const lit = quiet ? INK(0.7) : accentFor(colorIdx ?? 0);
        let out = `<line x1="${x + w / 2 - tw / 2}" y1="${cy}" x2="${x + w / 2 + tw / 2}" y2="${cy}"
          stroke="${TRACK}" stroke-width="3" stroke-linecap="round"/>`;
        const kx = x + w / 2 + (p.def ? tw / 2 - 4 : -tw / 2 + 4);
        out += `<line x1="${kx - 3}" y1="${cy}" x2="${kx + 3}" y2="${cy}" stroke="${p.def ? lit : INK(0.3)}" stroke-width="3" stroke-linecap="round"/>`;
        out += label(x, y + 14 + 8, p.label, w);
        return out;
      },
    };
  }

  /* A single horizontal slider — the VerticalFader's grammar laid flat:
     capsule track, capsule fill, and the fill's own rounded end IS the
     handle. No ball, per the theme. */
  function sliderBlock(pid, colorIdx) {
    const p = PARAMS[pid], w = 66, sw = 4;
    const h = sw + 10 + labelH + readH;
    return {
      kind: 'slider', pid, w, h, family: p.family,
      draw: (x, y) => {
        const cy = y + sw, color = accentFor(colorIdx);
        let out = `<line x1="${x}" y1="${cy}" x2="${x + w}" y2="${cy}"
          stroke="${TRACK}" stroke-width="${sw}" stroke-linecap="round"/>`;
        out += `<line x1="${x}" y1="${cy}" x2="${x + Math.max(sw, w * p.def)}" y2="${cy}"
          stroke="${color}" stroke-width="${sw}" stroke-linecap="round"/>`;
        out += label(x, cy + (labelH ? 14 : 8), p.label, w);
        out += readout(x, cy + (labelH ? 25 : 15), p.fmt ? p.fmt(p.def) : null, w);
        return out;
      },
    };
  }

  function stepsBlock(pid) {
    const p = PARAMS[pid], w = 50, h = 40 + labelH;
    return {
      kind: 'steps', pid, w, h, family: p.family,
      draw: (x, y) => {
        let out = '';
        const bw = 3, gap = (w - 14) / (p.def - 1);
        for (let i = 0; i < p.def; i++) {
          const bh = 7 + i * 5.5;
          out += `<rect x="${x + 7 + i * gap - bw / 2}" y="${y + 34 - bh}" width="${bw}" height="${bh}" rx="1.5"
            fill="${i < 2 ? INK(0.8) : TRACK}"/>`;
        }
        out += label(x, y + 34 + 10, p.label, w);
        return out;
      },
    };
  }

  /* ── the per-voice SET: one geometry for pans and mutes ──────────
     Three readings of a per-voice set — square · horizontal line ·
     vertical line — and ⭐ ONE geometry behind both, so two sets on the
     same plate line up cell for cell: same cell pitch, same mark size,
     same label baseline, identical footprint for a given voice count.
     Before this the mutes sat on a 19pt pitch and the pans on 22, which
     meant a matched pair still failed to align.

     ⚠️ `square` degenerates honestly at low counts: 2 voices is a pair
     either way, and 3 is an L rather than a square. Forcing a 2×2 with a
     hole would be a grid lying about how many voices there are. */
  /* ⚠️ Scaled by `knobSize` like everything else. These were fixed at
     20/15 while `KNOB` grew, so at the top of the range the knobs
     ballooned and the pan and mute sets sat there unchanged — the plate
     stopped reading as one instrument and started reading as two. The
     gene is called knobSize but it is really the plate's control scale,
     and a per-voice mark is a control. */
  const VCELL = 20 * g.knobSize;   // the per-voice cell, shared
  const VMARK = 15 * g.knobSize;   // the mark drawn inside it

  function voiceGrid(layout, n) {
    const cols = layout === 'row' ? n : layout === 'column' ? 1 : Math.ceil(Math.sqrt(n));
    return { cols, rows: Math.ceil(n / cols) };
  }

  /* ⚠️ The block declares the width it REALLY occupies, caption included.
     A `column` is one cell wide — about 20pt — while its caption is
     nearer 24, so two of them placed a `blockGap` apart had captions
     almost touching while the marks looked far apart: the packer was
     spacing the grids, not the blocks. Measuring the caption fixes the
     padding and the centring at once, because the grid is then centred
     inside the true width rather than flush against its left edge. */
  const captionW = (text) => (g.labels === 'hidden' || !text) ? 0 : String(text).length * 5.9 + 2;

  function voiceSetBlock(pid, voices, layout, kind, mark) {
    const p = PARAMS[pid];
    const { cols, rows } = voiceGrid(layout, voices);
    const gridW = cols * VCELL;
    /* ⚠️ A small inset so the grid never sits flush against the block's
       edge. Two per-voice sets side by side were separated only by the
       generic `blockGap`, which reads as tight when both sides of it are
       a dense field of marks rather than a lone knob on a big cell. It
       scales with the cell, so the breathing room holds at every
       `knobSize`. */
    const inset = VCELL * 0.18;
    const w = Math.max(gridW + inset * 2, captionW(p.label));
    const h = rows * VCELL + labelH;
    const pad = (w - gridW) / 2;          // ⭐ the grid centred in the block
    return {
      kind, pid, w, h, family: p.family,
      draw: (x, y) => {
        let out = '';
        for (let i = 0; i < voices; i++) {
          const cx = x + pad + (i % cols) * VCELL + VCELL / 2;
          const cy = y + Math.floor(i / cols) * VCELL + VCELL / 2;
          out += mark(cx, cy, i);
        }
        out += label(x, y + rows * VCELL + 8, p.label, w);
        return out;
      },
    };
  }

  /* The switch itself is a filled cell when live and an outline when
     muted, because "muted" is the state that should look like an
     absence. No cross, no slash: the theme has no filled marks, and an
     empty cell already says nothing-coming-through. */
  function muteCell(cx, cy, size, on, color) {
    const x = cx - size / 2, y = cy - size / 2;
    return on
      ? `<rect x="${x}" y="${y}" width="${size}" height="${size}" rx="3" fill="${color}" opacity="0.85"/>`
      : `<rect x="${x + 0.5}" y="${y + 0.5}" width="${size - 1}" height="${size - 1}" rx="3"
           fill="none" stroke="${INK(0.28)}" stroke-width="1"/>`;
  }
  const muteOn = (i) => rs(i * 19 + 7) > 0.28;

  /* ⭐ ONE place decides both per-voice shapes, so pan and mute can never
     disagree by accident — the same discipline as `voiceInk` being the
     single source of per-voice colour. Under `shapeLink: matched` (the
     norm) the pan simply takes the mute's shape, direction included. */
  const muteShape = g.mutePlace === 'cluster' ? 'square' : g.mutePlace;
  const panShape = (g.shapeLink !== 'free' && present.has('mutes')) ? muteShape : g.panPlace;

  const voiceMutesBlock = (pid, voices) =>
    voiceSetBlock(pid, voices, muteShape, 'voiceMutes',
      (cx, cy, i) => muteCell(cx, cy, VMARK, muteOn(i), voiceInk(i)));

  /* ── THE WAVE SCREEN (the witness) ────────────────────────────────
     One period (or two) of the real morphed, folded, saturated waveform
     — the same picture the shape/fold menu shows, at faceplate size.

     It is not a control and never appears in a manifest: it is drawn
     because the plate carries the controls that move it. Its VALUES come
     from those controls, so a plate with no fold knob shows an unfolded
     wave — the screen can never claim more than the plate can do. */
  function scopeBlock(present, strength, sizeMul) {
    /* ⚠️ No shape KNOB does not mean no shape. A square-only patch has
       nothing to morph, which is precisely why it has no shape control —
       and drawing a sine there would be the screen lying about the
       synth. So the resting shape comes from the PATCH, and the knob
       only overrides it when the plate actually carries one. */
    const anchor = { sine: 0, triangle: 1 / 3, square: 2 / 3, saw: 1 };
    const restShape = patch.waves.length === 1 ? (anchor[patch.waves[0]] ?? 0) : PARAMS.shape.def;
    const vals = {
      shape: present.has('shape') ? PARAMS.shape.def : restShape,
      width: present.has('width') ? PARAMS.width.def : 0.5,
      fold:  present.has('fold')  ? PARAMS.fold.def  : 0,
      sat:   present.has('saturation') ? PARAMS.saturation.def : 0,
    };
    const cycles = g.scopeCycles === 'two' ? 2 : 1;
    /* ⭐ The size INVERSION: the weak witness (saturation alone) is drawn
       BIGGER. A subtle change needs more pixels to be legible, while a
       silhouette-transforming one survives at any size. */
    const bigger = strength === 'weak' ? 1.25 : 1;
    /* `banner` and `hero` claim a SHARE OF THE ZONE, not a multiple of
       the inline size — "spanning the plate's width" has to mean the
       plate, or the gene is just three sizes of the same small box. */
    const w = sizeMul > 1
      ? Math.round(zone.w * (sizeMul >= 2.5 ? 0.94 : 0.78))
      : Math.round(76 * bigger);
    const h = Math.round((sizeMul > 1 ? w * (sizeMul >= 2.5 ? 0.42 : 0.30) : 38 * bigger));
    const N = 150;
    return {
      kind: 'scope', pid: 'scope', w, h: h + labelH, family: 'tone', witness: true,
      draw: (x, y, sc = 1) => {
        const ww = w * sc, hh = h * sc;
        let out = '';
        if (g.scopeFrame === 'fill') {
          out += `<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="4" fill="${INK(0.05)}"/>`;
        } else if (g.scopeFrame === 'hairline') {
          out += `<rect x="${x + 0.5}" y="${y + 0.5}" width="${ww - 1}" height="${hh - 1}" rx="4"
            fill="none" stroke="${INK(0.10)}" stroke-width="1"/>`;
        }
        const mid = y + hh / 2, half = (hh - 6) / 2;
        out += `<line x1="${x + 3}" y1="${mid}" x2="${x + ww - 3}" y2="${mid}" stroke="${INK(0.10)}" stroke-width="1"/>`;
        const pts = waveTrace(vals, N, cycles);
        let d = '';
        for (let i = 0; i < N; i++) {
          const px = x + 3 + (i / (N - 1)) * (ww - 6);
          const py = mid - pts[i] * half;
          d += `${i ? ' L' : 'M'} ${px.toFixed(1)} ${py.toFixed(1)}`;
        }
        // the app's own trace weight: ink 0.75, round caps, 1.5 at 1×
        out += `<path d="${d}" fill="none" stroke="${INK(0.75)}" stroke-width="${(1.5 * sc).toFixed(2)}"
          stroke-linecap="round" stroke-linejoin="round"/>`;
        out += label(x, y + hh + 9, 'wave', ww);
        return out;
      },
    };
  }

  /* ── the pan mark ─────────────────────────────────────────────────
     A pan is a knob, so it wears whatever `knobStyle` the knobs wear —
     it just runs bipolar. Delegating to `ring()` is the whole
     implementation: the pan's −1…1 maps onto the same 270° travel, and
     `panFill: noon` makes the filled styles grow out of the middle
     instead of out of the start.

     ⛔ No centre pip (Dan): the fill starting at the middle IS the
     centre marker, and on the unfilled styles the plate is already a
     grid of knobs — a lone dot floating over one of them was a second
     vocabulary for no gain. */
  function panMark(cx, cy, pr, pan, color) {
    return ring(cx, cy, pr, (pan + 1) / 2, color, 2, false, true);
  }

  /* ── the mixer CLUSTER ────────────────────────────────────────────
     level + pan for every voice, positioned by `mixerScatter`:

       0   a strict console — even columns, equal fader heights, each
           pan squarely beneath its own fader
       1   a composition — the faders take the spectrum bar's own stem
           spacing (so a voice sits where its pitch sits), their heights
           vary, and each pan swings out to a seeded angle and distance
           around its fader's foot instead of always hanging below it

     The pan never leaves its fader's neighbourhood at any scatter: it
     orbits the foot rather than being thrown somewhere else, so which
     pan belongs to which voice survives the scattering. That is the
     whole difference between a composition and a mess.

     ⭐ v2: under `mutePlace: cluster` the voice's MUTE joins it, sitting
     at the head of its own fader — so a voice's whole strip (level, pan,
     mute) is one thing that travels together. That is the coherence half
     of Dan's open question; `square` and `row` are the other half. */
  function clusterBlock(voices, withMutes) {
    const s = g.mixerScatter;
    const W = Math.max(voices * 26, zone.w * (0.55 + 0.45 * s));
    /* ⭐ One mark size everywhere: the strip's mute cap and its pan
       take the SAME `VMARK` as a standalone set, so a voice reads as
       head-square · track · foot-circle at one scale, and a cluster on
       one plate matches a loose set on another. */
    const baseH = 60, panR = VMARK / 2, panGap = 15;
    const mS = VMARK, mGap = 5;               // the in-strip mute cap

    const stems = stemXs(voices, W);
    const units = [];
    for (let i = 0; i < voices; i++) {
      const even = W * (i + 0.5) / voices;
      const fx = Math.max(panR + 2, Math.min(W - panR - 2,
        even + (stems[i] - even) * s + (rs(i * 31 + 4) - 0.5) * s * 26));
      const fh = baseH * (1 - s * 0.35 + rs(i * 13 + 6) * s * 0.7);
      const fy = (rs(i * 7 + 11) - 0.5) * s * 34;          // vertical drift
      // the pan orbits the fader's foot: straight below at s=0, out to a
      // seeded bearing as s→1
      const bearing = 90 + (rs(i * 23 + 9) * 360 - 90) * s;
      const dist = panGap * (1 + (rs(i * 29 + 3) * 1.5 - 0.35) * s);
      const rad = bearing * Math.PI / 180;
      units.push({
        i, fx, fy, fh,
        px: fx + Math.cos(rad) * dist * 0.95,
        py: fy + fh + Math.sin(rad) * dist,
        pan: (rs(i * 17 + 1) - 0.5) * 2,
        val: 0.25 + rs(i * 5) * 0.65,
      });
    }
    // normalise to the real bounding box so the layout packs it honestly
    const fw = g.faderW;
    // the mute sits at the HEAD of its fader — above the track, so the
    // strip reads top-down as "is it on · how loud · where"
    const mTop = withMutes ? mS + mGap : 0;
    const minX = Math.min(...units.map(u => Math.min(u.fx - Math.max(fw, withMutes ? mS : 0) / 2, u.px - panR - 1)));
    const maxX = Math.max(...units.map(u => Math.max(u.fx + Math.max(fw, withMutes ? mS : 0) / 2, u.px + panR + 1)));
    const minY = Math.min(...units.map(u => Math.min(u.fy - mTop, u.py - panR - 1)));
    const maxY = Math.max(...units.map(u => Math.max(u.fy + u.fh, u.py + panR + 1)));
    const w = maxX - minX, h = (maxY - minY) + labelH;

    return {
      kind: 'cluster', pid: 'levels', w, h, family: 'voices',
      members: withMutes ? ['levels', 'pans', 'mutes'] : ['levels', 'pans'],
      draw: (x, y) => {
        let out = '';
        for (const u of units) {
          const color = voiceInk(u.i);
          const cx = x + u.fx - minX, ty = y + u.fy - minY;
          if (withMutes) out += muteCell(cx, ty - mGap - mS / 2, mS, muteOn(u.i), color);
          out += `<rect x="${cx - fw / 2}" y="${ty}" width="${fw}" height="${u.fh}" rx="${fw / 2}" fill="${TRACK}"/>`;
          const filled = Math.max(fw, u.fh * u.val);
          out += `<rect x="${cx - fw / 2}" y="${ty + u.fh - filled}" width="${fw}" height="${filled}"
            rx="${fw / 2}" fill="${color}" opacity="0.92"/>`;
          out += panMark(x + u.px - minX, y + u.py - minY, panR, u.pan, dim(color, 100));
        }
        out += label(x, y + (maxY - minY) + 9, 'mix', w);
        return out;
      },
    };
  }

  /* pans on their own — a plain row of PanPot arcs */
  /* Pans standing alone (no mixer to join) take the SAME three layouts
     as the mutes, off the same geometry — `panPlace`, or the mute's own
     shape under `shapeLink: matched`. Inside the cluster this is inert:
     there the pan belongs to its fader's foot, which is the whole point
     of the cluster. */
  const voicePansBlock = (pid, voices) =>
    voiceSetBlock(pid, voices, panShape, 'voicePans',
      (cx, cy, i) => panMark(cx, cy, VMARK / 2, (rs(i * 17 + 1) - 0.5) * 2, voiceInk(i)));

  function voiceFadersBlock(pid, voices) {
    const p = PARAMS[pid], trackH = 74;
    const lenOf = (i) => g.faderLen === 'varied' ? 0.6 + rs(i * 11 + 2) * 0.45 : 1;
    const maxLen = Math.max(...Array.from({ length: voices }, (_, i) => lenOf(i)));
    const val = (i) => 0.25 + rs(i * 5) * 0.65;

    if (g.faderOrient === 'horizontal') {
      const rowH = 13, w = Math.max(voices * 16, 84), h = rowH * voices + labelH;
      return {
        kind: 'voiceFaders', pid, w, h, family: p.family,
        draw: (x, y) => {
          let out = '';
          for (let i = 0; i < voices; i++) {
            const cy = y + rowH * (i + 0.5), fw = g.faderW, len = w * lenOf(i) / maxLen;
            out += `<line x1="${x}" y1="${cy}" x2="${x + len}" y2="${cy}" stroke="${TRACK}" stroke-width="${fw}" stroke-linecap="round"/>`;
            out += `<line x1="${x}" y1="${cy}" x2="${x + Math.max(fw, len * val(i))}" y2="${cy}"
              stroke="${voiceInk(i)}" stroke-width="${fw}" stroke-linecap="round"/>`;
          }
          out += label(x, y + rowH * voices + 9, p.label, w);
          return out;
        },
      };
    }

    const laneW = 20, w = laneW * voices, h = trackH + labelH + 4;
    return {
      kind: 'voiceFaders', pid, w, h, family: p.family,
      draw: (x, y) => {
        let out = '';
        for (let i = 0; i < voices; i++) {
          const cx = x + laneW * (i + 0.5), fw = g.faderW;
          const color = voiceInk(i);
          const len = trackH * lenOf(i) / maxLen, top = y + (trackH - len), v = val(i);
          out += `<rect x="${cx - fw / 2}" y="${top}" width="${fw}" height="${len}" rx="${fw / 2}" fill="${TRACK}"/>`;
          out += `<rect x="${cx - fw / 2}" y="${top + len * (1 - v)}" width="${fw}" height="${len * v}" rx="${fw / 2}"
            fill="${color}" opacity="0.92"/>`;
        }
        out += label(x, y + trackH + 10, p.label, w);
        return out;
      },
    };
  }

  /* ── manifest → blocks, honouring the declared pairs ─────────────── */
  const consumed = new Set();
  const blocks = [];
  let colorIdx = 0;

  /* The mute joins the mixer strip only when there IS a mixer to join —
     `cluster` on a song with no faders falls back to the square, rather
     than silently dropping the control.
     ⚠️ `pairStyle: flatten` is one of those cases: it stops the cluster
     from forming at all, so a mute handed to a cluster that never got
     built would disappear off the plate entirely. */
  const mutesInCluster = present.has('mutes') && g.mutePlace === 'cluster'
    && g.pairStyle === 'declared' && present.has('levels') && present.has('pans');
  if (mutesInCluster) consumed.add('mutes');

  if (g.pairStyle === 'declared') {
    for (const pr of PAIRS) {
      if (!present.has(pr.a) || !present.has(pr.b)) continue;
      if (consumed.has(pr.a) || consumed.has(pr.b)) continue;
