      consumed.add(pr.a); consumed.add(pr.b);
      if (pr.style === 'cluster') {
        blocks.push(clusterBlock(manifest.voices, mutesInCluster));
      } else if (pr.style === 'concentric') {
        blocks.push(concentricBlock(pr.a, pr.b, pr.label, colorIdx++));
      } else {   // adjacent — two blocks, marked so layout keeps them together
        const mk = (id) => PARAMS[id].kind === 'button'
          ? buttonBlock(id, null, colorIdx) : knobBlock(id, colorIdx);
        const g1 = mk(pr.a), g2 = mk(pr.b);
        g1.glue = g2.glue = `glue${colorIdx++}`;
        blocks.push(g1, g2);
      }
    }
  }
  for (const pid of manifest.controls) {
    if (consumed.has(pid)) continue;
    const p = PARAMS[pid];
    if (!p) continue;
    switch (p.kind) {
      case 'knob':         blocks.push(knobBlock(pid, colorIdx++)); break;
      case 'slider':       blocks.push(sliderBlock(pid, colorIdx++)); break;
      /* ⭐ remix wears the cycle ring whenever the SONG cycles — the
         readout survived the dwell knob's exile to the back face. */
      case 'button':       blocks.push(buttonBlock(pid, pid === 'remix' && patch.cycle, colorIdx++)); break;
      case 'segment':      blocks.push(segmentBlock(pid)); break;
      case 'toggle':       blocks.push(toggleBlock(pid, colorIdx++)); break;
      case 'steps':        blocks.push(stepsBlock(pid)); break;
      case 'voiceFaders':  blocks.push(voiceFadersBlock(pid, manifest.voices)); break;
      case 'voicePans':    blocks.push(voicePansBlock(pid, manifest.voices)); break;
      case 'voiceMutes':   blocks.push(voiceMutesBlock(pid, manifest.voices)); break;
    }
  }

  /* ── the witness (PLAN §9) ───────────────────────────────────────
     Derived, never authored. `banner` and `hero` are pulled out of the
     flow entirely and drawn as their own row; `inline` lets the screen
     pack as an ordinary tone block, bound to the controls that move it.

     ⛔ ONE picture per plate. The pane already sits under a field sliver
     and a spectrum bar; a third is how a faceplate becomes a dashboard.
     That is enforced by there being exactly one witness, not by a rule
     the layout has to remember. */
  const scopeStrength = manifest.scope;
  let bannerScope = null;
  if (scopeStrength) {
    const heroScope = g.scopePlace === 'hero';
    const sizeMul = g.scopePlace === 'banner' ? 1.9 : heroScope ? 2.6 : 1;   // >1 = zone-relative
    const sb = scopeBlock(present, scopeStrength, sizeMul);
    if (g.scopePlace === 'inline') blocks.push(sb);
    else bannerScope = sb;
  }

  /* ── group into family sections ─────────────────────────────────── */
  const byFamily = new Map();
  for (const b of blocks) {
    if (!byFamily.has(b.family)) byFamily.set(b.family, []);
    byFamily.get(b.family).push(b);
  }
  let sections = FAMILY_ORDER.filter(f => byFamily.has(f)).map(f => ({ key: f, blocks: byFamily.get(f) }));

  const orderRng = mulberry32(Math.floor(g.orderSeed * 0xffffffff) ^ seed);
  for (let i = sections.length - 1; i > 0; i--) {
    const j = Math.floor(orderRng() * (i + 1));
    [sections[i], sections[j]] = [sections[j], sections[i]];
  }
  if (t < 0.45) {   // braun: the voice block leads if there is one
    const vi = sections.findIndex(s => s.key === 'voices');
    if (vi > 0) { const [v] = sections.splice(vi, 1); sections.unshift(v); }
  }

  /* ── TIERS have to mean something visually (PLAN §8) ─────────────
     Or they are just draw weights. Three light rules, leaving the
     composition itself to the genome:
       always (**)   a size FLOOR, and the only tier eligible for hero
       mostly (*)    normal
       situational   may render at 0.85×, and is the only tier the
                     packer may strand in a last row
     ⛔ Deliberately NOT a position rule: pinning the ** tier to the top
     would be the genome's job taken away, and the whole point is that
     the arrangement stays explorable. */
  const tierOf = (b) => {
    const w = PARAMS[b.pid]?.w;
    if (b.witness || w == null) return 'mostly';
    return w >= 1 ? 'always' : w >= 0.5 ? 'mostly' : 'situational';
  };
  const tierScale = (b) => tierOf(b) === 'situational' ? 0.85 : 1;

  /* hero: one control drawn oversize (bauhaus half of the axis).
     WHICH one is `heroPick` — before that gene it took the first
     eligible block in reading order, making the identity a side-effect
     of `orderSeed`, a gene documented as "not a quality axis". So the
     model could never learn that promoting the FILTER reads differently
     from promoting REMIX.

     ⛔ Under `scopePlace: hero` there is no control hero at all: the
     screen is already the dominant element, and two dominants is none. */
  let heroBlock = null;
  const scopeIsHero = !!bannerScope && g.scopePlace === 'hero';
  if (g.hero === 'on' && t > 0.35 && !scopeIsHero) {
    const eligible = (b) => !b.glue && tierOf(b) !== 'situational' &&
      (b.kind === 'knob' || b.kind === 'pair' ||
       (b.kind === 'button' && g.heroPick === 'action'));
    const all = sections.flatMap(sec => sec.blocks).filter(eligible);
    heroBlock = (g.heroPick !== 'first' && all.find(b => b.family === g.heroPick))
      || all[0] || null;
  }
  LAST_HERO = scopeIsHero ? 'scope' : heroBlock ? heroBlock.pid : null;
  const heroScale = 1.3 + t * 0.5;
  const scaleOf = (b) => b === heroBlock ? heroScale : tierScale(b);

  /* ── layout ──────────────────────────────────────────────────────── */
  const rowGap = 12 * g.gapScale, sectionGap = 15 * g.gapScale, blockGap = 11 * g.gapScale;
  const glueGap = 5;
  const placed = [], marks = [];
  let contentW = 0, contentH = 0;

  if (g.flow === 'rows') {
    /* ── 1. sections → UNITS ─────────────────────────────────────────
       A unit is a run of blocks that must stay adjacent. Normally that
       is a whole section; a section too wide for the zone splits into
       several units so it wraps rather than overflowing. Pairs keep
       their tight `glueGap` inside a unit. */
    const units = [];
    for (const sec of sections) {
      let items = [], w = 0;
      for (const b of sec.blocks) {
        const scale = scaleOf(b);
        const bw = b.w * scale;
        const gap = items.length
          ? (b.glue && items[items.length - 1].b.glue === b.glue ? glueGap : blockGap) : 0;
        if (items.length && w + gap + bw > zone.w) {
          units.push({ key: sec.key, items, w }); items = []; w = 0;
        }
        const gg = items.length
          ? (b.glue && items[items.length - 1].b.glue === b.glue ? glueGap : blockGap) : 0;
        items.push({ b, scale, bw, gap: gg });
        w += gg + bw;
      }
      if (items.length) units.push({ key: sec.key, items, w });
    }

    /* ── 2. pack units into rows, BALANCED ───────────────────────────
       One section per row wasted this zone: 7 controls in 4 families
       laid out 2-1-1-1 and filled a third of the width. So units share
       rows, separated by the wider `sectionGap` (blocks inside a unit
       keep `blockGap`) — the gap itself says where one group ends.

       Greedy wrap finds the minimum row count R, then a second pass
       re-packs into exactly R rows aiming at an equal width each, so
       the last row isn't left holding one lonely knob. */
    const packRows = () => {
      let n = 0, w = 0, rowsMin = 1;
      for (const u of units) {
        const gap = n ? sectionGap : 0;
        if (n && w + gap + u.w > zone.w) { rowsMin++; n = 0; w = 0; }
        w += (n ? sectionGap : 0) + u.w; n++;
      }
      const R = rowsMin;
      const total = units.reduce((a, u) => a + u.w, 0) + sectionGap * (units.length - 1);
      const target = total / R;
      const rows = [];
      let i = 0;
      for (let r = 0; r < R; r++) {
        const row = [];
        let rw = 0;
        const rowsAfter = R - r - 1;
        while (i < units.length) {
          // never take a unit a later row still needs
          if (row.length && (units.length - i) <= rowsAfter) break;
          const gap = row.length ? sectionGap : 0;
          if (row.length && rw + gap + units[i].w > zone.w) break;
          if (row.length && rw >= target) break;   // this row has its share
          rw += gap + units[i].w;
          row.push(units[i]); i++;
        }
        if (row.length) rows.push(row);
      }
      while (i < units.length) rows[rows.length - 1].push(units[i++]);  // safety
      return rows;
    };

    /* ── 3. place ───────────────────────────────────────────────────── */
    let cursorY = 0;
    const rows = packRows();
    rows.forEach((row, ri) => {
      const totalW = row.reduce((a, u) => a + u.w, 0) + sectionGap * (row.length - 1);
      let x = g.align === 'center' ? (zone.w - totalW) / 2 : 0;
      x += (rng() - 0.5) * 2 * t * g.jitter * Math.max(0, (zone.w - totalW) * 0.45);
      x = Math.max(0, Math.min(Math.max(0, zone.w - totalW), x));
      let rowH = 0;
      row.forEach((u, ui) => {
        if (ui) x += sectionGap;
        for (const e of u.items) {
          x += e.gap;
          placed.push({ block: e.b, x, y: cursorY + (rng() - 0.5) * 2 * t * g.jitter * 5, scale: e.scale });
          x += e.bw;
          rowH = Math.max(rowH, e.b.h * e.scale);
        }
      });
      contentW = Math.max(contentW, totalW);
      cursorY += rowH;
      if (ri < rows.length - 1) {
        // the hairline now separates ROWS (shelves), not sections —
        // sections share rows, so a rule between them would cut a row
        // in half rather than group anything.
        cursorY += rowGap / 2;
        marks.push({ kind: 'h', at: cursorY });
        cursorY += rowGap / 2;
      }
    });
    contentH = cursorY;
  } else {
    let cursorX = 0;
    sections.forEach((sec, si) => {
      const colW = Math.max(...sec.blocks.map(b => b.w * scaleOf(b)));
      let y = Math.max(0, (rng() - 0.5) * 2 * t * g.jitter * 12);
      for (const b of sec.blocks) {
        const scale = scaleOf(b);
        placed.push({ block: b, x: cursorX + (colW - b.w * scale) / 2, y, scale });
        y += b.h * scale + rowGap;
      }
      contentH = Math.max(contentH, y - rowGap);
      cursorX += colW;
      if (si < sections.length - 1) {
        cursorX += sectionGap / 2;
        marks.push({ kind: 'v', at: cursorX });
        cursorX += sectionGap / 2;
      }
    });
    contentW = cursorX;
  }

  /* ── the screen as its own row (`banner` / `hero`) ────────────────
     Pulled out of the flow rather than packed: a banner that had to
     share a row with knobs would be a wide block competing for width,
     which is the opposite of what "spanning the plate" means.

     It leads, so the plate reads display-over-controls the way an
     instrument does. ⚠️ That does put it directly under the spectrum
     bar — two pictures adjacent, which is exactly what `scopeFrame`
     is for: the frameless reading keeps the boundary quiet. */
  if (bannerScope) {
    const sc = 1;
    const sh = bannerScope.h * sc + rowGap;
    for (const p2 of placed) p2.y += sh;
    for (const m of marks) if (m.kind === 'h') m.at += sh;
    const sw2 = bannerScope.w * sc;
    const sx = g.align === 'left' ? 0 : Math.max(0, (Math.max(contentW, sw2) - sw2) / 2);
    placed.unshift({ block: bannerScope, x: sx, y: 0, scale: sc });
    contentW = Math.max(contentW, sw2);
    contentH += sh;
  }

  const fit = Math.min(1, zone.w / Math.max(1, contentW), zone.h / Math.max(1, contentH));
  const ox = zone.x + (zone.w - contentW * fit) / 2;
  const oy = zone.y + (zone.h - contentH * fit) / 2;

  let markSvg = '';
  if (g.dividers === 'hairline') {
    for (const m of marks) {
      markSvg += m.kind === 'h'
        ? `<line x1="0" y1="${m.at}" x2="${contentW}" y2="${m.at}" stroke="${INK(0.08)}" stroke-width="1"/>`
        : `<line x1="${m.at}" y1="0" x2="${m.at}" y2="${contentH}" stroke="${INK(0.08)}" stroke-width="1"/>`;
    }
  }

  /* ⛔ v1's `backdrop` gene (a faint circle/quarter/bar wash behind the
     controls) is CUT. Its own description said "currently decoration —
     it groups nothing", which is a gene admitting it has no job. */

  const regionTop = FIELD_H + SPECT_H;
  const body = placed.map(p => p.block.draw(p.x, p.y, p.scale)).join('');
  /* One hairline between the rail and the pane — the rail is read as a
     rail by the line, not by any background of its own. */
  const colDivider = `<line x1="${LCOL_W + 6}" y1="${regionTop + 14}" x2="${LCOL_W + 6}"
    y2="${regionTop + REGION_H - 14}" stroke="${INK(0.16)}" stroke-width="1"/>`;

  let cycleBar = '';
  if (cycleBarOn) {
    const by = regionY + margin + 4, bh = 3;
    cycleBar = `<rect x="${zone.x}" y="${by}" width="${zone.w}" height="${bh}" rx="${bh / 2}" fill="${INK(0.12)}"/>
      <rect x="${zone.x}" y="${by}" width="${zone.w * CYCLE_PROGRESS}" height="${bh}" rx="${bh / 2}" fill="${INK(0.55)}"/>`;
  }

  /* ── the way to the back face ─────────────────────────────────────
     One `⋯` in the pane's bottom-right corner. Chrome tier, drawn at
     the quietest ink there is: the controls behind it are the ones that
     do NOT change the sound now, so it must never win the eye from
     anything that does. ⛔ Not styled by the genome — see renderBack(). */
  const dotY = regionTop + REGION_H - 12, dotX = PHONE_W - 20;
  const moreMark = [-5, 0, 5].map(d =>
    `<circle cx="${dotX + d}" cy="${dotY}" r="1.3" fill="${INK(0.30)}"/>`).join('');

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PHONE_W} ${TOTAL_H}" width="${PHONE_W}" height="${TOTAL_H}">
    <rect width="${PHONE_W}" height="${TOTAL_H}" fill="${GROUND}"/>
    ${chromeFieldSliver()}
    ${chromeSpectrumBar(FIELD_H, manifest.voices, g)}
    ${chromeLeftColumn(regionTop, g, accentFor(0), patch.cycle)}
    ${colDivider}
    ${cycleBar}
    <g transform="translate(${ox} ${oy}) scale(${fit})">${body}${markSvg}</g>
    ${moreMark}
    ${chromeRail(regionTop + REGION_H)}
  </svg>`;
}

/* ════════════════════════════════════════════════════════════════════
   6b · THE BACK FACE — everything that does not move the sound now
   ────────────────────────────────────────────────────────────────────
   The other half of v2's admission rule. Dwell, slide and drift live
   here so the plate can promise that every control ON it responds the
   instant you touch it.

   ⛔ The genome does not style this face. It is chrome: one plain list,
   identical on every song. Styling both faces would double the search
   space for the surface nobody is looking at — and the entire reason
   these controls are here is that they do not deserve the attention.
   ════════════════════════════════════════════════════════════════════ */
function renderBack(manifest) {
  const regionTop = FIELD_H + SPECT_H;
  const rows = MENU_IDS.map(id => PARAMS[id]);
  const x0 = 26, w = PHONE_W - 52, rowH = 40;
  let out = '';
  rows.forEach((p, i) => {
    const y = regionTop + 34 + i * rowH;
    out += `<text x="${x0}" y="${y}" font-size="10" font-weight="500" letter-spacing="1"
      fill="${INK(0.75)}">${p.label.toUpperCase()}</text>`;
    out += `<text x="${x0 + w}" y="${y}" text-anchor="end" font-size="10" fill="${HI(0.8)}"
      style="font-variant-numeric:tabular-nums">${p.fmt ? p.fmt(p.def) : ''}</text>`;
    // a plain track + fill: no knob vocabulary, nothing to compare
    out += `<line x1="${x0}" y1="${y + 11}" x2="${x0 + w}" y2="${y + 11}"
      stroke="${TRACK}" stroke-width="3" stroke-linecap="round"/>`;
    out += `<line x1="${x0}" y1="${y + 11}" x2="${x0 + w * p.def}" y2="${y + 11}"
      stroke="${INK(0.6)}" stroke-width="3" stroke-linecap="round"/>`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PHONE_W} ${TOTAL_H}" width="${PHONE_W}" height="${TOTAL_H}">
    <rect width="${PHONE_W}" height="${TOTAL_H}" fill="${GROUND}"/>
    ${chromeFieldSliver()}
    <text x="26" y="${regionTop + 12}" font-size="8" letter-spacing="1.4" fill="${INK(0.35)}">NOT IMMEDIATE</text>
    <line x1="26" y1="${regionTop + 20}" x2="${PHONE_W - 26}" y2="${regionTop + 20}" stroke="${INK(0.10)}" stroke-width="1"/>
    ${out}
    ${chromeRail(regionTop + REGION_H)}
  </svg>`;
}

/* ════════════════════════════════════════════════════════════════════
   7 · TASTE MODEL — logistic regression over gene features
   ════════════════════════════════════════════════════════════════════ */
/* ⚠️ v2 bumps every key. The model's weights are keyed to GENE NAMES,
   and v2 cut four genes and added nine — feeding v1's ratings to it
   would silently mix two vocabularies. v1 keeps its own keys so its
   ratings stay attached to the genes they were collected against. */
const STORE_KEY = 'wt-parametric-lab-v4';
let ratings = [];
try { ratings = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch { ratings = []; }
function saveRatings() { localStorage.setItem(STORE_KEY, JSON.stringify(ratings)); }

let model = null;
function trainModel() {
  if (ratings.length < 8) { model = null; return; }
  const X = ratings.map(r => featurize(r.genome));
  const Y = ratings.map(r => (r.vote > 0 ? 1 : 0));
  const d = X[0].length, w = new Array(d).fill(0);
  let b = 0;
  const lr = 0.15, l2 = 0.01, epochs = 300;
  for (let ep = 0; ep < epochs; ep++) {
    for (let i = 0; i < X.length; i++) {
      let z = b;
      for (let j = 0; j < d; j++) z += w[j] * X[i][j];
      const p = 1 / (1 + Math.exp(-z)), err = p - Y[i];
      for (let j = 0; j < d; j++) w[j] -= lr * (err * X[i][j] + l2 * w[j]);
      b -= lr * err;
    }
  }
  model = { w, b };
}
function score(genome) {
  if (!model) return null;
  const x = featurize(genome);
  let z = model.b;
  for (let j = 0; j < x.length; j++) z += model.w[j] * x[j];
  return 1 / (1 + Math.exp(-z));
}

/* ════════════════════════════════════════════════════════════════════
   8 · BATCHES, GRID, INTERACTION
   ════════════════════════════════════════════════════════════════════ */
const BATCH = 12;
let batch = [], focusIdx = -1;
let mode = 'batch';                 // 'batch' | 'sweep'
/* ⭐ SONG MODE — the payoff of splitting the two seeds (§4).
     off  one manifest, twelve arrangements — v1's whole workflow, and
          the right way to judge a LAYOUT.
     on   twelve cards each drawing their own manifest AND genome. This
          is how you rate the SYSTEM: if one draw in twelve comes out
          incoherent that is a WEIGHTS problem, and it is invisible in
          the other mode because the controls never change. */
let songMode = false;
/* A card renders its own manifest if it drew one, else the live one. */
const manifestFor = (item) =>
  item.mseed != null ? buildManifest(currentSongKey, item.mseed) : manifest;
/* ?gene=<name> opens a specific sweep — deep-links a single decision. */
const geneParam = new URLSearchParams(location.search).get('gene');
let sweepGene = (geneParam && GENES.some(g => g.k === geneParam)) ? geneParam : 'knobSize';
let sweepSeed = newSeed();

/* ── LOCKS and EXCLUSIONS ────────────────────────────────────────────
   A sweep's output is a DECISION, not a rating, and it comes in two
   strengths:

     LOCK       pin the gene to exactly this value. Total commitment.
     EXCLUDE    rule this value OUT and keep sampling the rest.

   The second is usually the honest one. On an 8-option gene you rarely
   think "it must be `cap`" — you think "not tickOnly, not wedge, the
   other six are all fine". Excluding narrows the space without
   pretending to a decision you have not made, and several exclusions
   compose where a lock cannot.

   For a FLOAT gene, excluding a swept step narrows the RANGE from
   whichever end the step sits nearer — an interior hole in a continuous
   parameter is not a thing you can sample around meaningfully, but "the
   bottom third is too small" is exactly what a float sweep tells you.

   Everything downstream honours both: random batches, evolve children,
   and the base genome of every later sweep.
   ─────────────────────────────────────────────────────────────────── */
const LOCK_KEY = 'wt-parametric-lab-locks-v3';
let LOCKS = {};      // gene → pinned value
let EXCLUDES = {};   // enum gene → [banned options]
let BOUNDS = {};     // float gene → [min, max]
try {
  const raw = JSON.parse(localStorage.getItem(LOCK_KEY) || '{}');
  LOCKS = raw.locks || {}; EXCLUDES = raw.excludes || {}; BOUNDS = raw.bounds || {};
} catch { LOCKS = {}; EXCLUDES = {}; BOUNDS = {}; }
const saveLocks = () => localStorage.setItem(LOCK_KEY,
  JSON.stringify({ locks: LOCKS, excludes: EXCLUDES, bounds: BOUNDS }));

/* The options / range a gene may still be drawn from. */
function allowedOptions(gene) {
  const ex = EXCLUDES[gene.k] || [];
  const keep = gene.o.filter(o => !ex.includes(o));
  return keep.length ? keep : gene.o;      // never strand a gene with nothing
}
function floatBounds(gene) {
  const b = BOUNDS[gene.k];
  return b ? [Math.max(gene.min, b[0]), Math.min(gene.max, b[1])] : [gene.min, gene.max];
}
function isNarrowed(gene) {
  if (gene.t === 'e') return (EXCLUDES[gene.k] || []).length > 0;
  const [lo, hi] = floatBounds(gene);
  return lo > gene.min || hi < gene.max;
}

/* ── song PINS ───────────────────────────────────────────────────────
   A deliberate hole in the manifest/genome split: a song may pin named
   genes to give itself a CHARACTER. It is what separates "hello world 2"
   from "hello world 3" — identical control lists, different composure —
   and there is no honest way to express that as content.

   Pins beat the random draw and the user's locks, because they define
   which variant you are looking at. The one thing that beats a pin is
   the SWEEP: sweeping a pinned gene must still show its whole range, or
   you could never see what the pin chose from.
   ─────────────────────────────────────────────────────────────────── */
function applyPins(gm, exceptGene) {
  const pins = SONGS[currentSongKey].pins;
  if (!pins) return gm;
  const out = { ...gm };
  for (const k of Object.keys(pins)) {
    if (k !== exceptGene) out[k] = pins[k];
  }
  return out;
}

/* Pin the locks, then drag anything out of bounds back inside — a
   crossover child can inherit a value that has since been excluded. */
function applyLocks(gm) {
  const out = { ...gm, ...LOCKS };
  for (const gene of GENES) {
    if (LOCKS[gene.k] !== undefined) continue;
    if (gene.t === 'e') {
      const keep = allowedOptions(gene);
      if (!keep.includes(out[gene.k])) out[gene.k] = keep[0];
    } else {
      const [lo, hi] = floatBounds(gene);
      out[gene.k] = Math.max(lo, Math.min(hi, out[gene.k]));
    }
  }
  return out;
}

const drawGenome = (seed) => applyPins(applyLocks(randomGenome(mulberry32(seed))));

/* ── GENERATIONS ─────────────────────────────────────────────────────
   Every batch is kept, so evolve is undoable. Without this a bad
   evolve destroys your position: the previous generation is replaced,
   and only the cards you happened to RATE survive (in `ratings`, which
   stores whole genomes). Interactive evolution needs "that generation
   was better, go back and breed from there" — otherwise you can only
   ever move forward and hope.

   Stepping back and then evolving BRANCHES: the forward history is
   dropped, exactly like editing in the middle of an undo stack. So the
   history is a single line you can rewind and diverge from, not a
   tree — a tree would need naming and pruning UI to be usable, and the
   move you actually want is "rewind and try again".

   Generations hold the batch objects BY REFERENCE, so a vote cast on a
   restored card lands in the history too.
   ─────────────────────────────────────────────────────────────────── */
const GEN_KEY = 'wt-parametric-lab-gens-v2';
const GEN_CAP = 40;
let generations = [], genIdx = -1;
try {
  const raw = JSON.parse(localStorage.getItem(GEN_KEY) || '{}');
  generations = raw.gens || []; genIdx = raw.idx ?? generations.length - 1;
} catch { generations = []; genIdx = -1; }
const saveGens = () => {
  try { localStorage.setItem(GEN_KEY, JSON.stringify({ gens: generations, idx: genIdx })); }
  catch { /* quota — history is a convenience, never block on it */ }
};

function recordGeneration(label) {
  if (genIdx < generations.length - 1) generations = generations.slice(0, genIdx + 1);
  generations.push({ label, songKey: currentSongKey, items: batch });
  if (generations.length > GEN_CAP) generations.shift();
  genIdx = generations.length - 1;
  saveGens(); renderGenNav();
}

function gotoGeneration(i) {
  if (i < 0 || i >= generations.length) return;
  genIdx = i;
  const gen = generations[i];
  // a generation belongs to the song it was bred under — restoring one
  // from another song has to bring the manifest with it, or the cards
  // re-render with the wrong controls
  if (gen.songKey !== currentSongKey && SONGS[gen.songKey]) {
    currentSongKey = gen.songKey;
    manifestEdits = null;
    manifest = buildManifest();
    document.getElementById('songSel').value = currentSongKey;
    buildManifestEditor();
  }
  batch = gen.items;
  focusIdx = -1;
  saveGens(); renderGrid(); renderGenNav();
}

function renderGenNav() {
  const back = document.getElementById('genBack');
  const fwd = document.getElementById('genFwd');
  const lab = document.getElementById('genLabel');
  if (!back) return;
  const live = mode === 'batch' && generations.length > 0;
  back.disabled = !live || genIdx <= 0;
  fwd.disabled = !live || genIdx >= generations.length - 1;
  lab.textContent = live
    ? `${generations[genIdx]?.label || 'gen'} · ${genIdx + 1}/${generations.length}`
    : 'gen —';
}

/* The NEUTRAL base: braun-plain, labels on, no jitter, no hero. A sweep
   is only readable against a quiet control — a random base throws four
   other loud genes into the comparison and you end up rating the base,
   not the axis. Reroll gives random bases for a sanity check that the
   choice survives a different context. */
const NEUTRAL = {
  school: 0.15, flow: 'rows', accent: 'none', voiceLit: 'lit',
  knobStyle: 'ring', remixGlyph: 'dice',
  scopePlace: 'inline', scopeFrame: 'hairline', scopeCycles: 'one',
  mixerScatter: 0.15, panFill: 'noon', mutePlace: 'square', panPlace: 'row',
  shapeLink: 'matched',
  faderOrient: 'vertical', faderLen: 'even',
  orbInk: 'mono', autoShape: 'circle', cycleReadout: 'ring',
  heroPick: 'first',
  pairStyle: 'declared', playStyle: 'washCircle',
  align: 'center', labels: 'below', readouts: 'on', dividers: 'none',
  hero: 'off', jitter: 0, chipStyle: 'wash',
  knobSize: 1.1, margin: 14, gapScale: 1.1, orderSeed: 0.5, faderW: 5,
};
let sweepBase = 'neutral';          // 'neutral' | 'random'

function sweepValues(key) {
  const gene = GENES.find(g => g.k === key);
  if (gene.t === 'e') return gene.o.slice();
  const N = 8;
  return Array.from({ length: N }, (_, i) => gene.min + (gene.max - gene.min) * i / (N - 1));
}

/* Every card in a sweep renders with the SAME seed, so the jitter draw,
   the backdrop placement and the per-voice stable values are identical
   and the swept gene is the only thing that moved. */
function buildSweep() {
  // `sweepGene` is exempt from the song's pins — otherwise sweeping a
  // pinned gene would render eight identical cards.
  const base = applyPins(applyLocks(sweepBase === 'neutral'
    ? { ...NEUTRAL } : randomGenome(mulberry32(sweepSeed))), sweepGene);
  batch = sweepValues(sweepGene).map(v => ({
    seed: sweepSeed, genome: { ...base, [sweepGene]: v }, vote: 0, sweepVal: v,
  }));
  focusIdx = -1;
  renderGrid();
  renderGeneDesc();
}

/* What the swept gene does, plus the two ways a sweep can be silently
   inert: the song contains nothing the gene acts on, or `school` is
   sitting below the gene's gate and multiplying it to zero. Both look
   identical on screen (8 identical cards) and both read as a bug. */
function renderGeneDesc() {
  const el = document.getElementById('geneDesc');
  if (mode !== 'sweep') { el.innerHTML = ''; return; }
  const gene = GENES.find(g => g.k === sweepGene);
  const warns = [];
  if (gene.needs && !gene.needs(manifest)) {
    warns.push(`“${currentSongKey}” has no ${gene.needsLabel}, so every card will be identical — switch song, or add one in <b>edit manifest</b>.`);
  }
  const school = LOCKS.school ?? (sweepBase === 'neutral' ? NEUTRAL.school : null);
  if (school != null && gene.gate != null && school <= gene.gate) {
    warns.push(`<b>school</b> is ${school.toFixed(2)} and this gene only switches on above ${gene.gate} — the sweep is inert. Lock <b>school</b> higher first.`);
  }
  if (school != null && gene.scaledBySchool && school < 0.5) {
    warns.push(`<b>school</b> multiplies this gene, and it is at ${school.toFixed(2)} — you are seeing ${Math.round(school * 100)}% of the effect. Lock <b>school</b> nearer 1 to judge it.`);
  }
  el.innerHTML = `<span class="dsc"><b>${gene.k}</b> — ${gene.d}</span>` +
    warns.map(w => `<span class="warn">⚠ ${w}</span>`).join('');
}

function lockAt(idx) {
  const item = batch[idx];
  if (!item) return;
  if (LOCKS[sweepGene] === item.sweepVal) delete LOCKS[sweepGene];
  else LOCKS[sweepGene] = item.sweepVal;
  saveLocks(); renderLocks(); renderGrid(); renderGeneDesc();
}

/* Is this swept value currently ruled out? */
function isExcludedVal(gene, v) {
  if (gene.t === 'e') return (EXCLUDES[gene.k] || []).includes(v);
  const [lo, hi] = floatBounds(gene);
  return v < lo - 1e-9 || v > hi + 1e-9;
}

function excludeAt(idx) {
  const item = batch[idx];
  if (!item) return;
  const gene = GENES.find(g => g.k === sweepGene);
  const v = item.sweepVal;

  if (gene.t === 'e') {
    const ex = EXCLUDES[sweepGene] || [];
    const next = ex.includes(v) ? ex.filter(o => o !== v) : [...ex, v];
    // never exclude the last survivor — that would strand the gene
    if (next.length >= gene.o.length) return;
    if (next.length) EXCLUDES[sweepGene] = next; else delete EXCLUDES[sweepGene];
  } else {
    const [lo, hi] = floatBounds(gene);
    const step = (gene.max - gene.min) / 7;          // the sweep's own step
    if (isExcludedVal(gene, v)) {                    // click again to restore
      BOUNDS[sweepGene] = [Math.min(lo, v), Math.max(hi, v)];
    } else if (v <= (lo + hi) / 2) {
      BOUNDS[sweepGene] = [Math.min(v + step * 0.5, hi), hi];   // trim the bottom
    } else {
      BOUNDS[sweepGene] = [lo, Math.max(v - step * 0.5, lo)];   // trim the top
    }
    const b = BOUNDS[sweepGene];
    if (b[0] <= gene.min && b[1] >= gene.max) delete BOUNDS[sweepGene];
  }
  // a lock inside the newly-excluded region no longer means anything
  if (LOCKS[sweepGene] !== undefined && isExcludedVal(gene, LOCKS[sweepGene])) {
    delete LOCKS[sweepGene];
  }
  saveLocks(); renderLocks(); renderGrid(); renderGeneDesc();
}

function renderLocks() {
  buildGeneSel();                 // keep the picker's markers in step
  const el = document.getElementById('locks');
  const locked = Object.keys(LOCKS);
  const narrowed = GENES.filter(g => LOCKS[g.k] === undefined && isNarrowed(g));
  if (!locked.length && !narrowed.length) {
    el.innerHTML = `<span class="none">nothing decided yet — <b>lock</b> pins a value, <b>✕</b> rules one out and keeps the rest</span>`;
    return;
  }
  const lockChips = locked.map(k => {
    const v = LOCKS[k];
    return `<span class="lk">${k} = ${typeof v === 'number' ? v.toFixed(2) : v}
      <button data-unlock="${k}" title="unlock">✕</button></span>`;
  }).join('');
  const exChips = narrowed.map(g => {
    const txt = g.t === 'e'
      ? `${g.k} ✕ ${(EXCLUDES[g.k] || []).join(' ✕ ')}`
      : `${g.k} ${floatBounds(g)[0].toFixed(2)}–${floatBounds(g)[1].toFixed(2)}`;
    return `<span class="ex">${txt}<button data-clear="${g.k}" title="clear">✕</button></span>`;
  }).join('');
  el.innerHTML = `<span class="none">${locked.length} locked · ${narrowed.length} narrowed
    · ${GENES.length - locked.length - narrowed.length} open —</span>` + lockChips + exChips;
}
document.getElementById('locks').addEventListener('click', (e) => {
  const un = e.target.closest('button[data-unlock]');
  const cl = e.target.closest('button[data-clear]');
  if (un) delete LOCKS[un.dataset.unlock];
  else if (cl) { delete EXCLUDES[cl.dataset.clear]; delete BOUNDS[cl.dataset.clear]; }
  else return;
  saveLocks(); renderLocks();
  mode === 'sweep' ? buildSweep() : renderGrid();
});

function setMode(m) {
  /* ⛔ A mode button is not an action. Clicking `batch` while already
     in batch mode used to fall through to newBatch(), silently
     replacing the grid and burning a generation — two buttons doing
     the same job, one of them by accident. (`batch.length` is the
     boot guard: empty means nothing has been drawn yet.) */
  if (mode === m && batch.length) return;
  mode = m;
  document.getElementById('modeBatch').classList.toggle('primary', m === 'batch');
  document.getElementById('modeSweep').classList.toggle('primary', m === 'sweep');
  document.getElementById('batchBar').style.display = m === 'batch' ? '' : 'none';
  document.getElementById('sweepBar').style.display = m === 'sweep' ? '' : 'none';
  document.getElementById('hint').innerHTML = m === 'batch'
    ? `field sliver · spectrum · rail and the left play/volume column are FIXED chrome — the genome only owns the region right of the divider.
       <b>song mode</b> re-draws the CONTROLS per card too, from the same patch — that rates the weights, not one arrangement.<br>
       click a card to zoom (the modal shows the back face beside the plate) · ← → move focus · <b>L</b> like · <b>X</b> dislike · <b>N</b> new batch · <b>E</b> evolve · <b>[ ]</b> step generations`
    : `one gene swept across its range, everything else held still. <b>lock</b> pins a value; <b>✕</b> rules one out
       and keeps sampling the rest — several exclusions compose where a lock cannot.<br>
       click a card to zoom · ← → move focus · <b>L</b> lock · <b>X</b> exclude · <b>R</b> reroll the base genome`;
  /* Coming back from a sweep RESTORES where you were, rather than
     rolling a fresh batch — peeking at a sweep should not cost you
     your generation. */
  if (m === 'sweep') buildSweep();
  else if (generations.length && genIdx >= 0) gotoGeneration(Math.min(genIdx, generations.length - 1));
  else newBatch();
  renderGeneDesc(); renderGenNav();
}

function newBatch() {
  const bias = document.getElementById('biasChk').checked && model;
  const draws = bias ? BATCH * 8 : BATCH;
  const cands = [];
  for (let i = 0; i < draws; i++) {
    const seed = newSeed();
    // in song mode each card also draws its own CONTROLS, from the same
    // patch — same song, a different plate
    cands.push({ seed, mseed: songMode ? newSeed() : null, genome: drawGenome(seed), vote: 0 });
  }
  batch = bias ? cands.sort((a, b) => score(b.genome) - score(a.genome)).slice(0, BATCH) : cands;
  focusIdx = -1;
  renderGrid();
  recordGeneration(bias ? 'biased' : 'random');
}

function evolve() {
  const liked = ratings.filter(r => r.vote > 0).slice(-24);
  if (liked.length < 2) { alert('Like at least 2 designs first.'); return; }
  const rng = mulberry32(newSeed());
  batch = [];
  for (let i = 0; i < BATCH - 2; i++) {
    const pa = liked[Math.floor(rng() * liked.length)];
    const pb = liked[Math.floor(rng() * liked.length)];
    batch.push({
      seed: newSeed(), mseed: songMode ? newSeed() : null,
      genome: applyPins(applyLocks(mutate(crossover(pa.genome, pb.genome, rng), rng))),
      vote: 0, bred: true, parents: [pa.seed, pb.seed],
    });
  }
  for (let i = 0; i < 2; i++) {   // fresh blood
    const seed = newSeed();
    batch.push({ seed, mseed: songMode ? newSeed() : null, genome: drawGenome(seed), vote: 0 });
  }
  focusIdx = -1;
  renderGrid();
  recordGeneration('evolved');
}

/* One card = one row, always. Re-voting REPLACES the row rather than
   appending: pushing every click meant a double-tap silently gave that
   genome twice the weight, and ▲-then-▼ left the training set holding
   both opinions at once. Clicking the vote you already cast clears it —
   an un-rated card is genuinely neutral (it leaves the training set),
   which is the only honest way to say "I can't call this one". */
/* ⚠️ A vote records the CONTROLS it was cast under, not just the genome.
   The model only sees gene features, so it cannot tell that you disliked
   a plate for what was ON it rather than how it was arranged — and once
   you edit the manifest, or turn on song mode, consecutive votes are
   about different instruments. Storing the control list does not fix the
   attribution, but it makes the mixture VISIBLE (the stats line counts
   distinct manifests) and keeps the data recoverable, which a
   genome-only record did not. */
function vote(idx, v) {
  const item = batch[idx];
  if (!item) return;
  const repeat = item.vote === v;
  item.vote = repeat ? 0 : v;
  ratings = ratings.filter(r => r.seed !== item.seed);
  if (!repeat) {
    const m = manifestFor(item);
    ratings.push({
      seed: item.seed, genome: item.genome, songKey: currentSongKey, vote: v, ts: Date.now(),
      mseed: item.mseed ?? manifestSeed, controls: m.controls.join(' '),
    });
  }
  saveRatings(); trainModel(); updateCard(idx); renderStats(); renderWeights();
}

function cardHTML(item, idx) {
  if (mode === 'sweep') {
    const v = item.sweepVal;
    const gene = GENES.find(g => g.k === sweepGene);
    const locked = LOCKS[sweepGene] === v;
    const excl = isExcludedVal(gene, v);
    return `
      <div class="card ${locked ? 'locked' : ''} ${excl ? 'excluded' : ''} ${idx === focusIdx ? 'focus' : ''}" data-idx="${idx}">
        ${render(manifestFor(item), item.genome, item.seed)}
        <div class="meta">
          <span class="sweepval">${sweepGene} <b>${typeof v === 'number' ? v.toFixed(2) : v}</b>${LAST_HERO ? ` · hero:${LAST_HERO}` : ''}</span>
          <span class="votes">
            <button class="wide" data-lock="${idx}">${locked ? 'locked' : 'lock'}</button>
            <button class="wide ${excl ? 'on' : ''}" data-excl="${idx}"
              title="${excl ? 'allow this again' : 'rule this out, keep sampling the rest'}">${excl ? 'out' : '✕'}</button>
          </span>
        </div>
      </div>`;
  }
  const sc = score(item.genome);
  return `
    <div class="card ${item.vote > 0 ? 'liked' : item.vote < 0 ? 'disliked' : ''} ${idx === focusIdx ? 'focus' : ''}" data-idx="${idx}">
      ${render(manifestFor(item), item.genome, item.seed)}
      <div class="meta">
        <span>#${item.seed.toString(16).slice(0, 6)}${item.bred ? ' ·bred' : ''} · t${item.genome.school.toFixed(2)} · ${item.genome.flow}${LAST_HERO ? ' · hero:' + LAST_HERO : ''}</span>
        <span class="score">${sc != null ? Math.round(sc * 100) : '·'}</span>
        <span class="votes">
          <button data-vote="1" data-idx="${idx}">▲</button>
          <button data-vote="-1" data-idx="${idx}">▼</button>
        </span>
      </div>
    </div>`;
}
function renderGrid() {
  document.getElementById('grid').innerHTML = batch.map(cardHTML).join('');
  renderStats();
}
function updateCard(idx) {
  const el = document.querySelector(`.card[data-idx="${idx}"]`);
  if (el) el.outerHTML = cardHTML(batch[idx], idx);
}
function renderStats() {
  const nLike = ratings.filter(r => r.vote > 0).length;
  const cost = manifest.controls.reduce((t, id) => t + (PARAMS[id]?.cost || 0), 0);
  /* How many DIFFERENT instruments the training set spans. One is a
     clean comparison; several means the model is being handed style
     judgements that were partly about content. */
  const spread = new Set(ratings.map(r => r.controls || '?')).size;
  const el = document.getElementById('stats');
  el.textContent =
    `${manifest.controls.length} controls · ${cost}/${BUDGET} cost · ${ratings.length} rated (▲${nLike} ▼${ratings.length - nLike})` +
    `${model ? ' · model live' : ` · ${Math.max(0, 8 - ratings.length)} more to train`}` +
    (spread > 1 ? ` · ⚠ across ${spread} manifests` : '');
  el.title = spread > 1
    ? `Your ${ratings.length} ratings were cast over ${spread} different control sets. The model only sees GENES, so it cannot separate "I disliked this layout" from "I disliked these controls".`
    : '';
}
function renderWeights() {
  const el = document.getElementById('weights');
  if (!model) { el.innerHTML = ''; return; }
  const names = featureNames();
  const pairs = names.map((n, i) => [n, model.w[i]]).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 12);
  const maxW = Math.max(...pairs.map(p => Math.abs(p[1])), 0.001);
  el.innerHTML = '<h2>learned taste weights</h2>' + pairs.map(([n, w]) => `
    <div class="wrow">
      <span class="wname">${n}</span>
      <span class="wbar ${w > 0 ? 'wpos' : 'wneg'}" style="width:${Math.abs(w) / maxW * 180}px"></span>
      <span>${w > 0 ? '+' : ''}${w.toFixed(2)}</span>
    </div>`).join('');
}

function openModal(idx) {
  const item = batch[idx];
  const m = manifestFor(item);
  /* Both faces at once: the plate, and behind the `⋯`, everything that
     failed the immediacy test. Seeing them together is the only way to
     judge whether the split was drawn in the right place. */
  document.getElementById('modalPlate').innerHTML = render(m, item.genome, item.seed);
  document.getElementById('modalBack').innerHTML = renderBack(m);
  const lineage = item.parents
    ? `bred from <b>#${item.parents[0].toString(16).slice(0, 6)}</b> + <b>#${item.parents[1].toString(16).slice(0, 6)}</b><br>`
    : '';
  const cost = m.controls.reduce((t, id) => t + (PARAMS[id]?.cost || 0), 0);
  document.getElementById('modalGenes').innerHTML =
    `<b>#${item.seed.toString(16)}</b><br>${lineage}` +
    `<span class="mf">${m.controls.join(' · ')}</span>` +
    `<span class="mf">cost ${cost}/${BUDGET} · screen ${m.scope || 'none'}</span>` +
    GENES.map(g2 => {
      const v = item.genome[g2.k];
      return `${g2.k}: <b>${typeof v === 'number' ? v.toFixed(2) : v}</b>`;
    }).join('<br>');
  document.getElementById('modal').classList.add('open');
}
document.getElementById('modal').addEventListener('click', () =>
  document.getElementById('modal').classList.remove('open'));

/* ── song select + manifest editor (grouped by family) ────────────── */
const sel = document.getElementById('songSel');
for (const k of Object.keys(SONGS)) {
  const o = document.createElement('option');
  o.value = k; o.textContent = k;
  if (k === currentSongKey) o.selected = true;
  sel.appendChild(o);
}
sel.addEventListener('change', () => {
  currentSongKey = sel.value;
  manifestEdits = null;          // a new song re-draws rather than inheriting
  manifest = buildManifest();
  buildManifestEditor();
  mode === 'sweep' ? buildSweep() : newBatch();
});
/* The editor now shows the PATCH first, because the patch is what makes
   a control legal at all — and an id greyed out with the reason is far
   more useful than an id that has silently vanished from the list. */
function buildManifestEditor() {
  const ed = document.getElementById('manifestEditor');
  const patch = manifest.patch;
  const have = new Set(manifest.controls);
  const cost = manifest.controls.reduce((a, id) => a + (PARAMS[id]?.cost || 0), 0);

  let html = `<div class="fam"><span class="famname">patch</span>
    <label>engine
      <select data-patch="engine">
        <option ${patch.engine === 'classic' ? 'selected' : ''}>classic</option>
        <option ${patch.engine === 'granular' ? 'selected' : ''}>granular</option>
      </select></label>
    <label>waves
      <select data-patch="waves">
        <option value="all" ${patch.waves.length > 1 ? 'selected' : ''}>sine·tri·sqr·saw</option>
        <option value="square" ${patch.waves.length === 1 && patch.waves[0] === 'square' ? 'selected' : ''}>square only</option>
        <option value="saw" ${patch.waves.length === 1 && patch.waves[0] === 'saw' ? 'selected' : ''}>saw only</option>
      </select></label>
    <label><input type="checkbox" data-patch="shaping" ${patch.shaping ? 'checked' : ''}
      title="does this synth shape its waveform? off = no shape/fold/width AND no wave screen"> shaping</label>
    <label><input type="checkbox" data-patch="noise" ${patch.noise ? 'checked' : ''}> noise</label>
    <label><input type="checkbox" data-patch="arp" ${patch.arp ? 'checked' : ''}> arp</label>
    <label><input type="checkbox" data-patch="cycle" ${patch.cycle ? 'checked' : ''}> cycles</label>
    <label>voices <input type="number" min="2" max="4" value="${patch.voices}" data-patch="voices"></label>
  </div>`;

  for (const fam of FAMILY_ORDER) {
    const ids = PLATE_IDS.filter(id => PARAMS[id].family === fam && !PARAMS[id].partnerOf);
    if (!ids.length) continue;
    html += `<div class="fam"><span class="famname">${fam}</span>` + ids.map(id => {
      const ok = legalOn(patch, id);
      return `<label class="${ok ? '' : 'illegal'}" title="${ok ? '' : 'this patch does not allow it'}">
        <input type="checkbox" data-pid="${id}" ${have.has(id) ? 'checked' : ''} ${ok ? '' : 'disabled'}> ${id}</label>`;
    }).join('') + `</div>`;
  }
  html += `<div class="fam"><span class="famname">menu</span>` + MENU_IDS.map(id =>
    `<label class="illegal" title="not immediate — it lives on the back face">${id}</label>`).join('') + `</div>`;

  const live = PAIRS.filter(p => have.has(p.a) && have.has(p.b));
  /* ⚠️ Which list you are looking at is not obvious from the checkboxes
     alone, and it decides whether `re-draw` will change anything. */
  const source = manifestEdits ? 'hand-edited'
    : SONGS[currentSongKey].controls ? 'authored by the song'
    : `drawn · seed ${manifestSeed.toString(16).slice(0, 6)}`;
  html += `<div class="pairnote">cost <b>${cost}</b>/${BUDGET} units
    · screen: <b>${manifest.scope || 'none'}</b>
    · controls: <b>${source}</b>
    · couplings: ${live.length ? live.map(p => `${p.a}+${p.b} → ${p.style}`).join(' · ') : 'none'}
    <button data-redraw="1">${manifestEdits ? 'discard edits · re-draw' : 're-draw controls'}</button></div>`;
  ed.innerHTML = html;

  const commit = () => {
    manifest = buildManifest();
    buildManifestEditor();
    ed.classList.add('open');
    // the manifest decides whether several genes have anything to act
    // on, so the inert-sweep warning has to be re-evaluated here too
    mode === 'sweep' ? buildSweep() : renderGrid();
  };
  ed.querySelector('button[data-redraw]').addEventListener('click', () => {
    manifestSeed = newSeed();
    manifestEdits = null;         // back to whatever the sampler draws
    commit();
  });
  ed.querySelectorAll('input, select').forEach(inp => inp.addEventListener('change', () => {
    const pk = inp.dataset.patch;
    if (pk) {
      /* Editing the patch writes THROUGH to the song, because the patch
         IS the song. ⚠️ It used to also null `manifestEdits`, which threw
         away every control you had ticked by hand — flipping `noise`
         silently redrew the whole plate. A patch change can only make
         controls ILLEGAL, so now it prunes rather than resets: your
         picks survive, minus the ones the new patch forbids. */
      const song = SONGS[currentSongKey];
      song.patch = song.patch || {};
      if (pk === 'waves') song.patch.waves = inp.value === 'all' ? [...DEFAULT_PATCH.waves] : [inp.value];
      else if (pk === 'voices') song.patch.voices = Math.max(2, Math.min(4, +inp.value || 4));
      else if (inp.type === 'checkbox') song.patch[pk] = inp.checked;
      else song.patch[pk] = inp.value;
      if (manifestEdits) {
        const next = songPatch(currentSongKey);
        manifestEdits = manifestEdits.filter(id => legalOn(next, id));
      }
    } else {
      const pid = inp.dataset.pid;
      const next = inp.checked
        ? [...manifest.controls, pid]
        : manifest.controls.filter(c => c !== pid);
      manifestEdits = next.filter(id => !PARAMS[id].partnerOf);
    }
    commit();
  }));
}
buildManifestEditor();
document.getElementById('editManifest').addEventListener('click', () =>
  document.getElementById('manifestEditor').classList.toggle('open'));

document.getElementById('genBack').addEventListener('click', () => gotoGeneration(genIdx - 1));
document.getElementById('genFwd').addEventListener('click', () => gotoGeneration(genIdx + 1));
document.getElementById('newBatch').addEventListener('click', newBatch);
document.getElementById('evolve').addEventListener('click', evolve);
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({
    songs: SONGS, locks: LOCKS, ratings,
    manifests: [...new Set(ratings.map(r => r.controls).filter(Boolean))],
    weights: model ? { names: featureNames(), w: model.w, b: model.b } : null,
  }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'parametric-taste.json';
  a.click();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Wipe all ratings?')) return;
  ratings = []; saveRatings(); model = null;
  renderStats(); renderWeights(); renderGrid();
});

document.getElementById('grid').addEventListener('click', (e) => {
  const lk = e.target.closest('button[data-lock]');
  if (lk) { lockAt(+lk.dataset.lock); e.stopPropagation(); return; }
  const ex = e.target.closest('button[data-excl]');
  if (ex) { excludeAt(+ex.dataset.excl); e.stopPropagation(); return; }
  const btn = e.target.closest('button[data-vote]');
  if (btn) { vote(+btn.dataset.idx, +btn.dataset.vote); e.stopPropagation(); return; }
  const card = e.target.closest('.card');
  if (card) { focusIdx = +card.dataset.idx; openModal(focusIdx); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const move = (d) => {
    const prev = focusIdx;
    focusIdx = Math.max(0, Math.min(batch.length - 1, (focusIdx < 0 ? 0 : focusIdx + d)));
    if (prev >= 0) updateCard(prev);
    updateCard(focusIdx);
    document.querySelector(`.card[data-idx="${focusIdx}"]`)?.scrollIntoView({ block: 'nearest' });
  };
  switch (e.key.toLowerCase()) {
    case 'arrowright': case 'j': move(1); e.preventDefault(); break;
    case 'arrowleft':  case 'k': move(-1); e.preventDefault(); break;
    case 'l':
      if (focusIdx < 0) break;
      if (mode === 'sweep') lockAt(focusIdx); else { vote(focusIdx, 1); move(1); }
      break;
    case 'x':
      if (focusIdx < 0) break;
      if (mode === 'sweep') excludeAt(focusIdx); else { vote(focusIdx, -1); move(1); }
      break;
    case 'r': if (mode === 'sweep') { sweepSeed = newSeed(); buildSweep(); } break;
    case '[': if (mode === 'batch') gotoGeneration(genIdx - 1); break;
    case ']': if (mode === 'batch') gotoGeneration(genIdx + 1); break;
    case 'n': if (mode === 'batch') newBatch(); break;
    case 'e': if (mode === 'batch') evolve(); break;
    case 'd': toggleTheme(); break;
    case 'escape': document.getElementById('modal').classList.remove('open'); break;
  }
});

/* ── sweep controls ───────────────────────────────────────────────── */
/* The picker doubles as the progress readout: a locked gene shows its
   padlock and the value it is pinned to, so "what have I already
   decided" is answerable without leaving the dropdown. Rebuilt from
   renderLocks so it can never drift out of step with the chips.
   (A locked gene is still sweepable — that is how you change your
   mind; the card holding the current value reads LOCKED.) */
function buildGeneSel() {
  const geneSel = document.getElementById('geneSel');
  geneSel.innerHTML = '';
  for (const gene of GENES) {
    const o = document.createElement('option');
    o.value = gene.k;
    const lv = LOCKS[gene.k];
    if (lv !== undefined) {
      o.textContent = `🔒  ${gene.k} = ${typeof lv === 'number' ? lv.toFixed(2) : lv}`;
    } else if (isNarrowed(gene)) {
      o.textContent = gene.t === 'e'
        ? `⊘  ${gene.k}  (${allowedOptions(gene).length} of ${gene.o.length} left)`
        : `⊘  ${gene.k}  (${floatBounds(gene)[0].toFixed(2)}–${floatBounds(gene)[1].toFixed(2)})`;
    } else {
      o.textContent = `      ${gene.k}  (${gene.t === 'f' ? `${gene.min}–${gene.max}` : gene.o.join(' · ')})`;
    }
    if (gene.k === sweepGene) o.selected = true;
    geneSel.appendChild(o);
  }
}
buildGeneSel();
document.getElementById('geneSel').addEventListener('change', (e) => {
  sweepGene = e.target.value; buildSweep();
});
document.getElementById('baseSel').addEventListener('change', (e) => {
  sweepBase = e.target.value; buildSweep();
});
document.getElementById('reroll').addEventListener('click', () => {
  sweepSeed = newSeed();
  if (sweepBase === 'neutral') {   // reroll only means something for a random base
    sweepBase = 'random';
    document.getElementById('baseSel').value = 'random';
  }
  buildSweep();
});
/* Everything on screen is a string of baked-in colours, so a flip has to
   redraw the lot: the grid, and the modal if it happens to be open. */
function toggleTheme() {
  lightMode = !lightMode;
  setTheme(lightMode);
  document.getElementById('themeBtn').textContent = lightMode ? 'nightfall' : 'daylight';
  renderGrid();
  if (focusIdx >= 0 && document.getElementById('modal').classList.contains('open')) openModal(focusIdx);
}
document.getElementById('themeBtn').addEventListener('click', toggleTheme);
document.getElementById('songChk').addEventListener('change', (e) => {
  songMode = e.target.checked;
  if (mode === 'batch') newBatch();
});
document.getElementById('modeBatch').addEventListener('click', () => setMode('batch'));
document.getElementById('modeSweep').addEventListener('click', () => setMode('sweep'));
document.getElementById('exportBtn2').addEventListener('click', () =>
  document.getElementById('exportBtn').click());

/* Deep links, in the same spirit as `?song=` and `?gene=`: boot straight
   into the surface you want to look at. `?batch=song` opens song mode,
   `?zoom=N` opens card N's modal (which is where the back face lives). */
const q = new URLSearchParams(location.search);
/* ⚠️ Set the theme BEFORE anything renders: the plate's inks are baked
   into the SVG strings, so a flip after the first batch would leave the
   cards drawn in the old palette until something re-rendered them. */
let lightMode = q.has('light')
  ? q.get('light') !== '0'
  : (() => { try { return localStorage.getItem(THEME_KEY) === 'light'; } catch { return false; } })();
setTheme(lightMode);
document.getElementById('themeBtn').textContent = lightMode ? 'nightfall' : 'daylight';
if (q.get('batch')) {
  songMode = q.get('batch') === 'song';
  document.getElementById('songChk').checked = songMode;
}
trainModel(); renderWeights(); renderLocks();
setMode(q.get('batch') || q.get('zoom') != null ? 'batch' : 'sweep');
renderGenNav();
if (q.get('zoom') != null) openModal(Math.max(0, Math.min(batch.length - 1, +q.get('zoom') || 0)));
</script>
</body>
</html>
