<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>parametric lab v3 — recipe faceplates</title>
<style>
  /* ── Lab chrome wears the simple theme's own tokens ────────────── */
  :root {
    --ink-rgb: 150, 150, 150;      /* simple's chrome cap */
    --ink-hi-rgb: 215, 215, 215;   /* legibility tier */
    --bg: #000;                    /* the page */
    --card-bg: #000;               /* a plate's own ground */
    --scrim: rgba(0, 0, 0, 0.88);  /* behind the zoom modal */
  }
  /* Daylight. Same token names, base values flipped so every alpha step
     keeps its contrast — see the THEMES table in the script for why this
     is not an inversion. The page sits a shade darker than the plates so
     a card still reads as a card without needing a heavier outline. */
  body.light {
    --ink-rgb: 64, 64, 64;
    --ink-hi-rgb: 20, 20, 20;
    --bg: #e6e6e4;
    --card-bg: #f4f4f3;
    --scrim: rgba(232, 232, 230, 0.92);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: rgba(var(--ink-rgb), 0.9);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    padding: 16px 20px 60px;
  }
  h1 {
    font-size: 11px; font-weight: 500; letter-spacing: 1.5px;
    text-transform: uppercase; color: rgba(var(--ink-rgb), 0.5);
    margin-bottom: 14px;
  }
  h1 b { color: rgba(var(--ink-hi-rgb), 0.95); font-weight: 500; }

  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-bottom: 8px; font-size: 11px;
  }
  .bar button, .bar select, .bar label.chk {
    background: rgba(var(--ink-rgb), 0.10);
    border: none; border-radius: 4px;
    color: rgba(var(--ink-hi-rgb), 0.9);
    font-size: 10px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 6px 12px; cursor: pointer;
  }
  .bar button:hover { background: rgba(var(--ink-rgb), 0.18); }
  .bar button.primary { background: rgba(var(--ink-rgb), 0.22); }
  .bar label.chk { display: inline-flex; align-items: center; gap: 6px; user-select: none; }
  .bar .stat { font-size: 10px; letter-spacing: 0.5px; color: rgba(var(--ink-rgb), 0.45); font-variant-numeric: tabular-nums; }
  /* ── the knob view controls (floor slider + width range) ────────── */
  .bar .knobctl {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase;
    color: rgba(var(--ink-rgb), 0.6);
  }
  .bar .knobctl b {
    font-weight: 500; color: rgba(var(--ink-hi-rgb), 0.85);
    font-variant-numeric: tabular-nums; min-width: 34px;
  }
  .bar .knobctl input[type="range"] { width: 90px; height: 12px; accent-color: rgba(var(--ink-hi-rgb), 0.75); }
  /* two native ranges stacked = one dual-thumb slider: the inputs are
     pointer-transparent, only their thumbs catch the mouse */
  .bar .dualwrap { position: relative; width: 110px; height: 14px; }
  .bar .dualwrap input[type="range"] {
    position: absolute; left: 0; top: 1px; width: 110px; height: 12px; margin: 0;
    pointer-events: none; -webkit-appearance: none; appearance: none; background: none;
  }
  .bar .dualwrap input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; pointer-events: auto;
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(var(--ink-hi-rgb), 0.9); cursor: ew-resize;
  }
  .bar .dualwrap input[type="range"]::-moz-range-thumb {
    pointer-events: auto; width: 12px; height: 12px; border-radius: 50%;
    background: rgba(var(--ink-hi-rgb), 0.9); border: none; cursor: ew-resize;
  }
  .bar .dualtrack {
    position: absolute; left: 0; right: 0; top: 5.5px; height: 3px;
    border-radius: 2px; background: rgba(var(--ink-rgb), 0.18);
  }
  .bar .dualfill {
    position: absolute; top: 5.5px; height: 3px;
    border-radius: 2px; background: rgba(var(--ink-hi-rgb), 0.55);
  }
  .bar .gennav { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; }
  .bar .gennav button { padding: 6px 9px; }
  .bar .gennav button:disabled { opacity: 0.3; cursor: default; }
  .bar .gennav .stat { min-width: 96px; text-align: center; }
  .hint { font-size: 10px; color: rgba(var(--ink-rgb), 0.35); letter-spacing: 0.3px; margin-bottom: 16px; line-height: 1.7; }

  /* manifest editor */
  #manifestEditor {
    display: none; margin: 4px 0 14px; padding: 10px 12px;
    background: rgba(var(--ink-rgb), 0.05); border-radius: 6px;
    font-size: 10px; letter-spacing: 0.4px;
  }
  #manifestEditor.open { display: block; }
  #manifestEditor .fam { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 6px; }
  #manifestEditor .famname {
    width: 58px; text-align: right; text-transform: uppercase;
    color: rgba(var(--ink-rgb), 0.35); font-weight: 500;
  }
  #manifestEditor label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: rgba(var(--ink-rgb), 0.75); }
  #manifestEditor input[type="number"] { width: 40px; background: rgba(var(--ink-rgb),0.1); border: none; border-radius: 3px; color: rgba(var(--ink-hi-rgb),0.9); padding: 2px 4px; }
  #manifestEditor .pairnote { margin-top: 8px; color: rgba(var(--ink-rgb), 0.3); }
  #manifestEditor .pairnote b { color: rgba(var(--ink-hi-rgb), 0.85); font-weight: 500; }
  #manifestEditor .pairnote button {
    margin-left: 10px; background: rgba(var(--ink-rgb), 0.12); border: none; border-radius: 3px;
    color: rgba(var(--ink-hi-rgb), 0.85); font-size: 9px; letter-spacing: 0.5px;
    text-transform: uppercase; padding: 3px 8px; cursor: pointer;
  }
  /* an id the PATCH rules out — greyed with the reason on hover, never
     hidden: a control that silently vanishes reads as a missing feature */
  #manifestEditor label.illegal { opacity: 0.3; cursor: default; text-decoration: line-through; }
  #manifestEditor select {
    background: rgba(var(--ink-rgb),0.1); border: none; border-radius: 3px;
    color: rgba(var(--ink-hi-rgb),0.9); padding: 2px 4px; font-size: 10px;
  }
  /* ── the WEIGHT GRID (v3) ─────────────────────────────────────────
     Every element the manifest can carry is a ROW; ticking a row active
     makes a likelihood column APPEAR beside it — a slider and the
     percentage. Inactive rows keep the column's space (visibility, not
     display) so the grid never reflows as you toggle. */
  #manifestEditor .wgrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 2px 26px; margin: 10px 0 4px;
  }
  #manifestEditor .wgrow {
    display: grid; grid-template-columns: 44px minmax(0, 1fr) 110px 46px;
    align-items: center; gap: 8px; padding: 2px 0;
  }
  /* one line per row — the dependency notes ellipsize (full text on
     hover) rather than folding the grid into ragged heights */
  #manifestEditor .wgrow label {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #manifestEditor .wgrow .famtag {
    text-align: right; text-transform: uppercase; font-size: 9px;
    color: rgba(var(--ink-rgb), 0.28); letter-spacing: 0.5px;
  }
  #manifestEditor .wgrow label { color: rgba(var(--ink-rgb), 0.8); }
  #manifestEditor .wgrow .ride { color: rgba(var(--ink-rgb), 0.35); }
  #manifestEditor .wgrow input[type="range"] {
    width: 110px; height: 10px; accent-color: rgba(var(--ink-hi-rgb), 0.75);
  }
  #manifestEditor .wgrow .pct {
    text-align: right; font-variant-numeric: tabular-nums;
    color: rgba(var(--ink-hi-rgb), 0.9);
  }
  #manifestEditor .wgrow.off input[type="range"],
  #manifestEditor .wgrow.off .pct { visibility: hidden; }
  #manifestEditor .wgrow.always .pct { color: rgba(120, 220, 150, 0.85); }

  /* card grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .card {
    position: relative; border-radius: 8px; overflow: hidden;
    background: var(--card-bg); outline: 1px solid rgba(var(--ink-rgb), 0.10);
    cursor: pointer; transition: outline-color 0.15s;
  }
  .card:hover { outline-color: rgba(var(--ink-rgb), 0.30); }
  .card.liked   { outline: 1px solid rgba(120, 220, 150, 0.55); }
  .card.disliked{ outline: 1px solid rgba(230, 100, 90, 0.4); opacity: 0.45; }
  .card.focus { outline: 2px solid rgba(var(--ink-hi-rgb), 0.8); }
  .card svg { display: block; width: 100%; height: auto; }
  /* rating plates start at the spectrum bar, like the app sim's bottom
     section — the 84px field sliver is clipped off with the sim's
     margin trick, as a % of width (84/393) so scaled cards clip the
     same strip */
  .simclip { overflow: hidden; }
  .simclip svg { margin-top: -21.374%; }
  .card .meta {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px 7px; font-size: 9px; letter-spacing: 0.5px;
    color: rgba(var(--ink-rgb), 0.4); font-variant-numeric: tabular-nums;
  }
  .card .meta .votes { display: flex; gap: 4px; }
  .card .meta button {
    background: rgba(var(--ink-rgb), 0.10); border: none; border-radius: 3px;
    color: rgba(var(--ink-hi-rgb), 0.85); font-size: 10px; width: 26px; height: 20px; cursor: pointer;
  }
  .card .meta button:hover { background: rgba(var(--ink-rgb), 0.22); }
  .card .meta button.wide { width: auto; padding: 0 8px; letter-spacing: 0.5px; text-transform: uppercase; font-size: 9px; }
  .card .meta button.on { background: rgba(230, 160, 90, 0.25); color: rgba(245, 205, 155, 0.95); }
  .card.excluded { outline: 1px solid rgba(230, 160, 90, 0.35); opacity: 0.34; }
  .card.excluded:hover { opacity: 0.7; }
  .card .score { color: rgba(var(--ink-rgb), 0.55); }
  .card .sweepval b { color: rgba(var(--ink-hi-rgb), 0.95); font-weight: 500; }
  .card.locked { outline: 1px solid rgba(120, 220, 150, 0.65); }

  /* locks panel */
  #locks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; font-size: 10px; }
  #locks .lk {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(120, 220, 150, 0.12); border-radius: 4px; padding: 4px 8px;
    color: rgba(var(--ink-hi-rgb), 0.85); letter-spacing: 0.4px; font-variant-numeric: tabular-nums;
  }
  #locks .ex {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(230, 160, 90, 0.12); border-radius: 4px; padding: 4px 8px;
    color: rgba(240, 200, 155, 0.9); letter-spacing: 0.4px; font-variant-numeric: tabular-nums;
  }
  #locks .lk button, #locks .ex button { background: none; border: none; color: rgba(var(--ink-rgb), 0.6); cursor: pointer; font-size: 11px; padding: 0; }
  #locks .none b { color: rgba(var(--ink-hi-rgb), 0.8); font-weight: 500; }
  #locks .none { color: rgba(var(--ink-rgb), 0.3); letter-spacing: 0.4px; }

  /* W5: the ?voices session banner — loud on purpose */
  #voicesChip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(230, 160, 90, 0.18); border-radius: 4px; padding: 4px 9px;
    color: rgba(240, 200, 155, 0.95); letter-spacing: 0.5px; font-size: 10px;
    font-variant-numeric: tabular-nums;
  }

  /* champions panel — the durable record a wave produces */
  #champs { display: none; margin-bottom: 16px; max-width: 900px; }
  #champs.open { display: block; }
  #champs .chead {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 8px; font-size: 10px; color: rgba(var(--ink-rgb), 0.4);
    letter-spacing: 0.4px;
  }
  #champs .crow {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px;
    border-radius: 5px; background: rgba(var(--ink-rgb), 0.05); margin-bottom: 6px;
  }
  #champs .thumb {
    flex: 0 0 auto; width: 92px; background: var(--card-bg);
    border-radius: 4px; overflow: hidden; outline: 1px solid rgba(var(--ink-rgb), 0.12);
  }
  #champs .thumb svg { display: block; width: 92px; height: auto; }
  #champs .cbody { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  #champs .cbody input {
    background: rgba(var(--ink-rgb), 0.08); border: none; border-radius: 3px;
    color: rgba(var(--ink-hi-rgb), 0.9); font: inherit; font-size: 11px;
    padding: 4px 6px; width: 100%; letter-spacing: 0.3px;
  }
  #champs .cbody input.notes { font-size: 10px; color: rgba(var(--ink-rgb), 0.7); }
  #champs .cmeta {
    font-size: 9.5px; color: rgba(var(--ink-rgb), 0.45); letter-spacing: 0.4px;
    font-variant-numeric: tabular-nums; line-height: 1.6; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  #champs .cmeta b { color: rgba(var(--ink-hi-rgb), 0.8); font-weight: 500; }
  #champs .cmeta .bred { color: rgba(235, 185, 130, 0.9); }
  #champs .cdel {
    flex: 0 0 auto; background: none; border: none; cursor: pointer;
    color: rgba(var(--ink-rgb), 0.45); font-size: 12px; padding: 2px 4px;
  }
  /* W4: the champion → pins distillation panel */
  #champs .cpins {
    flex: 0 0 auto; background: rgba(var(--ink-rgb), 0.08); border: none;
    border-radius: 3px; color: rgba(var(--ink-rgb), 0.7); cursor: pointer;
    font: inherit; font-size: 10px; padding: 3px 8px; letter-spacing: 0.4px;
  }
  #champs .cpins.on { background: rgba(120, 220, 150, 0.18); color: rgba(165, 235, 190, 0.95); }
  #champs .cpinspanel {
    margin-top: 4px; padding: 8px 9px; border-radius: 4px;
    background: rgba(var(--ink-rgb), 0.05);
  }
  #champs .pghead {
    font-size: 9.5px; color: rgba(var(--ink-rgb), 0.5); letter-spacing: 0.3px;
    line-height: 1.5; margin-bottom: 7px;
  }
  #champs .pghead b { color: rgba(var(--ink-hi-rgb), 0.8); font-weight: 500; }
  #champs .pgrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 3px 12px; margin-bottom: 8px;
  }
  #champs .pgene {
    display: flex; align-items: center; gap: 6px; font-size: 10px;
    color: rgba(var(--ink-rgb), 0.75); letter-spacing: 0.3px; cursor: pointer;
    font-variant-numeric: tabular-nums; min-width: 0;
  }
  #champs .pgene span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #champs .pgene b { color: rgba(var(--ink-hi-rgb), 0.9); font-weight: 500; }
  #champs .pgene.noise { opacity: 0.45; }
  #champs .pgfoot { display: flex; gap: 6px; align-items: center; }
  #champs .pgfoot select, #champs .pgfoot button {
    background: rgba(var(--ink-rgb), 0.08); border: none; border-radius: 3px;
    color: rgba(var(--ink-hi-rgb), 0.85); font: inherit; font-size: 10px;
    padding: 4px 8px; cursor: pointer;
  }
  #champs .cnone { font-size: 10px; color: rgba(var(--ink-rgb), 0.3); letter-spacing: 0.4px; }
  .card.champ { outline: 1px solid rgba(150, 190, 255, 0.6); }
  .card .votes button.star.on { color: rgba(170, 205, 255, 0.95); }

  /* swept-gene description */
  #geneDesc { max-width: 780px; margin: 2px 0 14px; font-size: 11px; line-height: 1.65; }
  #geneDesc .dsc { color: rgba(var(--ink-rgb), 0.62); letter-spacing: 0.2px; }
  #geneDesc .dsc b { color: rgba(var(--ink-hi-rgb), 0.95); font-weight: 500; letter-spacing: 0.5px; }
  #geneDesc .warn {
    display: block; margin-top: 5px; padding: 5px 9px; border-radius: 4px;
    background: rgba(230, 160, 90, 0.10); color: rgba(235, 185, 130, 0.92);
    font-size: 10px; letter-spacing: 0.3px;
  }

  /* zoom modal */
  #modal {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: var(--scrim); align-items: center; justify-content: center; gap: 28px;
  }
  #modal.open { display: flex; }
  #modal .plate { background: var(--card-bg); outline: 1px solid rgba(var(--ink-rgb), 0.15); border-radius: 12px; overflow: hidden; }
  #modal .plate svg { display: block; width: 420px; height: auto; }
  #modal .plate.back { opacity: 0.85; }
  #modal .plate.back svg { width: 250px; }
  /* ⚠️ 36 gene rows is taller than a short window, and the modal centres
     its columns — so the top of this list (where the champion button
     sits) was being pushed to a NEGATIVE y and became unclickable.
     Cap it and let it scroll instead of letting flex push it out. */
  #modal .genes {
    max-width: 260px; max-height: 92vh; overflow-y: auto;
    font-size: 10px; letter-spacing: 0.4px; line-height: 1.9;
    color: rgba(var(--ink-rgb), 0.6); font-variant-numeric: tabular-nums;
  }
  #modal .genes b { color: rgba(var(--ink-hi-rgb), 0.9); font-weight: 500; }
  #modal .genes .mf {
    display: block; margin: 6px 0; padding: 5px 8px; border-radius: 4px;
    background: rgba(var(--ink-rgb), 0.08); line-height: 1.5;
    color: rgba(var(--ink-hi-rgb), 0.75);
  }

  /* model weight panel */
  #weights { margin-top: 26px; max-width: 560px; }
  #weights h2 { font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: rgba(var(--ink-rgb), 0.4); margin-bottom: 8px; }
  .wrow { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.4px; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .wrow .wname { width: 190px; color: rgba(var(--ink-rgb), 0.7); text-align: right; }
  .wrow .wbar { height: 4px; border-radius: 2px; }
  .wrow .wpos { background: rgba(120, 220, 150, 0.7); }
  .wrow .wneg { background: rgba(230, 100, 90, 0.6); }

  /* ── APP SIM (P0 of SPEC-parametric-faceplates) ──────────────────── */
  #appSim { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  #appSim .songstrip { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
  #appSim .songstrip h2 {
    font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase;
    color: rgba(var(--ink-rgb), 0.4); margin-bottom: 4px;
  }
  #appSim .songchip {
    text-align: left; background: rgba(var(--ink-rgb), 0.08); border: none; border-radius: 6px;
    color: rgba(var(--ink-hi-rgb), 0.85); font-size: 11px; letter-spacing: 0.4px;
    padding: 9px 12px; cursor: pointer;
  }
  #appSim .songchip:hover { background: rgba(var(--ink-rgb), 0.16); }
  #appSim .songchip.on { background: rgba(var(--ink-rgb), 0.24); }
  #appSim .songchip .seedtag { display: block; margin-top: 2px; font-size: 9px; color: rgba(var(--ink-rgb), 0.45); font-variant-numeric: tabular-nums; }
  #appSim .songchip .seedtag.fresh { font-style: italic; }
  /* The phone: bezel around the rendered page, hamburger overlaid on the
     field sliver — HTML on top of the SVG, since the menu is app chrome
     the genome will never own. */
  #appSim .phone {
    position: relative; width: 393px; border-radius: 28px; overflow: hidden;
    border: 1px solid rgba(var(--ink-rgb), 0.35); background: var(--card-bg);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
  }
  #appSim .phone svg { display: block; width: 393px; height: auto; }
  /* Hide the plate's 84px field sliver — the phone draws its own field
     (the lissajous screen) above, at app size. */
  #appSim .phone .plateclip { overflow: hidden; }
  /* play face (08-16): the phone's TOP HALF is black GLASS in both lab
     themes — the field's backing must not follow --card-bg into
     daylight, or the split (black over paper) dies with the theme. */
  #appSim .phone .glass { background: #000; }
  #appSim .phone .plateclip svg { margin-top: -84px; }
  #appSim .burger {
    position: absolute; top: 10px; right: 12px; z-index: 3;
    background: rgba(var(--ink-rgb), 0.14); border: none; border-radius: 6px;
    color: rgba(var(--ink-hi-rgb), 0.9); font-size: 13px; line-height: 1;
    padding: 6px 9px; cursor: pointer;
  }
  #appSim .statemenu {
    position: absolute; top: 40px; right: 12px; z-index: 4;
    display: flex; flex-direction: column; border-radius: 8px; overflow: hidden;
    background: rgba(20, 20, 20, 0.96); border: 1px solid rgba(var(--ink-rgb), 0.3);
  }
  body.light #appSim .statemenu { background: rgba(244, 244, 243, 0.97); }
  #appSim .statemenu button {
    background: none; border: none; text-align: left; cursor: pointer;
    color: rgba(var(--ink-hi-rgb), 0.85); font-size: 11px; letter-spacing: 0.6px;
    text-transform: uppercase; padding: 10px 22px 10px 14px;
  }
  #appSim .statemenu button:hover { background: rgba(var(--ink-rgb), 0.14); }
  #appSim .statemenu button.on { color: rgba(var(--ink-hi-rgb), 1); background: rgba(var(--ink-rgb), 0.20); }
  #appSim .placeholder {
    width: 393px; height: 736px; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 11px; letter-spacing: 0.6px; line-height: 2;
    color: rgba(var(--ink-rgb), 0.45); text-transform: uppercase;
  }
  #appSim .simmeta { max-width: 300px; font-size: 10px; letter-spacing: 0.4px; line-height: 1.8; color: rgba(var(--ink-rgb), 0.55); }
  #appSim .simmeta b { color: rgba(var(--ink-hi-rgb), 0.9); font-weight: 500; }
  #appSim .simmeta .uij {
    display: block; margin-top: 8px; padding: 6px 8px; border-radius: 4px;
    background: rgba(var(--ink-rgb), 0.08); color: rgba(var(--ink-hi-rgb), 0.75);
    font-family: ui-monospace, Menlo, monospace; font-size: 9px; line-height: 1.6;
    cursor: copy; white-space: pre-wrap; word-break: break-all;
  }
  /* The vote row sits UNDER the bezel, not inside it — the app's own
     screen never shows a rating control; liking is a lab gesture. */
  #appSim .phonecol { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #appSim .simvotes { display: flex; gap: 8px; }
  #appSim .simvotes button {

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   0 · THEME TOKENS — lifted from src/theme/palette.js + App.css simple
   ════════════════════════════════════════════════════════════════════ */
const CLASSIC_PALETTE = [
  '#ff4136', '#2ecc40', '#0074d9', '#ffdc00', '#bb8fce',
  '#85c1e9', '#82e0aa', '#f8b500', '#e74c3c', '#1abc9c',
  '#ff7eb6', '#a78bfa',
];
function shift(hex, amt, toward) {              // toward 255 = lighten, 0 = darken
  const n = parseInt(hex.slice(1), 16);
  const ch = (s) => { const c = (n >> s) & 0xff; return Math.round(c + (toward - c) * amt).toString(16).padStart(2, '0'); };
  return `#${ch(16)}${ch(8)}${ch(0)}`;
}

/* ── DAYLIGHT MODE ───────────────────────────────────────────────────
   A viewing aid first (these plates are hard to read on a bright
   screen), and a look worth judging second — if the app ever gets a
   light theme, an inverted faceplate is exactly the thing to look at.

   ⛔ NOT an inversion of the drawing. Every ink here is alpha over the
   ground, so swapping #000 for #fff would leave a 0.3-alpha gray-150
   label almost invisible on paper. What flips is the ink's BASE VALUE:

     INK(0.30)  dark  gray-150, lifted → Δ61    light  gray-64 over paper → Δ54
     HI(0.90)   dark  gray-215 → Δ194           light  gray-20 over paper → Δ202
     TRACK      white 0.17 over #000 → Δ43      black 0.11 over paper     → Δ27

   ⚠️ 08-16: the two grounds are no longer contrast-symmetric on
   purpose. The old matched table (Δ45/Δ47 at INK 0.30) read fine on
   paper and nearly black-on-black on screen, so dark now runs the LIFT
   (see THEMES) and light's base darkened 86 → 64 ("make the text
   slightly darker on the white background" — Dan).

   ⚠️ The voice palette flips direction too. `SIMPLE_PALETTE` is the
   classic hues lightened 18% *to carry on black*; on paper those wash
   out (yellow worst), so daylight darkens by 22% instead. Same hues,
   opposite correction.

   ⛔ `dim()` must mix toward the GROUND, not toward black — on paper,
   mixing a voice colour with black makes it louder, which is the exact
   opposite of what every caller wants.
   ─────────────────────────────────────────────────────────────────── */
const DARK_PALETTE  = CLASSIC_PALETTE.map(c => shift(c, 0.18, 255));
const LIGHT_PALETTE = CLASSIC_PALETTE.map(c => shift(c, 0.22, 0));
/* ⭐ THE DARK LIFT (Dan, 2026-08-16: "almost impossible to see the
   blacks"). Dim-on-black falls under the visibility floor much faster
   than dim-on-paper, so the dark theme lifts its LOW ink tiers on a
   curve which raises INK(0.10) hairlines and INK(0.28) mute outlines a
   real step while leaving the bright tiers almost untouched. `dim()`
   gets the matching correction: on dark it mixes less black in (the
   same exponent on the distance to full colour), and the track sits
   well above light's 0.11. Light needs none of this.
   → Round 2 (Dan, same day, on the play-face rating cards: "still very
   dim and difficult to see compared to the white background"): the
   first lift (0.75, track 0.17) wasn't enough — most control chrome
   draws in the 0.08–0.35 tiers, which 0.75 left at 0.15–0.45 opacity
   of gray-150. Now alpha^0.5 + ink base 150→162 + track 0.26:
   INK(0.12) washes 0.20→0.35, INK(0.3) labels 0.41→0.55, while
   INK(0.85) only 0.89→0.92 — the ordering of tiers is preserved, the
   floor is what moved. ⚠️ 162 nudges past web simple's gray-150 anchor
   on purpose: visibility beat the anchor when Dan compared the two
   grounds side by side. */
const THEMES = {
  dark:  { ink: '162,162,162', hi: '215,215,215', track: 'rgba(255,255,255,0.26)',
           ground: '#000000', mix: 'black',  palette: DARK_PALETTE, lift: 0.5 },
  light: { ink: '64,64,64',    hi: '20,20,20',    track: 'rgba(0,0,0,0.11)',
           ground: '#f4f4f3', mix: 'white',  palette: LIGHT_PALETTE },
};
const THEME_KEY = 'wt-parametric-lab-theme';
let THEME = THEMES.dark;
const INK = (a) =>                              // simple's chrome cap
  `rgba(${THEME.ink},${THEME.lift ? Math.pow(a, THEME.lift).toFixed(3) : a})`;
const HI  = (a) => `rgba(${THEME.hi},${a})`;    // legibility tier
let TRACK = THEME.track;                        // arc/fader track level
let GROUND = THEME.ground;                      // the plate's own paper
function dim(color, pct) {                      // PanPot's dim idiom
  if (THEME.lift) pct = 100 - (100 - pct) * THEME.lift;
  return pct >= 100 ? color : `color-mix(in srgb, ${color} ${pct}%, ${THEME.mix})`;
}
function voiceColor(i) { return THEME.palette[i % THEME.palette.length]; }
function setTheme(light) {
  THEME = light ? THEMES.light : THEMES.dark;
  TRACK = THEME.track; GROUND = THEME.ground;
  document.body.classList.toggle('light', light);
  try { localStorage.setItem(THEME_KEY, light ? 'light' : 'dark'); } catch { /* private mode */ }
}
/* ── the app-sim's PAPER face (Dan, 2026-08-16) ──────────────────────
   The phone mirrors the iOS play screen's split: black glass on top
   (the field — the sim's lissajous is already black in both themes),
   PAPER below it (the whole plate: spectrum bar, pane, rail). So the
   sim renders its plate under a forced light theme whatever the lab
   is set to — `withTheme` swaps the module ink state around one render
   and restores it, ⛔ never touching the persisted lab theme or
   `body.light`. The palette stays DARK_PALETTE, not light's darkened
   one: iOS dropped the −22% darken on 08-16 ("light palette == dark's"),
   so paper plates carry the same voice colours as glass. */
const PAPER_THEME = { ...THEMES.light, palette: DARK_PALETTE };
function withTheme(t, fn) {
  const pT = THEME, pTr = TRACK, pG = GROUND;
  THEME = t; TRACK = t.track; GROUND = t.ground;
  try { return fn(); } finally { THEME = pT; TRACK = pTr; GROUND = pG; }
}
/* ── rating surfaces wear the play face too (Dan, 2026-08-16) ────────
   The spreads Dan rates (batch/song grid, sweep, pick, the zoom modal)
   draw exactly like the app sim's bottom section: program-size palette
   orbs, field sliver clipped off by `.simclip` — so a vote judges what
   the play face will actually show. ⭐ THEME-AWARE (Dan, same day:
   "dark mode no longer works"): the play face exists in both app
   themes, so a dark lab rates DARK plates and a daylight lab rates
   paper ones — but light always swaps to PAPER_THEME, because iOS
   08-16 settled "light palette == dark's" and THEMES.light still
   carries the −22% darkened palette for the lab's own chrome.
   `transportTrial` is ALWAYS on here (Dan, later
   same day: "remove play/auto from the left bar, and the progress bar
   — we aren't using this anymore"): left column = the full-height main
   mixer only, no cycle capsule (retune's ring owns the countdown),
   play/pause on the rail — deliberately NOT tied to the sim's trial
   chip, so a chip toggle can't silently change what a vote judged.
   ⛔ Champions (star-time witness, staleness re-render, svgFor) and
   the fixtures export stay on the plain render() — the parity
   vocabulary is unchanged. */
const renderRated = (m, g, seed) =>
  withTheme(THEME === THEMES.dark ? THEMES.dark : PAPER_THEME, () =>
    render(m, g, seed, { playFace: true, transportTrial: true }));

/* ── the KNOB FLOOR (Dan 2026-08-16) ─────────────────────────────────
   A floor in px on the smallest control mark: no knob draws under it,
   and neither does a pan knob or a mute cap — the per-voice marks scale
   up together (cell included) so the voice grids keep their geometry.
   0 = off; the zone's final shrink-to-fit can still take the whole
   plate down together. ⚠️ Round two: no longer view-only — KNOB and the
   per-voice scale floor on it at PACK time, so the value travels in the
   recipes AND champions exports (`minKnob`) and the Swift port packs
   with it (`PlatePacker.layout(minKnob:)`). Champion `current` geometry
   is only replayable knowing the floor it was exported under. */
const MINK_KEY = 'wt-parametric-lab-minknob';
let MIN_KNOB = 0;
try { MIN_KNOB = Math.max(0, +localStorage.getItem(MINK_KEY) || 0); } catch { /* private mode */ }

/* ════════════════════════════════════════════════════════════════════
   0b · iPHONE 17 LISTEN-PAGE GEOMETRY (pt) — from ListenView.swift
   field (square, elided to a sliver) → spectrum bar (56) →
   pane region (~292, ⛔ fixed height) → ListenRail (52)
   ════════════════════════════════════════════════════════════════════ */
const PHONE_W  = 393;
const FIELD_H  = 84;
const SPECT_H  = 56;
const REGION_H = 292;
const RAIL_H   = 52;
const TOTAL_H  = FIELD_H + SPECT_H + REGION_H + RAIL_H;
/* ONE fixed rail, a hairline away from the pane: play/pause · volume ·
   auto. ⛔ v1's right rail (snapshot · prev/next song · shuffle) was
   built, parked at `RIGHT_RAIL = false`, and is DELETED in v2 — dead
   chrome in a file being rewritten. `SPEC-song-ui-manifest-v1.md` §1
   keeps the reasoning if those actions come back. */
const LCOL_W   = 46;
/* The main mixer's line width (the left column's twin L/R meter lanes)
   — extracted because it is also the FLOOR under every drawn voice
   fader (Dan, 2026-08-16: plate faders were rendering thinner than the
   chrome beside them). One constant so the two can never drift apart. */
const MASTER_VW = 5;
/* How far through the current auto-cycle the mock-ups are drawn. A
   static number on purpose — these are faceplates, not a running app —
   but it must be the SAME everywhere so the ring and the bar agree. */
const CYCLE_PROGRESS = 0.42;

/* Which control render() last promoted to hero. Set inside render and
   read by the card meta immediately after, so it is always the hero of
   the plate directly above it. A return value would be cleaner, but
   render() is called from inside template literals in three places. */
let LAST_HERO = null;

/* Which per-voice strip the last render fused, if any: 'mixer' (faders +
   pans), 'mute' (mute caps + pans), or null. Same witness pattern as
   LAST_HERO, and the only honest way to ASK whether a plate clustered —
   the drawn label is suppressed by `labels: hidden` and the standalone
   mute grid carries the same word, so reading the SVG cannot tell you.
   ⛔ Never both: the two kinds are mutually exclusive by construction
   (`mutes` xor `levels`), which is what this exists to keep provable. */
let LAST_CLUSTER = null;

/* ════════════════════════════════════════════════════════════════════
   1 · THE PATCH — v2's new layer, and the one that decides what is LEGAL
   ────────────────────────────────────────────────────────────────────
   Each song is authored as a patch first (by hand now, parametrically
   later). The faceplate reads it as GATES: a control whose `requires`
   the patch fails can never be drawn, whatever the weights say.

   Two constraints fall out of this with no special case at all:

     · "not on cello grains" — one `engine: 'granular'` retires shape,
       fold and wave level together.
     · "width only on a square-only synth, and only when there's no
       shape knob" — a square-only patch has nothing to morph, so
       `shape` fails its own gate and `width` takes the slot. The PATCH
       enforces it, not the layout engine.

   ⚠️ A granular patch therefore has NOTHING in the tone family. It ships
   as filter + reverb until grains get their own family (size · density ·
   position · spray) — see PLAN §1.
   ════════════════════════════════════════════════════════════════════ */
const DEFAULT_PATCH = {
  engine: 'classic',        // 'classic' (sine/tri/square/saw) | 'granular'
  waves: ['sine', 'triangle', 'square', 'saw'],
  /* ⭐ v3: a RANGE, 2–6. A recipe no longer fixes its voice count — each
     draw picks a count inside the range (from the manifestSeed, so one
     draw always answers the same), which is Dan's "range for what the
     number of voices might be". The RESOLVED count still trickles all
     the way down: the spectrum bar's stems and orb handles, the mute
     grid, the pan grid, the fader row and the mixer cluster all size
     themselves off the one number the draw settled on.
     ⛔ Still not a gene — the count is drawn WITH the controls (the
     manifest seed), never with the styling, so re-styling a plate can
     never change how many voices exist.
     ⚠️ Clamped to 2–6: one voice is not a chord, and per-voice blocks
     get tight past six. At 5+ the cluster stops being allowed (see
     `clusterAllowed`) — Dan: a five-voice cluster stops looking good. */
  voices: [2, 6],
  noise: true,
  arp: false,
  /* ⭐ Does this synth SHAPE its waveform at all? `false` is a synth
     whose oscillator is what it is — no morph, no fold, no PWM. It gates
     the three waveshaping controls AND the wave screen together, because
     they are one idea: with nothing able to redraw the silhouette there
     is nothing for a screen to witness, and a picture of a wave that
     never changes is decoration. ⛔ Two consequences, one field — not
     two special cases, and it is the answer to "where do I turn the
     viewer off": you say the synth does not shape its wave. */
  shaping: true,
  cycle: true,              // is auto-cycling part of this song at all?
};
const squareOnly = (p) => p.waves.length === 1 && p.waves[0] === 'square';
/* A patch may still say `voices: 4` (the stress plate does) — a bare
   number reads as a one-value range, so nothing downstream branches. */
const voiceRange = (p) => Array.isArray(p.voices) ? p.voices : [p.voices || 4, p.voices || 4];

/* ════════════════════════════════════════════════════════════════════
   2 · PARAM CATALOG — the control VOCABULARY
   ────────────────────────────────────────────────────────────────────
   ⭐ v2's admission rule: `imm` — does moving this change the sound NOW?
   The faceplate is the IMMEDIATE surface. Everything else lives on the
   back face (§9), so the plate can promise that every control on it
   responds the instant you touch it.

   `w`    sampling weight — Dan's visibility tiers as numbers:
          1.0 = ** always · 0.6 = * mostly · below = situational.
          `tune` is 0.5 because it was specified as half of remix.
          ⚠️ On a `ridesWith` row it is CONDITIONAL on the host, not the
          rate you will observe.
   `cost` what it claims of the plate. A knob is 1, a per-voice array 2,
          the mixer cluster 3. The BUDGET is in these units, not in a
          control count: a per-voice array and a knob are one entry
          each and nothing like the same claim on the plate (PLAN §3).
   `requires`  patch gate. Absent = legal on every patch.
   `xor`  at most one row per group: `filter+res` is the generic single
          filter, `lpf`/`hpf` the split pair. Drawing both would be two
          answers to one question.
          ⚠️ An xor'd row's OBSERVED rate is therefore below its `w` —
          whichever member is offered first claims the group, so `filter`
          lands ~0.30 against a nominal 0.50 while `lpf` (0.60) takes
          most of them. That is the exclusion working, not the weight
          being wrong; read the group's total, not the member's.
   ════════════════════════════════════════════════════════════════════ */
/* ⛔ v3: the `tuning` family is gone — detune reads as "tune drift" and
   lives WITH remix and tune (Dan: "mostly close to the remix + tune
   knobs"), so it moved into `action` and the family had no members left. */
const FAMILY_ORDER = ['voices', 'tone', 'filter', 'space', 'arp', 'action'];
const BUDGET = 11;          // cost units — see PLAN §3

const PARAMS = {
  /* ── voices ───────────────────────────────────────────────────────
     ⛔ There is NO pitch control here, and that is the point. Frequency
     lives in the spectrum bar's orb handles, which are fixed chrome on
     every song — so it is always reachable without any song spending
     pane space on it (Dan, 2026-08-14, settling the one collision v2
     opened: a pitch ARRAY and the orbs cannot both be the reason the
     other is unnecessary, and the orbs were there first).

     ⚠️ Consequence worth knowing: the ** tier is now `remix` ALONE, and
     the 2 cost units the array used to take are simply given back — the
     mean plate went 9.7 → 8.1 units (square waves) and 8.7 → 6.8
     (cello). Plates got LIGHTER, not denser: the sampler offers each
     candidate once, so freeing space does not invite more controls, it
     only stops the budget from rejecting the ones already offered.
     The visible effect is that the low-weight tiers now land nearer
     their nominal rates (waveLevel 0.37 → 0.40, detune 0.25 → 0.28). */
  /* ⭐ The mixer is the RARE half of this family (Dan, 2026-08-14):
     panning is only sometimes there, and volume rarer still. Both were
     a tier too high — pan sat with the `*` group at 0.6 and measured
     0.61, which made a mixer feel like standard equipment. Mutes stay
     `*`: a mute is a performance control, a fader is a setup one.
     ⛔ SUPERSEDED v3.1 — mutes and levels split one categorical group
     50/50 at Dan's asking (40 · 40 · 20 neither), so "rare half" no
     longer describes it: they are now equally likely and the rarity
     lives in the group's 20% gap. The recipes weight pans at 0.7, well
     above the 0.35 this note was written against. */
  /* ⛔ HISTORICAL — `levels` no longer rides `pans`; kept because it is
     why the mechanism exists and it still governs any future rider.
     ⚠️ `ridesWith` — volume was offered only on a plate that already had
     PANS, at a conditional rate. Independent draws put pan at 35% and
     volume at 18% exactly as asked, but then both landed together on
     only 6% of plates, and BOTH is what fires the mixer cluster — so
     `mixerScatter` and `mutePlace: cluster`, two of the more interesting
     genes, became things you would see once in seventeen cards.
     Riding pan kept volume's OBSERVED rate where it was asked for (18%)
     and lifted the cluster from 6% to the same 18%. It also said
     something true: four volume faders with no pans is a stranger object
     than a mixer.
     ⚠️ 0.7, not 0.5: the nominal 0.35 × w overstates it, because the
     rider is judged last and a 2-cost block is the one most often
     refused by what is left of the budget. Calibrated against the
     measurement, not the arithmetic. */
  /* ⛔ v3.1, Dan 2026-08-15: MUTES AND LEVELS ARE THE SAME QUESTION —
     "mute/unmute kind of accomplishes the same thing as a mixer but with
     less granularity". Two answers to one question, which is exactly
     what `xor` is for, so they share the `voiceCoarse` group: at most
     one per plate, and (as the group has no floor) neither is fine.
     The cluster is therefore always a PAIR and never a triple —
     mute+pan, or mixer+pan, never mute+mixer+pan.

     ⭐ The group is CATEGORICAL (see `CATEGORICAL_XOR`), so these two
     weights are a SPLIT, not two coin-flips: 0.4 + 0.4 is Dan's
     "40% mutes, 40% levels, 20% neither", read straight off the
     sliders. Left sequential the ratio was 70/14 from two equal 0.7s —
     whichever the shuffle reached first claimed the group.

     ⛔ `levels` no longer rides `pans`. A categorical member cannot be a
     rider (its rate would become share × P(host) = 28%, and the slider
     would stop meaning what it says), and Dan's "each can also be
     individually added" licenses a fader set standing alone. The rider
     was calibrated in v3 against pans at 0.35, where it lifted the
     cluster from 6% to 18%; the recipes weight pans at 0.7, so the
     cluster now lands near 28% WITHOUT it and the problem it solved has
     gone away. ⚠️ Consequence: faders with no pans, on ~29% of the
     plates that draw levels. */
  levels:     { label: 'level',  family: 'voices', kind: 'voiceFaders', imm: true, w: 0.4, cost: 2,
                xor: 'voiceCoarse:level' },
  pans:       { label: 'pan',    family: 'voices', kind: 'voicePans',   imm: true, w: 0.35, cost: 2 },
  mutes:      { label: 'mute',   family: 'voices', kind: 'voiceMutes',  imm: true, w: 0.4,  cost: 1,
                xor: 'voiceCoarse:mute' },

  /* ── tone ─────────────────────────────────────────────────────────
     The three that transform the waveform's SILHOUETTE — and so the
     three that earn the wave screen (§9). */
  shape:      { label: 'shape',  family: 'tone', kind: 'knob', imm: true, w: 0.6, cost: 1, def: 0.42,
                fmt: v => ['SINE', 'TRI', 'SQR', 'SAW'][Math.round(v * 3)],
                requires: p => p.engine === 'classic' && p.shaping && p.waves.length > 1 },
  fold:       { label: 'fold',   family: 'tone', kind: 'knob', imm: true, w: 0.4, cost: 1, def: 0.30,
                fmt: v => `${Math.round(v * 100)}`,
                requires: p => p.engine === 'classic' && p.shaping },
  width:      { label: 'width',  family: 'tone', kind: 'knob', imm: true, w: 0.25, cost: 1, def: 0.50,
                fmt: v => `${Math.round(20 + v * 60)}%`,
                requires: p => p.engine === 'classic' && p.shaping && squareOnly(p) },
  saturation: { label: 'drive',  family: 'tone', kind: 'knob', imm: true, w: 0.6, cost: 1, def: 0.35,
                fmt: v => `${Math.round(v * 100)}` },
  /* noise + wave are the two SOURCE volumes and were listed together —
     they pair as one blend (§3). */
  noise:      { label: 'noise',  family: 'tone', kind: 'knob', imm: true, w: 0.4, cost: 1, def: 0.20,
                fmt: v => `${Math.round(v * 100)}`,
                requires: p => p.noise },
  waveLevel:  { label: 'wave',   family: 'tone', kind: 'knob', imm: true, w: 0.4, cost: 1, def: 0.72,
                fmt: v => `${Math.round(v * 100)}`,
                requires: p => p.engine === 'classic' },

  /* ── filter ───────────────────────────────────────────────────────
     ⭐ v3 `sizeMul`: "generally have the largest knob be something like
     LPF" (Dan). A fixed per-control multiplier on top of tier scale and
     hero — the LPF (and the generic filter) is drawn a quarter larger
     than the base knob wherever it appears, and the peak rides inside
     it unchanged (the concentric pair keeps peak NEXT to the lpf, which
     is its own rule of Dan's, honoured by the pair not by layout). */
  lpf:        { label: 'lpf',    family: 'filter', kind: 'knob', imm: true, w: 0.6, cost: 1, def: 0.62,
                sizeMul: 1.25, xor: 'filterKind:split', fmt: v => `${Math.round(120 * Math.pow(2, v * 7))}` },
  lpfPeak:    { label: 'peak',   family: 'filter', kind: 'knob', imm: true, w: 0,   cost: 0, def: 0.22,
                partnerOf: 'lpf', fmt: v => `${(v * 20).toFixed(1)}` },
  hpf:        { label: 'hpf',    family: 'filter', kind: 'knob', imm: true, w: 0.3, cost: 1, def: 0.18,
                xor: 'filterKind:split', fmt: v => `${Math.round(30 * Math.pow(2, v * 7))}` },
  hpfPeak:    { label: 'peak',   family: 'filter', kind: 'knob', imm: true, w: 0,   cost: 0, def: 0.25,
                partnerOf: 'hpf', fmt: v => `${(v * 20).toFixed(1)}` },
  filter:     { label: 'filter', family: 'filter', kind: 'knob', imm: true, w: 0.5, cost: 1, def: 0.55,
                sizeMul: 1.25, xor: 'filterKind:generic', fmt: v => `${Math.round(120 * Math.pow(2, v * 7))}` },
  resonance:  { label: 'res',    family: 'filter', kind: 'knob', imm: true, w: 0,   cost: 0, def: 0.30,
                partnerOf: 'filter', fmt: v => `${(v * 20).toFixed(1)}` },

  // ── space ────────────────────────────────────────────────────────
  reverb:     { label: 'reverb', family: 'space', kind: 'knob', imm: true, w: 0.6, cost: 1, def: 0.40,
                fmt: v => `${Math.round(v * 100)}` },

  /* ── detune, read as "tune drift" ─────────────────────────────────
     ⭐ The detune SPLIT (PLAN §2) still holds: spreading the oscillators
     changes the beating the instant you turn it — immediate, stays.
     How far the next remix WANDERS changes nothing until the next remix
     — that is the back face's knob (relabelled `wander` so the plate's
     drift and the menu's never share a name).
     ⭐ v3 (Dan): the knob READS as "tune drift" and sits "mostly close
     to the remix + tune knobs" — so it is labelled `drift`, lives in
     the `action` family (same section, so the packer keeps them
     together), and the glue pairs bind it to tune, or to remix when
     the plate has no tune. `needsAction` still keeps both off a plate
     with neither. */
  detune:     { label: 'drift',  family: 'action', kind: 'knob',   imm: true, w: 0.3, cost: 1, def: 0.25,
                needsAction: true, fmt: v => `${(v * 10).toFixed(1)}¢` },
  detuneBtn:  { label: 'spread', family: 'action', kind: 'button', imm: true, w: 0.2, cost: 1,
                sizeMul: 0.85, needsAction: true, glyph: 'spread' },

  // ── arp — only exists if the patch has one ───────────────────────
  /* ⚠️ No built-in song carries `arp: true` any more (the arp song came
     out 2026-08-14), so the arp family is reachable only by ticking
     `arp` in the patch editor — or on `full console (stress)`, whose
     control list is authored. Flip it on any song to explore the arp. */
  arpOn:      { label: 'arp',    family: 'arp', kind: 'toggle',  imm: true, w: 0.9, cost: 1, def: true,
                requires: p => p.arp },
  arpBpm:     { label: 'tempo',  family: 'arp', kind: 'slider',  imm: true, w: 0.7, cost: 1, def: 0.45,
                requires: p => p.arp, fmt: v => `${Math.round(50 + v * 130)}` },
  arpOct:     { label: 'octaves',family: 'arp', kind: 'steps',   imm: true, w: 0.5, cost: 1, def: 4,
                requires: p => p.arp },
  arpDir:     { label: 'dir',    family: 'arp', kind: 'segment', imm: true, w: 0.5, cost: 1, def: 0,
                opts: ['up', 'down', 'updn', 'rand'], requires: p => p.arp },

  /* ── actions: momentary, they DO something — instantly ────────────
     ⭐ v3 `sizeMul: 0.85` — "remix button and tune should generally be
     a little smaller" (Dan). The whole cell shrinks, not just the
     glyph, so the pair reads as a size class below the knobs. */
  /* ⭐ Relabelled RETUNE (Dan, 2026-08-16, matching play round 2 §3f).
     ⛔ The id stays `remix` — manifests, fixtures, recipes and the Swift
     parity suite all carry the id, so only the drawn label moves. */
  remix:      { label: 'retune', family: 'action', kind: 'button', imm: true, w: 1.0, cost: 1,
                sizeMul: 0.85, glyph: 'dice' },
  tune:       { label: 'tune',   family: 'action', kind: 'button', imm: true, w: 0.5, cost: 1,
                sizeMul: 0.85, glyph: 'align' },

  /* ── ⛔ THE BACK FACE — nothing here moves the sound now ───────────
     `autoCycle` is the dwell timer, `slide` the glide time, `drift` the
     wander amount. Turning any of them changes what happens NEXT.

     ⭐ Note what survives the exile: the cycle READOUT stays on the
     plate (the ring around remix, `cycleReadout`). The countdown is a
     display, not a control — it was only the knob that failed the test,
     so v1's best idea, the timer drawn on the thing it re-clicks, is
     kept while the dwell knob goes to the menu.

     `auto` likewise stays reachable as RAIL chrome (it is transport,
     and the rail is not the plate) — so v1's `autoPlace` gene, and the
     machinery that glued auto onto the remix block, are both gone. */
  autoCycle:  { label: 'dwell',  family: 'motion', kind: 'knob', imm: false, def: 0.40,
                fmt: v => `${Math.round(15 + v * 105)}s` },
  slide:      { label: 'slide',  family: 'motion', kind: 'knob', imm: false, def: 0.45,
                fmt: v => `${(v * 4).toFixed(1)}s` },
  /* relabelled `wander` in v3: the plate's detune knob now reads DRIFT
     (Dan's "tune drift"), and two knobs sharing one name across the two
     faces would be the same lie twice. */
  drift:      { label: 'wander', family: 'motion', kind: 'knob', imm: false, def: 0.35,
                fmt: v => `${Math.round(v * 100)}` },
};

/* Every id that can reach the plate, in catalog order. */
const PLATE_IDS = Object.keys(PARAMS).filter(id => PARAMS[id].imm);
const MENU_IDS  = Object.keys(PARAMS).filter(id => !PARAMS[id].imm);
/* Legal on this patch? A partner rides in on its principal, never alone. */
function legalOn(patch, id) {
  const p = PARAMS[id];
  if (!p || !p.imm) return false;
  return !p.requires || p.requires(patch);
}

/* ── COUPLINGS ──────────────────────────────────────────────────────
   The layout ATOM is the pair, not the control. A pair only fires when
   BOTH members are in the song; otherwise each renders alone.
     cluster    — the mixer: every voice's fader, pan (and mute) as one
     concentric — cutoff outer ring, peak inner ring, one body
     adjacent   — two controls that must touch, drawn side by side
   ⛔ v1's `timerRing` pair is GONE with the dwell knob — the ring is now
   drawn from `patch.cycle`, because a readout needs no control present.
   ──────────────────────────────────────────────────────────────── */
/* Which `xor` groups are drawn as ONE categorical decision rather than
   as independent per-member coin-flips. ⛔ Adding a group here CHANGES
   its members' observed rates — `filterKind` is deliberately absent so
   the filter measurements in §5 still hold. */
const CATEGORICAL_XOR = ['voiceCoarse'];

const PAIRS = [
  { a: 'levels', b: 'pans',      style: 'cluster',    label: 'mix' },
  /* ⭐ v3.1: the mute strip — the same object as the mixer with a cap
     where the fader was. Mutes and levels are xor'd, so exactly one of
     these two pairs can ever fire, which is Dan's "mute and pan, mixer
     and pan, but never all three". ⚠️ Gated on `mutePlace: cluster`, so
     the fusing stays a genome decision the way it always was — the
     other three placements keep mutes and pans as separate blocks. */
  { a: 'mutes',  b: 'pans',      style: 'cluster',    label: 'mute' },
  { a: 'lpf',    b: 'lpfPeak',   style: 'concentric', label: 'lpf' },
  { a: 'hpf',    b: 'hpfPeak',   style: 'concentric', label: 'hpf' },
  { a: 'filter', b: 'resonance', style: 'concentric', label: 'filter' },
  // the two SOURCE volumes read as one blend, so they are glued
  { a: 'noise',  b: 'waveLevel', style: 'adjacent',   label: '' },
  { a: 'tune',   b: 'detune',    style: 'adjacent',   label: '' },
  /* ⭐ v3: drift glues to REMIX when the plate has no tune — "mostly
     close to the remix + tune knobs" has to survive tune being absent.
     Order matters: tune claims it first, so remix only steps in as the
     fallback host. */
  { a: 'remix',  b: 'detune',    style: 'adjacent',   label: '' },
  { a: 'tune',   b: 'detuneBtn', style: 'adjacent',   label: '' },
];

/* ════════════════════════════════════════════════════════════════════
   2b · THE WITNESS — the wave screen (PLAN §9)
   ────────────────────────────────────────────────────────────────────
   Neither a control nor chrome: a third class. It never appears in a
   manifest — it is a CONSEQUENCE of what the plate carries.

   It does not break the immediacy rule; it is that rule made visible.
   The plate claims every knob moves the sound now, and the screen is
   the plate proving it.

   ⭐ The weight tracks how much the control moves the TRACE, which is
   the honest reading of "less often for saturation": shape, fold and
   width transform the silhouette; saturation only rounds the peaks off.
   And it inverts on size — when the screen appears for saturation ALONE
   it is drawn BIGGER, because a subtle change needs more pixels to be
   legible while a dramatic one survives at any size.
   ════════════════════════════════════════════════════════════════════ */
const WITNESS = {
  id: 'scope',
  strong: ['shape', 'fold', 'width'],   // they redraw the silhouette
  weak: ['saturation'],                 // only rounds the peaks — sparse plates only
};
/* ⛔ 08-15, Dan: on a SQUARE-ONLY patch the screen requires `width` on
   the plate — no width knob, no screen, weak case included. The screen
   there exists to show the pulse width sliding; without the knob it is
   a fixed square, which is a dead witness (see scopeFor). */
/* ⭐ v3: the witness's LIKELIHOOD is a recipe weight like any other —
   `scope` is a row in the weight grid, so "waveshape viewer" appears in
   a recipe's list exactly the way Dan wrote it. The weight is the
   strong-case rate; the weak case (saturation alone) fires at 0.4× of
   it, keeping v2's ratio. Eligibility is still the patch's business
   (classic + shaping), never the slider's. */

/* ════════════════════════════════════════════════════════════════════
   3 · RECIPES — a PATCH plus a per-element LIKELIHOOD table
   ────────────────────────────────────────────────────────────────────
   ⭐ v3's move: a recipe owns its own weights. v2 had one global weight
   per catalog row; Dan's recipe lists ("hello world will have a
   variation of: mute, pan, remix, tune, saturation, level") are really
   per-recipe samplers — WHICH elements can appear, and how often each
   does. So `weights` maps element id → likelihood 0…1:

     absent from the map   never on this recipe's plates
     1.0                   always there (the ** tier, per recipe)
     anything between      the draw rate the slider shows

   `scope` (the waveshape viewer) is a row like any other. Partners
   (lpfPeak &c.) still ride in on their principals — "peak" in Dan's
   lists is the lpf's inner ring, not a separate draw. `levels` still
   rides `pans` (v2 §3b), at the conditional rate given here.

   Edits in the weight grid write straight into this object, autosave to
   localStorage, and export/import as `parametric-recipes.json` — the
   simple "json file or database of sorts". A recipe may still author
   `controls` outright (the stress plate does), which bypasses the
   weights entirely.
   ════════════════════════════════════════════════════════════════════ */
const DEFAULT_RECIPES = {
  /* 1 · very simple: a variation of mute, pan, remix, tune, saturation,
     level. Sine and nothing that bends it — `shaping: false` kills the
     tone family AND the wave screen in one field. */
  'hello world · sine waves': {
    patch: { waves: ['sine'], voices: [2, 6], shaping: false, noise: false },
    weights: { mutes: 0.4, pans: 0.7, levels: 0.4, remix: 1.0, tune: 0.5,
               saturation: 0.6 },
  },
  /* 2 · square-only, so `width` is legal and `shape` is not, and the
     wave screen has a pulse to draw. lpf carries its peak in with it.
     ⭐ Dan, 2026-08-16: pans at 1.0 — this song ALWAYS ships its pans,
     the same "not sampled, always there" rule remix rides (§4 step 1).
     ⚠️ The always-on pass runs before the cost budget, so the pan
     block's 2 units come off the top: mutes/levels and the tail of the
     shuffled pass are refused marginally more often at 6 voices, and
     the knob cull can no longer rescue a tight plate by dropping the
     pans — only by re-rolling the manifest. */
  'square waves · immediate slide': {
    patch: { waves: ['square'], voices: [2, 6], cycle: true, noise: false },
    weights: { pans: 1.0, mutes: 0.4, lpf: 0.85, reverb: 0.6, remix: 1.0,
               tune: 0.5, levels: 0.4, saturation: 0.5, width: 0.6, scope: 0.7 },
  },
  /* 3 · granular: the tone family is illegal wholesale, so this plate
     is voices + filter + reverb + noise — and no wave screen, because a
     grain cloud has no single cycle to draw. */
  'cello grain': {
    patch: { engine: 'granular', waves: [], voices: [2, 4], noise: true, cycle: false },
    weights: { pans: 0.7, mutes: 0.4, lpf: 0.85, reverb: 0.7, remix: 1.0,
               tune: 0.5, levels: 0.4, noise: 0.6 },
  },
  /* 4 · hello world PLUS: noise, lpf+peak, shape, fold and the viewer.
     The full wave list, because a shape knob needs something to morph. */
  'sine waves + extras': {
    patch: { waves: ['sine', 'triangle', 'square', 'saw'], voices: [2, 6], noise: true },
    weights: { mutes: 0.4, pans: 0.7, levels: 0.4, remix: 1.0, tune: 0.5,
               saturation: 0.6, noise: 0.5, lpf: 0.7, shape: 0.6, fold: 0.5, scope: 0.7 },
  },
  /* Kept deliberately as the failure case: everything legal at once,
     ~3× the budget, so the generator keeps being tested against a plate
     that does NOT fit. AUTHORED — the weight grid does not apply. */
  'full console (stress)': {
    patch: { voices: 4, arp: true },
    controls: ['levels', 'pans', 'mutes', 'shape', 'fold', 'saturation', 'noise',
               'waveLevel', 'lpf', 'lpfPeak', 'hpf', 'hpfPeak', 'reverb', 'detune',
               'arpOn', 'arpBpm', 'arpOct', 'arpDir', 'remix', 'tune'],
  },
};

/* ── the recipe STORE — localStorage is the database, json the export ─
   Loaded once at boot; every weight-grid edit writes through. A stored
   recipe replaces its default whole (weights object included), so a
   slider you set stays set; recipes the store has never seen keep their
   defaults, and recipes you invented in the grid survive too. */
const RECIPE_KEY = 'wt-parametric-lab-recipes-v1';
const RECIPES = structuredClone(DEFAULT_RECIPES);
try {
  const stored = JSON.parse(localStorage.getItem(RECIPE_KEY) || 'null');
  if (stored?.recipes) for (const [k, v] of Object.entries(stored.recipes)) RECIPES[k] = v;
} catch { /* private mode / corrupt store — defaults stand */ }
function saveRecipes() {
  try { localStorage.setItem(RECIPE_KEY, JSON.stringify({ version: 3, recipes: RECIPES })); }
  catch { /* quota / private mode — the session still works, it just won't persist */ }
}
const recipePatch = (key) => ({ ...DEFAULT_PATCH, ...(RECIPES[key].patch || {}) });

/* ?recipe=<substring> (or the older ?song=) deep-links one. */
const RECIPE_KEYS = Object.keys(RECIPES);
const recipeParam = new URLSearchParams(location.search).get('recipe')
  || new URLSearchParams(location.search).get('song');
let currentRecipeKey = (recipeParam
  && RECIPE_KEYS.find(k => k.toLowerCase().includes(recipeParam.toLowerCase())))
  || 'hello world · sine waves';

/* ════════════════════════════════════════════════════════════════════
   4 · THE MANIFEST SAMPLER — patch + weights + seed → which controls
   ────────────────────────────────────────────────────────────────────
   v1's manifest was hand-authored per song. Dan's v2 note gave
   FREQUENCIES rather than lists ("** always", "* mostly", "tune half as
   often as remix"), which is a sampler spec — so the manifest is now
   drawn, under a `manifestSeed` kept SEPARATE from the genome seed.

   Two seeds is the mechanic that makes song mode possible: hold the
   manifest and vary the genome (v1's whole workflow), or vary both and
   rate the SYSTEM rather than one plate.

   ⛔ The manifest is still not a gene. It is a deterministic function of
   (patch, manifestSeed): the same song always draws the same plate.
   ════════════════════════════════════════════════════════════════════ */
function drawManifest(patch, mseed, forced, weights, vbias) {
  const rng = mulberry32(mseed ^ 0x2f6a88c1);
  /* ⭐ v3: the voice COUNT is the draw's first act, so it is stable for
     a given seed no matter how the weight sliders move afterwards —
     nudging a likelihood must never change how many voices a plate you
     were just looking at has.
     ⭐ 08-15: `vbias` is the APP's voice table (Dan: 4 > 2 > 3 > 6 > 5),
     renormalised over the recipe's range. Since the v6 key-bump (W1)
     EVERY mode passes VOICE_BIAS; the uniform path remains the contract
     that legacy replays (pre-bias generations) rely on. ⛔ Both paths
     consume exactly ONE rng() call, so every draw AFTER the count is
     identical for a given mseed with the bias on or off. */
  const [vLo, vHi] = voiceRange(patch);
  const voices = drawVoiceCount(rng(), vLo, vHi, vbias);
  /* The recipe's likelihood table; a recipe with none (the authored
     stress plate) falls back to the catalog's v2 weights. Absent from
     the table = never drawn. */
  const wOf = (id) => weights ? (weights[id] ?? 0) : (PARAMS[id]?.w ?? 0);
  const chosen = [], claimedXor = new Set();
  let cost = 0;

  if (forced) {
    // a hand-authored recipe: honour it verbatim, minus anything its own
    // patch makes illegal (so editing the patch can't produce a lie)
    for (const id of forced) if (legalOn(patch, id) || PARAMS[id]?.partnerOf) chosen.push(id);
    return finish(chosen, patch, voices, scopeFor(chosen, patch, 1, rng), weights);
  }

  const take = (id) => {
    const p = PARAMS[id];
    if (p.xor) {
      const [group] = p.xor.split(':');
      if ([...claimedXor].some(x => x.startsWith(group + ':') && x !== p.xor)) return false;
      claimedXor.add(p.xor);
    }
    chosen.push(id);
    cost += p.cost;
    return true;
  };

  const pool = PLATE_IDS.filter(id => legalOn(patch, id) && !PARAMS[id].partnerOf && wOf(id) > 0);
  // 1 · a weight of 1.0 is not sampled. It is always there — that is
  //     what the slider sitting at 100% means.
  for (const id of pool.filter(id => wOf(id) >= 1)) take(id);

  /* 1b · CATEGORICAL XOR GROUPS (v3.1). A group listed in
     `CATEGORICAL_XOR` is ONE decision, not N independent coin-flips.
     ⚠️ This is the difference between "never both" and a chosen SPLIT.
     Sequential Bernoullis in a shuffled order cannot express one: the
     member the shuffle reaches first claims the group, so the ratio
     inside it is draw order rather than anything anyone picked (mutes
     landed 70/14 over levels that way, from two equal 0.7 weights).

     The sliders keep meaning exactly what they say — a member's weight
     IS its share of all plates:
         total  = Σ weights, capped at 1   ("something coarse")
         share  = w / Σ weights            (which one)
     so 0.4 + 0.4 reads as 40% · 40% · 20% neither, and raising one
     slider raises both its share and the group's total until the group
     saturates and "neither" disappears.
     ⛔ Groups NOT listed here (filterKind) keep the sequential
     behaviour, and their measured rates with it. */
  const groupOf = (id) => PARAMS[id].xor?.split(':')[0];
  const catMembers = new Set();
  for (const group of CATEGORICAL_XOR) {
    const members = pool.filter(id => groupOf(id) === group);
    if (!members.length) continue;
    members.forEach(id => catMembers.add(id));
    if (members.some(id => claimedXor.has(PARAMS[id].xor))) continue;  // an always-on member won it
    const sum = members.reduce((t, id) => t + wOf(id), 0);
    if (sum <= 0) continue;
    let r = rng() * Math.max(sum, 1);        // the gap above Σ, if any, is "neither"
    const pick = members.find(id => (r -= wOf(id)) < 0);
    if (!pick) continue;                     // rolled into the neither band
    if (cost + PARAMS[pick].cost > BUDGET) continue;
    /* ⛔ A categorical member may not also be a `ridesWith` rider: the
       host is drawn in the shuffled pass BELOW, so a rider would land at
       share × P(host) and the slider would stop meaning what it says.
       (This is why `levels` dropped its pans rider — see PARAMS.) */
    take(pick);
  }

  // 2 · everything else by its recipe weight, in a shuffled order so no
  //     control wins its slot merely by sitting higher in the catalog.
  const rest = pool.filter(id => wOf(id) < 1 && !catMembers.has(id));
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  const hasAction = () => chosen.includes('remix') || chosen.includes('tune');

     plate that does not have the host yet, and its rate would depend on
     where the shuffle happened to put it. */
  const riders = rest.filter(id => PARAMS[id].ridesWith);
  for (const id of rest) {
    const p = PARAMS[id];
    if (p.ridesWith) continue;
    if (cost + p.cost > BUDGET) continue;

/* Pull in partners (a peak rides in on its cutoff) and order by family.
   The manifest carries its weights so the renderer's TIER rules (size
   floor, strand rights) read the recipe's numbers, not the catalog's. */
function finish(chosen, patch, voices, scope, weights) {

  for (const id of chosen) {
    out.push(id);
    for (const pid of Object.keys(PARAMS)) {
      if (PARAMS[pid].partnerOf === id && !chosen.includes(pid)) out.push(pid);
    }
  }
  const controls = FAMILY_ORDER.flatMap(f => out.filter(id => PARAMS[id].family === f));
  return { patch, voices, controls, scope, weights: weights || null };

/* The witness decision (§2b), returned as null | 'strong' | 'weak'.
   ⭐ v3: `sw` is the recipe's `scope` weight — the strong case fires at
   that rate, the weak case at 0.4× of it (v2's 0.7/0.3 ratio, kept). */
function scopeFor(controls, patch, sw, rng) {
  const cost = controls.reduce((a, id) => a + (PARAMS[id]?.cost || 0), 0);
  /* ⛔ A granular patch has no single-cycle waveform, so there is nothing
     honest for the screen to draw — the same rule that makes a
     square-only patch show a SQUARE rather than a sine (`restShape`).
     ⚠️ Grains want their own witness (a cloud, not a wave); until then
     they get none. The same gate covers `shaping: false` — a synth whose
     oscillator never changes shape has nothing for a screen to show.
     ⛔ The gate is the PATCH's, never the slider's: a scope weight of
     1.0 on cello grains still draws nothing. */
  if (patch.engine !== 'classic' || !patch.shaping || !(sw > 0)) return null;
  /* ⛔ Square-only (Dan, 08-15): the screen's whole story is the pulse
     WIDTH sliding, so it appears ONLY when the width knob is on the
     plate. Without it the trace is a fixed square — saturation's weak
     case drew exactly that dead screen (example A), so on square-only
     patches neither path fires without `width`. */
  if (squareOnly(patch) && !controls.includes('width')) return null;
  if (WITNESS.strong.some(id => controls.includes(id))) return rng() < sw ? 'strong' : null;

  // both readings of Dan's "(and less other things)", composed.
  if (WITNESS.weak.some(id => controls.includes(id)) && cost <= BUDGET - 2) {
    return rng() < sw * 0.4 ? 'weak' : null;
  }
  return null;
}

   letting each card draw its own is draw-per-card, which is how you
   rate the RECIPE instead of one arrangement — and it is v3's default,
   because a recipe is a distribution, not a plate.

   5 · FIXED PAGE CHROME — identical on every card
   ════════════════════════════════════════════════════════════════════ */
function stemXs(n, w) {
  const xs = [];
  for (let i = 0; i < n; i++) xs.push(w * (0.14 + (0.72 * (i + 0.5)) / n) + ((i * 37) % 11) - 5);
  return xs;
}
function chromeFieldSliver() {
  let d = `M 0 ${FIELD_H * 0.55}`;
  for (let x = 0; x <= PHONE_W; x += 6) {
    const y = FIELD_H * 0.55
      + Math.sin(x * 0.045) * 14 * Math.sin(x * 0.008 + 1.2)
      + Math.sin(x * 0.013 + 0.5) * 7;
    d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  return `<path d="${d}" fill="none" stroke="${INK(0.32)}" stroke-width="1.4" stroke-linecap="round"/>
    <text x="${PHONE_W - 10}" y="14" text-anchor="end" font-size="7" letter-spacing="1" fill="${INK(0.18)}">FIELD</text>`;
}
function chromeSpectrumBar(y0, voices, g, playFace) {
  const xs = stemXs(voices, PHONE_W - 24);
  const base = y0 + SPECT_H - 16;
  let out = `<line x1="12" y1="${base}" x2="${PHONE_W - 12}" y2="${base}" stroke="${INK(0.25)}" stroke-width="1"/>`;
  let d = `M 12 ${base - 4}`;
  for (let x = 12; x <= PHONE_W - 12; x += 8) d += ` L ${x} ${base - 4 - Math.abs(Math.sin(x * 0.02)) * 9}`;
  out += `<path d="${d}" fill="none" stroke="${INK(0.10)}" stroke-width="1"/>`;
  xs.forEach((x, i) => {
    const h = 14 + ((i * 29) % 13);
    out += `<line x1="${12 + x}" y1="${base}" x2="${12 + x}" y2="${base - h}"
      stroke="${i === 0 ? HI(0.9) : INK(0.5)}" stroke-width="2" stroke-linecap="round"/>`;
  });
  /* The draggable frequency handles (SPEC-listen-orbs): half-size,
     sitting UNDER the line. FIXED CHROME on every song, like the
     play/volume column and the rail — frequency is always reachable,
     so no song has to spend pane space on a fine-tune. Only their
     colour varies.

     `orbInk` gives them the three readings the app itself has:

       mono       one flat tone for every orb — what the listen page
                  ships. ⛔ Deliberately does NOT lift the root: on this
                  page every orb does the same job, and one bright coin
                  would say otherwise
       spectrum   the voice colours, as on the instrument page
       grayscale  told apart by VALUE rather than hue — the root is
                  brightest and each voice steps down. Distinguishable
                  without relying on colour vision at all  */
  const n = xs.length;
  const orbFill = (i) => {
    if (g.orbInk === 'spectrum') {
      // same coherence rule as the pane: one accent means one colour
      return g.accent === 'voice0' ? voiceColor(0) : voiceColor(i);
    }
    if (g.orbInk === 'grayscale') return INK(0.78 - (i / Math.max(1, n - 1)) * 0.42);
    return INK(0.55);
  };
  /* playFace (the app sim, Dan 2026-08-16): the orbs are PROGRAM-SIZE
     — the size the iOS program screen and play round 2 §3f F3 use —
     not the listen page's half-size gray coins, and they wear the
     plain voice palette (iOS 08-16: colorMultiply gone). Same anchor
     under the line; at r=9 they ride over the region top the way the
     app's `.zIndex(10)` orbs overlay. ⛔ The `orbInk` gene still owns
     the rated grid — playFace bypasses it, never rewrites it. */
  xs.forEach((x, i) => {
    out += playFace
      ? `<circle cx="${12 + x}" cy="${base + 7}" r="9" fill="${voiceColor(i)}"/>`
      : `<circle cx="${12 + x}" cy="${base + 7}" r="4.5" fill="${orbFill(i)}"/>`;
  });
  return out;
}
function chromeRail(y0, trial) {
  const cellW = PHONE_W / 5, cy = y0 + RAIL_H / 2 - 2, c = INK(0.35);
  const glyph = (i, cx) => {
    switch (i) {
      case 0: return `<rect x="${cx - 5}" y="${cy - 5}" width="10" height="10" rx="2" fill="none" stroke="${c}" stroke-width="1.3"/>`;
      case 1: return `<circle cx="${cx}" cy="${cy}" r="5" fill="none" stroke="${c}" stroke-width="1.3"/>`;
      /* transport trial: the CENTER cell is play/pause — the one
         transport action earns the rail's only wash and a stronger
         ink, so the bar reads nav · nav · TRANSPORT · nav · nav.
         Drawn paused (a play triangle): a static mock claims no
         running audio, same honesty rule as the fixed lissajous. */
      case 2: if (trial) return `<circle cx="${cx}" cy="${cy}" r="13" fill="${INK(0.12)}"/>
                      <path d="M ${cx - 3.5} ${cy - 5.5} L ${cx + 5.5} ${cy} L ${cx - 3.5} ${cy + 5.5} Z"
                        fill="none" stroke="${INK(0.8)}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
              return `<rect x="${cx - 2.5}" y="${cy - 6}" width="5" height="9" rx="2.5" fill="none" stroke="${c}" stroke-width="1.3"/>
                      <line x1="${cx}" y1="${cy + 3}" x2="${cx}" y2="${cy + 6}" stroke="${c}" stroke-width="1.3" stroke-linecap="round"/>`;
      case 3: return `<path d="M ${cx - 6} ${cy + 3} L ${cx - 2} ${cy + 3} L ${cx + 2} ${cy - 4} L ${cx + 6} ${cy - 4}" fill="none" stroke="${c}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>`;
      default: return `<line x1="${cx - 6}" y1="${cy - 3}" x2="${cx + 6}" y2="${cy - 3}" stroke="${c}" stroke-width="1.3" stroke-linecap="round"/>
                       <line x1="${cx - 6}" y1="${cy + 2}" x2="${cx + 2}" y2="${cy + 2}" stroke="${c}" stroke-width="1.3" stroke-linecap="round"/>`;
    }
  };
  let out = `<line x1="0" y1="${y0}" x2="${PHONE_W}" y2="${y0}" stroke="${INK(0.08)}" stroke-width="1"/>`;
  for (let i = 0; i < 5; i++) out += glyph(i, cellW * (i + 0.5));
  return out;
}
/* ── the auto button ────────────────────────────────────────────────
   Three shapes, one drawing function, because auto appears in two
   places (the left rail and the pane) and they must not drift apart.

     circle  wash circle + lemniscate + label under — matches remix and
             tune, at the cost of a knob-sized footprint
     pill    a rounded horizontal rectangle with AUTO set INSIDE it and
             no label under. The word is the button
     rect    a small rounded rectangle + label under. The compact one:
             a third of the circle's area

   `AUTO_SIZE` is exported so a block can size itself before drawing. */
const AUTO_SIZE = { circle: { w: 34, h: 34 }, pill: { w: 38, h: 20 }, rect: { w: 28, h: 19 } };

function lemniscate(cx, cy, w, hh, color, sw) {
  return `<path d="M ${cx - w} ${cy} C ${cx - w} ${cy - hh}, ${cx - w * 0.18} ${cy - hh}, ${cx} ${cy}
    C ${cx + w * 0.18} ${cy + hh}, ${cx + w} ${cy + hh}, ${cx + w} ${cy}
    C ${cx + w} ${cy - hh}, ${cx + w * 0.18} ${cy - hh}, ${cx} ${cy}
    C ${cx - w * 0.18} ${cy + hh}, ${cx - w} ${cy + hh}, ${cx - w} ${cy} Z"
    fill="none" stroke="${color}" stroke-width="${sw}" stroke-linejoin="round"/>`;
}

/* Draws centred on (cx, cy). Returns the svg; the caller owns layout. */
function autoMark(cx, cy, g, accent, wash) {
  const shape = g.autoShape || 'circle';
  const s = AUTO_SIZE[shape];
  let out = '';
  if (shape === 'pill') {
    out += `<rect x="${cx - s.w / 2}" y="${cy - s.h / 2}" width="${s.w}" height="${s.h}"
      rx="${s.h / 2}" fill="${wash ? INK(0.12) : 'none'}"/>`;
    out += `<text x="${cx}" y="${cy + 3.2}" text-anchor="middle" font-size="9" font-weight="600"
      letter-spacing="1" fill="${accent}">AUTO</text>`;
    return out;   // ⛔ never a label under — the word IS the button
  }
  if (shape === 'rect') {
    out += `<rect x="${cx - s.w / 2}" y="${cy - s.h / 2}" width="${s.w}" height="${s.h}"
      rx="4" fill="${wash ? INK(0.12) : 'none'}"/>`;
    out += lemniscate(cx, cy, s.w * 0.26, s.h * 0.24, accent, 1.6);
    return out;
  }
  out += `<circle cx="${cx}" cy="${cy}" r="${s.w / 2}" fill="${wash ? INK(0.12) : 'none'}"/>`;
  out += lemniscate(cx, cy, s.w * 0.25, s.w * 0.17, accent, 1.7);
  return out;
}

/* ── the level lines' T handle (Dan, 2026-08-16) ─────────────────────
   Web simple's `.vfader-xcap`, ported: a short crossbar riding the
   level fill's cap — the theme's grammar is "a tick crossing a line
   is the handle you drag". And the fill meets that crossbar SQUARE
   (web, 08-11: with a rounded cap the fill curved away under the
   bar, so the pair read as a bar resting on a separate rounded line
   instead of one T). Only the cap end squares; the foot keeps its
   radius — it still sits inside the track's own rounded end. The
   bar keeps the web's proportion (13px across a 7px fill ≈ 1.9·fw).
   Top-level because the chrome's master meter uses `levelFill` too,
   not just the block builders. */
function levelFill(x, y, w, h, color, capSide) {
  const r = Math.min(w, h) / 2;
  const sq = Math.min(capSide === 'top' ? h : w, r * 2);
  const patch = capSide === 'top'
    ? `<rect x="${x}" y="${y}" width="${w}" height="${sq}"/>`
    : `<rect x="${x + w - sq}" y="${y}" width="${sq}" height="${h}"/>`;
  return `<g fill="${color}" opacity="0.92">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>${patch}</g>`;
}
function levelBar(cx, cy, fw, color, horiz) {
  const half = fw * 0.95;
  return horiz
    ? `<line x1="${cx - half}" y1="${cy}" x2="${cx + half}" y2="${cy}"
        stroke="${color}" stroke-width="2" stroke-linecap="round" opacity="0.95"/>`
    : `<line x1="${cx}" y1="${cy - half}" x2="${cx}" y2="${cy + half}"
        stroke="${color}" stroke-width="2" stroke-linecap="round" opacity="0.95"/>`;
}

function chromeLeftColumn(y0, g, accent, showAuto, trial, fitScale) {
  const cx = LCOL_W / 2 + 2, py = y0 + 20, psize = 32;
  let out = '';
  let autoBot;
  /* ── transport trial (Dan, 2026-08-16, round 2), sim-only ──────────
     Round 1's NEXT (skip glyph + countdown ring) and AUTO word-pill
     are REMOVED — "the retune button acts as the next button, keep it
     simpler". So: retune stays ON THE PLATE and doubles as next, its
     ring carrying the cycle countdown (buttonBlock forces the ring
     under the trial); play/pause is the bottom-center rail button;
     auto has no home yet (settings, TBD). This column is ONLY the
     main mixer, FULL region height — top and bottom match the column
     divider's 14pt insets, so the meter spans what the faceplate's
     own elements span. The VOL caption draws at the plate labels'
     EFFECTIVE size (8 × the body fit scale — plate labels live inside
     the scaled group, chrome does not) so one plate has one caption
     size. */
  if (!trial) {
  const pc = { x: cx, y: py + psize / 2 };
  if (g.playStyle === 'washCircle') out += `<circle cx="${pc.x}" cy="${pc.y}" r="${psize * 0.46}" fill="${INK(0.14)}"/>`;
  else if (g.playStyle === 'capsule') out += `<rect x="${cx - psize * 0.5}" y="${pc.y - psize * 0.24}" width="${psize}" height="${psize * 0.48}" rx="${psize * 0.24}" fill="${INK(0.14)}"/>`;
  const tr = psize * 0.17;
  out += `<path d="M ${pc.x - tr * 0.7} ${pc.y - tr} L ${pc.x + tr * 1.1} ${pc.y} L ${pc.x - tr * 0.7} ${pc.y + tr} Z"
    fill="none" stroke="${accent}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  /* auto, when `autoPlace: column` puts it here — smaller than play,
     because it modifies the transport rather than being it. */
  autoBot = py + psize;
  if (showAuto) {
    const s = AUTO_SIZE[g.autoShape || 'circle'];
    const ay = py + psize + 14 + s.h / 2;
    out += autoMark(cx, ay, g, accent, true);
    const labelled = g.autoShape !== 'pill' && g.labels === 'below';
    if (labelled) {
      out += `<text x="${cx}" y="${ay + s.h / 2 + 10}" text-anchor="middle" font-size="8" font-weight="500"
        letter-spacing="0.5" fill="${INK(0.3)}">AUTO</text>`;
    }
    autoBot = ay + s.h / 2 + (labelled ? 12 : 2);
  }
  }
  /* ⭐ The main mixer (Dan, 2026-08-16): the single VOL lane becomes the
     web MasterMeterRail — TWO thin lines (the live L/R meter) with the
     volume as a horizontal crossbar over them ("a level line, not a
     ball"). Web simple's geometry: 5px bars, 3px gap, the meter fill
     clipped SQUARE at its level, the 22×3 crossbar centred on the pair.
     The meter levels are SIMULATED — fixed and slightly asymmetric so
     the pair reads as stereo, never equal (the lab has no audio; the
     same honesty rule as the phone's fixed 3:2 lissajous). */
  const labelOn = g.labels === 'below';
  /* Trial: full region height — the divider's 14pt insets are the
     bounds; with a caption on, the track stops 12pt short so the VOL
     baseline lands ON the divider's lower end. */
  const vTop = trial ? y0 + 14 : autoBot + 20;
  const vBot = trial ? y0 + REGION_H - (labelOn ? 26 : 14) : y0 + REGION_H - 20;
  const vw = MASTER_VW, vgap = 3;
  const vh = vBot - vTop, fill = 0.68;
