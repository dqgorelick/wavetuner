       <b>N</b> shuffle · <b>G</b> shuffle look · <b>L</b> like · <b>X</b> dislike (votes join the batch taste pool)
       · <b>export fixtures</b> writes the Swift parity suite`;
    renderAppSim(); renderGeneDesc(); renderGenNav();
    return;
  }
  document.getElementById('hint').innerHTML = m === 'batch'
    ? `field sliver · spectrum · rail and the left play/volume column are FIXED chrome — the genome only owns the region right of the divider.
       <b>edit recipe</b> opens the weight grid: every element is a row, an active row grows its likelihood slider, and edits autosave (export/import as parametric-recipes.json).
       <b>draw per card</b> re-draws the CONTROLS per card too — that rates the recipe, not one arrangement; the card shows both seeds (g + m) and the voice count.<br>
       click a card to zoom (the modal shows the back face, and the song.ui handoff json) · ← → move focus · <b>L</b> like · <b>X</b> dislike · <b>S</b> save champion · <b>N</b> new batch · <b>E</b> evolve · <b>[ ]</b> step generations`
    : `one gene swept across its range, everything else held still. <b>lock</b> pins a value; <b>✕</b> rules one out
       and keeps sampling the rest — several exclusions compose where a lock cannot.<br>
       click a card to zoom · ← → move focus · <b>L</b> lock · <b>X</b> exclude · <b>R</b> reroll the base genome`;
  /* Coming back from a sweep RESTORES where you were, rather than
     rolling a fresh batch — peeking at a sweep should not cost you
     your generation. */
  if (m === 'sweep') buildSweep();
  else if (generations.length && genIdx >= 0) gotoGeneration(Math.min(genIdx, generations.length - 1));
  else newBatch();
  renderGeneDesc(); renderGenNav();
}

function newBatch() {
  const bias = document.getElementById('biasChk').checked && model;
  const draws = bias ? BATCH * 8 : BATCH;
  const cands = [];
  for (let i = 0; i < draws; i++) {
    const seed = newSeed();
    // in song mode each card also draws its own CONTROLS, from the same
    // patch — same song, a different plate. vb:1 = drawn under the bias
    cands.push({ seed, mseed: songMode ? newSeed() : null, genome: drawGenome(seed), vote: 0, vb: 1 });
  }
  batch = bias ? cands.sort((a, b) => score(b.genome) - score(a.genome)).slice(0, BATCH) : cands;
  focusIdx = -1;
  renderGrid();
  recordGeneration(bias ? 'biased' : 'random');
}

function evolve() {
  const liked = ratings.filter(r => r.vote > 0).slice(-24);
  if (liked.length < 2) { alert('Like at least 2 designs first.'); return; }
  const rng = mulberry32(newSeed());
  batch = [];
  for (let i = 0; i < BATCH - 2; i++) {
    const pa = liked[Math.floor(rng() * liked.length)];
    const pb = liked[Math.floor(rng() * liked.length)];
    batch.push({
      seed: newSeed(), mseed: songMode ? newSeed() : null,
      genome: applyPins(applyLocks(mutate(crossover(pa.genome, pb.genome, rng), rng))),
      vote: 0, bred: true, parents: [pa.seed, pb.seed], vb: 1,
    });
  }
  for (let i = 0; i < 2; i++) {   // fresh blood
    const seed = newSeed();
    batch.push({ seed, mseed: songMode ? newSeed() : null, genome: drawGenome(seed), vote: 0, vb: 1 });
  }
  focusIdx = -1;
  renderGrid();
  recordGeneration('evolved');
}

/* One card = one row, always. Re-voting REPLACES the row rather than
   appending: pushing every click meant a double-tap silently gave that
   genome twice the weight, and ▲-then-▼ left the training set holding
   both opinions at once. Clicking the vote you already cast clears it —
   an un-rated card is genuinely neutral (it leaves the training set),
   which is the only honest way to say "I can't call this one". */
/* ⚠️ A vote records the CONTROLS it was cast under, not just the genome.
   The model only sees gene features, so it cannot tell that you disliked
   a plate for what was ON it rather than how it was arranged — and once
   you edit the manifest, or turn on song mode, consecutive votes are
   about different instruments. Storing the control list does not fix the
   attribution, but it makes the mixture VISIBLE (the stats line counts
   distinct manifests) and keeps the data recoverable, which a
   genome-only record did not. */
function vote(idx, v) {
  const item = batch[idx];
  if (!item) return;
  const repeat = item.vote === v;
  item.vote = repeat ? 0 : v;
  ratings = ratings.filter(r => r.seed !== item.seed);
  if (!repeat) {
    const m = manifestFor(item);
    ratings.push({
      seed: item.seed, genome: item.genome, recipeKey: currentRecipeKey, vote: v, ts: Date.now(),
      mseed: item.mseed ?? manifestSeed, voices: m.voices, controls: m.controls.join(' '),
      /* vb:1 = the manifest this vote judged was drawn under VOICE_BIAS.
         The one modern exception: an item restored from a pre-bias
         generation (mseed set, no vb tag) replays uniform, so its vote
         must not claim the bias. An mseed-less card reads the LIVE
         manifest, which is always a biased draw now. */
      ...(item.vb || item.mseed == null ? { vb: 1 } : {}),
      ...(VOICES_OVERRIDE ? { vr: [...VOICES_OVERRIDE] } : {}),
    });
  }
  saveRatings(); trainModel(); updateCard(idx); renderStats(); renderWeights();
}

function cardHTML(item, idx) {
  if (mode === 'sweep') {
    const v = item.sweepVal;
    const gene = GENES.find(g => g.k === sweepGene);
    const locked = LOCKS[sweepGene] === v;
    const excl = isExcludedVal(gene, v);
    return `
      <div class="card ${locked ? 'locked' : ''} ${excl ? 'excluded' : ''} ${idx === focusIdx ? 'focus' : ''}" data-idx="${idx}">
        <div class="simclip">${renderRated(manifestFor(item), item.genome, item.seed)}</div>
        <div class="meta">
          <span class="sweepval">${sweepGene} <b>${typeof v === 'number' ? v.toFixed(2) : v}</b>${LAST_HERO ? ` · hero:${LAST_HERO}` : ''}</span>
          <span class="votes">
            <button class="wide" data-lock="${idx}">${locked ? 'locked' : 'lock'}</button>
            <button class="wide ${excl ? 'on' : ''}" data-excl="${idx}"
              title="${excl ? 'allow this again' : 'rule this out, keep sampling the rest'}">${excl ? 'out' : '✕'}</button>
          </span>
        </div>
      </div>`;
  }
  const sc = score(item.genome);
  const m = manifestFor(item);
  /* Both seeds on the card, because the pair IS the plate's identity —
     the app's SongUI carries exactly these two integers plus the recipe
     (SPEC-patch-to-faceplate §5), and "show a seed we can save" starts
     with the seed being visible. */
  const mseedTag = item.mseed != null ? ` m${item.mseed.toString(16).slice(0, 5)}` : '';
  const champ = isChamp(item);
  return `
    <div class="card ${item.vote > 0 ? 'liked' : item.vote < 0 ? 'disliked' : ''} ${champ ? 'champ' : ''} ${idx === focusIdx ? 'focus' : ''}" data-idx="${idx}">
      <div class="simclip">${renderRated(m, item.genome, item.seed)}</div>
      <div class="meta">
        <span>g${item.seed.toString(16).slice(0, 6)}${mseedTag} · ${m.voices}v${item.bred ? ' ·bred' : ''}${LAST_CLUSTER ? ' · ' + LAST_CLUSTER : ''}${LAST_HERO ? ' · hero:' + LAST_HERO : ''}</span>
        <span class="score">${sc != null ? Math.round(sc * 100) : '·'}</span>
        <span class="votes">
          <button data-vote="1" data-idx="${idx}">▲</button>
          <button data-vote="-1" data-idx="${idx}">▼</button>
          <button class="star ${champ ? 'on' : ''}" data-champ="${idx}"
            title="${champ ? 'saved as a champion — click to remove' : 'bank this plate: genome + manifest + recipe + picture'}">${champ ? '★' : '☆'}</button>
        </span>
      </div>
    </div>`;
}
function renderGrid() {
  document.getElementById('grid').innerHTML = batch.map(cardHTML).join('');
  renderStats();
}
function updateCard(idx) {
  const el = document.querySelector(`.card[data-idx="${idx}"]`);
  if (el) el.outerHTML = cardHTML(batch[idx], idx);
}
function renderStats() {
  const nLike = ratings.filter(r => r.vote > 0).length;
  const cost = manifest.controls.reduce((t, id) => t + (PARAMS[id]?.cost || 0), 0);
  /* How many DIFFERENT instruments the training set spans. One is a
     clean comparison; several means the model is being handed style
     judgements that were partly about content. */
  const spread = new Set(ratings.map(r => r.controls || '?')).size;
  const el = document.getElementById('stats');
  el.textContent =
    `${manifest.controls.length} controls · ${cost}/${BUDGET} cost · ${ratings.length} rated (▲${nLike} ▼${ratings.length - nLike})` +
    `${model ? ' · model live' : ` · ${Math.max(0, 8 - ratings.length)} more to train`}` +
    (spread > 1 ? ` · ⚠ across ${spread} manifests` : '');
  el.title = spread > 1
    ? `Your ${ratings.length} ratings were cast over ${spread} different control sets. The model only sees GENES, so it cannot separate "I disliked this layout" from "I disliked these controls".`
    : '';
}
function renderWeights() {
  const el = document.getElementById('weights');
  if (!model) { el.innerHTML = ''; return; }
  const names = featureNames();
  const pairs = names.map((n, i) => [n, model.w[i]]).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 12);
  const maxW = Math.max(...pairs.map(p => Math.abs(p[1])), 0.001);
  el.innerHTML = '<h2>learned taste weights</h2>' + pairs.map(([n, w]) => `
    <div class="wrow">
      <span class="wname">${n}</span>
      <span class="wbar ${w > 0 ? 'wpos' : 'wneg'}" style="width:${Math.abs(w) / maxW * 180}px"></span>
      <span>${w > 0 ? '+' : ''}${w.toFixed(2)}</span>
    </div>`).join('');
}

function openModal(idx) {
  const item = batch[idx];
  const m = manifestFor(item);
  /* Both faces at once: the plate, and behind the `⋯`, everything that
     failed the immediacy test. Seeing them together is the only way to
     judge whether the split was drawn in the right place. */
  document.getElementById('modalPlate').innerHTML =
    `<div class="simclip">${renderRated(m, item.genome, item.seed)}</div>`;
  document.getElementById('modalBack').innerHTML = renderBack(m);
  const lineage = item.parents
    ? `bred from <b>#${item.parents[0].toString(16).slice(0, 6)}</b> + <b>#${item.parents[1].toString(16).slice(0, 6)}</b><br>`
    : '';
  const cost = m.controls.reduce((t, id) => t + (PARAMS[id]?.cost || 0), 0);
  /* ⭐ The handoff object — the shape iOS `SongUI` stores
     (SPEC-patch-to-faceplate §5): recipe + two seeds is the whole plate,
     reproducible on either side of the bridge. Click to copy. */
  const ui = {
    recipe: currentRecipeKey,
    manifestSeed: item.mseed ?? manifestSeed,
    genomeSeed: item.seed,
    voices: m.voices,
  };
  document.getElementById('modalGenes').innerHTML =
    `<b>#${item.seed.toString(16)}</b><br>${lineage}` +
    `<span class="mf">${m.controls.join(' · ')}</span>` +
    `<span class="mf">cost ${cost}/${BUDGET} · screen ${m.scope || 'none'} · ${m.voices} voices</span>` +
    `<span class="mf" id="uiJson" title="song.ui — click to copy" style="cursor:pointer">ui ${JSON.stringify(ui)}</span>` +
    GENES.map(g2 => {
      const v = item.genome[g2.k];
      return `${g2.k}: <b>${typeof v === 'number' ? v.toFixed(2) : v}</b>`;
    }).join('<br>');
  document.getElementById('uiJson').addEventListener('click', (e) => {
    e.stopPropagation();
    try { navigator.clipboard.writeText(JSON.stringify(ui)); } catch { /* clipboard denied */ }
    e.target.textContent = 'ui copied ✓';
  });
  /* The modal is where you look CLOSELY, so it is where the decision to
     keep a plate actually gets made — the ★ belongs here as well as on
     the card. ⛔ Sweep cards are decisions (lock/exclude), not plates to
     bank, so no star there. */
  if (mode === 'batch') {
    const star = document.createElement('button');
    star.textContent = isChamp(item) ? '★ champion — click to remove' : '☆ save as champion';
    star.className = 'mf';
    star.style.cssText = 'cursor:pointer;border:none;width:100%;text-align:left;font:inherit';
    star.addEventListener('click', (e) => {
      e.stopPropagation();
      saveChampion(idx);
      star.textContent = isChamp(item) ? '★ champion — click to remove' : '☆ save as champion';
    });
    document.getElementById('modalGenes').prepend(star);
  }
  document.getElementById('modal').classList.add('open');
}
document.getElementById('modal').addEventListener('click', () =>
  document.getElementById('modal').classList.remove('open'));

/* ── recipe select + the weight-grid editor ───────────────────────── */
const sel = document.getElementById('songSel');
function buildRecipeSel() {
  sel.innerHTML = '';
  for (const k of Object.keys(RECIPES)) {
    const o = document.createElement('option');
    o.value = k; o.textContent = k;
    if (k === currentRecipeKey) o.selected = true;
    sel.appendChild(o);
  }
}
buildRecipeSel();
sel.addEventListener('change', () => {
  currentRecipeKey = sel.value;
  manifest = buildManifest();
  buildManifestEditor();
  if (mode === 'pick') { newPickPair(); return; }   // a pair of the OLD song would rate the wrong recipe
  mode === 'sweep' ? buildSweep() : newBatch();
});
/* ⭐ v3: the editor edits the RECIPE, never one draw. The patch leads
   (it decides what is legal at all); under it, EVERY element the
   manifest can carry is a row, and an active row grows its likelihood
   column — the percentage and the slider. Every change writes through
   to `RECIPES` and autosaves to localStorage; export/import moves the
   whole table as `parametric-recipes.json`. */
function buildManifestEditor() {
  const ed = document.getElementById('manifestEditor');
  const recipe = RECIPES[currentRecipeKey];
  const patch = recipePatch(currentRecipeKey);
  const have = new Set(manifest.controls);
  const cost = manifest.controls.reduce((a, id) => a + (PARAMS[id]?.cost || 0), 0);
  const [vLo, vHi] = voiceRange(patch);
  const W = recipe.controls ? null : (recipe.weights = recipe.weights || {});

  let html = `<div class="fam"><span class="famname">patch</span>
    <label>engine
      <select data-patch="engine">
        <option ${patch.engine === 'classic' ? 'selected' : ''}>classic</option>
        <option ${patch.engine === 'granular' ? 'selected' : ''}>granular</option>
      </select></label>
    <label>waves
      <select data-patch="waves">
        <option value="all" ${patch.waves.length > 1 ? 'selected' : ''}>sine·tri·sqr·saw</option>
        <option value="sine" ${patch.waves.length === 1 && patch.waves[0] === 'sine' ? 'selected' : ''}>sine only</option>
        <option value="square" ${patch.waves.length === 1 && patch.waves[0] === 'square' ? 'selected' : ''}>square only</option>
        <option value="saw" ${patch.waves.length === 1 && patch.waves[0] === 'saw' ? 'selected' : ''}>saw only</option>
      </select></label>
    <label><input type="checkbox" data-patch="shaping" ${patch.shaping ? 'checked' : ''}
      title="does this synth shape its waveform? off = no shape/fold/width AND no wave screen"> shaping</label>
    <label><input type="checkbox" data-patch="noise" ${patch.noise ? 'checked' : ''}> noise</label>
    <label><input type="checkbox" data-patch="arp" ${patch.arp ? 'checked' : ''}> arp</label>
    <label><input type="checkbox" data-patch="cycle" ${patch.cycle ? 'checked' : ''}> cycles</label>
    <label title="each draw picks a count inside this range — Dan's 2–6">voices
      <input type="number" min="2" max="6" value="${vLo}" data-patch="vmin"> –
      <input type="number" min="2" max="6" value="${vHi}" data-patch="vmax"></label>
  </div>`;

  if (W) {
    /* ── the weight grid ─────────────────────────────────────────────
       Rows in family order, the wave screen last as its own `screen`
       family — it is an element of the manifest even though it is a
       witness, and Dan's recipe lists name it like any other. An id the
       patch rules out is greyed WITH the reason, never hidden. */
    const rows = [
      ...FAMILY_ORDER.flatMap(f =>
        PLATE_IDS.filter(id => PARAMS[id].family === f && !PARAMS[id].partnerOf)),
      'scope',
    ];
    html += `<div class="wgrid">` + rows.map(id => {
      const isScope = id === 'scope';
      const legal = isScope ? (patch.engine === 'classic' && patch.shaping) : legalOn(patch, id);
      const w = W[id] ?? 0;
      const active = legal && w > 0;
      const notes = [];
      if (!isScope) {
        const partners = Object.keys(PARAMS).filter(pid => PARAMS[pid].partnerOf === id);
        if (partners.length) notes.push(`+ ${partners.map(p => PARAMS[p].label).join('+')} rides in`);
        if (PARAMS[id].ridesWith) notes.push(`offered only with ${PARAMS[id].ridesWith}`);
        if (PARAMS[id].needsAction) notes.push('needs remix/tune');
        if (PARAMS[id].xor) notes.push(PARAMS[id].xor.startsWith('voiceCoarse')
          ? '⛔ never with ' + (id === 'mutes' ? 'levels' : 'mutes') + ' — same question'
          : 'one filter kind per plate');
      }
      const reason = isScope ? 'this patch shapes nothing — there is no wave to witness'
        : 'this patch does not allow it';
      return `<div class="wgrow ${active ? '' : 'off'} ${w >= 1 ? 'always' : ''}">
        <span class="famtag">${isScope ? 'screen' : PARAMS[id].family}</span>
        <label class="${legal ? '' : 'illegal'}" title="${legal ? notes.join(' · ') : reason}">
          <input type="checkbox" data-wtoggle="${id}" ${active ? 'checked' : ''} ${legal ? '' : 'disabled'}>
          ${isScope ? 'wave screen' : id}${notes.length ? ` <span class="ride">· ${notes.join(' · ')}</span>` : ''}
        </label>
        <input type="range" min="0" max="100" step="5" value="${Math.round(w * 100)}" data-wslider="${id}">
        <span class="pct">${w >= 1 ? 'always' : `${Math.round(w * 100)}%`}</span>
      </div>`;
    }).join('') + `</div>`;
  } else {
    html += `<div class="pairnote">controls <b>authored</b> by this recipe — the weight grid only
      drives drawn recipes. Edit the list in the source if it needs to change.</div>`;
  }
  html += `<div class="fam"><span class="famname">menu</span>` + MENU_IDS.map(id =>
    `<label class="illegal" title="not immediate — it lives on the back face">${id}</label>`).join('') + `</div>`;

  const live = PAIRS.filter(p => have.has(p.a) && have.has(p.b));
  const source = recipe.controls ? 'authored by the recipe'
    : `drawn · seed ${manifestSeed.toString(16).slice(0, 6)}`;
  html += `<div class="pairnote">this draw: cost <b>${cost}</b>/${BUDGET} units
    · <b>${manifest.voices}</b> voices
    · screen: <b>${manifest.scope || 'none'}</b>
    · controls: <b>${source}</b>
    · couplings: ${live.length ? live.map(p => `${p.a}+${p.b} → ${p.style}`).join(' · ') : 'none'}
    <button data-redraw="1">re-draw</button>
    <button data-resetrec="1" title="restore this recipe's shipped weights">reset recipe</button>
    <button data-exportrec="1" title="download every recipe as parametric-recipes.json">export recipes</button>
    <button data-importrec="1">import</button>
    <input type="file" accept=".json,application/json" data-recfile style="display:none">
    <span style="color:rgba(var(--ink-rgb),0.3)">· edits autosave</span></div>`;
  ed.innerHTML = html;

  const commit = () => {
    saveRecipes();
    manifest = buildManifest();
    buildManifestEditor();
    ed.classList.add('open');
    // the manifest decides whether several genes have anything to act
    // on, so the inert-sweep warning has to be re-evaluated here too
    mode === 'sweep' ? buildSweep() : renderGrid();
  };
  ed.querySelector('button[data-redraw]').addEventListener('click', () => {
    manifestSeed = newSeed();
    commit();
  });
  ed.querySelector('button[data-resetrec]').addEventListener('click', () => {
    if (!DEFAULT_RECIPES[currentRecipeKey]) return;
    RECIPES[currentRecipeKey] = structuredClone(DEFAULT_RECIPES[currentRecipeKey]);
    commit();
  });
  ed.querySelector('button[data-exportrec]').addEventListener('click', () => {
    /* This exports ALL recipes, not the one you have open — the tag is a
       count, and naming it after `currentRecipeKey` would be a lie.
       ⭐ `voiceBias` rides along (08-15): this file seeds the Swift side,
       and the bias is one table for both runtimes — see VOICE_BIAS.
       ⭐ …and so do the LOCKS (§13.2). They are draw conditions, not lab
       furniture: an app that ships the recipes without them draws
       genomes the fixtures never saw, and the parity suite would be
       green while the two runtimes disagreed on every plate.
       ⭐ `caps` is documentation for the port — the packer holds the
       real constants, and a device with a bigger pane gets its own.
       ⭐ `minKnob` rides along (round two): MIN_KNOB became a PACK input
       (the KNOB and per-voice-scale floors), so the app must pack with
       the same floor the champions were judged at — same one-table rule
       as voiceBias/locks. */
    downloadJSON('recipes', [`${Object.keys(RECIPES).length}recipes`],
      { version: 4, voiceBias: VOICE_BIAS,
        locks: LOCKS, excludes: EXCLUDES, bounds: BOUNDS,
        caps: { iphone: { rows: 3, columns: 4 } },
        minKnob: MIN_KNOB,
        recipes: RECIPES });
  });
  const recFile = ed.querySelector('input[data-recfile]');
  ed.querySelector('button[data-importrec]').addEventListener('click', () => recFile.click());
  recFile.addEventListener('change', () => {
    const f = recFile.files?.[0];
    if (!f) return;
    f.text().then(txt => {
      try {
        const data = JSON.parse(txt);
        const recs = data.recipes || data;    // accept a bare map too
        for (const [k, v] of Object.entries(recs)) {
          if (v && (v.patch || v.weights || v.controls)) RECIPES[k] = v;
        }
        buildRecipeSel();
        commit();
      } catch { alert('not a recipes json'); }
    });
  });

  /* patch + weight edits — everything writes through to the recipe */
  ed.querySelectorAll('input[data-wslider]').forEach(sl => {
    const row = sl.closest('.wgrow'), pct = row.querySelector('.pct');
    // live: just the number, so dragging is smooth; commit on release
    sl.addEventListener('input', () => {
      pct.textContent = +sl.value >= 100 ? 'always' : `${sl.value}%`;
    });
    sl.addEventListener('change', () => {
      const id = sl.dataset.wslider;
      if (+sl.value <= 0) delete W[id]; else W[id] = +sl.value / 100;
      commit();
    });
  });
  ed.querySelectorAll('input[data-wtoggle]').forEach(cb => cb.addEventListener('change', () => {
    const id = cb.dataset.wtoggle;
    if (cb.checked) {
      // a fresh row starts at the catalog's own rate (the v2 weight),
      // scope at the strong witness's 0.7 — a sane slider to pull from
      W[id] = W[id] || (id === 'scope' ? 0.7 : Math.min(1, PARAMS[id]?.w || 0.6));
    } else {
      delete W[id];
    }
    commit();
  }));
  ed.querySelectorAll('[data-patch]').forEach(inp => inp.addEventListener('change', () => {
    const pk = inp.dataset.patch;
    /* Editing the patch writes THROUGH to the recipe, because the patch
       IS the recipe's sound. ⚠️ Weights for ids the new patch forbids
       are KEPT, not deleted — the pool filters on legality anyway, and
       flipping the engine back should find your sliders where you left
       them. */
    recipe.patch = recipe.patch || {};
    const [lo0, hi0] = voiceRange({ ...DEFAULT_PATCH, ...recipe.patch });
    if (pk === 'waves') {
      recipe.patch.waves = inp.value === 'all' ? [...DEFAULT_PATCH.waves] : [inp.value];
    } else if (pk === 'vmin' || pk === 'vmax') {
      const v = Math.max(2, Math.min(6, +inp.value || 2));
      const lo = pk === 'vmin' ? v : Math.min(lo0, v);
      const hi = pk === 'vmax' ? v : Math.max(hi0, v);
      recipe.patch.voices = [Math.min(lo, hi), Math.max(lo, hi)];
    } else if (inp.type === 'checkbox') {
      recipe.patch[pk] = inp.checked;
    } else {
      recipe.patch[pk] = inp.value;
    }
    commit();
  }));
}
buildManifestEditor();
document.getElementById('editManifest').addEventListener('click', () =>
  document.getElementById('manifestEditor').classList.toggle('open'));

document.getElementById('genBack').addEventListener('click', () => gotoGeneration(genIdx - 1));
document.getElementById('genFwd').addEventListener('click', () => gotoGeneration(genIdx + 1));
document.getElementById('newBatch').addEventListener('click', newBatch);
document.getElementById('evolve').addEventListener('click', evolve);
document.getElementById('champBtn').addEventListener('click', () =>
  document.getElementById('champs').classList.toggle('open'));
document.getElementById('exportBtn').addEventListener('click', () => {
  /* ⚠️ `ratings` is one pool across every recipe, so the recipe tag names
     where you were STANDING when you exported, not what is inside. The
     counts are the honest part: likes/dislikes tell you at a glance
     whether a dump is worth re-importing, and whether the model in it
     was even trained (it needs 8). */
  const nLike = ratings.filter(r => r.vote > 0).length;
  downloadJSON('taste', [
    fileSlug(currentRecipeKey),
    `${nLike}like-${ratings.length - nLike}dislike`,
    model ? null : 'nomodel',
  ], {
    kind: 'parametric-taste', version: 3, exported: Date.now(),
    recipeKey: currentRecipeKey,
    recipes: RECIPES, locks: LOCKS, ratings,
    manifests: [...new Set(ratings.map(r => r.controls).filter(Boolean))],
    weights: model ? { names: featureNames(), w: model.w, b: model.b } : null,
  });
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Wipe all ratings?')) return;
  ratings = []; saveRatings(); model = null;
  renderStats(); renderWeights(); renderGrid();
});

document.getElementById('grid').addEventListener('click', (e) => {
  const lk = e.target.closest('button[data-lock]');
  if (lk) { lockAt(+lk.dataset.lock); e.stopPropagation(); return; }
  const ex = e.target.closest('button[data-excl]');
  if (ex) { excludeAt(+ex.dataset.excl); e.stopPropagation(); return; }
  const btn = e.target.closest('button[data-vote]');
  if (btn) { vote(+btn.dataset.idx, +btn.dataset.vote); e.stopPropagation(); return; }
  const st = e.target.closest('button[data-champ]');
  if (st) { saveChampion(+st.dataset.champ); e.stopPropagation(); return; }
  const card = e.target.closest('.card');
  if (card) { focusIdx = +card.dataset.idx; openModal(focusIdx); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  /* App mode first: the grid keys act on a HIDDEN batch (focusIdx can be
     stale from a rating session), so nothing below may fire here. */
  if (mode === 'app') {
    switch (e.key.toLowerCase()) {
      case 'n': simShuffleSeeds(false); break;
      case 'g': simShuffleSeeds(true); break;
      case 'l': simVote(1); break;
      case 'x': simVote(-1); break;
      case 'd': toggleTheme(); break;
      case 'escape':
        if (simMenuOpen) { simMenuOpen = false; renderAppSim(); }
        document.getElementById('modal').classList.remove('open');
        break;
    }
    return;
  }
  /* Pick mode owns the arrows (they ARE the choice), so it must bail
     before the grid's focus-move sees them. */
  if (mode === 'pick') {
    switch (e.key.toLowerCase()) {
      case 'arrowleft':  pickChoose(0); e.preventDefault(); break;
      case 'arrowright': pickChoose(1); e.preventDefault(); break;
      case ' ': case 'n': newPickPair(); e.preventDefault(); break;
      case 'd': toggleTheme(); break;
      case 'escape': document.getElementById('modal').classList.remove('open'); break;
    }
    return;
  }
  const move = (d) => {
    const prev = focusIdx;
    focusIdx = Math.max(0, Math.min(batch.length - 1, (focusIdx < 0 ? 0 : focusIdx + d)));
    if (prev >= 0) updateCard(prev);
    updateCard(focusIdx);
    document.querySelector(`.card[data-idx="${focusIdx}"]`)?.scrollIntoView({ block: 'nearest' });
  };
  switch (e.key.toLowerCase()) {
    case 'arrowright': case 'j': move(1); e.preventDefault(); break;
    case 'arrowleft':  case 'k': move(-1); e.preventDefault(); break;
    case 'l':
      if (focusIdx < 0) break;
      if (mode === 'sweep') lockAt(focusIdx); else { vote(focusIdx, 1); move(1); }
      break;
    case 'x':
      if (focusIdx < 0) break;
      if (mode === 'sweep') excludeAt(focusIdx); else { vote(focusIdx, -1); move(1); }
      break;
    case 's': if (mode === 'batch' && focusIdx >= 0) saveChampion(focusIdx); break;
    case 'r': if (mode === 'sweep') { sweepSeed = newSeed(); buildSweep(); } break;
    case '[': if (mode === 'batch') gotoGeneration(genIdx - 1); break;
    case ']': if (mode === 'batch') gotoGeneration(genIdx + 1); break;
    case 'n': if (mode === 'batch') newBatch(); break;
    case 'e': if (mode === 'batch') evolve(); break;
    case 'd': toggleTheme(); break;
    case 'escape': document.getElementById('modal').classList.remove('open'); break;
  }
});

/* ── sweep controls ───────────────────────────────────────────────── */
/* The picker doubles as the progress readout: a locked gene shows its
   padlock and the value it is pinned to, so "what have I already
   decided" is answerable without leaving the dropdown. Rebuilt from
   renderLocks so it can never drift out of step with the chips.
   (A locked gene is still sweepable — that is how you change your
   mind; the card holding the current value reads LOCKED.) */
function buildGeneSel() {
  const geneSel = document.getElementById('geneSel');
  geneSel.innerHTML = '';
  for (const gene of GENES) {
    const o = document.createElement('option');
    o.value = gene.k;
    const lv = LOCKS[gene.k];
    if (lv !== undefined) {
      o.textContent = `🔒  ${gene.k} = ${typeof lv === 'number' ? lv.toFixed(2) : lv}`;
    } else if (isNarrowed(gene)) {
      o.textContent = gene.t === 'e'
        ? `⊘  ${gene.k}  (${allowedOptions(gene).length} of ${gene.o.length} left)`
        : `⊘  ${gene.k}  (${floatBounds(gene)[0].toFixed(2)}–${floatBounds(gene)[1].toFixed(2)})`;
    } else {
      o.textContent = `      ${gene.k}  (${gene.t === 'f' ? `${gene.min}–${gene.max}` : gene.o.join(' · ')})`;
    }
    if (gene.k === sweepGene) o.selected = true;
    geneSel.appendChild(o);
  }
}
buildGeneSel();
document.getElementById('geneSel').addEventListener('change', (e) => {
  sweepGene = e.target.value; buildSweep();
});
document.getElementById('baseSel').addEventListener('change', (e) => {
  sweepBase = e.target.value; buildSweep();
});
document.getElementById('reroll').addEventListener('click', () => {
  sweepSeed = newSeed();
  if (sweepBase === 'neutral') {   // reroll only means something for a random base
    sweepBase = 'random';
    document.getElementById('baseSel').value = 'random';
  }
  buildSweep();
});
/* Everything on screen is a string of baked-in colours and geometry, so
   a theme flip — or a knob-floor move — has to redraw the lot: the grid,
   the sim/pick surfaces, and the modal if it happens to be open. */
function repaintPlates() {
  renderGrid();
  if (mode === 'app') renderAppSim();   // the sim's SVG inks are baked too
  if (mode === 'pick') renderPick();    // and the pair's
  if (focusIdx >= 0 && document.getElementById('modal').classList.contains('open')) openModal(focusIdx);
}
function toggleTheme() {
  lightMode = !lightMode;
  setTheme(lightMode);
  document.getElementById('themeBtn').textContent = lightMode ? 'nightfall' : 'daylight';
  repaintPlates();
}
document.getElementById('themeBtn').addEventListener('click', toggleTheme);
document.getElementById('songChk').addEventListener('change', (e) => {
  songMode = e.target.checked;
  if (mode === 'batch') newBatch();
});
document.getElementById('modeBatch').addEventListener('click', () => setMode('batch'));
document.getElementById('modeSweep').addEventListener('click', () => setMode('sweep'));
document.getElementById('modePick').addEventListener('click', () => setMode('pick'));
document.getElementById('modeApp').addEventListener('click', () => setMode('app'));
document.getElementById('exportBtn2').addEventListener('click', () =>
  document.getElementById('exportBtn').click());

/* Deep links, in the same spirit as `?song=` and `?gene=`: boot straight
   into the surface you want to look at. `?batch=song` opens song mode,
   `?zoom=N` opens card N's modal (which is where the back face lives). */
const q = new URLSearchParams(location.search);
/* ⚠️ Set the theme BEFORE anything renders: the plate's inks are baked
   into the SVG strings, so a flip after the first batch would leave the
   cards drawn in the old palette until something re-rendered them. */
let lightMode = q.has('light')
  ? q.get('light') !== '0'
  : (() => { try { return localStorage.getItem(THEME_KEY) === 'light'; } catch { return false; } })();
setTheme(lightMode);
document.getElementById('themeBtn').textContent = lightMode ? 'nightfall' : 'daylight';
/* draw-per-card is v3's default; `?batch=style` gives the held-manifest
   mode, `?batch=song` forces the default explicitly. */
if (q.get('batch')) songMode = q.get('batch') !== 'style';
document.getElementById('songChk').checked = songMode;
/* W5's session banner — visible whenever ?voices is narrowing the draw,
   so a normal rating session can never be silently polluted. */
if (VOICES_OVERRIDE) {
  const chip = document.createElement('span');
  chip.id = 'voicesChip';
  const [vlo, vhi] = VOICES_OVERRIDE;
  chip.textContent = `?voices session — draws held to ${vlo === vhi ? `${vlo} voices` : `${vlo}–${vhi} voices`}`;
  chip.title = 'session-only: ratings cast now carry vr:[lo,hi]; the app sim and every export are unaffected. Remove the URL param to end it.';
  document.querySelector('.bar').appendChild(chip);
}
trainModel(); renderWeights(); renderLocks(); renderChampions();
/* v3 boots into batches (the recipe workflow); `?gene=` still lands you
   straight in that gene's sweep, `?mode=app` in the iOS simulation,
   `?mode=pick` in the pairwise chooser. */
setMode(q.get('gene') ? 'sweep'
  : q.get('mode') === 'app' ? 'app'
  : q.get('mode') === 'pick' ? 'pick' : 'batch');
renderGenNav();
if (q.get('zoom') != null) openModal(Math.max(0, Math.min(batch.length - 1, +q.get('zoom') || 0)));
</script>
</body>
</html>
